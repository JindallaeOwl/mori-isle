        uGradeTint: sharedUniforms.uGradeTint, uGradeWarmth: sharedUniforms.uGradeWarmth,
        uDitherOfs: { value: ditherOfs }, uLevels: { value: 34.0 }
      });

      const _invVP = new THREE.Matrix4();
      function runPostPipeline() {
        const px = atmoMat.uniforms.uPx.value.set(1 / rtSize.w, 1 / rtSize.h);
        const vh = camera.top - camera.bottom;
        const worldPx = vh / rtSize.h;
        const zoomK = vh / (2 * 42.5 * Math.tan(CAM_FOV_EQUIV / 2)); // 1.0 at the default zoom
        const night = sharedUniforms.uNightFactor.value;

        // 1. atmo
        let u = atmoMat.uniforms;
        _invVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
        u.uInvVP.value.copy(_invVP);
        camera.getWorldDirection(u.uCamDir.value);
        u.uAO.value.set(POST.ao && !POST.lite ? 1.5 : 0.0, 0.38 / worldPx, 0.38);
        u.uWind.value.set(sharedUniforms.uTime.value * 0.05, sharedUniforms.uTime.value * 0.021);
        u.uMist.value.set(0.0, 0.28, THREE.MathUtils.lerp(0.055, 0.2, night), 1.0);
        u.uMistAmb.value.set(sharedUniforms.uFogColor.value.r, sharedUniforms.uFogColor.value.g, sharedUniforms.uFogColor.value.b)
          .multiplyScalar(THREE.MathUtils.lerp(0.95, 0.4, night));
        let k = 0;
        for (const pl of pointLightPool) {
          if (k >= NL) break;
          if (!pl.userData.active || pl.intensity <= 0) continue;
          pl.getWorldPosition(mistLightPos[k]);
          mistLightCol[k].set(pl.color.r, pl.color.g, pl.color.b).multiplyScalar(pl.intensity * 0.09);
          k++;
        }
        for (; k < NL; k++) mistLightCol[k].set(0, 0, 0);
        fsPass(atmoMat, PT.atmo);

        // 2. dof
        let colorSrc = PT.atmo;
        if (POST.dof) {
          u = dofMat.uniforms;
          u.uPx.value.copy(px);
          const zr = camera.far - camera.near;
          const focus = (CAM_BACK - camera.near) / zr;
          const maxR = Math.max(2, Math.min(rtSize.h, rtSize.w * 1.6) * 0.0125) * (POST.lite ? 0.5 : 1);
          u.uDof.value.set(focus, 2.2 * zoomK / zr, 7.5 * zoomK / zr, maxR);
          u.uNear.value.set(3.0 * zoomK / zr, 6.0 * zoomK / zr, 0.6);
          fsPass(dofMat, PT.dof);
          colorSrc = PT.dof;
        }
        compMat.uniforms.tColor.value = colorSrc.texture;

        // 3. bloom
        if (POST.bloom) {
          u = brightMat.uniforms;
          u.tColor.value = colorSrc.texture; u.uPx.value.copy(px);
          u.uThr.value.set(THREE.MathUtils.lerp(1.9, 0.85, night), THREE.MathUtils.lerp(1.2, 0.9, night));
          fsPass(brightMat, PT.bA);
          u = blurMat.uniforms;
          u.tColor.value = PT.bA.texture;  u.uDir.value.set(1 / PT.bA.width, 0);  fsPass(blurMat, PT.bA2);
          u.tColor.value = PT.bA2.texture; u.uDir.value.set(0, 1 / PT.bA.height); fsPass(blurMat, PT.bA);
          u.tColor.value = PT.bA.texture;  u.uDir.value.set(1 / PT.bB.width, 0);  fsPass(blurMat, PT.bB2);
          u.tColor.value = PT.bB2.texture; u.uDir.value.set(0, 1 / PT.bB.height); fsPass(blurMat, PT.bB);
          u.tColor.value = PT.bB.texture;  u.uDir.value.set(1.6 / PT.bB.width, 0);  fsPass(blurMat, PT.bB2);
          u.tColor.value = PT.bB2.texture; u.uDir.value.set(0, 1.6 / PT.bB.height); fsPass(blurMat, PT.bB);
          compMat.uniforms.uBloom.value.set(THREE.MathUtils.lerp(0.22, 0.38, night), THREE.MathUtils.lerp(0.3, 0.55, night));
        } else {
          compMat.uniforms.uBloom.value.set(0, 0);
        }

        // 4. comp -> postTarget
        fsPass(compMat, postTarget);
      }

      // Final pass: sharp upscale (crisp texels, anti-aliased texel edges only) + sub-pixel camera offset + film grain
      const upScene = new THREE.Scene();
      const upMat = new THREE.ShaderMaterial({
        uniforms: {
          tColor: { value: postTarget.texture },
          uTex: { value: new THREE.Vector2(rtSize.w, rtSize.h) },
          uOut: { value: new THREE.Vector2(1, 1) },
          uSub: { value: camSub },
          uGrain: { value: 0.028 },
          uSeed: { value: 0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
        `,
        fragmentShader: `
          uniform sampler2D tColor;
          uniform vec2 uTex, uOut, uSub;
          uniform float uGrain, uSeed;
          varying vec2 vUv;
          float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
          void main() {
            vec2 texel = vUv * uTex + uSub;
            vec2 scale = max(uOut / uTex, vec2(1.0));
            vec2 tf = floor(texel), f = texel - tf;
            vec2 region = 0.5 - 0.5 / scale, cen = f - 0.5;
            vec2 off = (cen - clamp(cen, -region, region)) * scale + 0.5;
            vec3 c = texture2D(tColor, (tf + off) / uTex).rgb;
            float g = hash12(gl_FragCoord.xy + uSeed) - 0.5;
            c += g * uGrain * (0.35 + 0.65 * (1.0 - dot(c, vec3(0.333))));
            gl_FragColor = vec4(c, 1.0);
          }
        `,
        depthTest: false,
        depthWrite: false
      });
      upScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), upMat));
      function syncUpscaleSize() {
        const sz = renderer.getDrawingBufferSize(new THREE.Vector2());
        upMat.uniforms.uOut.value.copy(sz);
        upMat.uniforms.uTex.value.set(rtSize.w, rtSize.h);
      }
      syncUpscaleSize();

      // Resize every resolution-dependent piece (window resize or adaptive quality change)
      function applyResolution() {
        rtSize = getRTSize();
        // depth textures are not resized by setSize: replace it
        renderTarget.depthTexture.dispose();
        renderTarget.depthTexture = new THREE.DepthTexture(rtSize.w, rtSize.h, THREE.UnsignedIntType);
        renderTarget.setSize(rtSize.w, rtSize.h);
        atmoMat.uniforms.tDepth.value = renderTarget.depthTexture;
        dofMat.uniforms.tDepth.value = renderTarget.depthTexture;
        postTarget.setSize(rtSize.w, rtSize.h);
        sizePostTargets();

        updateCameraTransform();
      }

      }) : null;
      if (fpsEl) {
        document.body.appendChild(fpsEl);

      }
      // Adaptive resolution: drop internal resolution when frames run long, recover when there's headroom
      const perf = { acc: 0, frames: 0, slow: 0, fast: 0, hold: 0, back: 12 };
      function trackPerformance(rawDt) {
        if (document.hidden || rawDt > 0.25) { perf.acc = 0; perf.frames = 0; return; }
        perf.acc += rawDt; perf.frames++;
        if (perf.acc < 2) return;
        const ms = perf.acc / perf.frames * 1000;
        if (fpsEl) {
          fpsEl.textContent = (1000 / ms).toFixed(0) + ' fps  ' + ms.toFixed(1) + 'ms  ' + rtSize.w + 'x' + rtSize.h + '  q' + LOWRES.quality.toFixed(2) + (POST.lite ? ' lite' : '')
            + '  calls ' + renderer.info.render.calls + '  tris ' + (renderer.info.render.triangles / 1000).toFixed(0) + 'k';
          console.log('[mori-perf] ' + fpsEl.textContent);
        }
        if (ms > 22.5) { perf.slow++; perf.fast = 0; } else { perf.slow = 0; perf.fast = ms < 18.6 ? perf.fast + 1 : 0; }
        perf.hold -= perf.acc;
        if (LOWRES.enabled && LOWRES.adaptive) {
          if (perf.slow >= 3 && LOWRES.quality <= 0.55 && !POST.lite) {
            POST.lite = true; perf.slow = 0; // drop AO, halve DoF radius
          } else if (perf.slow >= 2 && LOWRES.quality > 0.55) {
            LOWRES.quality = Math.max(0.55, LOWRES.quality - 0.15); applyResolution();
            perf.slow = 0; perf.hold = perf.back; perf.back = Math.min(480, perf.back * 2);
          } else if (perf.fast >= 3 && LOWRES.quality < 1 && perf.hold <= 0) {
            LOWRES.quality = Math.min(1, LOWRES.quality + 0.15); applyResolution(); perf.fast = 0;
          }
        }
        perf.acc = 0; perf.frames = 0;
      }

      /* =======================================================================

      const { chunkTopSurface, chunkSubsoil, chunkBedrock, pondMist, mistMat, gridMat, waterMesh, lilyParts } = buildMiniatureIsland(scene);

      // --- GHIBLI-STYLE FLUFFY CURVED GRASS TUFT GEOMETRY (InstancedMesh + Upward Normals) ---
      // 4 plump outward-curving blades per clump; root matches ground grass, tips glow warm yellow-green.
      function createGhibliGrassTuftGeometry() {
        const positions = [];
        const normals = [];
        const colors = [];
        const tipWeights = [];
        const indices = [];

        const colRoot = new THREE.Color('#66ab4b'); // Matches island ground grass seamlessly
        const colMid = new THREE.Color('#8cd15a');  // Fresh spring green
        const colTip = new THREE.Color('#dce86b');  // Warm sunlit Ghibli yellow-green
        const tmpCol = new THREE.Color();

        const blades = [
          { ang: 0.15,  h: 0.21, lean: 0.105, wScale: 1.05, rOff: 0.012 },
          { ang: 1.65,  h: 0.17, lean: 0.095, wScale: 0.95, rOff: 0.014 },
          { ang: 3.25,  h: 0.19, lean: 0.110, wScale: 1.00, rOff: 0.012 },
          { ang: 4.78,  h: 0.15, lean: 0.088, wScale: 0.90, rOff: 0.013 }
        ];

        const levels = [
          { t: 0.00, w: 0.048, curve: 0.00 },
          { t: 0.36, w: 0.062, curve: 0.22 }, // Plump miniature body
          { t: 0.72, w: 0.040, curve: 0.64 }  // Soft taper before tip
        ];

        let vIndex = 0;
        for (const b of blades) {
          const dirX = Math.cos(b.ang);
          const dirZ = Math.sin(b.ang);
          const sideX = -dirZ;
          const sideZ = dirX;
          const baseV = vIndex;

          if (nowSec >= pendingFx[i].t) { const f = pendingFx[i].fn; pendingFx.splice(i, 1); f(); }
        }
      }

      const _panV = new THREE.Vector3();
      function screenPan(x, y, z) { _panV.set(x, y, z).project(camera); return THREE.MathUtils.clamp(_panV.x, -1, 1) * 0.7; }

      function triggerPlaceJuice(def, x, y, z) {
        let total, groups;
        if (isInstancedDef(def)) {
          total = dropTotalTime(def.layers);
          groups = Math.floor((def.layers - 1) / dropGroupFor(def.layers)) + 1;
        } else if (def.type === '3d_cabin') {
          total = cabinDropTotal(); groups = 16;
        } else {
          total = 0.05; groups = 1; // path / fence: single snap
        }
        const footprint = def.type === '3d_cabin' ? 0.7 : (def.freePlace ? 0.18 : 0.32);
        // first layer lands -> pixel dust
        scheduleFx(DROP_FALL, () => burstDust(x, y, z, def.type === '3d_cabin' ? 20 : 12, footprint));
        // top lands -> micro shake
        scheduleFx(total, () => { shakeStart = performance.now() * 0.001; shakeAmp = def.type === '3d_cabin' ? 0.07 : (def.freePlace ? 0.02 : 0.045); });
        // clicks: ~6 evenly spread landings
        const clicks = Math.max(1, Math.min(6, groups));
        const times = [];
        for (let i = 0; i < clicks; i++) {
          times.push(DROP_FALL + (clicks > 1 ? i / (clicks - 1) : 0) * Math.max(0, total - DROP_FALL));
        }
        audio.playStackClicks(times, screenPan(x, y, z));
      }

      /* ---- COLLISION VALIDATION (PREVENTS UNREALISTIC CLIPPING / OVERLAP) ---- */
      const PROP_SELF_RADIUS = {
        rocks: 0.28,
        flowers: 0.12,
        reeds: 0.11,
        mushrooms: 0.10
      };

      function isInsideCabinFootprint(wx, wz, pad = 0.0) {
        for (const entry of placedItems.values()) {
          if (entry.id !== 'cabin') continue;
          const cx = entry.gx - HALF_GRID + 0.5;
          const cz = entry.gz - HALF_GRID + 0.5;
          const rotated = entry.rotation % 2 === 1;
          const hx = (rotated ? 0.48 : 0.52) + pad;
          const hz = (rotated ? 0.52 : 0.48) + pad;
          if (Math.abs(wx - cx) < hx && Math.abs(wz - cz) < hz) return true;
        }
        return false;
      }

      function isBlockedForPoint(wx, wz, selfRadius = 0.10, checkSmallFreeProps = true) {
        // 1. Water / Pond exclusion
        if (isPondWorld(wx, wz, 0.06 + selfRadius * 0.3)) return true;

        // 2. Cabin interior floor & walls bounding box
        if (isInsideCabinFootprint(wx, wz, selfRadius)) return true;

        // 3. Solid grid-placed objects (campfire flames, tree trunks, benches, lanterns, fence posts)
        for (const entry of placedItems.values()) {
          if (entry.id === 'cabin' || entry.id === 'path') continue;
          const ex = entry.gx - HALF_GRID + 0.5;
          const ez = entry.gz - HALF_GRID + 0.5;
          let solidR = 0.24;
          if (entry.id === 'campfire') solidR = 0.42;
          else if (entry.id === 'bench') solidR = 0.34;
          else if (entry.id === 'pine' || entry.id === 'oak') solidR = 0.24;
          else if (entry.id === 'lantern') solidR = 0.18;
          else if (entry.id === 'fence') solidR = 0.16;
          if (Math.hypot(wx - ex, wz - ez) < solidR + selfRadius) return true;
        }

        // 4. Solid free-placed rocks & closely overlapping small props
        for (const fp of freeProps) {
          const dist = Math.hypot(wx - fp.wx, wz - fp.wz);
          if (fp.id === 'rocks') {
            const rockR = 0.34 * (fp.scale || 1.0);
            if (dist < rockR + selfRadius) return true;
          } else if (checkSmallFreeProps) {
            if (dist < 0.16 + selfRadius * 0.5) return true;
          }
        }
        return false;
      }

      function canPlaceAtHit(toolId, hit) {
        if (!hit || toolId === 'delete') return true;
        const def = assetsById[toolId]?.def;
        if (!def) return false;

        if (def.freePlace) {
          const r = PROP_SELF_RADIUS[toolId] || 0.12;
          return !isBlockedForPoint(hit.wx, hit.wz, r, true);
        } else {
          // Grid-snapped object: block pond tiles and already-occupied tiles
          if (isPondTile(hit.gx, hit.gz)) return false;
          const key = `${hit.gx},${hit.gz}`;
          if (placedItems.has(key)) return false;

          // Prevent placing a cabin or campfire directly over existing solid rocks
          const wx = hit.gx - HALF_GRID + 0.5;
          const wz = hit.gz - HALF_GRID + 0.5;
          const checkR = def.id === 'cabin' ? 0.46 : (def.id === 'campfire' ? 0.38 : 0.22);
          for (const fp of freeProps) {
            if (fp.id === 'rocks' && Math.hypot(wx - fp.wx, wz - fp.wz) < checkR + 0.26 * (fp.scale || 1.0)) {
              return false;
            }
          }
          return true;
        }
      }

      function setGhostValidityColor(ghost, isValid) {
        if (!ghost) return;
        const colHex = isValid ? '#a8ffbe' : '#ff5252';
        if (ghost.isMesh && ghost.material) {
          ghost.material.color.set(colHex);
          ghost.material.opacity = isValid ? 0.55 : 0.72;
        } else {
          ghost.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.color.set(isValid ? '#98ffb8' : '#ff5252');
              child.material.opacity = isValid ? 0.42 : 0.62;
            }
          });
        }
      }

      function rebuildInstances() {
        const buckets = {};
        ITEM_DEFS.forEach((d) => { if (isInstancedDef(d)) buckets[d.id] = []; });

        while (cabinGroupContainer.children.length > 0) {
          const old = cabinGroupContainer.children[0];
          cabinGroupContainer.remove(old);
          disposeObjectTree(old);
        }
        while (glowGroup.children.length > 0) {
          glowGroup.remove(glowGroup.children[0]);
        }
        activeCabins = [];
        activeGlowSprites = [];
        campfireSpots = [];
        contactShadowBaseList = [];

        lightSources = [];
        pointLightPool.forEach((pl) => { pl.userData = { active: false }; pl.intensity = 0; });

        let pathCenterIdx = 0, pathConnIdx = 0, pathCobbleIdx = 0;
        let fencePostIdx = 0, fenceRailIdx = 0;
        let crateIdx = 0;

        markShadowsDirty(1.0); // covers the stacked drop + cabin drop & squash

        // 1. Process Grid-Snapped Items
        placedItems.forEach((entry) => {
          const def = assetsById[entry.id].def;
          const wx = entry.gx - HALF_GRID + 0.5;
          const wz = entry.gz - HALF_GRID + 0.5;
          const wy = getTileElevation(entry.gx, entry.gz);
          const rotY = entry.rotation * (Math.PI / 2);

          if (isInstancedDef(def)) {
            buckets[entry.id].push({ wx, wy, wz, rotation: entry.rotation, scale: 1.0, spawnT: entry.spawnT ?? -100 });
          } else if (def.type === '3d_cabin') {
            const cabin = buildStorybookCabinPrefab();
            cabin.position.set(wx, wy, wz);
            cabin.rotation.y = rotY;
            cabinGroupContainer.add(cabin);
            activeCabins.push({ mesh: cabin, baseX: wx, baseY: wy, baseZ: wz, rotY, spawnT: entry.spawnT ?? -100 });
            prepareCabinDrop(cabin);

            if (crateIdx < 24) {
              dummyObj.position.set(wx - 0.54, wy + 0.08, wz + 0.34);
              dummyObj.rotation.set(0, rotY + 0.25, 0);
              dummyObj.scale.set(1, 1, 1);
              dummyObj.updateMatrix();
              crateClutterInst.setMatrixAt(crateIdx++, dummyObj.matrix);
            }
          } else if (def.type === 'auto_path') {
            // Auto-tiling dirt pad + stepping stones connecting to neighbor paths & cabin door!
            dummyObj.position.set(wx, wy + 0.014, wz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(1, 1, 1);
            dummyObj.updateMatrix();
            pathCenterInst.setMatrixAt(pathCenterIdx++, dummyObj.matrix);

            // Stepping stones on tile
            for (let s = 0; s < 2 && pathCobbleIdx < 260; s++) {
              const ox = (hash2D(entry.gx, entry.gz, s * 5 + 1) - 0.5) * 0.36;
              const oz = (hash2D(entry.gx, entry.gz, s * 5 + 2) - 0.5) * 0.36;
              const sc = 0.78 + hash2D(entry.gx, entry.gz, s * 5 + 3) * 0.45;
              dummyObj.position.set(wx + ox, wy + 0.022, wz + oz);
              dummyObj.rotation.set(0, hash2D(entry.gx, entry.gz, s + 9) * 3.14, 0);
              dummyObj.scale.set(sc, 1, sc * 0.85);
              dummyObj.updateMatrix();
              pathCobbleInst.setMatrixAt(pathCobbleIdx++, dummyObj.matrix);
            }

            // Connect smoothly to cardinal neighbors (path or cabin) on same elevation
            const dirs = [[0, -1, 0], [0, 1, 0], [1, 0, Math.PI / 2], [-1, 0, Math.PI / 2]];
            dirs.forEach(([dx, dz, ang]) => {
              const nb = placedItems.get(`${entry.gx + dx},${entry.gz + dz}`);
              if (nb && (nb.id === 'path' || nb.id === 'cabin') && getTileElevation(entry.gx + dx, entry.gz + dz) === wy) {
                if (pathConnIdx < 260) {
                  dummyObj.position.set(wx + dx * 0.36, wy + 0.013, wz + dz * 0.36);
                  dummyObj.rotation.set(0, ang, 0);
                  dummyObj.scale.set(1, 1, 1);
                  dummyObj.updateMatrix();
                  pathConnInst.setMatrixAt(pathConnIdx++, dummyObj.matrix);
                }
              }
            });
          } else if (def.type === 'auto_fence') {
            // Auto-tiling wooden fence post + horizontal rails to adjacent fence posts!
            dummyObj.position.set(wx, wy + 0.18, wz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(1, 1, 1);
            dummyObj.updateMatrix();
            fencePostInst.setMatrixAt(fencePostIdx++, dummyObj.matrix);

            const dirs = [[0, -1, 0], [0, 1, 0], [1, 0, Math.PI / 2], [-1, 0, Math.PI / 2]];
            dirs.forEach(([dx, dz, ang]) => {
              const nb = placedItems.get(`${entry.gx + dx},${entry.gz + dz}`);
              if (nb && nb.id === 'fence' && Math.abs(getTileElevation(entry.gx + dx, entry.gz + dz) - wy) < 0.05) {
                for (let railH of [0.13, 0.27]) {
                  if (fenceRailIdx < 360) {
                    dummyObj.position.set(wx + dx * 0.28, wy + railH, wz + dz * 0.28);
                    dummyObj.rotation.set(0, ang, 0);
                    dummyObj.scale.set(1, 1, 1);
                    dummyObj.updateMatrix();
                    fenceRailInst.setMatrixAt(fenceRailIdx++, dummyObj.matrix);
                  }
                }
              }
            });
          }

          if (def.contactRadius > 0) {
            contactShadowBaseList.push({
              x: wx, y: wy + 0.014, z: wz, r: def.contactRadius * 2.0,
              tier: def.type === '3d_cabin' ? 2 : (def.explodeTier || 0)
            });
          }

          if (entry.id === 'campfire') campfireSpots.push({ x: wx, y: wy, z: wz, seed: hash2D(entry.gx, entry.gz, 9) * 10 });
          if (def.glow) {
            // optional horizontal offset of the light source (e.g. a lamp hanging off a post arm)
            const gox = def.glow.offsetX || 0, goz = def.glow.offsetZ || 0;
            const gx = wx + gox * Math.cos(rotY) + goz * Math.sin(rotY);
            const gz = wz - gox * Math.sin(rotY) + goz * Math.cos(rotY);
            const spMat = new THREE.SpriteMaterial({
              map: glowTex, color: def.glow.color, transparent: true, opacity: 0,
              blending: THREE.AdditiveBlending, depthWrite: false
            });
            const sprite = new THREE.Sprite(spMat);
            sprite.position.set(gx, wy + def.glow.offsetY, gz);
            sprite.scale.set(def.glow.scale, def.glow.scale, 1);
            glowGroup.add(sprite);
            activeGlowSprites.push({
              sprite, baseY: wy + def.glow.offsetY, baseScale: def.glow.scale,
              seed: hash2D(entry.gx, entry.gz, 9) * 10, flicker: !!def.glow.flicker,
              isCabin: def.type === '3d_cabin', tier: def.explodeTier || 0
            });

            // every light source is listed; updatePointLights() lends the 8 pool lights to the nearest ones
            lightSources.push({
              x: gx, z: gz, baseY: wy + def.glow.offsetY + 0.15,
              color: def.glow.color,
              mult: def.glow.lightIntensity || 1.0,
              flicker: !!def.glow.flicker,
              seed: hash2D(entry.gx, entry.gz, 15) * 20,
              isCabin: def.type === '3d_cabin',
              tier: def.explodeTier || 0,
              want: false, slot: -1, w: 0
            });
          }
        });
        pickPointLights(true);

        // 2. Process Free-Placed Overlapping Decor (Flowers, Reeds, Rocks, Mushrooms)
        freeProps.forEach((fp) => {
          const def = assetsById[fp.id]?.def;
          if (!def || !isInstancedDef(def)) return;
          const wy = getContinuousTerrainHeight(fp.wx, fp.wz);
          buckets[fp.id].push({ wx: fp.wx, wy, wz: fp.wz, rotation: fp.rotation, scale: fp.scale || 1.0, spawnT: fp.spawnT ?? -100 });
          if (def.contactRadius > 0) {
            contactShadowBaseList.push({
              x: fp.wx, y: wy + 0.014, z: fp.wz, r: def.contactRadius * 1.75 * (fp.scale || 1.0),
              tier: def.explodeTier || 0
            });
          }
        });

        // Apply InstancedMeshes
        ITEM_DEFS.forEach((def) => {
          if (!isInstancedDef(def)) return;
          const list = buckets[def.id];
          const mesh = instancedById[def.id];
          for (let i = 0; i < list.length && i < MAX_INSTANCES; i++) {
            const item = list[i];
            dummyObj.position.set(item.wx, item.wy, item.wz);
            dummyObj.rotation.set(0, item.rotation * (Math.PI / 2), 0);
            dummyObj.scale.setScalar(item.scale);
            dummyObj.updateMatrix();
            mesh.setMatrixAt(i, dummyObj.matrix);
            mesh.userData.spawnAttr.array[i] = item.spawnT;
          }
          mesh.count = Math.min(list.length, MAX_INSTANCES);
          mesh.visible = mesh.count > 0; // an empty InstancedMesh still costs a draw call (x2 with shadows)
          mesh.instanceMatrix.needsUpdate = true;
          mesh.userData.spawnAttr.needsUpdate = true;
        });

        pathCenterInst.count = pathCenterIdx; pathCenterInst.instanceMatrix.needsUpdate = true;
        pathConnInst.count = pathConnIdx; pathConnInst.instanceMatrix.needsUpdate = true;
        pathCobbleInst.count = pathCobbleIdx; pathCobbleInst.instanceMatrix.needsUpdate = true;
        fencePostInst.count = fencePostIdx; fencePostInst.instanceMatrix.needsUpdate = true;
        fenceRailInst.count = fenceRailIdx; fenceRailInst.instanceMatrix.needsUpdate = true;
        crateClutterInst.count = crateIdx; crateClutterInst.instanceMatrix.needsUpdate = true;
        for (const im of [pathCenterInst, pathConnInst, pathCobbleInst, fencePostInst, fenceRailInst, crateClutterInst]) im.visible = im.count > 0;

        // 3. Clustered Ghibli-Style Grass Tufts (Large + 2~3 Med/Small Clumps with Tile Edge Padding!)
        let grassIdx = 0;
        let pebbleIdx = 0;
        const TILE_PAD = 0.14; // Keeps tufts neatly inset from tile grid lines

        function clampToTilePadding(val) {
          const base = Math.floor(val);
          const local = THREE.MathUtils.clamp(val - base, TILE_PAD, 1.0 - TILE_PAD);
          return base + local;
        }

        function isGrassSpotValid(tx, tz) {
          if (Math.abs(tx) > HALF_GRID - 0.18 || Math.abs(tz) > HALF_GRID - 0.18) return false;
          if (getPondSDF(tx, tz) < 0.16) return false;
          const gx = Math.floor(tx + HALF_GRID);
          const gz = Math.floor(tz + HALF_GRID);
          const tileItem = placedItems.get(`${gx},${gz}`);
          if (tileItem && (tileItem.id === 'path' || tileItem.id === 'cabin' || tileItem.id === 'campfire')) return false;
          if (isBlockedForPoint(tx, tz, 0.06, false)) return false;
          return true;
        }

        function spawnGrassCluster(ax, az, seed) {
          if (grassIdx >= MAX_GRASS_TUFTS) return;
          const cx = clampToTilePadding(ax);
          const cz = clampToTilePadding(az);
          if (!isGrassSpotValid(cx, cz)) return;

          // 1 Large anchor tuft
          const mainSc = 1.02 + hash2D(seed, 1, 31) * 0.24;
          const cy = getContinuousTerrainHeight(cx, cz);
          dummyObj.position.set(cx, cy - 0.01, cz);
          dummyObj.rotation.set(0, hash2D(seed, 2, 31) * Math.PI * 2, 0);
          dummyObj.scale.set(mainSc, mainSc, mainSc);
          dummyObj.updateMatrix();
          grassClutterInst.setMatrixAt(grassIdx++, dummyObj.matrix);

          // 2~3 Medium/Small companion tufts tucked tightly around the large tuft
          const subCount = 2 + (Math.floor(hash2D(seed, 3, 31) * 2) % 2);
          for (let s = 0; s < subCount && grassIdx < MAX_GRASS_TUFTS; s++) {
            const ang = (s / subCount) * Math.PI * 2 + hash2D(seed, s + 4, 31) * 1.1;
            const dist = 0.085 + hash2D(seed, s + 9, 31) * 0.075;
            const sx = clampToTilePadding(cx + Math.cos(ang) * dist);
            const sz = clampToTilePadding(cz + Math.sin(ang) * dist);
            if (!isGrassSpotValid(sx, sz)) continue;
            const sy = getContinuousTerrainHeight(sx, sz);
            const subSc = 0.56 + hash2D(seed, s + 15, 31) * 0.30;
            dummyObj.position.set(sx, sy - 0.01, sz);
            dummyObj.rotation.set(0, hash2D(seed, s + 21, 31) * Math.PI * 2, 0);
            dummyObj.scale.set(subSc, subSc * (0.9 + hash2D(seed, s + 25, 31) * 0.2), subSc);
            dummyObj.updateMatrix();
            grassClutterInst.setMatrixAt(grassIdx++, dummyObj.matrix);
          }
        }

        let clusterSeed = 1;
        // (A) Cluster around Tree Roots, Cabin Outer Corners & Fences
        placedItems.forEach((entry) => {
          const wx = entry.gx - HALF_GRID + 0.5;
          const wz = entry.gz - HALF_GRID + 0.5;
          if (entry.id === 'pine' || entry.id === 'oak') {
            for (let k = 0; k < 2; k++) {
              const a = hash2D(entry.gx, entry.gz, k * 3 + 1) * Math.PI * 2;
              spawnGrassCluster(wx + Math.cos(a) * 0.32, wz + Math.sin(a) * 0.32, clusterSeed++);
            }
          } else if (entry.id === 'cabin') {
            // Tuck fluffy grass clusters near cabin outer corners (outside footprint)
            [[-0.64, -0.58], [0.64, -0.58], [-0.66, 0.56], [0.64, 0.54]].forEach(([ox, oz]) => {
              spawnGrassCluster(wx + ox, wz + oz, clusterSeed++);
            });
          } else if (entry.id === 'fence' || entry.id === 'bench') {
            const a = hash2D(entry.gx, entry.gz, 7) * Math.PI * 2;
            spawnGrassCluster(wx + Math.cos(a) * 0.28, wz + Math.sin(a) * 0.28, clusterSeed++);
          }
        });

        // (B) Cluster right beside Rock Bases
        freeProps.forEach((fp) => {
          if (fp.id === 'rocks') {
            const r = 0.38 * (fp.scale || 1.0) + 0.08;
            for (let k = 0; k < 2; k++) {
              const a = hash2D(fp.wx * 10, fp.wz * 10, k + 5) * Math.PI * 2;
              spawnGrassCluster(fp.wx + Math.cos(a) * r, fp.wz + Math.sin(a) * r, clusterSeed++);
            }
          }
        });

        // (C) Cluster organically around the Rounded Pond Rim
        for (let a = 0; a < 18; a++) {
          const ang = (a / 18) * Math.PI * 2 + 0.12;
          for (let step = 0.6; step < 3.6; step += 0.08) {
            const tx = 2.35 + Math.cos(ang) * step;
            const tz = 2.35 + Math.sin(ang) * step;
            if (getPondSDF(tx, tz) > 0.24) {
              spawnGrassCluster(tx, tz, clusterSeed++);
              break;
            }
          }
        }

        // (D) Light natural accents on back-hill ledges (keeps central meadow clean & airy)
        for (let gz = 0; gz < GRID_SIZE; gz++) {
          for (let gx = 0; gx < GRID_SIZE; gx++) {
            if (getHillLevel(gx, gz) >= 1 && !placedItems.has(`${gx},${gz}`) && hash2D(gx, gz, 41) > 0.62) {
              const wx = gx - HALF_GRID + 0.5 + (hash2D(gx, gz, 42) - 0.5) * 0.35;
              const wz = gz - HALF_GRID + 0.5 + (hash2D(gx, gz, 43) - 0.5) * 0.35;
              spawnGrassCluster(wx, wz, clusterSeed++);
            }
          }
        }

        // Cluster smooth wet pebbles tightly along the organic rounded pond rim!
        for (let a = 0; a < 90 && pebbleIdx < 110; a++) {
          const ang = (a / 90) * Math.PI * 2;
          // March radially outward from pond center until right on the curved shoreline!
          let rx = 2.35, rz = 2.35;
          for (let step = 0.5; step < 3.4; step += 0.08) {
            const tx = 2.35 + Math.cos(ang) * step;
            const tz = 2.35 + Math.sin(ang) * step;
            if (getPondSDF(tx, tz) > 0.08) {
              rx = tx + (hash2D(a, 1, 5) - 0.5) * 0.28;
              rz = tz + (hash2D(a, 2, 5) - 0.5) * 0.28;
              break;
            }
          }
          if (Math.abs(rx) > HALF_GRID - 0.2 || Math.abs(rz) > HALF_GRID - 0.2) continue;
          const py = getContinuousTerrainHeight(rx, rz);
          const sc = 0.65 + hash2D(a, 3, 5) * 0.95;
          dummyObj.position.set(rx, py + 0.02, rz);
          dummyObj.rotation.set(a, a * 1.3, a * 0.7);
          dummyObj.scale.set(sc, sc * 0.55, sc);
          dummyObj.updateMatrix();
          pebbleClutterInst.setMatrixAt(pebbleIdx++, dummyObj.matrix);
        }
        grassClutterInst.count = grassIdx; grassClutterInst.instanceMatrix.needsUpdate = true;
        pebbleClutterInst.count = pebbleIdx; pebbleClutterInst.instanceMatrix.needsUpdate = true;
      }

      /* ---- STORYTELLING CLUSTERED STARTER DIORAMA ---- */
      function populateStarterIsland(rebuild = true) {
        placedItems.clear();
        freeProps.length = 0;

        const starterGrid = [
          // 1. Dense Forest & Rocks clustered tightly on the elevated back hills!
          { gx: 0, gz: 1, id: 'pine', rotation: 0 },
          { gx: 0, gz: 3, id: 'pine', rotation: 2 },
          { gx: 1, gz: 0, id: 'pine', rotation: 1 },
          { gx: 1, gz: 2, id: 'oak', rotation: 0 },
          { gx: 2, gz: 0, id: 'pine', rotation: 3 },
          { gx: 2, gz: 1, id: 'pine', rotation: 1 },
          { gx: 3, gz: 0, id: 'oak', rotation: 2 },
          { gx: 4, gz: 0, id: 'pine', rotation: 0 },
          { gx: 5, gz: 1, id: 'pine', rotation: 2 },
          { gx: 0, gz: 5, id: 'oak', rotation: 1 },
          { gx: 1, gz: 6, id: 'pine', rotation: 3 },

          // 2. Cozy Storybook Cabin nestled right in front of the back hill shelter
          { gx: 4, gz: 4, id: 'cabin', rotation: 0 },

          // 3. Auto-tiling Wooden Fence hugging the left side of the cabin yard
          { gx: 3, gz: 4, id: 'fence', rotation: 0 },
          { gx: 3, gz: 5, id: 'fence', rotation: 0 },
          { gx: 3, gz: 6, id: 'fence', rotation: 0 },

          // 4. Storytelling Path connecting Cabin Door -> Campfire/Bench -> Pond Shoreline!
          { gx: 4, gz: 5, id: 'path', rotation: 0 },

        const starterFree = [

      function placeAtHit(hit) {
        if (selectedTool === 'delete') {
          removeAtHit(hit);
          return;
        }
        if (!canPlaceAtHit(selectedTool, hit)) {
          return; // Blocked by collision/water; red ghost provides clear visual feedback
        }
        const def = assetsById[selectedTool].def;
        if (def.freePlace) {
          freeProps.push({
            id: selectedTool,
            wx: hit.wx,
            wz: hit.wz,
            rotation: currentRotation,
            scale: 0.88 + Math.random() * 0.24,
            spawnT: performance.now() * 0.001
          });
          rebuildInstances();
          triggerPlaceJuice(def, hit.wx, getContinuousTerrainHeight(hit.wx, hit.wz), hit.wz);
        } else {
          const key = `${hit.gx},${hit.gz}`;
          placedItems.set(key, { id: selectedTool, gx: hit.gx, gz: hit.gz, rotation: currentRotation, spawnT: performance.now() * 0.001 });
          rebuildInstances();
          triggerPlaceJuice(def, hit.gx - HALF_GRID + 0.5, getTileElevation(hit.gx, hit.gz), hit.gz - HALF_GRID + 0.5);
        }
      }

      function removeAtHit(hit) {
        // Check closest free-placed prop within 0.55 radius first
        let bestIdx = -1, bestDist = 0.55;
        for (let i = 0; i < freeProps.length; i++) {
          const d = Math.hypot(freeProps[i].wx - hit.wx, freeProps[i].wz - hit.wz);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        if (bestIdx !== -1) {
          freeProps.splice(bestIdx, 1);
          rebuildInstances();
          audio.playRemove();
          return;
        }
        const key = `${hit.gx},${hit.gz}`;
        if (placedItems.has(key)) {
          placedItems.delete(key);
          rebuildInstances();
          audio.playRemove();
        }
      }

      /* =======================================================================
         14. MINIMALIST COZY HUD SETUP

      // Bottom dock: one wooden token per category; hovering (or tapping) raises a tray of
      // paper cards with every item of that category. The slot remembers the last item picked.
      // Every HUD button is a token from 4C (the HTML only holds placeholders).
      const setToken = (sel, name, opts) => { const el = document.querySelector(sel); if (el) el.innerHTML = makeToken(name, opts); };
      setToken('#btn-explode', 'layers', { round: true });
      setToken('#btn-photo', 'camera', { round: true });

      setToken('#btn-help', 'help', { round: true });

      setToken('#btn-rotate .icon', 'rotate');
      const catContainer = document.getElementById('cat-container');
      const itemNameEl = document.getElementById('item-name');
      const rotateIcon = document.querySelector('#btn-rotate .glyph');
      const catSlots = {}; // category id -> { wrap, btn, items: [def], current }
      let nameTimer = 0;

      // name floats just above `anchor` (the open tray or the dock)
      function showItemName(text, ms = 0, anchor = null) {
        clearTimeout(nameTimer);
        if (text) {
          const r = (anchor || (openWrap && openWrap.querySelector('.tray')) || document.getElementById('hud-dock')).getBoundingClientRect();
          itemNameEl.style.left = `${Math.round(r.left + r.width / 2)}px`;
          itemNameEl.style.bottom = `${Math.round(window.innerHeight - r.top + 2)}px`;
        }
        itemNameEl.textContent = text;
        itemNameEl.classList.toggle('show', !!text);
        if (text && ms) nameTimer = setTimeout(() => itemNameEl.classList.remove('show'), ms);
      }
      // trim an icon to its opaque pixels and scale it to fill the slot (integer steps keep pixels crisp)
      function fitIconCanvas(src, size = 40, pad = 2) {
        const w = src.width, h = src.height, d = src.getContext('2d').getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 < 0) return src;
        const bw = x1 - x0 + 1, bh = y1 - y0 + 1, fit = (size - pad * 2) / Math.max(bw, bh);
        const k = fit >= 2 ? Math.floor(fit) : (fit >= 1 ? 1 : fit);
        const c = document.createElement('canvas'); c.width = size; c.height = size;
        const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = k < 1;
        const dw = bw * k, dh = bh * k;
        ctx.drawImage(src, x0, y0, bw, bh, Math.round((size - dw) / 2), Math.round(size - pad - dh), dw, dh);
        return c;
      }
      ITEM_DEFS.forEach((def) => { assetsById[def.id].iconCanvas = fitIconCanvas(assetsById[def.id].iconCanvas); });

      function updateSelectionUI() {
        for (const cat of CATEGORIES) {
          const slot = catSlots[cat.id];

        document.querySelectorAll('.item').forEach((b) => b.classList.toggle('active', b.dataset.tool === selectedTool));
        document.getElementById('btn-eraser').classList.toggle('active', selectedTool === 'delete');

        updateHoverVisuals();
      }
      function selectTool(id, announce) {
        selectedTool = id;
        audio.playUiBlip(id === 'delete' ? 380 : 520);
        updateSelectionUI();
        if (announce) showItemName(id === 'delete' ? '지우개' : assetsById[id].def.name, 1100);
      }

      // tray open/close: short open delay so sweeping across the dock doesn't pop trays,
      // a grace period so moving from a slot up into its tray never closes it
      let openWrap = null, openTimer = 0, closeTimer = 0;
      function openTray(wrap) {
        clearTimeout(closeTimer);
        if (openWrap === wrap) return;
        if (openWrap) openWrap.classList.remove('open');
        openWrap = wrap;
        wrap.classList.add('open');
        audio.playUiBlip(760);
      }
      function closeTray() {
        clearTimeout(openTimer);
        if (openWrap) openWrap.classList.remove('open');
        openWrap = null;
        showItemName('');

      CATEGORIES.forEach((cat, ci) => {
        const items = ITEM_DEFS.filter((d) => d.category === cat.id);
        if (!items.length) return;
        const wrap = document.createElement('div');
        wrap.className = 'cat-wrap';
        const tray = document.createElement('div');
        tray.className = 'tray';
        items.forEach((def, i) => {
          const b = document.createElement('button');
          b.className = 'item';
          b.dataset.tool = def.id;
          b.dataset.category = def.category;
          b.style.setProperty('--i', i);
          b.style.setProperty('--tilt', `${((h2(i, ci, 5) - 0.5) * 7).toFixed(1)}deg`); // cards pinned a bit askew
          b.setAttribute('aria-label', def.name);
          b.appendChild(assetsById[def.id].iconCanvas);
          b.addEventListener('mouseenter', () => showItemName(def.name));
          b.addEventListener('mouseleave', () => showItemName(''));
          b.addEventListener('click', (e) => {
            e.stopPropagation();
            selectTool(def.id, false);
            showItemName(def.name, 900);
            setTimeout(() => { if (openWrap === wrap) closeTray(); }, 160);
          });
          tray.appendChild(b);
        });
        const btn = document.createElement('button');
        btn.className = 'cat';
        btn.setAttribute('aria-label', `${cat.name} (${ci + 1})`); // no native tooltip: the tray says it all
        const slotIcon = document.createElement('span');
        slotIcon.className = 'icon';
        slotIcon.innerHTML = makeToken(cat.id);
        btn.append(slotIcon);
        // click/tap: pick the slot's item and toggle the tray (touch has no hover)
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const slot = catSlots[cat.id];
          if (selectedTool !== slot.current) selectTool(slot.current, true);
          if (openWrap === wrap) closeTray(); else openTray(wrap);
        });
        wrap.addEventListener('mouseenter', () => {
          clearTimeout(closeTimer); clearTimeout(openTimer);
          openTimer = setTimeout(() => openTray(wrap), openWrap ? 0 : 90);
        });
        wrap.addEventListener('mouseleave', () => {
          clearTimeout(openTimer);
          closeTimer = setTimeout(() => { if (openWrap === wrap) closeTray(); }, 220);
        });
        wrap.append(tray, btn);
        catContainer.appendChild(wrap);
        catSlots[cat.id] = { wrap, btn, items, current: items[0].id };
      });
      // tapping the scene closes an open tray
      renderer.domElement.addEventListener('pointerdown', closeTray);
      // startup pop-in order (body.ui-pop): the dock left to right, then the top-right buttons

        if (!slot) return;
        let id = slot.current;
        if (selectedTool === slot.current) {

      // in-style hover labels for icon buttons (replaces the browser's title tooltip):

            hintEl.innerHTML = m ? `${m[1]} <span class="hint-key">${m[2]}</span>` : el.dataset.hint;
            const below = r.top < window.innerHeight / 2;

      // help panel
      const helpPanel = document.getElementById('help-panel');
      const btnHelp = document.getElementById('btn-help');

      const resetPopover = document.getElementById('reset-popover');
