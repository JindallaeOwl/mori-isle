<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mori Isle — Cozy 3D Miniature Diorama</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <style>
    :root {
      --ink: #f4e8cc;          /* warm cream for icons and the few words left */
      --ink-dim: rgba(244, 232, 204, 0.5);
      --glow: #ffc45e;         /* lamp light = "this is selected" */
      --glow-soft: rgba(255, 184, 84, 0.5);
      --danger: #ff8f7a;
      --scrim: rgba(3, 6, 16, 0.72); /* bottom shade, retinted per time of day from JS */
      --halo: rgba(4, 6, 14, 0.55);  /* shade behind an open tray, also per time of day */
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --font: 'Galmuri11', 'Galmuri9', monospace;
      --font-small: 'Galmuri9', 'Galmuri11', monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161d30;
      font-family: var(--font);
      font-size: 12px;
      color: var(--ink);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    #canvas-container.dragging { cursor: grabbing; }

    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 1px dashed var(--glow);
      outline-offset: 3px;
    }

    /* everything drawn over the scene shares one drop shadow so it reads on day and night */
    .lit {
      filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.75)) drop-shadow(0 0 5px rgba(0, 0, 0, 0.45));
    }

    .ui-layer {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.photo-mode .ui-layer {
      opacity: 0;
      pointer-events: none !important;
    }

    body.photo-mode #hud-dock { transform: translate(-50%, 16px); }
    body.photo-mode #sys { transform: translateY(-16px); }

    /* untouched for a while: the UI steps back so the diorama is the only thing on screen */
    /* panels are excluded: this rule would override their closed state (opacity 0) and show them */
    body.ui-idle:not(.photo-mode) .ui-layer:not(.panel) { opacity: 0.32; }

    #hud-scrim {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 150px;
      background: linear-gradient(to bottom, transparent, var(--scrim));
      pointer-events: none;
      z-index: 5;
      transition: background 1.2s ease, opacity 0.4s ease;
    }

    /* ---------- top right: icon-only system buttons ---------- */
    #sys {
      position: fixed;
      top: 16px;
      right: 18px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }

    /* wooden tokens (see 4C. COZY UI TOKENS): the token draws its own thickness, so only a
       soft contact shadow is added here */
    .token {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 3px 2.5px rgba(10, 6, 2, 0.38));
      transition: filter 0.25s ease;
    }
    .token .glyph { transform-box: view-box; transform-origin: 28px 27px; transition: transform 0.35s var(--spring); }

    .sys-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      transition: transform 0.25s var(--spring);
    }

    .sys-btn > span, .sys-btn > svg { width: 40px; height: 40px; display: block; }
    .sys-btn:hover { transform: scale(1.14) translateY(-2px) rotate(-4deg); }
    .sys-btn:active { transform: scale(0.9); }
    .sys-btn .token { filter: drop-shadow(0 3px 2.5px rgba(10, 6, 2, 0.38)) saturate(0.9) brightness(0.93); }
    .sys-btn.on .token { filter: drop-shadow(0 0 7px var(--glow-soft)) drop-shadow(0 3px 2.5px rgba(10, 6, 2, 0.35)) brightness(1.06); }

    #sys-sep {
      width: 1px;
      margin: 8px 4px;
      background: linear-gradient(transparent, rgba(244, 232, 204, 0.35), transparent);
    }

    /* small floating panels under the system buttons */
    .panel {
      position: fixed;
      top: 58px;
      right: 18px;
      z-index: 30;
      padding: 12px 14px;
      background: rgba(10, 12, 22, 0.78);
      border-radius: 3px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.25s var(--spring);
    }

    .panel.open {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    #help-panel {
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px 16px;
      line-height: 1.25;
    }

    #help-panel b {
      font-family: var(--font-small);
      font-weight: 400;
      color: var(--glow);
      text-align: right;
      white-space: nowrap;
    }

    #reset-popover { display: flex; gap: 10px; padding: 10px; }

    /* save slots: three cream paper cards, each with a little picture of the island it holds */
    /* no dark box: the cards float on their own. The motion (cards flying out of / back into the book
       token) is driven from JS with the Web Animations API (animateSaveCards); CSS only hides them
       once closed. */
    #save-panel {
      display: flex; gap: 12px; padding: 12px;
      background: none; box-shadow: none; backdrop-filter: none;
      opacity: 1; transform: none; transition: none;
    }
    #save-panel:not(.open) .save-card { visibility: hidden; transition: visibility 0s 0.36s; }
    .save-card {
      width: 132px;
      padding: 7px 7px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border-radius: 9px 11px 10px 8px;
      background: linear-gradient(170deg, #fbf1dc, #ead6ae);
      box-shadow: 0 3px 0 #b48a5c, 0 7px 14px rgba(10, 6, 2, 0.4), 0 2px 3px rgba(10, 6, 2, 0.25), inset 0 1px 0 #fffaf0;
      transform: rotate(var(--tilt, 0deg));
      transform-origin: 50% 35%;
    }
    .save-thumb {
      width: 118px;
      height: 79px;
      border-radius: 4px;
      background: rgba(120, 84, 48, 0.12) center / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(91, 58, 31, 0.28);
    }
    .save-card.empty .save-thumb { background-image: none; box-shadow: inset 0 0 0 1.5px rgba(91, 58, 31, 0.22); }
    .save-row { display: flex; gap: 2px; }
    .save-card .pop-btn { width: 40px; height: 40px; }
    .save-card.empty .slot-load, .save-card.empty .slot-del { display: none; }
    .save-card .pop-btn.arm { animation: arm-wobble 0.5s ease-in-out infinite; filter: drop-shadow(0 0 5px rgba(255, 150, 110, 0.85)); }
    @media (max-width: 560px) { /* phones: three smaller cards still fit */
      #save-panel { gap: 7px; padding: 8px; right: 8px; }
      .save-card { width: 96px; padding: 5px 4px 3px; }
      .save-thumb { width: 86px; height: 57px; }
      .save-card .pop-btn { width: 29px; height: 29px; }
    }
    @keyframes arm-wobble { 0%, 100% { transform: rotate(-7deg) scale(1.08); } 50% { transform: rotate(7deg) scale(1.08); } }

    .pop-btn {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      transition: transform 0.25s var(--spring);
    }

    .pop-btn:hover { transform: scale(1.14) translateY(-2px) rotate(-4deg); }
    .pop-btn:active { transform: scale(0.9); }

    /* ---------- bottom: category dock ---------- */
    #hud-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 14px;
      z-index: 25;
    }

    .dock-sep {
      width: 1px;
      height: 40px;
      margin: 0 2px 4px;
      background: linear-gradient(transparent, rgba(244, 232, 204, 0.3), transparent);
    }

    .cat-wrap { position: relative; }

    .cat, .tool {
      position: relative;
      width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cat .icon, .tool .icon {
      width: 58px;
      height: 58px;
      display: block;
      transition: transform 0.3s var(--spring);
    }

    /* resting tokens sit a little dim; the one in hand is lifted and lit */
    .cat .token, .tool .token { filter: drop-shadow(0 3px 2.5px rgba(10, 6, 2, 0.38)) saturate(0.88) brightness(0.92); }
    .cat.active .icon, .tool.active .icon { transform: translateY(-4px); }
    .cat.active .token, .tool.active .token { filter: drop-shadow(0 7px 5px rgba(10, 6, 2, 0.32)) brightness(1.05); }

    /* warm pool of light behind the active slot */
    .cat::before, .tool::before {
      content: '';
      position: absolute;
      left: -8px;
      right: -8px;
      top: -4px;
      height: 70px;
      background: radial-gradient(closest-side, rgba(255, 178, 80, 0.42), transparent);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.25s ease, transform 0.35s var(--spring);
      pointer-events: none;
    }

    .cat::after, .tool::after {
      content: '';
      position: absolute;
      bottom: -5px;
      width: 18px;
      height: 2px;
      background: var(--glow);
      box-shadow: 0 0 8px var(--glow);
      opacity: 0;
      transform: scaleX(0.2);
      transition: opacity 0.2s ease, transform 0.3s var(--spring);
    }

    .cat-wrap:hover .cat .icon, .cat-wrap.open .cat .icon, .tool:hover .icon { transform: translateY(-7px) scale(1.12) rotate(-3deg); }
    .cat-wrap:hover .cat .token, .cat-wrap.open .cat .token, .tool:hover .token { filter: drop-shadow(0 9px 6px rgba(10, 6, 2, 0.3)) brightness(1.04); }
    .cat:active .icon, .tool:active .icon { transform: scale(0.9); }

    .cat.active::before, .tool.active::before { opacity: 1; transform: none; }
    .cat.active::after, .tool.active::after { opacity: 1; transform: none; }
    .tool.active.eraser::before { background: radial-gradient(closest-side, rgba(255, 120, 100, 0.45), transparent); }
    .tool.active.eraser::after { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    /* the item tray that rises out of a category */
    .tray {
      position: absolute;
      bottom: 100%;
      left: 50%;
      display: flex;
      gap: 4px;
      padding: 0 10px 14px;  /* bottom padding bridges the gap so the hover never drops */
      transform: translateX(-50%);
      pointer-events: none;
    }

    .cat-wrap.open .tray { pointer-events: auto; }

    /* items sit on little cream paper cards, each pinned slightly askew */
    .item {
      position: relative;
      width: 52px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 9px 11px 10px 8px;
      background: linear-gradient(170deg, #fbf1dc, #ead6ae);
      box-shadow: 0 3px 0 #b48a5c, 0 5px 6px rgba(10, 6, 2, 0.35), inset 0 1px 0 #fffaf0;
      opacity: 0;
      transform: translateY(14px) scale(0.6) rotate(var(--tilt, 0deg));
      transition: opacity 0.16s ease, transform 0.34s var(--spring), box-shadow 0.2s ease;
      transition-delay: 0s;
    }

    .cat-wrap.open .item {
      opacity: 1;
      transform: rotate(var(--tilt, 0deg));
      transition-delay: calc(var(--i) * 30ms);
    }

    .item canvas {
      width: 44px;
      height: 44px;
      image-rendering: pixelated;
      transition: transform 0.25s var(--spring);
    }

    .cat-wrap.open .item:hover { transform: translateY(-5px) rotate(0deg) scale(1.08); box-shadow: 0 3px 0 #b48a5c, 0 9px 9px rgba(10, 6, 2, 0.3), inset 0 1px 0 #fffaf0; }
    .item:hover canvas { transform: scale(1.12); }
    /* terrain tool cards: the glyph drawn in ink on the paper (no wooden token) */
    .item .card-glyph { width: 44px; height: 44px; transition: transform 0.25s var(--spring); }
    .item:hover .card-glyph { transform: scale(1.12); }
    .cat-wrap.open .item:active { transform: scale(0.94); }

    /* the card in hand gets a warm stitched border */
    .item::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 7px 9px 8px 6px;
      border: 1.5px dashed #d98f3a;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .item.active::after { opacity: 1; }
    .item.active { background: linear-gradient(170deg, #fff4d8, #f4d79c); }

    /* one quiet line of text: the name of what you point at or just picked */
    #item-name {
      position: fixed;
      left: 50%;
      bottom: 150px;
      transform: translate(-50%, 4px);
      color: #ffe6b0;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      z-index: 26;
      transition: opacity 0.18s ease, transform 0.25s var(--spring);
    }

    #item-name.show { opacity: 1; transform: translate(-50%, 0); }

    #hint {
      position: fixed;
      transform: translate(-50%, 3px);
      color: var(--ink);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.15s ease, transform 0.22s var(--spring);
    }

    #hint.show { opacity: 1; transform: translate(-50%, 0); }
    #hint .hint-key { font-family: var(--font-small); color: var(--glow); margin-left: 3px; }

    /* photo mode: a single faint close mark */
    #photo-exit-btn {
      position: fixed;
      top: 16px;
      right: 18px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.22s var(--spring);
    }
    body.photo-mode #photo-exit-btn { opacity: 0.4; pointer-events: auto; }
    body.photo-mode #photo-exit-btn:hover { opacity: 1; transform: scale(1.15); }

    /* ---------- startup: black, then the scene fades in while the island assembles ---------- */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #000;
      transition: opacity 0.9s ease;
    }
    #loader.go { opacity: 0; pointer-events: none; }
    /* three.js never arrived: one quiet word, click reloads */
    #loader.failed { cursor: pointer; }
    #loader-retry { color: var(--ink-dim); white-space: nowrap; opacity: 0; transition: opacity 0.4s ease; }
    #loader.failed #loader-retry { opacity: 1; }

    /* the HUD stays out of sight until the island has assembled (beats the idle rule too) */
    body.booting .ui-layer, body.booting #item-name, body.booting #hint { opacity: 0 !important; pointer-events: none !important; }
    /* then each token hops in, one after another (--pop is set from JS) */
    body.ui-pop .sys-btn, body.ui-pop #sys-sep, body.ui-pop .cat-wrap, body.ui-pop .tool, body.ui-pop .dock-sep {
      animation: ui-pop-in 0.42s var(--spring) backwards;
      animation-delay: calc(var(--pop, 0) * 55ms);
    }
    @keyframes ui-pop-in { from { opacity: 0; transform: translateY(16px) scale(0.55); } }

    @media (max-width: 760px) {
      #hud-dock { gap: 6px; bottom: 10px; }
      .cat, .tool { width: 46px; }
      .cat .icon, .tool .icon { width: 46px; height: 46px; }
      .item { width: 44px; height: 48px; }
      .item canvas { width: 38px; height: 38px; }
      .sys-btn { width: 34px; height: 34px; }
      .sys-btn > span, .sys-btn > svg { width: 34px; height: 34px; }
      #sys { gap: 2px; right: 10px; }
    }
  </style>
</head>
<body class="booting">
  <!-- Startup: black until the game is ready, then it fades away as the island assembles -->
  <div id="loader">
    <div id="loader-retry">다시 불러오기</div>
  </div>
  <script>
    // three.js comes from a CDN: if the game module never ran by the time the page has loaded,
    // say so (a click reloads) instead of bobbing forever
    window.addEventListener('load', function () {
      if (!window.__moriBoot) document.getElementById('loader').classList.add('failed');
    });
    document.getElementById('loader').addEventListener('click', function () {
      if (this.classList.contains('failed')) location.reload();
    });
  </script>

  <!-- WebGL Viewport -->
  <div id="canvas-container"></div>

  <div id="hud-scrim" class="ui-layer"></div>

  <!-- Top right: icon-only system buttons -->
  <div id="sys" class="ui-layer">
    <button class="sys-btn" id="btn-time" aria-label="시간대" data-hint="시간대"><span id="time-icon"></span></button>
    <button class="sys-btn" id="btn-audio" aria-label="배경음" data-hint="배경음"><span id="audio-icon"></span></button>
    <!-- every HUD icon is a wooden token filled in by makeToken() (4C); the HTML holds empty slots -->
    <button class="sys-btn" id="btn-explode" aria-label="분해 보기 (E)" data-hint="분해 보기 (E)"></button>
    <button class="sys-btn" id="btn-photo" aria-label="감상 모드" data-hint="감상 모드"></button>
    <div id="sys-sep"></div>
    <button class="sys-btn" id="btn-save" aria-label="섬 저장" data-hint="섬 저장"></button>
    <button class="sys-btn" id="btn-reset" aria-label="섬 초기화" data-hint="섬 초기화"></button>
    <button class="sys-btn" id="btn-help" aria-label="조작법 (H)" data-hint="조작법 (H)"></button>
  </div>

  <div id="reset-popover" class="panel ui-layer">
    <button class="pop-btn" id="pop-starter" aria-label="처음 섬으로" data-hint="처음 섬으로"></button>
    <button class="pop-btn danger" id="pop-clear" aria-label="모두 비우기" data-hint="모두 비우기"></button>
  </div>

  <div id="save-panel" class="panel ui-layer">
    <div class="save-card empty" data-slot="1" style="--tilt: -1.6deg">
      <div class="save-thumb"></div>
      <div class="save-row">
        <button class="pop-btn slot-save" aria-label="저장" data-hint="저장"></button>
        <button class="pop-btn slot-load" aria-label="불러오기" data-hint="불러오기"></button>
        <button class="pop-btn slot-del" aria-label="지우기" data-hint="지우기"></button>
      </div>
    </div>
    <div class="save-card empty" data-slot="2" style="--tilt: 1.1deg">
      <div class="save-thumb"></div>
      <div class="save-row">
        <button class="pop-btn slot-save" aria-label="저장" data-hint="저장"></button>
        <button class="pop-btn slot-load" aria-label="불러오기" data-hint="불러오기"></button>
        <button class="pop-btn slot-del" aria-label="지우기" data-hint="지우기"></button>
      </div>
    </div>
    <div class="save-card empty" data-slot="3" style="--tilt: -0.7deg">
      <div class="save-thumb"></div>
      <div class="save-row">
        <button class="pop-btn slot-save" aria-label="저장" data-hint="저장"></button>
        <button class="pop-btn slot-load" aria-label="불러오기" data-hint="불러오기"></button>
        <button class="pop-btn slot-del" aria-label="지우기" data-hint="지우기"></button>
      </div>
    </div>
  </div>

  <div id="help-panel" class="panel ui-layer">
    <b>왼쪽 클릭</b><span>놓기</span>
    <b>오른쪽 클릭</b><span>지우기</span>
    <b>오른쪽 드래그</b><span>돌리기 · 기울이기</span>
    <b>휠 드래그</b><span>화면 이동</span>
    <b>휠</b><span>확대 · 축소</span>
    <b>1 ~ 6</b><span>도구 (다시 누르면 다음 것)</span>
    <b>R</b><span>방향 돌리기</span>
    <b>X</b><span>지우개</span>
    <b>E</b><span>분해 보기</span>
    <b>F</b><span>시점 되돌리기</span>
  </div>

  <!-- Bottom: categories (hover or tap to open), eraser, rotate -->
  <div id="hud-dock" class="ui-layer">
    <div id="cat-container" style="display:flex;gap:inherit;align-items:flex-end"></div>
    <div class="dock-sep"></div>
    <button class="tool eraser" id="btn-eraser" data-tool="delete" aria-label="지우개 (X)" data-hint="지우개 (X)">
      <span class="icon"></span>
    </button>
    <button class="tool" id="btn-rotate" aria-label="방향 돌리기 (R)" data-hint="방향 돌리기 (R)">
      <span class="icon"></span>
    </button>
  </div>

  <div id="item-name" class="lit"></div>
  <div id="hint" class="lit"></div>

  <button id="photo-exit-btn" aria-label="감상 모드 끝내기 (Esc)" data-hint="감상 모드 끝내기 (Esc)"></button>

  <script type="module">
    import * as THREE from 'three';
    window.__moriBoot = true; // three.js arrived (the loader checks this on page load)

    /* =========================================================================
       1. CONFIGURATION, ORGANIC POND SDF & TERRACED HILL FRAMING
       ========================================================================= */
    const GRID_SIZE = 12;
    const HALF_GRID = GRID_SIZE / 2;
    const MAX_PIXEL_RATIO = 2.0; // only the final upscale pass runs at this density
    // --- Low-res pixel rendering (scene is drawn small, then sharply upscaled) ---
    const HASH = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map((kv) => {
      const [k, v] = kv.split('='); return [k, v === undefined ? '1' : v];
    }));
    const LOWRES = {
      enabled: HASH.hires !== '1', // #hires=1 renders at full resolution for comparison
      maxIH: 600,                  // internal height cap (px)
      maxPix: 620000,              // internal pixel budget

      quality: 1.0,                // adaptive scale 0.55 ~ 1.0

        hemiIntensity: 0.58,
        fogColor: new THREE.Color('#f5b384'),
        fogDensity: 0.46,
        waterDeep: new THREE.Color('#34456b'),
        waterShallow: new THREE.Color('#c47964'),
        waterFoam: new THREE.Color('#ffe0ba'),
        gradeTint: new THREE.Color('#ffe8cf'),
        gradeWarmth: 0.11,

      },
      night: {

        dotColor: '#8ea8ff',
        skyTop: new THREE.Color('#090e21'),
        skyBottom: new THREE.Color('#1d2a4f'),
        keyColor: new THREE.Color('#7a96dc'),  // cold moonlight
        keyIntensity: 0.8,
        fillColor: new THREE.Color('#24365f'),
        fillIntensity: 0.3,
        rimColor: new THREE.Color('#8aa8f0'),
        rimIntensity: 0.62,
        hemiSky: new THREE.Color('#26375f'),
        hemiGround: new THREE.Color('#0c0e17'),
        hemiIntensity: 0.38,
        fogColor: new THREE.Color('#1c2a4c'),
        fogDensity: 0.54,
        waterDeep: new THREE.Color('#0d1a38'),
        waterShallow: new THREE.Color('#1f3b6b'),
        waterFoam: new THREE.Color('#6488bd'),

    const TIME_ORDER = ['day', 'golden', 'night'];

    /* =========================================================================
       2. DETERMINISTIC HASH, EASING & SHARED UNIFORMS
       ========================================================================= */
    // Smooth 1D value noise in [-1, 1] (two octaves of this give a natural flame flicker)
    function noise1(x, seed = 0) {
      const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
      const a = Math.sin((i + seed * 13.1) * 127.1) * 43758.5453, b = Math.sin((i + 1 + seed * 13.1) * 127.1) * 43758.5453;
      return ((a - Math.floor(a)) * (1 - u) + (b - Math.floor(b)) * u) * 2 - 1;
    }
    function fireFlicker(t, seed) {
      return 0.86 + 0.1 * noise1(t * 6.3, seed) + 0.06 * noise1(t * 17.0, seed + 1);
    }

    function hash2D(x, y, seed = 0) {
      const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    // Juicy Ease-Out-Back overshoot curve for Exploded View layers
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    const sharedUniforms = {
      uTime: { value: 0 },
      uNightFactor: { value: 0.0 },
      uFogColor: { value: ATMOSPHERES.day.fogColor.clone() },
      uFogDensity: { value: ATMOSPHERES.day.fogDensity },
      uFogBottom: { value: -1.1 },
      uFogTop: { value: 1.45 },
      uWaterDeep: { value: ATMOSPHERES.day.waterDeep.clone() },
      uWaterShallow: { value: ATMOSPHERES.day.waterShallow.clone() },
      uWaterFoam: { value: ATMOSPHERES.day.waterFoam.clone() },
      uSkyTop: { value: ATMOSPHERES.day.skyTop.clone() },
      uSkyBottom: { value: ATMOSPHERES.day.skyBottom.clone() },
      uGradeTint: { value: ATMOSPHERES.day.gradeTint.clone() },
      uGradeWarmth: { value: ATMOSPHERES.day.gradeWarmth },
      uPointScale: { value: 0.5 }, // scene pixels per CSS pixel (for gl_PointSize)
      uViewH: { value: 600 },      // scene render target height (points sized in world units)
      // Exploded View GPU uniforms for clear 4-tier non-overlapping separation
      uExplodeSpread: { value: 0.0 },
      uExplodePropLift: { value: 0.0 },
      uExplodeMidLift: { value: 0.0 },
      uExplodeTopLift: { value: 0.0 },
      uExplodeTwist: { value: 0.0 }

    /* =========================================================================
       3. SYNTHESIZED COZY WEB AUDIO ENGINE (WITH CASCADING EXPLODE BLOCK SFX)
       ========================================================================= */
    class CozyAudio {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.enabled = false;
        this.wantOn = true; // sound is on by default; it actually starts on the first click / key
        this.chimeTimer = null;
        this.isNight = false;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        const ctx = this.ctx;

        // Output: everything ends in a gentle compressor so stacked clicks / chimes never clip
        this.comp = ctx.createDynamicsCompressor();
        this.comp.threshold.value = -18; this.comp.knee.value = 12; this.comp.ratio.value = 3.5;
        this.comp.attack.value = 0.004; this.comp.release.value = 0.18;
        this.comp.connect(ctx.destination);

        // Small-room reverb from a generated impulse (decaying stereo noise), shared by sfx and chimes
        this.reverb = ctx.createConvolver();
        this.reverb.buffer = this.makeImpulse(1.6, 3.2);
        this.revReturn = ctx.createGain(); this.revReturn.gain.value = 0.22;
        this.reverb.connect(this.revReturn); this.revReturn.connect(this.comp);

        // Ambience (wind, chimes): master on/off fader
        this.masterGain = ctx.createGain();
        this.masterGain.gain.value = 0.0001;
        this.masterGain.connect(this.comp);
        const ambSend = ctx.createGain(); ambSend.gain.value = 0.5;
        this.masterGain.connect(ambSend); ambSend.connect(this.reverb);

        // Sound effects bus (same level the old masterGain gave them), with a reverb send
        this.sfxBus = ctx.createGain(); this.sfxBus.gain.value = 0.42;
        this.sfxBus.connect(this.comp);
        const sfxSend = ctx.createGain(); sfxSend.gain.value = 0.35;
        this.sfxBus.connect(sfxSend); sfxSend.connect(this.reverb);

        // Shared white noise for clicks and crackles
        const wl = ctx.sampleRate;
        this.white = ctx.createBuffer(1, wl, ctx.sampleRate);
        const wd = this.white.getChannelData(0);
        for (let i = 0; i < wl; i++) wd[i] = Math.random() * 2 - 1;

        // Campfire bed: brown-ish rumble whose level follows nearby fires (see setFire / updateFire)
        const bl = ctx.sampleRate * 2, brown = ctx.createBuffer(1, bl, ctx.sampleRate), bd = brown.getChannelData(0);
        let last = 0;
        for (let i = 0; i < bl; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
        const rumble = ctx.createBufferSource(); rumble.buffer = brown; rumble.loop = true;
        const rumbleLP = ctx.createBiquadFilter(); rumbleLP.type = 'lowpass'; rumbleLP.frequency.value = 520;
        this.fireGain = ctx.createGain(); this.fireGain.gain.value = 0;
        this.firePan = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
        rumble.connect(rumbleLP); rumbleLP.connect(this.fireGain); this.fireGain.connect(this.firePan); this.firePan.connect(this.masterGain);
        rumble.start();
        this.fireLevel = 0; this.firePanValue = 0;

        // Waterfall bed (setFalls / updateFalls): a quiet babble, noise through a band that hops
        // about (updateFalls) over a low soft rush; its level follows the falls near the view
        const fsrc = ctx.createBufferSource(); fsrc.buffer = this.white; fsrc.loop = true;
        this.fallBand = ctx.createBiquadFilter(); this.fallBand.type = 'bandpass'; this.fallBand.frequency.value = 900; this.fallBand.Q.value = 2.2;
        const fallRush = ctx.createBiquadFilter(); fallRush.type = 'lowpass'; fallRush.frequency.value = 700;
        const rushGain = ctx.createGain(); rushGain.gain.value = 0.35;
        this.fallGain = ctx.createGain(); this.fallGain.gain.value = 0;
        this.fallPan = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
        fsrc.connect(this.fallBand); this.fallBand.connect(this.fallGain);
        fsrc.connect(fallRush); fallRush.connect(rushGain); rushGain.connect(this.fallGain);
        this.fallGain.connect(this.fallPan); this.fallPan.connect(this.masterGain);
        fsrc.start();
        this.fallLevel = 0; this.fallPanValue = 0; this.fallNext = 0;

        // Pause audio while the tab is hidden
        document.addEventListener('visibilitychange', () => {
          if (!this.ctx) return;
          if (document.hidden) this.ctx.suspend(); else if (this.enabled) this.ctx.resume();
        });

        // Soft pink-ish filtered breeze
        const bufferSize = this.ctx.sampleRate * 3;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          output[i] = (b0 + b1 + b2 + white * 0.015) * 0.5;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 340;
        filter.Q.value = 1.1;

        const lfo = this.ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.11;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 150;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();

        const windGain = this.ctx.createGain();
        windGain.gain.value = 0.2;
        noise.connect(filter);
        filter.connect(windGain);
        windGain.connect(this.masterGain);
        noise.start();
      }

      makeImpulse(seconds, decay) {
        const ctx = this.ctx, len = Math.floor(ctx.sampleRate * seconds), buf = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = buf.getChannelData(c);
          for (let i = 0; i < len; i++) {
            const t = i / len;
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < 90 ? i / 90 : 1); // soft onset, exponential-ish tail
          }
        }
        return buf;
      }

      // route a node into the sfx bus with stereo position (-1 left .. 1 right)
      out(node, pan = 0) {
        if (this.ctx.createStereoPanner && pan) {
          const pn = this.ctx.createStereoPanner();
          pn.pan.value = Math.max(-1, Math.min(1, pan));
          node.connect(pn); pn.connect(this.sfxBus);
        } else node.connect(this.sfxBus);
      }

      // short filtered noise burst: the "wood" in a wooden click / crackle pop
      noiseHit(t, { freq = 1800, q = 3.5, vol = 0.1, decay = 0.035, type = 'bandpass', pan = 0, dest = null } = {}) {
        const ctx = this.ctx;
        const src = ctx.createBufferSource(); src.buffer = this.white;
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.0015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        src.connect(f); f.connect(g);
        if (dest) {
          if (this.ctx.createStereoPanner && pan) { const pn = ctx.createStereoPanner(); pn.pan.value = pan; g.connect(pn); pn.connect(dest); }
          else g.connect(dest);
        } else this.out(g, pan);
        src.start(t, Math.random() * 0.8); src.stop(t + decay + 0.02);
      }

      // Campfire ambience: level 0..1 from nearby fires + zoom, pan from screen position
      setFire(level, pan) {
        if (!this.ctx) return;
        this.fireLevel = level; this.firePanValue = pan;
        const now = this.ctx.currentTime;
        this.fireGain.gain.setTargetAtTime(this.enabled ? level * 0.09 : 0, now, 0.4);
        if (this.firePan.pan) this.firePan.pan.setTargetAtTime(pan, now, 0.3);
      }
      // Waterfall ambience: level 0..1 from the falls near the view + zoom, pan from screen position
      setFalls(level, pan) {
        if (!this.ctx) return;
        this.fallLevel = level; this.fallPanValue = pan;
        const now = this.ctx.currentTime;
        this.fallGain.gain.setTargetAtTime(this.enabled ? level * 0.05 : 0, now, 0.5);
        if (this.fallPan.pan) this.fallPan.pan.setTargetAtTime(pan, now, 0.3);
      }
      updateFalls(dt) { // the babble: the band hops around, and now and then a small droplet plink
        if (!this.ctx || !this.enabled || this.fallLevel < 0.02 || document.hidden) return;
        const ctx = this.ctx, now = ctx.currentTime;
        if (now >= this.fallNext) {
          this.fallNext = now + 0.04 + Math.random() * 0.07;
          this.fallBand.frequency.setTargetAtTime(520 + Math.random() * 1150, now, 0.018);
        }
        if (Math.random() < dt * 3.5 * this.fallLevel) {
          const t = now + Math.random() * dt, o = ctx.createOscillator(), g = ctx.createGain(), f0 = 1300 + Math.random() * 900;
          o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 1.7, t + 0.035);
          g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.022 * this.fallLevel, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
          o.connect(g);
          if (ctx.createStereoPanner) {
            const pn = ctx.createStereoPanner(); pn.pan.value = Math.max(-1, Math.min(1, this.fallPanValue + (Math.random() - 0.5) * 0.3));
            g.connect(pn); pn.connect(this.masterGain);
          } else g.connect(this.masterGain);
          o.start(t); o.stop(t + 0.08);
        }
      }
      updateFire(dt) {
        if (!this.ctx || !this.enabled || this.fireLevel < 0.02 || document.hidden) return;
        // crackle pops: random rate, random brightness, a few big snaps
        let expected = dt * 9 * this.fireLevel;
        const now = this.ctx.currentTime;
        while (expected > 0) {
          if (Math.random() < Math.min(1, expected)) {
            const big = Math.random() < 0.12;
            this.noiseHit(now + Math.random() * dt, {
              type: 'highpass', freq: big ? 900 : 1600 + Math.random() * 2600, q: 0.7,
              vol: (big ? 0.11 : 0.035 + Math.random() * 0.04) * this.fireLevel,
              decay: big ? 0.05 : 0.012 + Math.random() * 0.02,
              pan: this.firePanValue + (Math.random() - 0.5) * 0.2, dest: this.masterGain
            });
          }
          expected -= 1;
        }
      }

      ensureSfxContext() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      // must run inside a user gesture (browsers block audio before the first click / key)
      setEnabled(on) {
        this.ensureSfxContext();
        if (this.enabled !== on) this.toggle(true);
        return this.enabled;
      }

      toggle(silent = false) {
        this.ensureSfxContext();
        this.enabled = !this.enabled;
        this.wantOn = this.enabled;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setTargetAtTime(this.enabled ? 0.42 : 0.0001, now, silent ? 0.9 : 0.25);
        this.setFire(this.fireLevel, this.firePanValue);
        this.setFalls(this.fallLevel, this.fallPanValue);

        if (this.enabled) {
          this.scheduleChime();
          if (!silent) this.playUiBlip(523.25);
        } else if (this.chimeTimer) {
          clearTimeout(this.chimeTimer);
          this.chimeTimer = null;
        }
        return this.enabled;
      }

      scheduleChime() {
        if (!this.enabled) return;
        this.chimeTimer = setTimeout(() => {
          if (this.enabled) {
            this.playWindChime();
            this.scheduleChime();
          }
        }, 2800 + Math.random() * 4200);
      }

      playWindChime() {
        if (!this.ctx || !this.enabled) return;
        const notes = this.isNight
          ? [392.0, 440.0, 523.25, 587.33, 659.25]
          : [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
        const freq = notes[Math.floor(Math.random() * notes.length)];
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.085, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.7);
        osc.connect(gain);
        gain.connect(this.masterGain); // chime lives on the ambience fader (+ reverb send)
        osc.start(now);
        osc.stop(now + 2.8);
      }

      // Cascading wooden-block / card-fanning SFX synced to Exploded View stagger!
      playExplodeCascade(opening) {
        this.ensureSfxContext();
        const quiet = !this.enabled; // UI feedback stays audible (softly) even with ambience off
        const baseVol = quiet ? 0.09 : 0.22;
        const steps = 8;
        const now = this.ctx.currentTime;

        for (let i = 0; i < steps; i++) {
          const t = now + i * 0.026; // Matches 0.026s layer wave stagger
          const frac = opening ? i / (steps - 1) : 1 - i / (steps - 1);
          const freq = 270 + frac * 420;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * (opening ? 1.18 : 0.86), t + 0.055);

          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(baseVol * (0.75 + 0.25 * frac), t + 0.007);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);

          osc.connect(gain);
          if (quiet) gain.connect(this.comp); else this.out(gain);
          osc.start(t);
          osc.stop(t + 0.095);
          this.noiseHit(t, { freq: 1400 + frac * 1400, q: 4, vol: baseVol * 0.5, decay: 0.03, dest: quiet ? this.comp : null });
        }
      }

      // LEGO-style stacking clicks: one per landing group, pitch 1.0 -> 1.3
      playStackClicks(times, pan = 0) {
        this.ensureSfxContext();
        const quiet = !this.enabled;
        const send = (node) => { if (quiet) node.connect(this.comp); else this.out(node, pan); };
        const vol = quiet ? 0.07 : 0.16;
        const now = this.ctx.currentTime;
        const n = times.length;
        times.forEach((dt, i) => {
          const t = now + dt;
          const pitch = 1.0 + 0.3 * (n > 1 ? i / (n - 1) : 0);
          const f = 620 * pitch;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f * 1.6, t);
          osc.frequency.exponentialRampToValueAtTime(f, t + 0.018);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol * (i === 0 || i === n - 1 ? 1.0 : 0.7), t + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          osc.connect(gain); send(gain);
          osc.start(t); osc.stop(t + 0.06);
          // the wooden "tok": band-passed noise rising with the tone
          this.noiseHit(t, { freq: 1700 * pitch, q: 3.2, vol: vol * 0.9 * (i === n - 1 ? 1.2 : 1), decay: 0.032, pan, dest: quiet ? this.comp : null });
        });
        // soft wooden thump on the final landing
        const tEnd = now + times[n - 1];
        const th = this.ctx.createOscillator();
        const tg = this.ctx.createGain();
        th.type = 'sine';
        th.frequency.setValueAtTime(190, tEnd);
        th.frequency.exponentialRampToValueAtTime(95, tEnd + 0.09);
        tg.gain.setValueAtTime(0.0001, tEnd);
        tg.gain.linearRampToValueAtTime(vol * 1.1, tEnd + 0.005);
        tg.gain.exponentialRampToValueAtTime(0.0001, tEnd + 0.11);
        th.connect(tg); send(tg);
        th.start(tEnd); th.stop(tEnd + 0.12);
      }

      // --- startup assembly (section 17): only with sound on and running. While the browser still
      // holds audio back the context is suspended and its clock stopped: anything scheduled then
      // would all play at once when it resumes, so those sounds are simply skipped
      introReady() { return !!this.ctx && this.enabled && this.ctx.state === "running"; }
      // a heavy island layer landing: low thud + dull knock + a little grit
      introThump(size = 1, pan = 0) {
        if (!this.introReady()) return;
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(120 + 30 * (1 - size), t);
        o.frequency.exponentialRampToValueAtTime(46, t + 0.24);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.34 * size, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
        o.connect(g); this.out(g, pan);
        o.start(t); o.stop(t + 0.34);
        this.noiseHit(t, { type: 'lowpass', freq: 480, q: 0.8, vol: 0.24 * size, decay: 0.13, pan });
        this.noiseHit(t + 0.012, { freq: 2400, q: 1.1, vol: 0.05 * size, decay: 0.1, pan });
      }
      // one object landing: the placement "tok", pitch climbing through the whole sequence
      introClick(pitch = 1, pan = 0, heavy = false) {
        if (!this.introReady()) return;
        const t = this.ctx.currentTime, f = 600 * pitch, vol = heavy ? 0.15 : 0.11;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f * 1.6, t);
        o.frequency.exponentialRampToValueAtTime(f, t + 0.018);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
        o.connect(g); this.out(g, pan);
        o.start(t); o.stop(t + 0.065);
        this.noiseHit(t, { freq: 1700 * pitch, q: 3.2, vol: vol * 0.9, decay: 0.032, pan });
        if (heavy) {
          const th = this.ctx.createOscillator(), tg = this.ctx.createGain();
          th.type = 'sine';
          th.frequency.setValueAtTime(190, t);
          th.frequency.exponentialRampToValueAtTime(95, t + 0.09);
          tg.gain.setValueAtTime(0.0001, t);
          tg.gain.linearRampToValueAtTime(0.16, t + 0.005);
          tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
          th.connect(tg); this.out(tg, pan);
          th.start(t); th.stop(t + 0.12);
        }
      }
      // water: a round "bloop" (rising sine)
      introPlop(pan = 0, pitch = 1) {
        if (!this.introReady()) return;
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(240 * pitch, t);
        o.frequency.exponentialRampToValueAtTime(780 * pitch, t + 0.07);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.13, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        o.connect(g); this.out(g, pan);
        o.start(t); o.stop(t + 0.13);
      }
      // a lamp or fire catching: soft noise "fwoomp" with a warm two-note glow
      introIgnite(pan = 0, pitch = 1) {
        if (!this.introReady()) return;
        const ctx = this.ctx, t = ctx.currentTime;
        const src = ctx.createBufferSource(); src.buffer = this.white;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
        bp.frequency.setValueAtTime(380, t);
        bp.frequency.exponentialRampToValueAtTime(2200, t + 0.22);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.1, t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
        src.connect(bp); bp.connect(g); this.out(g, pan);
        src.start(t, Math.random() * 0.5); src.stop(t + 0.36);
        [523.25, 783.99].forEach((fr, i) => {
          const o = ctx.createOscillator(), og = ctx.createGain(), ts = t + 0.05 + i * 0.07;
          o.type = 'sine'; o.frequency.value = fr * pitch;
          og.gain.setValueAtTime(0.0001, ts);
          og.gain.linearRampToValueAtTime(0.045, ts + 0.02);
          og.gain.exponentialRampToValueAtTime(0.0001, ts + 0.5);
          o.connect(og); this.out(og, pan);
          o.start(ts); o.stop(ts + 0.52);
        });
      }
      // the island giving way before a reset: low rumble with a few loose knocks
      introRumble() {
        if (!this.introReady()) return;
        const ctx = this.ctx, t = ctx.currentTime;
        const src = ctx.createBufferSource(); src.buffer = this.white; src.loop = true;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 170; lp.Q.value = 0.9;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.5, t + 0.12);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
        src.connect(lp); lp.connect(g); this.out(g, 0);
        src.start(t); src.stop(t + 1.05);
        for (let i = 0; i < 5; i++) {
          this.noiseHit(t + 0.05 + i * 0.09 + Math.random() * 0.05, { freq: 900 + Math.random() * 900, q: 3, vol: 0.06, decay: 0.035, pan: (Math.random() - 0.5) * 0.8 });
        }
      }

      playPlace() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.08);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc.connect(gain);
        this.out(gain);
        osc.start(now);
        osc.stop(now + 0.13);
      }

      playRemove() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.09);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.13, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
        osc.connect(gain);
        this.out(gain);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      // terrain edit: a soft earthy thump (rising when raised, sinking when lowered) + crumbling soil
      playTerrain(dir = 1, pan = 0) {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(dir > 0 ? 90 : 170, t);
        o.frequency.exponentialRampToValueAtTime(dir > 0 ? 165 : 70, t + 0.16);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.22, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
        o.connect(g); this.out(g, pan);
        o.start(t); o.stop(t + 0.26);
        this.noiseHit(t, { type: 'lowpass', freq: 650, q: 0.7, vol: 0.16, decay: 0.12, pan });
        for (let i = 0; i < 4; i++) {
          this.noiseHit(t + 0.06 + i * 0.045 + Math.random() * 0.03, { freq: 1300 + Math.random() * 1500, q: 2.5, vol: 0.035, decay: 0.025, pan: pan + (Math.random() - 0.5) * 0.2 });
        }
      }
      // ground paint: a soft brush swish coloured by the material (sand hiss, dirt scuff, stone click)
      playPaint(mat = 0, pan = 0) {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        if (mat === 4) { // water: a small wet bloop over a soft trickle
          const o = this.ctx.createOscillator(), g = this.ctx.createGain(), p = 0.9 + Math.random() * 0.35;
          o.type = 'sine';
          o.frequency.setValueAtTime(300 * p, t);
          o.frequency.exponentialRampToValueAtTime(720 * p, t + 0.06);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.07, t + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
          o.connect(g); this.out(g, pan);
          o.start(t); o.stop(t + 0.11);
          this.noiseHit(t, { freq: 1500 + Math.random() * 500, q: 1.2, vol: 0.025, decay: 0.09, pan });
          return;
        }
        const P = [[2600, 0.8, 0.05], [5200, 0.7, 0.05], [900, 0.9, 0.06], [1700, 2.5, 0.045]][mat] || [2600, 0.8, 0.05];
        this.noiseHit(t, { freq: P[0] * (0.92 + Math.random() * 0.16), q: P[1], vol: P[2], decay: 0.07, pan });
        if (mat === 3) this.noiseHit(t + 0.025, { freq: 2400 + Math.random() * 600, q: 6, vol: 0.05, decay: 0.018, pan });
      }
      // wildflower seeds: a patter of tiny seeds, then a soft chime as the flowers come up
      playSeeds(pan = 0) {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        for (let i = 0; i < 6; i++) {
          this.noiseHit(t + i * 0.028 + Math.random() * 0.02, { freq: 3800 + Math.random() * 2600, q: 5, vol: 0.03, decay: 0.012, pan: pan + (Math.random() - 0.5) * 0.3 });
        }
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t1 = t + 0.22;
        o.type = 'sine';
        o.frequency.value = [1046.5, 1174.7, 1318.5, 1568, 1760][Math.floor(Math.random() * 5)];
        g.gain.setValueAtTime(0.0001, t1);
        g.gain.linearRampToValueAtTime(0.028, t1 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.38);
        o.connect(g); this.out(g, pan);
        o.start(t1); o.stop(t1 + 0.4);
      }
      // save cards sliding out of (or back into) the book: three soft paper swishes, one per card,
      // rising in pitch on the way out and falling on the way back, with a faint page tick
      playPaper(open = true) {
        if (!this.ctx || !this.enabled) return;
        const ctx = this.ctx, t0 = ctx.currentTime;
        for (let i = 0; i < 3; i++) {
          const t = t0 + (open ? i * 0.06 : i * 0.04) + Math.random() * 0.012;
          const dur = open ? 0.2 : 0.14;
          const src = ctx.createBufferSource(); src.buffer = this.white;
          const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.9;
          const f0 = (open ? 1500 : 3000) * (0.93 + Math.random() * 0.14), f1 = open ? f0 * 2.1 : f0 * 0.5;
          f.frequency.setValueAtTime(f0, t);
          f.frequency.exponentialRampToValueAtTime(f1, t + dur);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.045, t + dur * 0.35);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(f); f.connect(g); this.out(g, 0.35 - i * 0.12);
          src.start(t, Math.random() * 0.8); src.stop(t + dur + 0.02);
          if (open) this.noiseHit(t + dur * 0.9, { freq: 2600 + Math.random() * 500, q: 3, vol: 0.022, decay: 0.02, pan: 0.35 - i * 0.12 });
        }
      }
      // terrain edit refused: a dull wooden knock
      playTerrainBlocked(pan = 0) {
        if (!this.ctx || !this.enabled) return;
        const t = this.ctx.currentTime;
        this.noiseHit(t, { freq: 420, q: 4, vol: 0.12, decay: 0.05, pan });
        this.noiseHit(t + 0.07, { freq: 360, q: 4, vol: 0.08, decay: 0.05, pan });
      }

      playRotate() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(720, now + 0.045);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
        osc.connect(gain);
        this.out(gain);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      playUiBlip(freq = 480) {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.07, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        osc.connect(gain);
        this.out(gain);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    const audio = new CozyAudio();

    /* =========================================================================
       4. SHADER ENHANCEMENT HOOK
          (LOW-LYING HEIGHT FOG + WIND SWAY + GPU SLICE EXPLODE FANNING)
       ========================================================================= */
    // --- LEGO-style 'tadadak' stacked drop (GPU, per-instance spawn time) ---
    const DROP_STRIDE = 0.017;   // per-group stagger (s)
    const DROP_FALL = 0.07;      // fall time per layer (s)
    const DROP_HEIGHT = 0.9;
    function dropGroupFor(layers) { return layers > 30 ? 2 : 1; }
    function dropTotalTime(layers) {
      return Math.floor((layers - 1) / dropGroupFor(layers)) * DROP_STRIDE + DROP_FALL;
    }
    const DROP_DECL = `
      uniform float uDropLayers;
      uniform float uDropGroup;
      attribute float aSpawn;`;
    function dropVertexGLSL(withFlash) {
      return `
      {
        float dSince = uTime - aSpawn;
        if (dSince < 0.9) {
          float li = floor(aLayerH * (uDropLayers - 1.0) + 0.5);
          float g = floor(li / uDropGroup);
          float G = floor((uDropLayers - 1.0) / uDropGroup);
          float tl = dSince - g * ${DROP_STRIDE.toFixed(4)};
          float FALL = ${DROP_FALL.toFixed(4)};
          // Whole-stack squash: 0.85 -> 1.05 -> 1.0 right as the top lands
          float u = dSince - (G * ${DROP_STRIDE.toFixed(4)} + FALL - 0.03);
          if (u > 0.0 && u < 0.14) {
            float sy = u < 0.045 ? mix(1.0, 0.85, u / 0.045)
                     : (u < 0.10 ? mix(0.85, 1.05, (u - 0.045) / 0.055)
                                 : mix(1.05, 1.0, (u - 0.10) / 0.04));
            transformed.y *= sy;
            transformed.xz *= 1.0 + (1.0 - sy) * 0.45;
          }
          if (tl < 0.0) {
            transformed *= 0.0; // not yet dropped: collapse slice
          } else if (tl < FALL) {
            float p = tl / FALL;
            float e = p * p; // ease-in
            transformed.y += (1.0 - e) * ${DROP_HEIGHT.toFixed(2)};
            float seed = 0.0;
            #ifdef USE_INSTANCING
              seed = instanceMatrix[3][0] * 3.17 + instanceMatrix[3][2] * 1.93;
            #endif
            float r = fract(sin(li * 12.9898 + seed) * 43758.5453);
            float ang = (r < 0.5 ? -1.0 : 1.0) * mix(0.087, 0.175, fract(r * 7.0)) * (1.0 - e);
            float cs = cos(ang), sn = sin(ang);
            transformed.xz = mat2(cs, -sn, sn, cs) * transformed.xz;
          }${withFlash ? `
          else if (tl < FALL + 0.035) {
            vDropFlash = 1.0 - (tl - FALL) / 0.035;
          }` : ''}
        }
      }`;
    }

    function enhanceStandardMaterial(
      material,
      {
        windStrength = 0.0,
        useLayerHeight = false,
        useGrassTip = false,
        emissiveNightBoost = 0.0,
        explodeSliceFactor = 0.0,
        explodeTier = 0,
        canopySplit = 0.0,
        dropLayers = 0
      } = {}
    ) {
      const useDrop = useLayerHeight && dropLayers > 0;
      material.userData.emissiveNightBoost = emissiveNightBoost; // read by mergeChunkToOneMesh
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = sharedUniforms.uTime;
        shader.uniforms.uNightFactor = sharedUniforms.uNightFactor;
        shader.uniforms.uFogColor = sharedUniforms.uFogColor;
        shader.uniforms.uFogDensity = sharedUniforms.uFogDensity;
        shader.uniforms.uFogBottom = sharedUniforms.uFogBottom;
        shader.uniforms.uFogTop = sharedUniforms.uFogTop;
        shader.uniforms.uWindStrength = { value: windStrength };
        shader.uniforms.uEmissiveNightBoost = { value: emissiveNightBoost };
        shader.uniforms.uExplodeSpread = sharedUniforms.uExplodeSpread;
        shader.uniforms.uExplodePropLift = sharedUniforms.uExplodePropLift;
        shader.uniforms.uExplodeMidLift = sharedUniforms.uExplodeMidLift;
        shader.uniforms.uExplodeTopLift = sharedUniforms.uExplodeTopLift;
        shader.uniforms.uExplodeTwist = sharedUniforms.uExplodeTwist;
        shader.uniforms.uExplodeSliceFactor = { value: explodeSliceFactor };
        shader.uniforms.uExplodeTier = { value: explodeTier };
        shader.uniforms.uCanopySplit = { value: canopySplit };
        shader.uniforms.uDropLayers = { value: dropLayers };
        shader.uniforms.uDropGroup = { value: dropGroupFor(dropLayers || 1) };

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uWindStrength;
            uniform float uExplodeSpread;
            uniform float uExplodePropLift;
            uniform float uExplodeMidLift;
            uniform float uExplodeTopLift;
            uniform float uExplodeTwist;
            uniform float uExplodeSliceFactor;
            uniform float uExplodeTier;
            uniform float uCanopySplit;
            ${useLayerHeight ? 'attribute float aLayerH;' : ''}
            ${useGrassTip ? 'attribute float aTipWeight;' : ''}
            ${useDrop ? DROP_DECL + '\n            varying float vDropFlash;' : ''}
            varying float vWorldY;
            varying vec2 vWorldXZ;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            ${useDrop ? 'vDropFlash = 0.0;' + dropVertexGLSL(true) : ''}
            if (uWindStrength > 0.0001) {
              float hFactor = ${useGrassTip ? 'aTipWeight' : (useLayerHeight ? 'aLayerH * aLayerH' : 'clamp(position.y, 0.0, 2.0)')};
              float phase = 0.0;
              #ifdef USE_INSTANCING
                phase = instanceMatrix[3][0] * 0.72 + instanceMatrix[3][2] * 0.54;
              #else
                phase = position.x * 0.7 + position.z * 0.5;
              #endif
              float freq = ${useGrassTip ? '2.4' : '1.9'};
              transformed.x += sin(uTime * freq + phase) * uWindStrength * hFactor;
              transformed.z += cos(uTime * (freq * 0.78) + phase * 1.3) * uWindStrength * 0.55 * hFactor;
            }
            ${useLayerHeight ? `
            if (uExplodeSliceFactor > 0.001 && (uExplodeSpread > 0.0001 || uExplodePropLift > 0.0001 || uExplodeMidLift > 0.0001 || uExplodeTopLift > 0.0001)) {
              // Clean 4-tier hierarchy: Ground Props -> Mid (Trunks/Walls/Lanterns) -> Top (Canopies/Roof)
              float isCanopy = uCanopySplit > 0.01 ? smoothstep(uCanopySplit - 0.025, uCanopySplit + 0.025, aLayerH) : 0.0;
              float tierLift = uCanopySplit > 0.01
                ? mix(uExplodeMidLift, uExplodeTopLift, isCanopy)
                : (uExplodeTier > 0.5 ? uExplodeMidLift : uExplodePropLift);
              transformed.y += tierLift + aLayerH * uExplodeSpread * uExplodeSliceFactor;
              float ang = uExplodeTwist * (0.35 + aLayerH * 0.75);
              float cs = cos(ang);
              float sn = sin(ang);
              transformed.xz = mat2(cs, -sn, sn, cs) * transformed.xz;
            }` : ''}`
          )
          .replace(
            '#include <project_vertex>',
            `#include <project_vertex>
            vec4 hFogWorld = vec4(transformed, 1.0);
            #ifdef USE_INSTANCING
              hFogWorld = instanceMatrix * hFogWorld;
            #endif
            hFogWorld = modelMatrix * hFogWorld;
            vWorldY = hFogWorld.y;
            vWorldXZ = hFogWorld.xz;`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uNightFactor;
            uniform vec3 uFogColor;
            uniform float uFogDensity;
            uniform float uFogBottom;
            uniform float uFogTop;
            uniform float uEmissiveNightBoost;
            ${useDrop ? 'varying float vDropFlash;' : ''}
            varying float vWorldY;
            varying vec2 vWorldXZ;`
          )
          .replace(
            '#include <emissivemap_fragment>',
            `#include <emissivemap_fragment>
            if (uEmissiveNightBoost > 0.01) {
              totalEmissiveRadiance *= mix(0.25, uEmissiveNightBoost, smoothstep(0.1, 0.85, uNightFactor));
            }
            ${useDrop ? 'totalEmissiveRadiance += vec3(1.0, 0.93, 0.78) * vDropFlash * 0.55;' : ''}`
          )
          .replace(
            '#include <fog_fragment>',
            `#include <fog_fragment>
            float hMask = 1.0 - smoothstep(uFogBottom, uFogTop, vWorldY);
            float mistWave = 0.78 + 0.22 * sin(vWorldXZ.x * 0.45 + uTime * 0.35) * cos(vWorldXZ.y * 0.4 - uTime * 0.25);
            float pondBias = smoothstep(5.5, 0.5, length(vWorldXZ - vec2(2.3, 2.3))) * 0.45 + 0.55;
            float fogAmt = clamp(hMask * uFogDensity * mistWave * pondBias, 0.0, 0.70);
            gl_FragColor.rgb = mix(gl_FragColor.rgb, uFogColor, fogAmt);`
          );
      };
      material.needsUpdate = true;
      return material;
    }

    const PI = Math.PI, TAU = Math.PI * 2, HPI = Math.PI / 2;

    function makeRng(seed) {

      const f = () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
      f.range = (a, b) => a + (b - a) * f();
      f.int = (a, b) => Math.floor(a + (b - a + 1) * f());
      f.sign = () => f() < .5 ? -1 : 1;

    function h2(x, y, s) {
      let h = (Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1)) | 0;

      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;

    function vnoise(x, y, s = 0) {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const a = h2(xi, yi, s), b = h2(xi + 1, yi, s), c = h2(xi, yi + 1, s), d = h2(xi + 1, yi + 1, s);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    function pnoise2(x, y, perX, perY, s = 0) {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const mx = k => ((k % perX) + perX) % perX, my = k => ((k % perY) + perY) % perY;

    function glyphSVG(name, pass) {
      const carve = pass === 'carve';

        const stroke = carve ? (s.ns ? 'none' : TOKEN_CARVE_LIGHT) : (s.ns ? 'none' : TOKEN_INK);
        const geo = s.el === 'path' ? `d="${s.d}"` : s.el === 'circle' ? `cx="${s.cx}" cy="${s.cy}" r="${s.r}"` : `cx="${s.cx}" cy="${s.cy}" rx="${s.rx}" ry="${s.ry}"`;
        return `<${s.el} ${geo} fill="${fill}" stroke="${stroke}"/>`;
      }).join('');
    }

    let tokenSeq = 0;
    // round = small system buttons; the shape and tilt are seeded by the name so each token
    // is cut a little differently but stays the same between reloads
    function makeToken(name, { round = false } = {}) {

      let seed = 0; for (const ch of name) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
      const rng = makeRng(seed);
      const tilt = (rng() - 0.5) * 6;
      let face;
      if (round) {
        const r = 21 + rng() * 1.2, k = 0.56 * r, cx = 28, cy = 26;
        const j = () => (rng() - 0.5) * 1.6;
        face = `M${cx} ${cy - r + j()}C${cx + k} ${cy - r} ${cx + r} ${cy - k} ${cx + r + j()} ${cy}C${cx + r} ${cy + k} ${cx + k} ${cy + r} ${cx} ${cy + r + j()}C${cx - k} ${cy + r} ${cx - r} ${cy + k} ${cx - r + j()} ${cy}C${cx - r} ${cy - k} ${cx - k} ${cy - r} ${cx} ${cy - r}Z`;
      } else {
        const x = 6, y = 4, w = 44, h = 44, rr = () => 12 + rng() * 5;
        const [a, b, c, d] = [rr(), rr(), rr(), rr()];
        face = `M${x + a} ${y}H${x + w - b}Q${x + w} ${y} ${x + w} ${y + b}V${y + h - c}Q${x + w} ${y + h} ${x + w - c} ${y + h}H${x + d}Q${x} ${y + h} ${x} ${y + h - d}V${y + a}Q${x} ${y} ${x + a} ${y}Z`;
      }
      const grain = [0, 1, 2].map((i) => {
        const gy = 13 + i * 12 + rng() * 4, wob = 2 + rng() * 2.5;
        return `<path d="M2 ${gy}C14 ${gy - wob} 22 ${gy + wob} 34 ${gy}S48 ${gy - wob} 56 ${gy + 1}" stroke="#a87443" stroke-width="1" fill="none" opacity="${0.18 + rng() * 0.12}"/>`;

      return `<svg class="token" viewBox="0 0 56 56" aria-hidden="true">
        <defs>
          <linearGradient id="${id}g" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#f3dba9"/><stop offset="1" stop-color="#d6a66b"/></linearGradient>
          <clipPath id="${id}c"><path d="${face}"/></clipPath>
        </defs>

          <path d="${face}" transform="translate(0 3.6)" fill="#6f4528"/>
          <path d="${face}" fill="url(#${id}g)"/>
          <g clip-path="url(#${id}c)">

      shape.lineTo(hw, hd);
      shape.lineTo(-hw, hd);
      shape.closePath();

        bevelSegments: 2,

        bevelThickness: bevel

      geo.center();
      return geo;

        groups.get(key).list.push(o);

        const fR = new THREE.Mesh(createBeveledBoxGeometry(0.035, 0.18, 0.055, 0.006), matWoodDark); fR.position.set(0.095, 0, 0.015);
        const glass = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.02), matGlowWindow); glass.position.set(0, 0, -0.002);
        const mV = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.16, 0.028), matWoodDark);
        const mH = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.016, 0.028), matWoodDark);
        wGroup.add(fT, fB, fL, fR, glass, mV, mH);

        if (withFlowerBox) {
          const box = new THREE.Mesh(createBeveledBoxGeometry(0.22, 0.055, 0.075, 0.008), matWood);
          box.position.set(0, -0.14, 0.045); box.castShadow = true;
          wGroup.add(box);
          const colors = ['#ff96b2', '#ffe078', '#b8d8ff'];
          for (let f = -1; f <= 1; f++) {
            const leaf = new THREE.Mesh(new THREE.DodecahedronGeometry(0.032, 0), matFoliage);

      addInsetWindow(-0.17, 0.38, 0.325, 0, true);
      addInsetWindow(0.385, 0.40, 0.02, Math.PI / 2, true);

      // Firewood stack + chopping stump + axe + mailbox + climbing ivy

      for (let row = 0; row < 2; row++) {
