<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mori Isle — Cozy 3D Miniature Diorama</title>

  <!-- Clean cozy UI typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <style>
    :root {
      --ui-bg: rgba(24, 22, 32, 0.80);
      --ui-bg-hover: rgba(44, 40, 56, 0.92);
      --ui-border: rgba(247, 235, 210, 0.24);
      --ui-border-active: #f7cf78;
      --ui-text: #f8f2e6;
      --ui-muted: #c7beab;
      --ui-accent: #8fd18a;
      --ui-sky: #7ec8f2;
      --ui-danger: #eb8181;
      --ui-shadow: 0 10px 30px rgba(8, 6, 16, 0.45);
      --font-display: 'Silkscreen', 'Courier New', monospace;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161d30;
      font-family: var(--font-body);
      color: var(--ui-text);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    #canvas-container.dragging {
      cursor: grabbing;
    }

    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Smooth UI hide for Photo Mode */
    .ui-layer {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.photo-mode .ui-layer {
      opacity: 0;
      pointer-events: none !important;
      transform: translateY(14px);
    }

    body.photo-mode #top-bar {
      transform: translateY(-14px);
    }

    /* Top bar */
    #top-bar {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 20;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .brand-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      background: var(--ui-bg);
      border: 1.5px solid var(--ui-border);
      border-radius: 14px;
      box-shadow: var(--ui-shadow);
      backdrop-filter: blur(10px);
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ui-accent);
      box-shadow: 0 0 10px rgba(143, 209, 138, 0.75);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #fff6e3;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--ui-muted);
      line-height: 1.2;
      margin-top: 2px;
    }

    .hints-pill {
      pointer-events: auto;
      padding: 8px 13px;
      background: rgba(20, 18, 28, 0.68);
      border: 1.5px solid rgba(244, 232, 206, 0.16);
      border-radius: 12px;
      font-size: 12px;
      color: #dfd6c5;
      backdrop-filter: blur(8px);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .hint-key {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffe2a8;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px;
    }

    /* Prominent Exploded View Toggle Pill */
    #btn-explode-top {
      pointer-events: auto;
      height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(126, 200, 242, 0.45);
      background: rgba(24, 26, 40, 0.84);
      color: #e4f4ff;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: var(--ui-shadow);
      backdrop-filter: blur(10px);
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    #btn-explode-top:hover {
      background: rgba(36, 42, 62, 0.94);
      border-color: var(--ui-sky);
      transform: translateY(-2px);
    }

    #btn-explode-top.active {
      background: rgba(126, 200, 242, 0.24);
      border-color: #9ce0ff;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(126, 200, 242, 0.42);
    }

    #btn-explode-top svg {
      width: 16px;
      height: 16px;
    }

    /* Bottom Floating Dock */
    #hud-dock {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 25;
      pointer-events: none;
    }

    #active-item-label {
      pointer-events: none;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(20, 18, 28, 0.8);
      border: 1.5px solid rgba(244, 232, 206, 0.2);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 12px;
      color: #ffe8b6;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }

    .mode-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(143, 209, 138, 0.2);
      color: #b7f0b2;
      border: 1px solid rgba(143, 209, 138, 0.4);
    }

    .mode-tag.free {
      background: rgba(247, 207, 120, 0.22);
      color: #ffe2a8;
      border-color: rgba(247, 207, 120, 0.45);
    }

    .dock-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: var(--ui-bg);
      border: 1.5px solid var(--ui-border);
      border-radius: 18px;
      box-shadow: var(--ui-shadow);
      backdrop-filter: blur(12px);
      overflow-x: auto;
      max-width: calc(100vw - 20px);
      scrollbar-width: none;
    }

    .dock-bar::-webkit-scrollbar {
      display: none;
    }

    .palette-group, .tools-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .dock-divider {
      width: 1.5px;
      height: 36px;
      background: rgba(244, 232, 206, 0.18);
      border-radius: 2px;
      margin: 0 4px;
      flex-shrink: 0;
    }

    .slot-btn {
      position: relative;
      width: 46px;
      height: 46px;
      padding: 3px;
      border-radius: 12px;
      border: 1.5px solid rgba(244, 232, 206, 0.16);
      background: rgba(255, 255, 255, 0.05);
      color: var(--ui-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
      flex-shrink: 0;
    }

    .slot-btn:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(244, 232, 206, 0.45);
      transform: translateY(-2px);
    }

    .slot-btn:active {
      transform: translateY(0px) scale(0.96);
    }

    .slot-btn.active {
      background: rgba(247, 208, 122, 0.22);
      border-color: var(--ui-border-active);
      box-shadow: 0 0 14px rgba(247, 208, 122, 0.35), inset 0 0 8px rgba(247, 208, 122, 0.15);
      transform: translateY(-3px);
    }

    .slot-btn.free-prop::after {
      content: '';
      position: absolute;
      top: 4px;
      right: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffd88c;
      opacity: 0.75;
    }

    .slot-btn.delete-btn.active {
      background: rgba(235, 129, 129, 0.24);
      border-color: var(--ui-danger);
      box-shadow: 0 0 14px rgba(235, 129, 129, 0.35);
    }

    .slot-btn canvas {
      width: 38px;
      height: 38px;
      pointer-events: none;
    }

    .action-btn {
      height: 44px;
      min-width: 44px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1.5px solid rgba(244, 232, 206, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: var(--ui-text);
      font-family: var(--font-display);
      font-size: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
      flex-shrink: 0;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(244, 232, 206, 0.45);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn.on {
      border-color: var(--ui-accent);
      background: rgba(143, 209, 138, 0.18);
      color: #e4ffe0;
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .rot-badge {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12px;
      color: #ffd88c;
      min-width: 24px;
      text-align: center;
    }

    /* Reset Confirmation Popover */
    #reset-popover {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: rgba(24, 22, 34, 0.96);
      border: 1.5px solid var(--ui-border);
      border-radius: 14px;
      padding: 13px 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      backdrop-filter: blur(12px);
    }

    #reset-popover.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    .popover-title {
      font-family: var(--font-display);
      font-size: 11px;
      color: #ffe8b6;
      text-align: center;
    }

    .popover-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pop-btn {
      padding: 7px 12px;
      border-radius: 9px;
      border: 1.5px solid rgba(244, 232, 206, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ui-text);
      font-family: var(--font-display);
      font-size: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .pop-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .pop-btn.danger {
      border-color: rgba(235, 129, 129, 0.6);
      background: rgba(235, 129, 129, 0.2);
      color: #ffd5d5;
    }

    .pop-btn.primary {
      border-color: rgba(143, 209, 138, 0.6);
      background: rgba(143, 209, 138, 0.2);
      color: #e4ffe0;
    }

    /* Photo Mode Corner Exit Button */
    #photo-exit-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 245, 224, 0.3);
      background: rgba(22, 20, 30, 0.55);
      color: #fff3d6;
      font-family: var(--font-display);
      font-size: 10px;
      cursor: pointer;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, background 0.2s ease;
      backdrop-filter: blur(8px);
    }

    body.photo-mode #photo-exit-btn {
      opacity: 0.42;
      pointer-events: auto;
    }

    body.photo-mode #photo-exit-btn:hover,
    body.photo-mode #photo-exit-btn:focus {
      opacity: 1;
      background: rgba(22, 20, 30, 0.88);
    }

    @media (max-width: 960px) {
      .hints-pill { display: none; }
      .slot-btn { width: 42px; height: 42px; }
      .slot-btn canvas { width: 34px; height: 34px; }
      .action-btn { height: 40px; min-width: 40px; padding: 0 8px; }
      .btn-text-hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <!-- WebGL Viewport -->
  <div id="canvas-container"></div>

  <!-- Top Branding, Controls Hint & Exploded View Toggle -->
  <div id="top-bar" class="ui-layer">
    <div class="brand-pill">
      <div class="brand-dot" id="time-dot"></div>
      <div>
        <div class="brand-title">MORI ISLE</div>
        <div class="brand-sub" id="item-counter">Miniature Diorama</div>
      </div>
    </div>

    <div class="top-right-group">
      <div class="hints-pill">
        <span><span class="hint-key">L-Click</span>Place</span>
        <span><span class="hint-key">R-Click</span>Remove</span>
        <span><span class="hint-key">R-Drag</span>Orbit</span>
        <span><span class="hint-key">R</span>Rotate</span>
        <span><span class="hint-key">E</span>Explode</span>
      </div>

      <button id="btn-explode-top" title="디오라마 층별 분해 보기 (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 12 12 17 22 12" />
          <polyline points="2 17 12 22 22 17" />
        </svg>
        <span id="explode-btn-text">디오라마 분해 보기</span>
      </button>
    </div>
  </div>

  <!-- Bottom Floating Cozy HUD -->
  <div id="hud-dock" class="ui-layer">
    <div id="active-item-label">Pine Tree • 0°</div>
    <div class="dock-bar">
      <div class="palette-group" id="palette-container"></div>
      <div class="dock-divider"></div>
      <div class="tools-group">
        <button class="action-btn" id="btn-rotate" title="회전 (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
          <span class="rot-badge" id="rot-label">0°</span>
        </button>

        <button class="action-btn" id="btn-time" title="시간대 변경">
          <span id="time-icon"></span>
          <span class="btn-text-hide-sm" id="time-label">Day</span>
        </button>

        <button class="action-btn" id="btn-audio" title="배경음 켜기/끄기">
          <span id="audio-icon"></span>
        </button>

        <button class="action-btn" id="btn-photo" title="감상 모드 (UI 숨기기)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </button>

        <button class="action-btn" id="btn-reset" title="섬 초기화">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6M14 11v6" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Inline Reset Popover -->
  <div id="reset-popover" class="ui-layer">
    <div class="popover-title">Island Layout</div>
    <div class="popover-actions">
      <button class="pop-btn primary" id="pop-starter">Restore Starter</button>
      <button class="pop-btn danger" id="pop-clear">Clear All</button>
      <button class="pop-btn" id="pop-cancel">Cancel</button>
    </div>
  </div>

  <!-- Photo Mode Exit Button -->
  <button id="photo-exit-btn">Exit Photo Mode (ESC)</button>

  <script type="module">
    import * as THREE from 'three';

    /* =========================================================================
       1. CONFIGURATION, ORGANIC POND SDF & TERRACED HILL FRAMING
       ========================================================================= */
    const GRID_SIZE = 12;
    const HALF_GRID = GRID_SIZE / 2;
    const MAX_PIXEL_RATIO = 2.0; // only the final upscale pass runs at this density
    // --- Low-res pixel rendering (scene is drawn small, then sharply upscaled) ---
    const HASH = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map((kv) => {
      const [k, v] = kv.split('='); return [k, v === undefined ? '1' : v];
    }));
    const LOWRES = {
      enabled: HASH.hires !== '1', // #hires=1 renders at full resolution for comparison
      maxIH: 600,                  // internal height cap (px)
      maxPix: 620000,              // internal pixel budget
      minTexel: 2,                 // at least 2x2 screen pixels per scene pixel
      quality: 1.0,                // adaptive scale 0.55 ~ 1.0
      adaptive: HASH.noscale !== '1'
    };
    const CAM_FOV_EQUIV = 22 * Math.PI / 180; // ortho framing matches the old 22-degree lens
    const SHADOW_MAP_SIZE = 1024;
    const MAX_POINT_LIGHTS = 8;

    // Smooth-min for organic rounded pond lobes (zero blocky square edges!)
    function smin(a, b, k) {
      const h = Math.max(k - Math.abs(a - b), 0.0) / k;
      return Math.min(a, b) - h * h * k * 0.25;
    }

    // Signed Distance Field of the organic rounded pond in world XZ space
    // Returns < 0 inside water, 0 at shoreline, > 0 on land
    function getPondSDF(wx, wz) {
      const d1 = Math.hypot(wx - 2.35, wz - 2.35) - 1.72;
      const d2 = Math.hypot(wx - 3.35, wz - 1.75) - 1.18;
      const d3 = Math.hypot(wx - 1.45, wz - 2.95) - 1.12;
      const d4 = Math.hypot(wx - 2.95, wz - 3.25) - 1.02;
      return smin(smin(d1, d2, 0.72), smin(d3, d4, 0.72), 0.68);
    }

    function isPondWorld(wx, wz, margin = 0.12) {
      return getPondSDF(wx, wz) < margin;
    }

    function isPondTile(gx, gz) {
      const wx = gx - HALF_GRID + 0.5;
      const wz = gz - HALF_GRID + 0.5;
      return getPondSDF(wx, wz) < 0.18;
    }

    // Cozy Back-Hill Framing (Terraced 1~2 steps on the back two edges: gx <= 2, gz <= 2)
    function getHillLevel(gx, gz) {
      if (gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return 0;
      // Top-most back corner ridge (Level 2)
      if ((gx === 0 && gz <= 5) || (gz === 0 && gx <= 5) || (gx === 1 && gz <= 2) || (gz === 1 && gx <= 2)) {
        return 2;
      }
      // Mid terrace framing behind the cabin & sides (Level 1)
      if ((gx <= 2 && gz <= 7) || (gz <= 2 && gx <= 7) || (gx === 3 && gz <= 3) || (gz === 3 && gx <= 3)) {
        return 1;
      }
      return 0;
    }

    const STEP_HEIGHT = 0.48;
    function getTileElevation(gx, gz) {
      return getHillLevel(gx, gz) * STEP_HEIGHT;
    }

    // Smooth continuous surface height at any world (wx, wz) for hills + rounded pond basin
    function getContinuousTerrainHeight(wx, wz) {
      const gx = THREE.MathUtils.clamp(wx + HALF_GRID - 0.5, 0, GRID_SIZE - 1);
      const gz = THREE.MathUtils.clamp(wz + HALF_GRID - 0.5, 0, GRID_SIZE - 1);
      const x0 = Math.floor(gx), z0 = Math.floor(gz);
      const x1 = Math.min(GRID_SIZE - 1, x0 + 1);
      const z1 = Math.min(GRID_SIZE - 1, z0 + 1);
      // Sharpened smoothstep for crisp beveled terrace cliffs
      const fx = THREE.MathUtils.smoothstep(gx - x0, 0.22, 0.78);
      const fz = THREE.MathUtils.smoothstep(gz - z0, 0.22, 0.78);

      const h00 = getTileElevation(x0, z0);
      const h10 = getTileElevation(x1, z0);
      const h01 = getTileElevation(x0, z1);
      const h11 = getTileElevation(x1, z1);
      const hillH = THREE.MathUtils.lerp(
        THREE.MathUtils.lerp(h00, h10, fx),
        THREE.MathUtils.lerp(h01, h11, fx),
        fz
      );

      // Organic smooth depression for the rounded pond basin
      const sdf = getPondSDF(wx, wz);
      const basin = THREE.MathUtils.smoothstep(sdf, -0.35, 0.36); // 0 deep inside pond .. 1 on land
      const pondDip = (1.0 - basin) * -0.40;
      return hillH + pondDip;
    }

    // 3-Point Lighting & Atmosphere Presets
    const ATMOSPHERES = {
      day: {
        name: 'Day',
        dotColor: '#8fd18a',
        skyTop: new THREE.Color('#4f92d6'),
        skyBottom: new THREE.Color('#cfe9ff'),
        keyColor: new THREE.Color('#fff2d6'),
        keyIntensity: 2.35,
        fillColor: new THREE.Color('#8bb8eb'),
        fillIntensity: 0.78,
        rimColor: new THREE.Color('#ffecc4'),
        rimIntensity: 0.92,

    /* =========================================================================
       2. DETERMINISTIC HASH, EASING & SHARED UNIFORMS
       ========================================================================= */
    function hash2D(x, y, seed = 0) {
      const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    // Juicy Ease-Out-Back overshoot curve for Exploded View layers
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    const sharedUniforms = {
      uTime: { value: 0 },
      uNightFactor: { value: 0.0 },
      uFogColor: { value: ATMOSPHERES.day.fogColor.clone() },
      uFogDensity: { value: ATMOSPHERES.day.fogDensity },
      uFogBottom: { value: -1.1 },
      uFogTop: { value: 1.45 },
      uWaterDeep: { value: ATMOSPHERES.day.waterDeep.clone() },

    };

    /* =========================================================================
       3. SYNTHESIZED COZY WEB AUDIO ENGINE (WITH CASCADING EXPLODE BLOCK SFX)
       ========================================================================= */
    class CozyAudio {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.enabled = false;
        this.chimeTimer = null;
        this.isNight = false;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.0001;
        this.masterGain.connect(this.ctx.destination);

        // Soft pink-ish filtered breeze
        const bufferSize = this.ctx.sampleRate * 3;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          output[i] = (b0 + b1 + b2 + white * 0.015) * 0.5;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 340;
        filter.Q.value = 1.1;

        const lfo = this.ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.11;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 150;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();

        const windGain = this.ctx.createGain();
        windGain.gain.value = 0.2;
        noise.connect(filter);
        filter.connect(windGain);
        windGain.connect(this.masterGain);
        noise.start();
      }

      ensureSfxContext() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      toggle() {
        this.ensureSfxContext();
        this.enabled = !this.enabled;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setTargetAtTime(this.enabled ? 0.42 : 0.0001, now, 0.25);

        if (this.enabled) {
          this.scheduleChime();
          this.playUiBlip(523.25);
        } else if (this.chimeTimer) {
          clearTimeout(this.chimeTimer);
          this.chimeTimer = null;
        }
        return this.enabled;
      }

      scheduleChime() {
        if (!this.enabled) return;
        this.chimeTimer = setTimeout(() => {
          if (this.enabled) {
            this.playWindChime();
            this.scheduleChime();
          }
        }, 2800 + Math.random() * 4200);
      }

      playWindChime() {
        if (!this.ctx || !this.enabled) return;
        const notes = this.isNight
          ? [392.0, 440.0, 523.25, 587.33, 659.25]
          : [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
        const freq = notes[Math.floor(Math.random() * notes.length)];
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.085, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.7);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 2.8);
      }

      // Cascading wooden-block / card-fanning SFX synced to Exploded View stagger!
      playExplodeCascade(opening) {
        this.ensureSfxContext();
        const outNode = this.enabled ? this.masterGain : this.ctx.destination;
        const baseVol = this.enabled ? 0.22 : 0.09;
        const steps = 8;
        const now = this.ctx.currentTime;

        for (let i = 0; i < steps; i++) {
          const t = now + i * 0.026; // Matches 0.026s layer wave stagger
          const frac = opening ? i / (steps - 1) : 1 - i / (steps - 1);
          const freq = 270 + frac * 420;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * (opening ? 1.18 : 0.86), t + 0.055);

          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(baseVol * (0.75 + 0.25 * frac), t + 0.007);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);

          osc.connect(gain);
          gain.connect(outNode);
          osc.start(t);
          osc.stop(t + 0.095);
        }
      }

      // LEGO-style stacking clicks: one per landing group, pitch 1.0 -> 1.3
      playStackClicks(times) {
        this.ensureSfxContext();
        const outNode = this.enabled ? this.masterGain : this.ctx.destination;
        const vol = this.enabled ? 0.16 : 0.07;
        const now = this.ctx.currentTime;
        const n = times.length;
        times.forEach((dt, i) => {
          const t = now + dt;
          const pitch = 1.0 + 0.3 * (n > 1 ? i / (n - 1) : 0);
          const f = 620 * pitch;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f * 1.6, t);
          osc.frequency.exponentialRampToValueAtTime(f, t + 0.018);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol * (i === 0 || i === n - 1 ? 1.0 : 0.7), t + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          osc.connect(gain); gain.connect(outNode);
          osc.start(t); osc.stop(t + 0.06);
        });
        // soft wooden thump on the final landing
        const tEnd = now + times[n - 1];
        const th = this.ctx.createOscillator();
        const tg = this.ctx.createGain();
        th.type = 'sine';
        th.frequency.setValueAtTime(190, tEnd);
        th.frequency.exponentialRampToValueAtTime(95, tEnd + 0.09);
        tg.gain.setValueAtTime(0.0001, tEnd);
        tg.gain.linearRampToValueAtTime(vol * 1.1, tEnd + 0.005);
        tg.gain.exponentialRampToValueAtTime(0.0001, tEnd + 0.11);
        th.connect(tg); tg.connect(outNode);
        th.start(tEnd); th.stop(tEnd + 0.12);
      }

      playPlace() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.08);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.13);
      }

      playRemove() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.09);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.13, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playRotate() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(720, now + 0.045);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      playUiBlip(freq = 480) {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.07, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    const audio = new CozyAudio();

    /* =========================================================================
       4. SHADER ENHANCEMENT HOOK
          (LOW-LYING HEIGHT FOG + WIND SWAY + GPU SLICE EXPLODE FANNING)
       ========================================================================= */
    // --- LEGO-style 'tadadak' stacked drop (GPU, per-instance spawn time) ---
    const DROP_STRIDE = 0.017;   // per-group stagger (s)
    const DROP_FALL = 0.07;      // fall time per layer (s)
    const DROP_HEIGHT = 0.9;
    function dropGroupFor(layers) { return layers > 30 ? 2 : 1; }
    function dropTotalTime(layers) {
      return Math.floor((layers - 1) / dropGroupFor(layers)) * DROP_STRIDE + DROP_FALL;
    }
    const DROP_DECL = `
      uniform float uDropLayers;
      uniform float uDropGroup;
      attribute float aSpawn;`;
    function dropVertexGLSL(withFlash) {
      return `
      {
        float dSince = uTime - aSpawn;
        if (dSince < 0.9) {
          float li = floor(aLayerH * (uDropLayers - 1.0) + 0.5);
          float g = floor(li / uDropGroup);
          float G = floor((uDropLayers - 1.0) / uDropGroup);
          float tl = dSince - g * ${DROP_STRIDE.toFixed(4)};
          float FALL = ${DROP_FALL.toFixed(4)};
          // Whole-stack squash: 0.85 -> 1.05 -> 1.0 right as the top lands
          float u = dSince - (G * ${DROP_STRIDE.toFixed(4)} + FALL - 0.03);
          if (u > 0.0 && u < 0.14) {
            float sy = u < 0.045 ? mix(1.0, 0.85, u / 0.045)
                     : (u < 0.10 ? mix(0.85, 1.05, (u - 0.045) / 0.055)
                                 : mix(1.05, 1.0, (u - 0.10) / 0.04));
            transformed.y *= sy;
            transformed.xz *= 1.0 + (1.0 - sy) * 0.45;
          }
          if (tl < 0.0) {
            transformed *= 0.0; // not yet dropped: collapse slice
          } else if (tl < FALL) {
            float p = tl / FALL;
            float e = p * p; // ease-in
            transformed.y += (1.0 - e) * ${DROP_HEIGHT.toFixed(2)};
            float seed = 0.0;
            #ifdef USE_INSTANCING
              seed = instanceMatrix[3][0] * 3.17 + instanceMatrix[3][2] * 1.93;
            #endif
            float r = fract(sin(li * 12.9898 + seed) * 43758.5453);
            float ang = (r < 0.5 ? -1.0 : 1.0) * mix(0.087, 0.175, fract(r * 7.0)) * (1.0 - e);
            float cs = cos(ang), sn = sin(ang);
            transformed.xz = mat2(cs, -sn, sn, cs) * transformed.xz;
          }${withFlash ? `
          else if (tl < FALL + 0.035) {
            vDropFlash = 1.0 - (tl - FALL) / 0.035;
          }` : ''}
        }
      }`;
    }

    function enhanceStandardMaterial(
      material,
      {
        windStrength = 0.0,
        useLayerHeight = false,
        useGrassTip = false,
        emissiveNightBoost = 0.0,
        explodeSliceFactor = 0.0,
        explodeTier = 0,
        canopySplit = 0.0,
        dropLayers = 0
      } = {}
    ) {
      const useDrop = useLayerHeight && dropLayers > 0;
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = sharedUniforms.uTime;
        shader.uniforms.uNightFactor = sharedUniforms.uNightFactor;
        shader.uniforms.uFogColor = sharedUniforms.uFogColor;
        shader.uniforms.uFogDensity = sharedUniforms.uFogDensity;
        shader.uniforms.uFogBottom = sharedUniforms.uFogBottom;
        shader.uniforms.uFogTop = sharedUniforms.uFogTop;
        shader.uniforms.uWindStrength = { value: windStrength };
        shader.uniforms.uEmissiveNightBoost = { value: emissiveNightBoost };
        shader.uniforms.uExplodeSpread = sharedUniforms.uExplodeSpread;
        shader.uniforms.uExplodePropLift = sharedUniforms.uExplodePropLift;
        shader.uniforms.uExplodeMidLift = sharedUniforms.uExplodeMidLift;
        shader.uniforms.uExplodeTopLift = sharedUniforms.uExplodeTopLift;
        shader.uniforms.uExplodeTwist = sharedUniforms.uExplodeTwist;
        shader.uniforms.uExplodeSliceFactor = { value: explodeSliceFactor };
        shader.uniforms.uExplodeTier = { value: explodeTier };
        shader.uniforms.uCanopySplit = { value: canopySplit };
        shader.uniforms.uDropLayers = { value: dropLayers };
        shader.uniforms.uDropGroup = { value: dropGroupFor(dropLayers || 1) };

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uWindStrength;
            uniform float uExplodeSpread;
            uniform float uExplodePropLift;
            uniform float uExplodeMidLift;
            uniform float uExplodeTopLift;
            uniform float uExplodeTwist;
            uniform float uExplodeSliceFactor;
            uniform float uExplodeTier;
            uniform float uCanopySplit;
            ${useLayerHeight ? 'attribute float aLayerH;' : ''}
            ${useGrassTip ? 'attribute float aTipWeight;' : ''}
            ${useDrop ? DROP_DECL + '\n            varying float vDropFlash;' : ''}
            varying float vWorldY;
            varying vec2 vWorldXZ;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            ${useDrop ? 'vDropFlash = 0.0;' + dropVertexGLSL(true) : ''}
            if (uWindStrength > 0.0001) {
              float hFactor = ${useGrassTip ? 'aTipWeight' : (useLayerHeight ? 'aLayerH * aLayerH' : 'clamp(position.y, 0.0, 2.0)')};
              float phase = 0.0;
              #ifdef USE_INSTANCING
                phase = instanceMatrix[3][0] * 0.72 + instanceMatrix[3][2] * 0.54;
              #else
                phase = position.x * 0.7 + position.z * 0.5;
              #endif
              float freq = ${useGrassTip ? '2.4' : '1.9'};
              transformed.x += sin(uTime * freq + phase) * uWindStrength * hFactor;
              transformed.z += cos(uTime * (freq * 0.78) + phase * 1.3) * uWindStrength * 0.55 * hFactor;
            }
            ${useLayerHeight ? `
            if (uExplodeSliceFactor > 0.001 && (uExplodeSpread > 0.0001 || uExplodePropLift > 0.0001 || uExplodeMidLift > 0.0001 || uExplodeTopLift > 0.0001)) {
              // Clean 4-tier hierarchy: Ground Props -> Mid (Trunks/Walls/Lanterns) -> Top (Canopies/Roof)
              float isCanopy = uCanopySplit > 0.01 ? smoothstep(uCanopySplit - 0.025, uCanopySplit + 0.025, aLayerH) : 0.0;
              float tierLift = uCanopySplit > 0.01
                ? mix(uExplodeMidLift, uExplodeTopLift, isCanopy)
                : (uExplodeTier > 0.5 ? uExplodeMidLift : uExplodePropLift);
              transformed.y += tierLift + aLayerH * uExplodeSpread * uExplodeSliceFactor;
              float ang = uExplodeTwist * (0.35 + aLayerH * 0.75);
              float cs = cos(ang);
              float sn = sin(ang);
              transformed.xz = mat2(cs, -sn, sn, cs) * transformed.xz;
            }` : ''}`
          )
          .replace(
            '#include <project_vertex>',
            `#include <project_vertex>
            vec4 hFogWorld = vec4(transformed, 1.0);
            #ifdef USE_INSTANCING
              hFogWorld = instanceMatrix * hFogWorld;
            #endif
            hFogWorld = modelMatrix * hFogWorld;
            vWorldY = hFogWorld.y;
            vWorldXZ = hFogWorld.xz;`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uNightFactor;
            uniform vec3 uFogColor;
            uniform float uFogDensity;
            uniform float uFogBottom;
            uniform float uFogTop;
            uniform float uEmissiveNightBoost;
            ${useDrop ? 'varying float vDropFlash;' : ''}
            varying float vWorldY;
            varying vec2 vWorldXZ;`
          )
          .replace(
            '#include <emissivemap_fragment>',
            `#include <emissivemap_fragment>
            if (uEmissiveNightBoost > 0.01) {
              totalEmissiveRadiance *= mix(0.25, uEmissiveNightBoost, smoothstep(0.1, 0.85, uNightFactor));
            }
            ${useDrop ? 'totalEmissiveRadiance += vec3(1.0, 0.93, 0.78) * vDropFlash * 0.55;' : ''}`
          )
          .replace(
            '#include <fog_fragment>',
            `#include <fog_fragment>
            float hMask = 1.0 - smoothstep(uFogBottom, uFogTop, vWorldY);
            float mistWave = 0.78 + 0.22 * sin(vWorldXZ.x * 0.45 + uTime * 0.35) * cos(vWorldXZ.y * 0.4 - uTime * 0.25);
            float pondBias = smoothstep(5.5, 0.5, length(vWorldXZ - vec2(2.3, 2.3))) * 0.45 + 0.55;
            float fogAmt = clamp(hMask * uFogDensity * mistWave * pondBias, 0.0, 0.70);
            gl_FragColor.rgb = mix(gl_FragColor.rgb, uFogColor, fogAmt);`
          );
      };
      material.needsUpdate = true;
      return material;
    }

    /* =========================================================================
       5. HIGH-DENSITY SPRITE STACKING + AUTO-TILING + FREE-PROP CATALOG
       ========================================================================= */
    function px(ctx, x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    }

    function fillRectPx(ctx, x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }

    function fillDisc(ctx, cx, cy, r, colorFn) {
      const r2 = r * r;
      const minX = Math.floor(cx - r);
      const maxX = Math.ceil(cx + r);
      const minY = Math.floor(cy - r);
      const maxY = Math.ceil(cy + r);
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const dx = x - cx;
          const dy = y - cy;
          const d2 = dx * dx + dy * dy;
          if (d2 <= r2) {
            const c = typeof colorFn === 'function' ? colorFn(x, y, Math.sqrt(d2) / Math.max(r, 0.001)) : colorFn;

    function buildSpriteStackAsset(def) {
      const { size, layers, layerStep, scale } = def;
      const sheetW = size * layers;
      const sheetH = size;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = sheetW;
      colorCanvas.height = sheetH;
      const colorCtx = colorCanvas.getContext('2d');
      colorCtx.imageSmoothingEnabled = false;

      const emCanvas = document.createElement('canvas');
      emCanvas.width = sheetW;
      emCanvas.height = sheetH;
      const emCtx = emCanvas.getContext('2d');
      emCtx.imageSmoothingEnabled = false;

      const sliceCanvases = [];
      const tmpEm = document.createElement('canvas');
      tmpEm.width = size;
      tmpEm.height = size;
      const tmpEmCtx = tmpEm.getContext('2d');

      for (let i = 0; i < layers; i++) {
        const sc = document.createElement('canvas');
        sc.width = size;
        sc.height = size;
        const sctx = sc.getContext('2d');
        sctx.imageSmoothingEnabled = false;

        tmpEmCtx.clearRect(0, 0, size, size);
        def.drawSlice(sctx, tmpEmCtx, i, layers, size);

        colorCtx.drawImage(sc, i * size, 0);
        emCtx.drawImage(tmpEm, i * size, 0);
        sliceCanvases.push(sc);
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.minFilter = THREE.NearestFilter;
      colorTex.magFilter = THREE.NearestFilter;
      colorTex.generateMipmaps = false;
      colorTex.colorSpace = THREE.SRGBColorSpace;

      const emTex = new THREE.CanvasTexture(emCanvas);
      emTex.minFilter = THREE.NearestFilter;
      emTex.magFilter = THREE.NearestFilter;
      emTex.generateMipmaps = false;
      emTex.colorSpace = THREE.SRGBColorSpace;

      const positions = [], normals = [], uvs = [], colors = [], layerHeights = [], indices = [];
      const half = 0.5 * scale;

      for (let i = 0; i < layers; i++) {
        const y = i * layerStep + 0.012;
        const u0 = i / layers;
        const u1 = (i + 1) / layers;
        const hNorm = layers > 1 ? i / (layers - 1) : 0;
        const ao = 0.62 + 0.42 * Math.pow(hNorm, 0.7);

        const vOffset = i * 4;
        positions.push(-half, y, -half, half, y, -half, half, y, half, -half, y, half);
        normals.push(-0.28, 0.92, -0.28, 0.28, 0.92, -0.28, 0.28, 0.92, 0.28, -0.28, 0.92, 0.28);
        uvs.push(u0, 1, u1, 1, u1, 0, u0, 0);
        colors.push(ao, ao, ao, ao, ao, ao, ao, ao, ao, ao, ao, ao);
        layerHeights.push(hNorm, hNorm, hNorm, hNorm);
        indices.push(vOffset, vOffset + 2, vOffset + 1, vOffset, vOffset + 3, vOffset + 2);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute('aLayerH', new THREE.Float32BufferAttribute(layerHeights, 1));
      geometry.setIndex(indices);

      const iconCanvas = renderMiniIsoIcon(sliceCanvases, size);
      return { def, geometry, colorTex, emTex, iconCanvas };
    }

    function renderMiniIsoIcon(sliceCanvases, size) {
      const iconSize = 40;
      const c = document.createElement('canvas');
      c.width = iconSize;
      c.height = iconSize;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const layers = sliceCanvases.length;
      const drawScale = size > 20 ? 0.92 : (size > 18 ? 1.0 : 1.15);
      const yStep = Math.min(1.0, 20 / Math.max(layers, 1));
      const baseY = iconSize - 8;

      for (let i = 0; i < layers; i++) {
        const hNorm = layers > 1 ? i / (layers - 1) : 1;
        ctx.save();
        ctx.translate(iconSize / 2, baseY - i * yStep);
        ctx.scale(drawScale, drawScale * 0.56);
        ctx.rotate(Math.PI / 4);
        ctx.filter = `brightness(${(0.75 + 0.3 * hNorm).toFixed(2)})`;
        ctx.drawImage(sliceCanvases[i], -size / 2, -size / 2);
        ctx.restore();
      }
      return c;
    }

    /* =========================================================================
       7. 3-CHUNK STORYBOOK CABIN WITH COZY INTERIOR (FOR EXPLODED VIEW!)
          Chunk 0: Foundation + Wooden Floor + Cozy Rug + Bed + Fireplace + Table
          Chunk 1: Timber Walls + Inset Door/Windows + Flower Boxes + Porch Clutter
          Chunk 2: Steep Fairytale Roof + Protruding Shingles + Crooked Chimney
       ========================================================================= */
    function createBeveledBoxGeometry(w, h, d, bevel = 0.025) {
      const shape = new THREE.Shape();
      const hw = Math.max(0.004, w / 2 - bevel);
      const hd = Math.max(0.004, d / 2 - bevel);
      shape.moveTo(-hw, -hd);
      shape.lineTo(hw, -hd);
      shape.lineTo(hw, hd);
      shape.lineTo(-hw, hd);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: Math.max(0.01, h - bevel * 2),
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: bevel,
        bevelThickness: bevel
      });
      geo.rotateX(-Math.PI / 2);
      geo.center();
      return geo;
    }

    function prepareCabinDrop(root) {
      const { chunkInterior, chunkWalls, chunkRoof } = root.userData;
      const parts = [];
      [chunkInterior, chunkWalls, chunkRoof].forEach((chunk, ci) => {
        chunk.children.forEach((obj) => {
          parts.push({ obj, ci, baseY: obj.position.y, baseRZ: obj.rotation.z, visible: obj.visible });
        });
      });
      parts.sort((a, b) => (a.ci - b.ci) || (a.baseY - b.baseY));
