      addPart(chunkWalls, new THREE.CylinderGeometry(0.05, 0.06, 0.10, 7), matWoodDark, -0.42, 0.05, 0.36);
      addPart(chunkWalls, new THREE.CylinderGeometry(0.009, 0.009, 0.16, 5), matWood, -0.44, 0.15, 0.36, 0, 0, 0.45);
      addPart(chunkWalls, createBeveledBoxGeometry(0.055, 0.04, 0.014, 0.004), matMetal, -0.41, 0.12, 0.36, 0, 0, 0.35);

      addPart(chunkWalls, new THREE.CylinderGeometry(0.012, 0.014, 0.24, 6), matWoodDark, 0.38, 0.12, 0.44, 0.05, 0, -0.08);
      addPart(chunkWalls, createBeveledBoxGeometry(0.07, 0.065, 0.11, 0.014), matMailbox, 0.39, 0.25, 0.44, 0.05, 0.15, -0.08);

      const vineGeo = new THREE.DodecahedronGeometry(0.042, 0);
      [[-0.39, 0.16, 0.22], [-0.40, 0.26, 0.18], [-0.39, 0.36, 0.24], [-0.40, 0.48, 0.20], [-0.38, 0.58, 0.14]]
        .forEach(([vx, vy, vz]) => addPart(chunkWalls, vineGeo, matFoliage, vx, vy, vz));

      /* ---- CHUNK 2: STEEP FAIRYTALE ROOF + PROTRUDING SHINGLES + CROOKED CHIMNEY ---- */
      const roofSlope = 0.94;
      const roofPanelGeo = createBeveledBoxGeometry(0.66, 0.07, 0.86, 0.015);
      addPart(chunkRoof, roofPanelGeo, matRoof, -0.23, 0.93, 0, 0, 0, roofSlope);
      addPart(chunkRoof, roofPanelGeo, matRoof, 0.23, 0.93, 0, 0, 0, -roofSlope);

      const gableShape = new THREE.Shape();
      gableShape.moveTo(-0.38, 0); gableShape.lineTo(0.38, 0); gableShape.lineTo(0, 0.56); gableShape.closePath();
      const gableGeo = new THREE.ExtrudeGeometry(gableShape, { depth: 0.62, bevelEnabled: false });
      gableGeo.translate(0, 0, -0.31);
      addPart(chunkRoof, gableGeo, matWood, 0, 0.65, 0);
      addPart(chunkRoof, createBeveledBoxGeometry(0.10, 0.09, 0.90, 0.02), matWoodDark, 0, 1.24, 0);

      const shingleGeo = createBeveledBoxGeometry(0.14, 0.032, 0.16, 0.006);
      [
        [-0.36, 0.78, -0.24], [-0.26, 0.92, 0.12], [-0.15, 1.07, -0.10], [-0.30, 0.86, 0.28],
        [0.36, 0.78, 0.20], [0.25, 0.93, -0.16], [0.16, 1.06, 0.08], [0.31, 0.85, -0.30]
      ].forEach(([sx, sy, sz], idx) => {
        const tilt = sx < 0 ? roofSlope + 0.05 : -roofSlope - 0.05;
        addPart(chunkRoof, shingleGeo, idx % 2 === 0 ? matRoofAlt : matRoof, sx, sy, sz, 0, 0, tilt);
      });

      // Oversized crooked chimney with dark soot gradient
      const chimGeo = createBeveledBoxGeometry(0.20, 0.68, 0.20, 0.025);
      const cPos = chimGeo.attributes.position;
      const cCols = new Float32Array(cPos.count * 3);
      for (let i = 0; i < cPos.count; i++) {
        const yNorm = THREE.MathUtils.clamp((cPos.getY(i) + 0.34) / 0.68, 0, 1);
        const soot = 1.0 - Math.pow(yNorm, 2.2) * 0.74;
        cCols[i * 3] = 0.54 * soot; cCols[i * 3 + 1] = 0.56 * soot; cCols[i * 3 + 2] = 0.60 * soot;
      }
      chimGeo.setAttribute('color', new THREE.BufferAttribute(cCols, 3));
      const matChimney = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0.02 }));
      addPart(chunkRoof, chimGeo, matChimney, 0.22, 1.10, -0.18, 0.06, 0.08, -0.09);
      const matSootCap = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#2b2c33', roughness: 0.94 }));
      addPart(chunkRoof, createBeveledBoxGeometry(0.24, 0.06, 0.24, 0.015), matSootCap, 0.25, 1.44, -0.16, 0.06, 0.08, -0.09);

      return root;
    }

    /* =========================================================================
       8. THICK STRATIFIED DIORAMA ISLAND WITH ROUNDED POND & BACK HILLS
          Split into 3 geological chunks so Exploded View reveals earth strata!
       ========================================================================= */
    // Stepped strata walls (Cinderwatch technique, src/31-terrain.js wallColumn): the rim is cut into
    // bands; each band is an outward face, and each step between bands is a ledge that is lit on top
    // and dark underneath. Per-segment shade jitter gives the chunky hand-cut look. Mori palette.
    //   hw: half width at the top, yTopFn(x, z): top edge, yBot: bottom, levels: band bottoms (descending)
    //   cols: band colors, layers: detail texture per band, taper: extra inset reached at yBot
    // jBase: band bottoms prepended above the usual ones (for raised terrain); the noise and shading
    // seeds count from the first usual band, so walls low enough to skip them look exactly as before
    function buildStrataChunk({ hw, yTopFn, yBot, levels, cols, layers, taper = 0, wob = 0.04, seed = 0, seg = 60, topCap = false, skin = null, jBase = 0 }) {
      const S = new Soup(), NP = seg * 4, yMax = levels.length > jBase ? levels[jBase] + 1 : yBot + 1;
      const base = (t) => {
        const side = Math.floor(t / seg) % 4, f = (t % seg) / seg;
        if (side === 0) return [-hw + 2 * hw * f, hw];
        if (side === 1) return [hw, hw - 2 * hw * f];
        if (side === 2) return [hw - 2 * hw * f, -hw];
        return [-hw, -hw + 2 * hw * f];
      };
      const at = (b, inset, y) => { const s = (hw - inset) / hw; return [b[0] * s, y, b[1] * s]; };
      const taperAt = (y) => taper * Math.pow(clamp((yMax - y) / (yMax - yBot), 0, 1), 1.3);
      const insetAt = (t, j, y) => taperAt(y) + (j & 1) * 0.035 + (vnoise(t * 0.21, j * 3.1, seed + 45) - 0.5) * 2 * wob;
      const shade = (c, k) => mulC(c, k);
      const facing = (a, b, c, d, ox, oz, col, layer) => {
        _sa.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]); _sb.set(c[0] - a[0], c[1] - a[1], c[2] - a[2]); _sn.crossVectors(_sa, _sb);
        if (_sn.x * ox + _sn.z * oz >= 0) S.quad(a, b, c, d, col, layer, 0.96, { uvs: 0.55 }); else S.quad(a, d, c, b, col, layer, 0.96, { uvs: 0.55 });
      };
      const ledge = (a, b, c, d, col, layer) => {
        _sa.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]); _sb.set(c[0] - a[0], c[1] - a[1], c[2] - a[2]); _sn.crossVectors(_sa, _sb);
        const up = _sn.y >= 0, lit = shade(col, 1.22), dark = shade(col, 0.5);
        S.quad(a, b, c, d, up ? lit : dark, layer, 0.96, { uvs: 0.55 }); S.quad(a, d, c, b, up ? dark : lit, layer, 0.96, { uvs: 0.55 });
      };
      for (let t = 0; t < NP; t++) {
        const bA = base(t), bB = base(t + 1 === NP ? 0 : t + 1), ox = (bA[0] + bB[0]) / 2, oz = (bA[1] + bB[1]) / 2;
        let yA = yTopFn(bA[0], bA[1]), yB = yTopFn(bB[0], bB[1]), inA = 0, inB = 0;
        let j = 0; while (j < levels.length && levels[j] > Math.min(yA, yB) - 0.07) j++;
        if (skin) { // thin dark root-mat band right under the turf edge
          const loA = yA - skin.h, loB = yB - skin.h;
          facing(at(bA, 0, yA), at(bA, 0, loA), at(bB, 0, loB), at(bB, 0, yB), ox, oz, shade(skin.col, 0.9 + 0.2 * h2(t, 1, seed)), L_DIRT);
          yA = loA; yB = loB;
        }
        for (let guard = 0; guard < 40; guard++) {
          const last = j >= levels.length;
          const lvl = last ? yBot : levels[j];
          const w = last ? 0 : 0.035;
          const jj = j - jBase;
          const loA = Math.max(yBot, Math.min(yA - 0.02, lvl + w * (vnoise(t * 0.5, jj, seed + 46) - 0.5)));
          const loB = Math.max(yBot, Math.min(yB - 0.02, lvl + w * (vnoise((t + 1) * 0.5, jj, seed + 46) - 0.5)));
          const band = Math.min(j, cols.length - 1), col = shade(cols[band], 0.9 + 0.2 * h2(t, jj, seed + 3));
          facing(at(bA, inA, yA), at(bA, inA, loA), at(bB, inB, loB), at(bB, inB, yB), ox, oz, col, layers[band]);
          if (last) break;
          const nA = insetAt(t, jj + 1, loA), nB = insetAt(t + 1, jj + 1, loB);
          ledge(at(bA, inA, loA), at(bA, nA, loA), at(bB, nB, loB), at(bB, inB, loB), col, layers[band]);
          yA = loA; yB = loB; inA = nA; inB = nB; j++;
        }
      }
      if (topCap) {
        const y = yTopFn(0, 0), c = shade(cols[0], 0.7);
        S.quad([-hw, y, -hw], [-hw, y, hw], [hw, y, hw], [hw, y, -hw], c, L_DIRT, 0.96, { uvs: 0.55 });
      }
      const mesh = new THREE.Mesh(S.build({ groups: 1, ao: null }), makeTerrainMaterial());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }
    // band bottoms from y0 down to y1, thicknesses between tMin and tMax
    function strataLevels(y0, y1, tMin, tMax, seed) {
      const L = []; let y = y0, i = 0;
      while (true) { y -= tMin + (tMax - tMin) * h2(i++, 9, seed); if (y <= y1 + tMin * 0.6) break; L.push(y); }
      return L;
    }

    function buildMiniatureIsland(scene) {
      const chunkTopSurface = new THREE.Group(); // Grass, hills, topsoil cutaway, roots, pond
      const chunkSubsoil = new THREE.Group();    // Clay/subsoil + embedded stones
      const chunkBedrock = new THREE.Group();    // Deep bedrock tapered base
      scene.add(chunkTopSurface, chunkSubsoil, chunkBedrock);

      // --- 8A. Continuous Beveled Top Grass & Terraced Hills + Rounded Pond Basin ---
      const segs = 72;
      const topGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE, segs, segs);
      topGeo.rotateX(-Math.PI / 2);
      // smooth copy of the surface: only the build grid overlay rides on it
      const fitGridHeights = (geo) => {
        const tPos = geo.attributes.position;
        for (let i = 0; i < tPos.count; i++) tPos.setY(i, getTurfHeight(tPos.getX(i), tPos.getZ(i)));
        tPos.needsUpdate = true;
        geo.computeBoundingSphere();
      };
      fitGridHeights(topGeo);

      // Faceted low-poly turf (Cinderwatch terrain technique, src/31-terrain.js): jittered grid,
      // one flat normal + one color per triangle, detail texture + bump. Mori palette.
      const terrainMat = makeTerrainMaterial();
      const TCELL = 0.2, TNV = Math.round(GRID_SIZE / TCELL) + 1;
      const TV = new Float32Array(TNV * TNV * 3);
      const fillTurfVerts = () => { for (let j = 0; j < TNV; j++) for (let i = 0; i < TNV; i++) {
        let x = -HALF_GRID + i * TCELL, z = -HALF_GRID + j * TCELL;
        if (i > 0 && i < TNV - 1) x += (h2(i, j, 151) - 0.5) * TCELL * 0.5;
        if (j > 0 && j < TNV - 1) z += (h2(i, j, 152) - 0.5) * TCELL * 0.5;
        const o = (j * TNV + i) * 3;
        const rim = i === 0 || j === 0 || i === TNV - 1 || j === TNV - 1; // rim stays exact: the topsoil wall meets it
        TV[o] = x; TV[o + 1] = getTurfHeight(x, z) + (rim ? 0 : (h2(i, j, 153) - 0.5) * 0.026); TV[o + 2] = z;
      } };
      const tGrassA = C('#72b84f'), tGrassB = C('#5b9f43'), tGrassL = C('#93c95c'), tHill = C('#4f9140'), tMoss = C('#5d8a3c');
      const tCliff = C('#7d5a38'), tCliffD = C('#5a3f27'), tShore = C('#bca776'), tBed = C('#4a615c');
      const tSand = C('#dcc48e'), tSandD = C('#c4a672'), tSoil = C('#8f6842'), tSoilD = C('#6c4a2d');
      const tStone = C('#9a9da4'), tStoneD = C('#73777f');
      // painted sand / dirt / stone (the pond bed stays as it is until water editing)
      const paintedColor = (pm, x, z, ny, n1, n2, sdf) => {
        if (pm === MAT_SAND) {
          let c = mixC(tSandD, tSand, smooth(0.3, 0.7, n1));
          if (ny < 0.86) c = mixC(mixC(tCliffD, tCliff, n1), c, 0.55); // sandy bank
          if (sdf < 0.42) c = mulC(c, 1 - 0.16 * (1 - smooth(0.05, 0.42, sdf))); // damp by the water
          return [mulC(c, 0.9 + 0.18 * n2), L_SAND, 0.98];
        }
        if (pm === MAT_DIRT) {
          const c = ny < 0.86 ? mixC(tCliffD, tCliff, n1) : mixC(tSoilD, tSoil, n1);
          return [mulC(c, 0.86 + 0.24 * n2), ny < 0.68 ? L_ROCK : L_DIRT, 0.95];
        }
        const c = mixC(tStoneD, tStone, smooth(0.25, 0.75, n1));
        return [mulC(c, 0.84 + 0.3 * n2), L_ROCK, ny < 0.86 ? 0.9 : 0.8];
      };
      const turfColor = (x, z, y, ny) => {
        const n1 = vnoise(x * 0.75, z * 0.75, 141) * 0.65 + vnoise(x * 2.1, z * 2.1, 143) * 0.35;
        const n2 = h2(Math.floor(x * 4 + 99), Math.floor(z * 4 + 99), 147);
        const sdf = getPondSDF(x, z);
        if (sdf < 0.05) { // pond bed + wet rim under the water
          const c = mixC(tShore, tBed, smooth(0.05, -0.4, sdf) * 0.9);
          return [mulC(c, 0.88 + 0.2 * n2), L_DIRT, 0.7];
        }
        const pm = terrainPaintAt(x, z);
        if (pm !== MAT_GRASS) return paintedColor(pm, x, z, ny, n1, n2, sdf);
        if (ny < 0.86) { // terrace cliff faces: packed earth, mossy where it flattens out
          let c = mixC(tCliffD, tCliff, n1);
          c = mixC(c, tMoss, smooth(0.62, 0.84, ny) * 0.55);
          return [mulC(c, 0.85 + 0.28 * n2), ny < 0.68 ? L_ROCK : L_DIRT, 0.96];
        }
        let c = mixC(tGrassB, tGrassA, smooth(0.32, 0.68, n1));
        c = mixC(c, tGrassL, smooth(0.66, 0.86, n1) * 0.55);
        if (y > 0.25) c = mixC(c, tHill, clamp((y - 0.25) * 0.7, 0, 0.5));
        if (sdf < 0.42) c = mixC(c, tShore, (1 - smooth(0.05, 0.42, sdf)) * 0.78);
        return [mulC(c, 0.86 + 0.26 * n2), L_GRASS, 0.95];
      };
      const tv = (i, j) => { const o = (j * TNV + i) * 3; return [TV[o], TV[o + 1], TV[o + 2]]; };
      const _ta = new THREE.Vector3(), _tb = new THREE.Vector3();
      const buildTurfGeometry = (refit = true) => { // refit = false: same heights, only the colours changed
      if (refit) fillTurfVerts();
      const turf = new Soup();
      for (let j = 0; j < TNV - 1; j++) for (let i = 0; i < TNV - 1; i++) {
        const a = tv(i, j), b = tv(i + 1, j), c = tv(i + 1, j + 1), d = tv(i, j + 1);
        const tris = ((i + j) & 1) ? [[a, d, c], [a, c, b]] : [[a, d, b], [b, d, c]];
        for (const t of tris) {
          _ta.set(t[1][0] - t[0][0], t[1][1] - t[0][1], t[1][2] - t[0][2]);
          _tb.set(t[2][0] - t[0][0], t[2][1] - t[0][1], t[2][2] - t[0][2]);
          const ny = _ta.cross(_tb).normalize().y;
          const m = turfColor((t[0][0] + t[1][0] + t[2][0]) / 3, (t[0][2] + t[1][2] + t[2][2]) / 3, (t[0][1] + t[1][1] + t[2][1]) / 3, ny);
          turf.tri(t[0], t[1], t[2], m[0], m[1], m[2], { uvs: 0.55 });
        }
      }
      return turf.build({ groups: 1, ao: null });
      };
      const topMesh = new THREE.Mesh(buildTurfGeometry(), terrainMat);
      topMesh.castShadow = true;
      topMesh.receiveShadow = true;
      chunkTopSurface.add(topMesh); // must stay children[0]: it is the pointer ray target

      // --- 8B. Thick Stratified Cutaway Cross-Section Chunks ---
      // Stratum 1: topsoil, its top edge meets the turf rim exactly (same 0.2 spacing, no jitter there)
      // two extra bands on top only show on raised rim tiles (3 steps); lower walls skip them (jBase)
      const topLv = strataLevels(1.0, -0.62, 0.16, 0.3, 201);
      const topPal = ['#6b472c', '#5e3d25', '#73502f', '#634129'];
      const buildTopsoil = () => buildStrataChunk({
        hw: HALF_GRID, yTopFn: getTurfHeight, yBot: -0.62, levels: [1.18, 0.98].concat(topLv), jBase: 2, seed: 201, seg: Math.round(GRID_SIZE / TCELL), wob: 0.03,
        cols: [C(topPal[1]), C(topPal[3])].concat(topLv.map((_, k) => C(topPal[k % 4]))).concat([C('#5a3b23')]),
        layers: [L_DIRT, L_DIRT].concat(topLv.map(() => L_DIRT)).concat([L_DIRT]),
        skin: { h: 0.07, col: C('#4a3020') }
      });
      const topsoilMesh = buildTopsoil();
      chunkTopSurface.add(topsoilMesh);

      // Stratum 2: warm clay and sandstone bands
      const clayLv = strataLevels(-0.60, -1.42, 0.12, 0.24, 202);
      const clayPal = ['#9a6a40', '#b5814e', '#8a5c38', '#c39a66', '#a5703f'].map((h) => C(h));
      const subsoilMesh = buildStrataChunk({
        hw: HALF_GRID - 0.12, yTopFn: () => -0.60, yBot: -1.42, levels: clayLv, seed: 202, seg: 40, wob: 0.05, topCap: true,
        cols: clayLv.map((_, k) => clayPal[Math.floor(h2(k, 3, 202) * clayPal.length)]).concat([clayPal[2]]),
        layers: clayLv.map((_, k) => (h2(k, 4, 202) > 0.55 ? L_ROCK : L_DIRT)).concat([L_ROCK])
      });
      chunkSubsoil.add(subsoilMesh);

      // Stratum 3: craggy blue-grey bedrock, stepping inward toward the bottom
      const rockLv = strataLevels(-1.40, -2.55, 0.14, 0.3, 203);
      const rockPal = ['#6c7180', '#575c69', '#7d8291', '#4b4f5b'].map((h) => C(h));
      const bedrockMesh = buildStrataChunk({
        hw: HALF_GRID - 0.5, yTopFn: () => -1.40, yBot: -2.55, levels: rockLv, seed: 203, seg: 40, wob: 0.09, taper: 0.7, topCap: true,
        cols: rockLv.map((_, k) => rockPal[(k * 3 + Math.floor(h2(k, 7, 203) * 3)) % rockPal.length]).concat([rockPal[3]]),
        layers: rockLv.map(() => L_ROCK).concat([L_ROCK])

      chunkBedrock.add(bedrockMesh);

      // --- 8C. Protruding Tree Roots (Topsoil Chunk) & Embedded Stones (Subsoil/Bedrock) ---
      const dummy = new THREE.Object3D();
      const rootGeo = new THREE.CylinderGeometry(0.024, 0.056, 0.62, 5);
      const rootMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#5c3c24', roughness: 0.90 }));
      const embedRoots = new THREE.InstancedMesh(rootGeo, rootMat, 44);
      const placeRoots = () => { for (let i = 0; i < 44; i++) {
        const side = i % 4;
        const along = (hash2D(i, 4, 19) - 0.5) * (GRID_SIZE - 1.0);
        let rx = 0, rz = 0;
        const edgeR = HALF_GRID + 0.01;
        if (side === 0) { rx = along; rz = edgeR; }
        else if (side === 1) { rx = along; rz = -edgeR; }
        else if (side === 2) { rx = edgeR; rz = along; }
        else { rx = -edgeR; rz = along; }
        // short roots lying along the earth wall, poking out of it, always below the turf
        const surfY = getTurfHeight(rx, rz);
        const depthY = surfY - 0.2 - hash2D(i, 5, 19) * 0.3;
        const tilt = (hash2D(i, 6, 19) < 0.5 ? -1 : 1) * (1.05 + hash2D(i, 8, 19) * 0.4);
        dummy.position.set(rx, depthY, rz);
        dummy.rotation.set(side >= 2 ? tilt : 0, 0, side < 2 ? tilt : 0);
        dummy.scale.set(0.8, 0.35 + hash2D(i, 9, 19) * 0.35, 0.8);
        dummy.updateMatrix();
        embedRoots.setMatrixAt(i, dummy.matrix);
      }
      embedRoots.instanceMatrix.needsUpdate = true;
      embedRoots.computeBoundingSphere();
      };
      placeRoots();
      chunkTopSurface.add(embedRoots);

      // Embedded Stones in Subsoil Cutaway
      const stoneGeo = new THREE.DodecahedronGeometry(0.17, 0);
      const embedStoneMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({
        color: '#8f96a3', roughness: 0.34, metalness: 0.08
      }));
      const embedStones = new THREE.InstancedMesh(stoneGeo, embedStoneMat, 56);
      embedStones.castShadow = true;
      embedStones.receiveShadow = true;
      for (let i = 0; i < 56; i++) {
        const side = i % 4;
        const along = (hash2D(i, 1, 7) - 0.5) * (GRID_SIZE - 1.2);
        const depthY = -0.72 - hash2D(i, 2, 7) * 0.62;
        const edgeR = HALF_GRID - 0.16 + (depthY + 0.6) * 0.3;
        let sx = 0, sz = 0;
        if (side === 0) { sx = along; sz = edgeR; }
        else if (side === 1) { sx = along; sz = -edgeR; }
        else if (side === 2) { sx = edgeR; sz = along; }
        else { sx = -edgeR; sz = along; }
        const sc = 0.65 + hash2D(i, 3, 7) * 1.15;
        dummy.position.set(sx, depthY, sz);
        dummy.rotation.set(i * 0.7, i * 1.1, i * 0.5);
        dummy.scale.set(sc, sc * 0.72, sc);
        dummy.updateMatrix();
        embedStones.setMatrixAt(i, dummy.matrix);
      }
      embedStones.instanceMatrix.needsUpdate = true;
      chunkSubsoil.add(embedStones);

      // --- 8D. Smooth Organic Curved Water Surface (SDF-Masked Shader) + Lily Pads ---
      const sdfSize = 128;

      sdfCanvas.width = sdfSize;

          const wz = (py / (sdfSize - 1) - 0.5) * GRID_SIZE;

          const val = Math.round(THREE.MathUtils.clamp((sdf / 3.0 + 0.5) * 255, 0, 255));

          if (d > reach) continue;

        fragmentShader: `

          void main() {

        depthWrite: false
      });
      const waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.y = -0.09;
      chunkTopSurface.add(waterMesh);

      // Floating Lily Pads inside the rounded pond (lilyParts: pad + blossom, popped in by the startup assembly)
      const lilyParts = [];
      const lilyMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#4c9c48', roughness: 0.55 }));
      const blossomMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#ffa3c7', roughness: 0.65 }));
      [
        { x: 1.9, z: 2.0, flower: true },
        { x: 3.1, z: 2.3, flower: false },
        { x: 2.3, z: 3.0, flower: true }
      ].forEach((lp) => { // starter pond only: hidden when the water there is gone (placeLilies)
        const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.025, 10, 1, false, 0.2, Math.PI * 1.85), lilyMat);
        pad.position.set(lp.x, -0.075, lp.z);
        pad.rotation.y = lp.x * 1.7;
        chunkTopSurface.add(pad);
        const part = [pad];
        if (lp.flower) {
          const fl = new THREE.Mesh(new THREE.DodecahedronGeometry(0.068, 0), blossomMat);
          fl.position.set(lp.x, -0.03, lp.z);
          chunkTopSurface.add(fl);
          part.push(fl);
        }
        lilyParts.push({ meshes: part, x: lp.x, z: lp.z, y: part.map((m) => m.position.y) });
      });
      const placeLilies = () => lilyParts.forEach((lp) => {
        const on = getPondSDF(lp.x, lp.z) < -0.24;
        const y = getTileElevation(Math.floor(lp.x + HALF_GRID), Math.floor(lp.z + HALF_GRID));
        lp.meshes.forEach((m, i) => { m.visible = on; m.position.y = lp.y[i] + y; });
      });
      placeLilies();

      // Low-lying valley mist drifting over the water: thickest over open water, thinning past the shore
      const mistMat = new THREE.ShaderMaterial({
        uniforms: {
          uSdf: { value: sdfTex },
          uTime: sharedUniforms.uTime,
          uColor: { value: new THREE.Color(ATMOSPHERES.day.fogColor) },
          uOpacity: { value: 0.24 }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec2 vXZ;
          void main() {
            vUv = uv;
            vXZ = position.xz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uSdf;
          uniform float uTime;
          uniform vec3 uColor;
          uniform float uOpacity;
          varying vec2 vUv;
          varying vec2 vXZ;
          float mh(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
          float mn(vec2 p) {
            vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
            return mix(mix(mh(i), mh(i + vec2(1.0, 0.0)), f.x), mix(mh(i + vec2(0.0, 1.0)), mh(i + 1.0), f.x), f.y);
          }
          void main() {
            float sdf = (texture2D(uSdf, vUv).r - 0.5) * 3.0;
            float a = smoothstep(0.32, -0.9, sdf);
            if (a < 0.01) discard;
            vec2 drift = vec2(sin(uTime * 0.25), cos(uTime * 0.2)) * 0.35;

            gl_FragColor = vec4(uColor, a);
          }
        `,
        transparent: true,
        depthWrite: false
      });
      const pondMist = new THREE.Mesh(buildPondSheet(0.32), mistMat);
      pondMist.position.y = 0.12;
      chunkTopSurface.add(pondMist);

      // --- 8D-2. Waterfalls: one strip mesh for all of them (falls, section 1) ---
      // Lip columns side by side on one edge make one strip. Its profile (t): a short run on the
      // upper pond (t < 0), the drop (0..1, a falling curve that clears the dug bank under it), a short
      // run on the plunge pool (t > 1). The shader paints two layers in one pass: clear translucent
      // water and crisp white streaks of varying width sliding down (thin at the lip, foam at the foot).
      const FALL_SURF = -0.09 + 0.016; // the water sheet (waterMesh.position.y), clear of its waves
      const fallSegments = () => {
        const groups = new Map();
        for (const f of falls) {
          const [cx, cz] = cellCentre(f.qx, f.qz);
          const line = f.sx ? cx + f.sx * 0.125 : cz + f.sz * 0.125; // the edge it spills over
          const key = `${f.sx},${f.sz},${line.toFixed(3)},${f.top},${f.bot}`;
          if (!groups.has(key)) groups.set(key, { sx: f.sx, sz: f.sz, line, top: f.top, bot: f.bot, edge: f.edge, a: [] });
          groups.get(key).a.push(f.sx ? cz : cx);
        }

        for (const g of groups.values()) {
          g.a.sort((p, q) => p - q);
          let a0 = g.a[0], prev = a0;
          for (let i = 1; i <= g.a.length; i++) {
            if (i < g.a.length && g.a[i] - prev < 0.26) { prev = g.a[i]; continue; }
            segs.push({ sx: g.sx, sz: g.sz, line: g.line, top: g.top, bot: g.bot, edge: g.edge, a0: a0 - 0.125, a1: prev + 0.125 });
            if (i < g.a.length) a0 = prev = g.a[i];
          }
        }
        return segs;
      };
      const FALL_RIM_BOTTOM = -1.9; // an island-edge fall frays into mist on its way down to here
      const edgeFallS = (t) => 0.16 * Math.sqrt(t) + 0.1 * t; // out past the rim: clears the earth wall at once
      const fallProfile = (seg) => { // pts: [s: out past the edge, y, t], foot: [s, y] where it lands
        if (seg.edge) {
          const ys = seg.top + FALL_SURF, Hd = ys - FALL_RIM_BOTTOM, pts = [[-0.16, ys, -0.6], [-0.08, ys, -0.3], [0, ys, 0]];
          for (let k = 1; k <= 14; k++) { const t = k / 14; pts.push([edgeFallS(t), ys - Hd * t, t]); }
          return { pts, foot: [edgeFallS(0.7), ys - Hd * 0.7] };
        }
        // between terraces the water rolls over a round crest where the terrace slope starts (0.28
        // before the edge) and falls in a gentle arc a little clear of the bank, never under a thin
        // sheet on it (ground = the highest point across the strip's middle), held between the two
        // pond surfaces and smoothed into one curve
        const ys = seg.top + FALL_SURF, yb = seg.bot + FALL_SURF, H = ys - yb, sd = seg.sx || seg.sz;
        const am = (seg.a0 + seg.a1) / 2, ah = Math.max(0, (seg.a1 - seg.a0) / 2 - 0.02), DS = 0.025, S0 = -0.5;

          }

        };
        const gTop = groundAt(-0.3), dTop = Math.max(0.06, ys - gTop), ysA = [];

        return { pts, foot: [sf, yb] };
      };
      const fallFeet = []; // where the falls land, every ~0.5 along them: { x, y, z, dx, dz: the way it falls, w: width, edge }
      const fallLines = []; // one per fall into a pool, for the ripple rings: { x, z: foot centre, ax, az: along the lip, half }
      const buildFallGeometry = () => {
        const segs = fallSegments(), pos = [], flow = [], fall = [], idx = [];

          }

          }
          let arc = 0;
          const arcs = prof.map((p, k) => (k ? (arc += Math.hypot(p[0] - prof[k - 1][0], p[1] - prof[k - 1][1])) : 0));
          const b = pos.length / 3;
          for (let k = 0; k < prof.length; k++) for (let i = 0; i <= nA; i++) {
            const [s, y, t] = prof[k], spread = seg.edge ? 0.07 * Math.max(0, t) : 0; // an edge fall widens as it falls
            const a = w0 - spread + (w1 - w0 + 2 * spread) * i / nA;
            if (seg.sx) pos.push(seg.line + seg.sx * s, y, a); else pos.push(a, y, seg.line + seg.sz * s);
            flow.push(a, arcs[k]); fall.push(t, i / nA, seg.edge ? 1 : 0);

    window.addEventListener('load', () => {

    function initGame() {

      keyLight.position.set(14, 21, 11);

      keyLight.shadow.mapSize.height = SHADOW_MAP_SIZE;

      scene.add(fillLight);

        ATMOSPHERES.day.hemiSky, ATMOSPHERES.day.hemiGround, ATMOSPHERES.day.hemiIntensity
      );
      scene.add(hemiLight);

      const pointLightPool = [];
      for (let i = 0; i < MAX_POINT_LIGHTS; i++) {
        const pl = new THREE.PointLight('#ffaa50', 0, 5.4, 2.0);
        pl.castShadow = false;

        pl.visible = true;
        pl.userData = { active: false };
        scene.add(pl);

      // --- Low-res post pipeline (all passes run at scene resolution) ---
      //  1. atmo  : sky composite + screen-space AO + low mist lit by nearby lamps

      //  3. bloom : bright pass -> 1/2 and 1/4 resolution gaussian
      //  4. comp  : bloom add + chromatic aberration + grade + ACES + vignette + Bayer dither
      const POST = {

        dof: HASH.nodof !== '1',
        bloom: HASH.nobloom !== '1',
        lite: false // set by adaptive scaler when even 55% resolution is too slow
      };
      const NL = MAX_POINT_LIGHTS;
      const mistLightPos = [], mistLightCol = [];
      for (let i = 0; i < NL; i++) { mistLightPos.push(new THREE.Vector3()); mistLightCol.push(new THREE.Vector3()); }

      const postScene = new THREE.Scene();
      const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const fsMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
      fsMesh.frustumCulled = false;
      postScene.add(fsMesh);
      function fsPass(mat, target) {
        fsMesh.material = mat;
        renderer.setRenderTarget(target);
        renderer.render(postScene, postCamera);
      }

      const FS_VERT = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
      const GLSL_COMMON = `
        float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
        float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
        float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
        float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
        float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
      `;
      function fsMat(frag, uniforms) {
        return new THREE.ShaderMaterial({ vertexShader: FS_VERT, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false, toneMapped: false });
      }

      function makeRT(w, h, filter) {
        return new THREE.WebGLRenderTarget(w, h, {
          type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: filter, magFilter: filter,
          depthBuffer: false, stencilBuffer: false, generateMipmaps: false
        });
      }
      const PT = {
        atmo: makeRT(rtSize.w, rtSize.h, THREE.NearestFilter),
        dof: makeRT(rtSize.w, rtSize.h, THREE.LinearFilter),
        bA: makeRT(1, 1, THREE.LinearFilter), bA2: makeRT(1, 1, THREE.LinearFilter),
        bB: makeRT(1, 1, THREE.LinearFilter), bB2: makeRT(1, 1, THREE.LinearFilter)
      };
      function sizePostTargets() {
        PT.atmo.setSize(rtSize.w, rtSize.h);
        PT.dof.setSize(rtSize.w, rtSize.h);
        const bw = Math.max(4, rtSize.w >> 1), bh = Math.max(4, rtSize.h >> 1);
        const cw = Math.max(2, rtSize.w >> 2), ch = Math.max(2, rtSize.h >> 2);
        PT.bA.setSize(bw, bh); PT.bA2.setSize(bw, bh);
        PT.bB.setSize(cw, ch); PT.bB2.setSize(cw, ch);
      }
      sizePostTargets();

      // 1. ATMO
      const atmoMat = fsMat(`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D tColor; uniform sampler2D tDepth;
        uniform mat4 uInvVP; uniform vec3 uCamDir; uniform vec2 uPx;
        uniform vec3 uSkyTop; uniform vec3 uSkyBottom; uniform float uNightFactor; uniform float uTime;
        uniform vec3 uLightPos[${NL}]; uniform vec3 uLightCol[${NL}];
        uniform vec3 uMistAmb; uniform vec4 uMist;   // x base height, y falloff, z density, w lamp gain
        uniform vec3 uAO;                            // x strength, y radius (scene px), z radius (world)
        uniform vec2 uDitherOfs; uniform vec2 uWind;
        ${GLSL_COMMON}
        vec3 getSky(vec2 uv) {
          vec3 sky = mix(uSkyBottom, uSkyTop, pow(clamp(uv.y, 0.0, 1.0), 0.85));
          if (uNightFactor > 0.35) {
            vec2 starCell = floor(uv * vec2(220.0, 130.0));
            float h = fract(sin(dot(starCell, vec2(127.1, 311.7))) * 43758.5453);
            if (h > 0.995 && uv.y > 0.30) {
              float twinkle = 0.55 + 0.45 * sin(h * 120.0 + uTime * 2.2);
              sky += vec3(0.85, 0.9, 1.0) * (uNightFactor - 0.35) * twinkle * 0.9;
            }
          }
          return sky;
        }
        vec3 wpos(vec2 uv, float d) { vec4 p = uInvVP * vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0); return p.xyz / p.w; }
        void main() {
          vec4 sc = texture2D(tColor, vUv);
          // the scene target holds premultiplied colour over a transparent clear (that is what normal blending
          // leaves there), so translucent things over the sky keep their brightness; skip the sky where it is hidden
          float scA = clamp(sc.a, 0.0, 1.0);
          vec3 col = scA < 0.999 ? getSky(vUv) * (1.0 - scA) + sc.rgb : sc.rgb;
          float d = texture2D(tDepth, vUv).x;
          if (d < 0.9999) {
            vec3 P = wpos(vUv, d);
            if (uAO.x > 0.001) {
              // normal reconstructed from depth (pick the smoother side to avoid edge halos)
              float dr = texture2D(tDepth, vUv + vec2(uPx.x, 0.0)).x, dl = texture2D(tDepth, vUv - vec2(uPx.x, 0.0)).x;
              float du = texture2D(tDepth, vUv + vec2(0.0, uPx.y)).x, dd = texture2D(tDepth, vUv - vec2(0.0, uPx.y)).x;
              vec3 ddx = abs(dr - d) < abs(d - dl) ? wpos(vUv + vec2(uPx.x, 0.0), dr) - P : P - wpos(vUv - vec2(uPx.x, 0.0), dl);
              vec3 ddy = abs(du - d) < abs(d - dd) ? wpos(vUv + vec2(0.0, uPx.y), du) - P : P - wpos(vUv - vec2(0.0, uPx.y), dd);
              vec3 N = normalize(cross(ddx, ddy)); if (dot(N, uCamDir) > 0.0) N = -N;
              float occ = 0.0, ang = bayer4(gl_FragCoord.xy + uDitherOfs) * 6.2831853;
              for (int i = 0; i < 10; i++) {
                float fi = (float(i) + 0.5) / 10.0, a = ang + float(i) * 2.39996;
                vec2 suv = vUv + vec2(cos(a), sin(a)) * uAO.y * sqrt(fi) * uPx;
                vec3 V = (wpos(suv, texture2D(tDepth, suv).x) - P) / uAO.z; // in units of the AO radius
                float vv = dot(V, V);
                occ += max(0.0, dot(V, N) - 0.04) / (vv + 0.04) * step(vv, 1.0);
              }
              col *= clamp(1.0 - occ * uAO.x * 0.118, 0.0, 1.0);
            }
            // low drifting mist, tinted by the lamps around it
            float n = vnoise(P.xz * 0.55 + uWind) * 0.65 + vnoise(P.xz * 1.6 - uWind * 1.7) * 0.35;
            float tau = min(uMist.z * exp(-(max(P.y, -0.6) - uMist.x) / uMist.y), 0.9)
                      * smoothstep(0.30, 0.80, n) * smoothstep(-0.75, -0.25, P.y);
            float f = 1.0 - exp(-tau);
            vec3 L = uMistAmb; vec3 Pm = P + vec3(0.0, 0.12, 0.0);
            for (int i = 0; i < ${NL}; i++) { vec3 dv = uLightPos[i] - Pm; L += uLightCol[i] / (dot(dv, dv) + 0.45); }
            col = mix(col, L * uMist.w, f);
          }
          gl_FragColor = vec4(col, 1.0);
        }
      `, {
        tColor: { value: renderTarget.texture }, tDepth: { value: renderTarget.depthTexture },
        uInvVP: { value: new THREE.Matrix4() }, uCamDir: { value: new THREE.Vector3() }, uPx: { value: new THREE.Vector2() },
        uSkyTop: sharedUniforms.uSkyTop, uSkyBottom: sharedUniforms.uSkyBottom,
        uNightFactor: sharedUniforms.uNightFactor, uTime: sharedUniforms.uTime,
        uLightPos: { value: mistLightPos }, uLightCol: { value: mistLightCol },
        uMistAmb: { value: new THREE.Vector3(0.8, 0.85, 0.9) }, uMist: { value: new THREE.Vector4(0.0, 0.32, 0.22, 1.0) },
        uAO: { value: new THREE.Vector3(1.0, 12, 0.32) }, uDitherOfs: { value: ditherOfs }, uWind: { value: new THREE.Vector2() }
      });

      // 2. DOF (depth-aware tilt-shift; ortho depth is linear, 1 unit = (far - near))
      const dofMat = fsMat(`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D tColor; uniform sampler2D tDepth; uniform vec2 uPx;
        uniform vec4 uDof;   // x focus depth, y far start, z far ramp, w max radius (px)
        uniform vec3 uNear;  // x near start, y near ramp, z near strength
        uniform vec2 uDitherOfs;
        ${GLSL_COMMON}
        float cocAt(float d) {
          float z = d - uDof.x;
          return z > 0.0 ? clamp((z - uDof.y) / uDof.z, 0.0, 1.0) * uDof.w
                         : clamp((-z - uNear.x) / uNear.y, 0.0, 1.0) * uDof.w * uNear.z;
        }
        void main() {
          float dc = texture2D(tDepth, vUv).x;
          vec3 col = texture2D(tColor, vUv).rgb;
          if (dc > 0.9999) { gl_FragColor = vec4(col, 1.0); return; } // sky stays crisp (stars)
          float cc = cocAt(dc);
          if (cc < 0.35) {
            // in focus: only blur if a blurry foreground object overlaps us
            float near = 0.0;
            for (int i = 0; i < 8; i++) {
              float a = float(i) * 0.7853982;
              vec2 o = vec2(cos(a), sin(a)) * uPx * uDof.w * (mod(float(i), 2.0) < 0.5 ? 0.95 : 0.5);
              float sd = texture2D(tDepth, vUv + o).x; if (sd < dc) near = max(near, cocAt(sd));
            }
            if (near < 0.5) { gl_FragColor = vec4(col, 1.0); return; }
          }
          float tot = 1.0, rad = 0.75, ang = bayer4(gl_FragCoord.xy + uDitherOfs) * 6.2831853;
          for (int i = 0; i < 32; i++) {
            ang += 2.39996323;
            vec2 tc = vUv + vec2(cos(ang), sin(ang)) * uPx * rad;
            float sd = texture2D(tDepth, tc).x, sc = cocAt(sd);
            if (sd > dc) sc = clamp(sc, 0.0, cc * 2.0); // background can't bleed over a sharper foreground
            float m = smoothstep(rad - 0.5, rad + 0.5, sc);
            col += mix(col / tot, texture2D(tColor, tc).rgb, m); tot += 1.0;
            rad += 1.35 / rad; if (rad > uDof.w) break;
          }
          gl_FragColor = vec4(col / tot, 1.0);
        }
      `, {
        tColor: { value: PT.atmo.texture }, tDepth: { value: renderTarget.depthTexture }, uPx: { value: new THREE.Vector2() },
        uDof: { value: new THREE.Vector4() }, uNear: { value: new THREE.Vector3() }, uDitherOfs: { value: ditherOfs }
      });

      // 3. BLOOM
      const brightMat = fsMat(`
        precision highp float; varying vec2 vUv; uniform sampler2D tColor; uniform vec2 uPx; uniform vec2 uThr;
        void main() {
          vec3 c = texture2D(tColor, vUv + uPx * vec2(-0.5, -0.5)).rgb + texture2D(tColor, vUv + uPx * vec2(0.5, -0.5)).rgb
                 + texture2D(tColor, vUv + uPx * vec2(-0.5, 0.5)).rgb + texture2D(tColor, vUv + uPx * vec2(0.5, 0.5)).rgb;
          c *= 0.25; float l = max(c.r, max(c.g, c.b));
          c *= smoothstep(uThr.x, uThr.x + uThr.y, l);
          gl_FragColor = vec4(min(c, vec3(24.0)), 1.0);
        }
      `, { tColor: { value: null }, uPx: { value: new THREE.Vector2() }, uThr: { value: new THREE.Vector2(1.8, 1.2) } });
      const blurMat = fsMat(`
        precision highp float; varying vec2 vUv; uniform sampler2D tColor; uniform vec2 uDir;
        void main() {
          vec3 c = texture2D(tColor, vUv).rgb * 0.227027;
          c += (texture2D(tColor, vUv + uDir * 1.3846).rgb + texture2D(tColor, vUv - uDir * 1.3846).rgb) * 0.316216;
          c += (texture2D(tColor, vUv + uDir * 3.2308).rgb + texture2D(tColor, vUv - uDir * 3.2308).rgb) * 0.070270;
          gl_FragColor = vec4(c, 1.0);
        }
      `, { tColor: { value: null }, uDir: { value: new THREE.Vector2() } });

      // 4. COMP
      const compMat = fsMat(`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D tColor; uniform sampler2D tBloomA; uniform sampler2D tBloomB;
        uniform vec2 uBloom;  // x half-res weight, y quarter-res weight
        uniform vec3 uGradeTint; uniform float uGradeWarmth;
        uniform vec2 uDitherOfs; uniform float uLevels;
        ${GLSL_COMMON}
        vec3 acesFilm(vec3 x) {
          float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
          return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
        }
        vec3 src(vec2 uv) { return texture2D(tColor, uv).rgb + texture2D(tBloomA, uv).rgb * uBloom.x + texture2D(tBloomB, uv).rgb * uBloom.y; }
        void main() {
          vec2 fromCenter = vUv - 0.5;
          float radial = length(fromCenter);
          vec3 col = src(vUv);
          float caAmt = radial * radial * 0.0022;
          if (caAmt > 0.00015) {
            vec2 caOff = normalize(fromCenter + vec2(0.0001)) * caAmt;
            col.r = mix(col.r, src(vUv + caOff).r, 0.65);
            col.b = mix(col.b, src(vUv - caOff).b, 0.65);
          }
          col *= uGradeTint;
          col.r += uGradeWarmth * 0.08;
          col.b -= uGradeWarmth * 0.06;
          col = acesFilm(col * 1.05);
          col = pow(col, vec3(1.0 / 2.2));
          float vig = 1.0 - dot(fromCenter, fromCenter) * 0.40;
          col *= clamp(vig, 0.72, 1.0);
          // Ordered (Bayer 8x8) dithering: analog banding on gradients & shadow edges
          float b = bayer8(gl_FragCoord.xy + uDitherOfs);
          col = floor(col * uLevels + b) / uLevels;
          gl_FragColor = vec4(col, 1.0);
        }
      `, {
        tColor: { value: PT.dof.texture }, tBloomA: { value: PT.bA.texture }, tBloomB: { value: PT.bB.texture },
        uBloom: { value: new THREE.Vector2(0.3, 0.45) },
        uGradeTint: sharedUniforms.uGradeTint, uGradeWarmth: sharedUniforms.uGradeWarmth,
        uDitherOfs: { value: ditherOfs }, uLevels: { value: 34.0 }
      });

      const _invVP = new THREE.Matrix4();
      function runPostPipeline() {
        const px = atmoMat.uniforms.uPx.value.set(1 / rtSize.w, 1 / rtSize.h);
        const vh = camera.top - camera.bottom;
        const worldPx = vh / rtSize.h;
        const zoomK = vh / (2 * 42.5 * Math.tan(CAM_FOV_EQUIV / 2)); // 1.0 at the default zoom
        const night = sharedUniforms.uNightFactor.value;

        // 1. atmo
        let u = atmoMat.uniforms;
        _invVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
        u.uInvVP.value.copy(_invVP);
        camera.getWorldDirection(u.uCamDir.value);
        u.uAO.value.set(POST.ao && !POST.lite ? 1.5 : 0.0, 0.38 / worldPx, 0.38);
        u.uWind.value.set(sharedUniforms.uTime.value * 0.05, sharedUniforms.uTime.value * 0.021);
        u.uMist.value.set(0.0, 0.28, THREE.MathUtils.lerp(0.055, 0.2, night), 1.0);
        u.uMistAmb.value.set(sharedUniforms.uFogColor.value.r, sharedUniforms.uFogColor.value.g, sharedUniforms.uFogColor.value.b)
          .multiplyScalar(THREE.MathUtils.lerp(0.95, 0.4, night));
        let k = 0;
        for (const pl of pointLightPool) {
          if (k >= NL) break;
          if (!pl.userData.active || pl.intensity <= 0) continue;
          pl.getWorldPosition(mistLightPos[k]);
          mistLightCol[k].set(pl.color.r, pl.color.g, pl.color.b).multiplyScalar(pl.intensity * 0.09);
          k++;
        }
        for (; k < NL; k++) mistLightCol[k].set(0, 0, 0);
        fsPass(atmoMat, PT.atmo);

        // 2. dof
        let colorSrc = PT.atmo;
        if (POST.dof) {
          u = dofMat.uniforms;
          u.uPx.value.copy(px);
          const zr = camera.far - camera.near;
          const focus = (CAM_BACK - camera.near) / zr;
          const maxR = Math.max(2, Math.min(rtSize.h, rtSize.w * 1.6) * 0.0125) * (POST.lite ? 0.5 : 1);
          u.uDof.value.set(focus, 2.2 * zoomK / zr, 7.5 * zoomK / zr, maxR);
          u.uNear.value.set(3.0 * zoomK / zr, 6.0 * zoomK / zr, 0.6);
          fsPass(dofMat, PT.dof);
          colorSrc = PT.dof;
        }
        compMat.uniforms.tColor.value = colorSrc.texture;

        // 3. bloom
        if (POST.bloom) {
          u = brightMat.uniforms;
          u.tColor.value = colorSrc.texture; u.uPx.value.copy(px);
          u.uThr.value.set(THREE.MathUtils.lerp(1.9, 0.85, night), THREE.MathUtils.lerp(1.2, 0.9, night));
          fsPass(brightMat, PT.bA);
          u = blurMat.uniforms;
          u.tColor.value = PT.bA.texture;  u.uDir.value.set(1 / PT.bA.width, 0);  fsPass(blurMat, PT.bA2);
          u.tColor.value = PT.bA2.texture; u.uDir.value.set(0, 1 / PT.bA.height); fsPass(blurMat, PT.bA);
          u.tColor.value = PT.bA.texture;  u.uDir.value.set(1 / PT.bB.width, 0);  fsPass(blurMat, PT.bB2);
          u.tColor.value = PT.bB2.texture; u.uDir.value.set(0, 1 / PT.bB.height); fsPass(blurMat, PT.bB);
          u.tColor.value = PT.bB.texture;  u.uDir.value.set(1.6 / PT.bB.width, 0);  fsPass(blurMat, PT.bB2);
          u.tColor.value = PT.bB2.texture; u.uDir.value.set(0, 1.6 / PT.bB.height); fsPass(blurMat, PT.bB);
          compMat.uniforms.uBloom.value.set(THREE.MathUtils.lerp(0.22, 0.38, night), THREE.MathUtils.lerp(0.3, 0.55, night));
        } else {
          compMat.uniforms.uBloom.value.set(0, 0);
        }

        // 4. comp -> postTarget
        fsPass(compMat, postTarget);
      }

      // Final pass: sharp upscale (crisp texels, anti-aliased texel edges only) + sub-pixel camera offset + film grain
      const upScene = new THREE.Scene();
      const upMat = new THREE.ShaderMaterial({
        uniforms: {
          tColor: { value: postTarget.texture },
          uTex: { value: new THREE.Vector2(rtSize.w, rtSize.h) },
          uOut: { value: new THREE.Vector2(1, 1) },
          uSub: { value: camSub },
          uGrain: { value: 0.028 },
          uSeed: { value: 0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
        `,
        fragmentShader: `
          uniform sampler2D tColor;
          uniform vec2 uTex, uOut, uSub;
          uniform float uGrain, uSeed;
          varying vec2 vUv;
          float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
          void main() {
            vec2 texel = vUv * uTex + uSub;
            vec2 scale = max(uOut / uTex, vec2(1.0));
            vec2 tf = floor(texel), f = texel - tf;
            vec2 region = 0.5 - 0.5 / scale, cen = f - 0.5;
            vec2 off = (cen - clamp(cen, -region, region)) * scale + 0.5;
            vec3 c = texture2D(tColor, (tf + off) / uTex).rgb;
            float g = hash12(gl_FragCoord.xy + uSeed) - 0.5;
            c += g * uGrain * (0.35 + 0.65 * (1.0 - dot(c, vec3(0.333))));
            gl_FragColor = vec4(c, 1.0);
          }
        `,
        depthTest: false,
        depthWrite: false
      });
      upScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), upMat));
      function syncUpscaleSize() {
        const sz = renderer.getDrawingBufferSize(new THREE.Vector2());
        upMat.uniforms.uOut.value.copy(sz);
        upMat.uniforms.uTex.value.set(rtSize.w, rtSize.h);
      }
      syncUpscaleSize();

      // Resize every resolution-dependent piece (window resize or adaptive quality change)
      function applyResolution() {
        rtSize = getRTSize();
        // depth textures are not resized by setSize: replace it
        renderTarget.depthTexture.dispose();
        renderTarget.depthTexture = new THREE.DepthTexture(rtSize.w, rtSize.h, THREE.UnsignedIntType);
        renderTarget.setSize(rtSize.w, rtSize.h);
        atmoMat.uniforms.tDepth.value = renderTarget.depthTexture;
        dofMat.uniforms.tDepth.value = renderTarget.depthTexture;
        postTarget.setSize(rtSize.w, rtSize.h);
        sizePostTargets();
        syncUpscaleSize();
        updatePointScale();
        updateCameraTransform();
      }

      // Optional frame-rate readout: #fps=1
      const fpsEl = HASH.fps === '1' ? Object.assign(document.createElement('div'), {
        style: 'position:fixed;left:8px;bottom:8px;z-index:99;font:11px monospace;color:#fff;background:rgba(0,0,0,.55);padding:3px 6px;border-radius:4px;pointer-events:none'
      }) : null;
      if (fpsEl) {
        document.body.appendChild(fpsEl);
        window.addEventListener('error', (ev) => { document.body.dataset.bench = (document.body.dataset.bench || '') + '[error] ' + ev.message + ' @' + ev.lineno + ' '; });
      }
      // Adaptive resolution: drop internal resolution when frames run long, recover when there's headroom
      const perf = { acc: 0, frames: 0, slow: 0, fast: 0, hold: 0, back: 12 };
      function trackPerformance(rawDt) {
        if (document.hidden || rawDt > 0.25) { perf.acc = 0; perf.frames = 0; return; }
        perf.acc += rawDt; perf.frames++;
        if (perf.acc < 2) return;
        const ms = perf.acc / perf.frames * 1000;
        if (fpsEl) {
          fpsEl.textContent = (1000 / ms).toFixed(0) + ' fps  ' + ms.toFixed(1) + 'ms  ' + rtSize.w + 'x' + rtSize.h + '  q' + LOWRES.quality.toFixed(2) + (POST.lite ? ' lite' : '')
            + '  calls ' + renderer.info.render.calls + '  tris ' + (renderer.info.render.triangles / 1000).toFixed(0) + 'k';
          console.log('[mori-perf] ' + fpsEl.textContent);
        }
        if (ms > 22.5) { perf.slow++; perf.fast = 0; } else { perf.slow = 0; perf.fast = ms < 18.6 ? perf.fast + 1 : 0; }
        perf.hold -= perf.acc;
        if (LOWRES.enabled && LOWRES.adaptive) {
          if (perf.slow >= 3 && LOWRES.quality <= 0.55 && !POST.lite) {
            POST.lite = true; perf.slow = 0; // drop AO, halve DoF radius
          } else if (perf.slow >= 2 && LOWRES.quality > 0.55) {
            LOWRES.quality = Math.max(0.55, LOWRES.quality - 0.15); applyResolution();
            perf.slow = 0; perf.hold = perf.back; perf.back = Math.min(480, perf.back * 2);
          } else if (perf.fast >= 3 && LOWRES.quality < 1 && perf.hold <= 0) {
            LOWRES.quality = Math.min(1, LOWRES.quality + 0.15); applyResolution(); perf.fast = 0;
          }
        }
        perf.acc = 0; perf.frames = 0;
      }

      /* =======================================================================
         10. ISLAND, AUTO-TILING PATH/FENCE, SPRITE STACKS & CONTACT SHADOWS
         ======================================================================= */
      const { chunkTopSurface, chunkSubsoil, chunkBedrock, pondMist, mistMat, gridMat, waterMesh, waterMat, fallMesh, fallMat, fallFeet, fallLines, sprayPoints, lilyParts, rebuildSurface: rebuildTerrainSurface, repaintSurface: repaintTerrainSurface } = buildMiniatureIsland(scene);

      // Height-Proportional Contact Shadow InstancedMesh (shifts & fades as layers float!)
      const csCanvas = document.createElement('canvas');
      csCanvas.width = 32; csCanvas.height = 32;
      const csCtx = csCanvas.getContext('2d');
      const csGrad = csCtx.createRadialGradient(16, 16, 2, 16, 16, 16);
      csGrad.addColorStop(0, 'rgba(10, 16, 10, 0.48)');
      csGrad.addColorStop(0.65, 'rgba(10, 16, 10, 0.16)');
      csGrad.addColorStop(1, 'rgba(10, 16, 10, 0.0)');
      csCtx.fillStyle = csGrad; csCtx.fillRect(0, 0, 32, 32);

      const csGeo = new THREE.PlaneGeometry(1.0, 1.0);
      csGeo.rotateX(-Math.PI / 2);
      const csMat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(csCanvas),
        transparent: true,
        opacity: 1.0,
        depthWrite: false
      });
      const contactShadowInst = new THREE.InstancedMesh(csGeo, csMat, 260);
      contactShadowInst.count = 0;
      chunkTopSurface.add(contactShadowInst);
      let contactShadowBaseList = []; // { x, y, z, r, liftWeight }

      // Auto-tiling cobbled path (Cinderwatch road technique: L_COBBLE detail texture in world UVs, so
      // stones run on across tiles). One mesh, rebuilt with the layout in rebuildInstances.
      const pathMesh = new THREE.Mesh(new THREE.BufferGeometry(), makeTerrainMaterial());
      pathMesh.receiveShadow = true;
      pathMesh.count = 0; // tiles in the mesh (the visibility code reads it like an InstancedMesh count)
      chunkTopSurface.add(pathMesh);
      const PATH_STONE = C('#bfae92'), PATH_DIRT = C('#8a6846'), PATH_PEBBLE = C('#a59c90');
      // tiles: { gx, gz, wx, wy, wz, conns: [[dx, dz], ...] }
      function buildPathGeometry(tiles) {
        const S = new Soup(), K = 16, RIM = 0.08;
        soupRng = makeRng(404);
        for (const t of tiles) {
          const y = t.wy + 0.045, yl = t.wy + 0.004, c = [t.wx, y, t.wz];
          const R = []; for (let k = 0; k < K; k++) R.push(0.38 + 0.07 * (h2(t.gx * 31 + k, t.gz, 401) - 0.5));
          const P = (k, extra, yy) => { const a = (k / K) * TAU, r = R[k % K] + extra; return [t.wx + Math.cos(a) * r, yy, t.wz + Math.sin(a) * r]; };
          for (let k = 0; k < K; k++) {
            const a = P(k, 0, y), b = P(k + 1, 0, y);
            S.tri(c, b, a, PATH_STONE, L_COBBLE, 0.62, { uvs: 1.0 });
            S.quad(a, b, P(k + 1, RIM, yl), P(k, RIM, yl), PATH_DIRT, L_DIRT, 0.95, { uvs: 0.55 });
          }
          for (const [dx, dz] of t.conns) { // arm to the tile edge, with sloped dirt kerbs on both sides
            const px = -dz, pz = dx, hw = 0.3, L = 0.53;
            const at = (s, f, yy) => [t.wx + px * s + dx * f, yy, t.wz + pz * s + dz * f];
            S.quad(at(hw, 0, y), at(hw, L, y), at(-hw, L, y), at(-hw, 0, y), PATH_STONE, L_COBBLE, 0.62, { uvs: 1.0 });
            S.quad(at(hw, L, y), at(hw, 0, y), at(hw + RIM, 0, yl), at(hw + RIM, L, yl), PATH_DIRT, L_DIRT, 0.95, { uvs: 0.55 });
            S.quad(at(-hw, 0, y), at(-hw, L, y), at(-hw - RIM, L, yl), at(-hw - RIM, 0, yl), PATH_DIRT, L_DIRT, 0.95, { uvs: 0.55 });
          }
          for (let k = 0; k < 3; k++) { // loose pebbles kicked to the side
            const a = h2(t.gx, t.gz * 7 + k, 405) * TAU, r = 0.44 + 0.06 * h2(t.gx, t.gz, 406 + k);
            const px = t.wx + Math.cos(a) * r, pz = t.wz + Math.sin(a) * r;
            if (t.conns.some(([dx, dz]) => Math.cos(a) * dx + Math.sin(a) * dz > 0.7)) continue; // not on an arm
            S.rock(0.03 + 0.03 * h2(t.gx, t.gz, 409 + k), px, t.wy + 0.02, pz, PATH_PEBBLE, { d: 0, rough: 0.7 });
          }
        }
        return S.build({ groups: 1, ao: null });
      }

      // Auto-Tiling Wooden Fence Posts & Connecting Rails (InstancedMesh, lifts with Ground Props Tier)
      const fenceGroup = new THREE.Group();
      scene.add(fenceGroup);
      const fencePostGeo = createBeveledBoxGeometry(0.11, 0.36, 0.11, 0.015);
      const fenceWoodMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#9c683d', roughness: 0.82 }));
      const fencePostInst = new THREE.InstancedMesh(fencePostGeo, fenceWoodMat, 144);
      fencePostInst.castShadow = true;
      fencePostInst.receiveShadow = true;
      fenceGroup.add(fencePostInst);

      const fenceRailGeo = createBeveledBoxGeometry(0.055, 0.055, 0.56, 0.01);
      const fenceRailMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#b57b4a', roughness: 0.80 }));
      const fenceRailInst = new THREE.InstancedMesh(fenceRailGeo, fenceRailMat, 360);
      fenceRailInst.castShadow = true;
      fenceRailInst.receiveShadow = true;
      fenceGroup.add(fenceRailInst);

      // Sprite-Stacked Assets, 3D Cabins & Ghosts
      const assetsById = {};
      const instancedById = {};
      const ghostMeshesById = {};
      const MAX_INSTANCES = 180;

      const cabinGroupContainer = new THREE.Group();
      scene.add(cabinGroupContainer);
      let activeCabins = []; // { mesh, baseX, baseY, baseZ, rotY }

      const cabinGhostPrefab = buildStorybookCabinPrefab();
      const cabinGhostMat = new THREE.MeshBasicMaterial({ color: '#98ffb8', transparent: true, opacity: 0.42, depthWrite: false });
      const cabinPrefabMats = new Set();
      cabinGhostPrefab.traverse((child) => {
        if (child.isMesh) {
          cabinPrefabMats.add(child.material);
          child.material = cabinGhostMat; // one shared material -> merges into a single mesh per chunk
          child.castShadow = false;
          child.receiveShadow = false;
        }
      });
      cabinPrefabMats.forEach((m) => m.dispose());
      cabinGhostPrefab.visible = false;
      mergeCabinPrefab(cabinGhostPrefab);
      scene.add(cabinGhostPrefab);

      const pathGhost = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.44, 0.04, 10),
        new THREE.MeshBasicMaterial({ color: '#ffe0a8', transparent: true, opacity: 0.5, depthWrite: false })
      );
      pathGhost.visible = false;
      scene.add(pathGhost);

      const fenceGhost = new THREE.Mesh(
        createBeveledBoxGeometry(0.12, 0.36, 0.12, 0.015),
        new THREE.MeshBasicMaterial({ color: '#ffe0a8', transparent: true, opacity: 0.55, depthWrite: false })
      );
      fenceGhost.visible = false;
      scene.add(fenceGhost);

      ITEM_DEFS.forEach((def) => {
        if (def.type === '3d_cabin') {
          assetsById[def.id] = { def, iconCanvas: buildCustomIcon('cabin') };
          ghostMeshesById[def.id] = cabinGhostPrefab;
          return;
        }
        if (def.type === 'auto_path') {
          assetsById[def.id] = { def, iconCanvas: buildCustomIcon('path') };
          ghostMeshesById[def.id] = pathGhost;
          return;
        }
        if (def.type === 'auto_fence') {
          assetsById[def.id] = { def, iconCanvas: buildCustomIcon('fence') };
          ghostMeshesById[def.id] = fenceGhost;
          return;
        }

        if (def.type === 'soup') {
          const asset = buildSoupAsset(def);
          asset.iconCanvas = renderSoupIcon(renderer, asset.geometry);
          assetsById[def.id] = asset;
          const spawnAttr = new THREE.InstancedBufferAttribute(new Float32Array(MAX_INSTANCES).fill(-100), 1);
          asset.geometry.setAttribute('aSpawn', spawnAttr);
          const instMesh = new THREE.InstancedMesh(asset.geometry, makeSoupMaterial(def), MAX_INSTANCES);
          instMesh.count = 0;
          instMesh.castShadow = true;
          instMesh.receiveShadow = true;
          instMesh.frustumCulled = false;
          instMesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
          instMesh.customDepthMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = sharedUniforms.uTime;
            shader.uniforms.uDropLayers = { value: def.layers };
            shader.uniforms.uDropGroup = { value: dropGroupFor(def.layers) };
            shader.vertexShader = shader.vertexShader
              .replace('#include <common>', '#include <common>\nuniform float uTime;\nattribute float aLayerH;' + DROP_DECL)
              .replace('#include <begin_vertex>', '#include <begin_vertex>' + dropVertexGLSL(false));
          };
          instMesh.userData.spawnAttr = spawnAttr;
          scene.add(instMesh);
          instancedById[def.id] = instMesh;
          const ghostMesh = new THREE.Mesh(asset.geometry, new THREE.MeshBasicMaterial({
            color: '#a8ffbe', transparent: true, opacity: 0.55, depthWrite: false
          }));
          ghostMesh.visible = false;
          scene.add(ghostMesh);
          ghostMeshesById[def.id] = ghostMesh;
          return;
        }

        const asset = buildSpriteStackAsset(def);
        assetsById[def.id] = asset;
        const maxN = def.maxInstances || MAX_INSTANCES;
        if (def.seedScatter) asset.iconCanvas = renderSeedIcon(def);

        const mat = enhanceStandardMaterial(
          new THREE.MeshStandardMaterial({
            map: asset.colorTex,
            emissive: def.glow ? new THREE.Color('#ffffff') : new THREE.Color('#000000'),
            emissiveMap: def.glow ? asset.emTex : null,
            emissiveIntensity: def.glow ? 1.5 : 0.0,
            alphaTest: 0.5,
            vertexColors: true,
            roughness: def.roughness,
            metalness: def.metalness,
            side: THREE.DoubleSide
          }),
          {
            windStrength: def.windStrength,
            useLayerHeight: true,
            emissiveNightBoost: def.glow ? 2.6 : 0.0,
            explodeSliceFactor: def.explodeSliceFactor || 0.4,
            explodeTier: def.explodeTier || 0,
            canopySplit: def.canopySplit || 0.0,
            dropLayers: def.seedScatter ? 0 : def.layers // seed flowers grow instead of dropping
          }
        );

        const spawnAttr = new THREE.InstancedBufferAttribute(new Float32Array(maxN).fill(-100), 1);
        asset.geometry.setAttribute('aSpawn', spawnAttr);
        if (def.seedScatter) {
          const tintAttr = new THREE.InstancedBufferAttribute(new Float32Array(maxN * 3).fill(1), 3);
          asset.geometry.setAttribute('aTint', tintAttr);
          asset.geometry.setAttribute('aGone', new THREE.InstancedBufferAttribute(new Float32Array(maxN).fill(1e9), 1));
          const base = mat.onBeforeCompile;
          mat.onBeforeCompile = (sh, r) => {
            base(sh, r);
            sh.vertexShader = sh.vertexShader
              .replace('#include <common>', '#include <common>\nattribute float aSpawn;\nattribute float aGone;\nattribute vec3 aTint;\nvarying vec3 vTint;')
              .replace('#include <begin_vertex>', `#include <begin_vertex>
              vTint = aTint;
              { // grows out of the ground: rises with a little overshoot, opening wider as it comes up
                float gt = clamp((uTime - aSpawn) / 0.85, 0.0, 1.0);
                if (gt < 1.0) {
                  float e = 1.0 - pow(1.0 - gt, 3.0), b = sin(gt * 3.14159);
                  transformed.y *= e + b * 0.14;
                  transformed.xz *= mix(0.3, 1.0, e) + b * 0.06;
                }
              }
              { // covered or erased: sinks back into the ground (aGone = when it started)
                float st = clamp((uTime - aGone) / ${SEED_SHRINK.toFixed(2)}, 0.0, 1.0);
                if (st > 0.0) {
                  float k = 1.0 - smoothstep(0.0, 1.0, st);
                  transformed.y *= k;
                  transformed.xz *= mix(1.0, k, st);
                }
              }`);
            sh.fragmentShader = sh.fragmentShader
              .replace('#include <common>', '#include <common>\nvarying vec3 vTint;')
              .replace('#include <map_fragment>', `#include <map_fragment>
              { float lo = min(diffuseColor.r, min(diffuseColor.g, diffuseColor.b)); // white petals take the tint
                diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vTint, smoothstep(0.72, 0.9, lo)); }`);
          };
        }

        const instMesh = new THREE.InstancedMesh(asset.geometry, mat, maxN);
        instMesh.count = 0;
        instMesh.castShadow = !def.seedScatter; // tiny flowers: no shadow pass (no extra draw call)
        instMesh.receiveShadow = true;
        instMesh.frustumCulled = false;
        instMesh.customDepthMaterial = new THREE.MeshDepthMaterial({
          depthPacking: THREE.RGBADepthPacking,
          map: asset.colorTex,
          alphaTest: 0.5
        });
        // Shadows follow the drop animation too
        instMesh.customDepthMaterial.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = sharedUniforms.uTime;
          shader.uniforms.uDropLayers = { value: def.layers };
          shader.uniforms.uDropGroup = { value: dropGroupFor(def.layers) };
          shader.vertexShader = shader.vertexShader
            .replace('#include <common>', '#include <common>\nuniform float uTime;\nattribute float aLayerH;' + DROP_DECL)
            .replace('#include <begin_vertex>', '#include <begin_vertex>' + dropVertexGLSL(false));
        };
        instMesh.userData.spawnAttr = spawnAttr;
        if (def.seedScatter) { instMesh.userData.tintAttr = asset.geometry.attributes.aTint; instMesh.userData.goneAttr = asset.geometry.attributes.aGone; instMesh.userData.digestSkip = true; }
        scene.add(instMesh);
        instancedById[def.id] = instMesh;

        const ghostMat = new THREE.MeshBasicMaterial({
          map: asset.colorTex,
          color: '#a8ffbe',
          alphaTest: 0.5,
          transparent: true,
          opacity: 0.55,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        const ghostMesh = new THREE.Mesh(asset.geometry, ghostMat);
        ghostMesh.visible = false;
        if (def.seedScatter) ghostMesh.userData.digestSkip = true; // seeds show a sowing circle, never this
        scene.add(ghostMesh);
        ghostMeshesById[def.id] = ghostMesh;
      });

      // Icons for the items that are not Soup props, rendered from their real 3D parts
      // (same look as in the scene, instead of hand-drawn 2D icons).
      {
        const iconOf = (id, obj) => { if (assetsById[id]) assetsById[id].iconCanvas = renderObjectIcon(renderer, obj); };
        // cabin: the merged prefab itself
        const cabin = buildStorybookCabinPrefab();
        mergeCabinPrefab(cabin);
        iconOf('cabin', cabin);
        disposeObjectTree(cabin);
        // path: a cobbled run across a grass tile (the same geometry the scene builds)
        const grassMat = new THREE.MeshStandardMaterial({ color: '#6fae4e', roughness: 0.95 });
        const path = new THREE.Group();
        const tile = new THREE.Mesh(createBeveledBoxGeometry(1.0, 0.1, 1.3, 0.03), grassMat); tile.position.y = -0.05; path.add(tile);
        const runMat = makeSoupMaterial(null);
        const run = new THREE.Mesh(buildPathGeometry([{ gx: 3, gz: 5, wx: 0, wy: 0, wz: 0, conns: [[0, -1], [0, 1]] }]), runMat);
        path.add(run);
        iconOf('path', path);
        run.geometry.dispose(); runMat.dispose();
        // fence: three posts joined by rails
        const fence = new THREE.Group();
        for (const x of [-0.56, 0, 0.56]) { const p = new THREE.Mesh(fencePostGeo, fenceWoodMat); p.position.set(x, 0.18, 0); fence.add(p); }
        for (const x of [-0.28, 0.28]) for (const y of [0.13, 0.27]) {
          const r = new THREE.Mesh(fenceRailGeo, fenceRailMat); r.position.set(x, y, 0); r.rotation.y = Math.PI / 2; fence.add(r);
        }
        iconOf('fence', fence);
        // campfire: the stacked fire ring plus a little flame (in the scene the flame is a shader billboard)
        const cf = assetsById.campfire;
        if (cf && cf.geometry) { // fire ring model (soup, or the old stack with #stack=1) + a little flame
          const ringMat = cf.colorTex ? new THREE.MeshStandardMaterial({
            map: cf.colorTex, emissive: '#ffffff', emissiveMap: cf.emTex, emissiveIntensity: 1.5,
            alphaTest: 0.5, vertexColors: true, roughness: 0.78, side: THREE.DoubleSide
          }) : makeSoupMaterial(null);
          const fire = new THREE.Group();
          fire.add(new THREE.Mesh(cf.geometry, ringMat));
          const F = new Soup();
          F.cone(0.13, 0.34, 0, 0.3, 0, C('#ff7a26'), { n: 5, emis: 0.55, jit: 0 });
          F.cone(0.08, 0.24, 0.035, 0.27, 0.02, C('#ffd060'), { n: 5, emis: 0.9, jit: 0 });
          F.cone(0.05, 0.16, -0.06, 0.22, -0.03, C('#ffb040'), { n: 4, emis: 0.7, jit: 0, r: [0, 0, 0.3] });
          const flameMat = makeSoupMaterial(null);
          const flame = new THREE.Mesh(F.build({ ao: null }), flameMat);
          fire.add(flame);
          iconOf('campfire', fire);
          ringMat.dispose(); flameMat.dispose(); flame.geometry.dispose();
        }
        grassMat.dispose();
      }

      // --- GHIBLI-STYLE FLUFFY CURVED GRASS TUFT GEOMETRY (InstancedMesh + Upward Normals) ---
      // 4 plump outward-curving blades per clump; root matches ground grass, tips glow warm yellow-green.
      function createGhibliGrassTuftGeometry() {
        const positions = [];
        const normals = [];
        const colors = [];
        const tipWeights = [];
        const indices = [];

        const colRoot = new THREE.Color('#66ab4b'); // Matches island ground grass seamlessly
        const colMid = new THREE.Color('#8cd15a');  // Fresh spring green
        const colTip = new THREE.Color('#dce86b');  // Warm sunlit Ghibli yellow-green
        const tmpCol = new THREE.Color();

        const blades = [
          { ang: 0.15,  h: 0.21, lean: 0.105, wScale: 1.05, rOff: 0.012 },
          { ang: 1.65,  h: 0.17, lean: 0.095, wScale: 0.95, rOff: 0.014 },
          { ang: 3.25,  h: 0.19, lean: 0.110, wScale: 1.00, rOff: 0.012 },
          { ang: 4.78,  h: 0.15, lean: 0.088, wScale: 0.90, rOff: 0.013 }
        ];

        const levels = [
          { t: 0.00, w: 0.048, curve: 0.00 },
          { t: 0.36, w: 0.062, curve: 0.22 }, // Plump miniature body
          { t: 0.72, w: 0.040, curve: 0.64 }  // Soft taper before tip
        ];

        let vIndex = 0;
        for (const b of blades) {
          const dirX = Math.cos(b.ang);
          const dirZ = Math.sin(b.ang);
          const sideX = -dirZ;
          const sideZ = dirX;
          const baseV = vIndex;

          // 3 paired cross-section rings (6 verts)
          for (const lv of levels) {
            const y = lv.t * b.h;
            const out = b.rOff + lv.curve * b.lean;
            const halfW = lv.w * b.wScale * 0.5;
            const cx = dirX * out;
            const cz = dirZ * out;

            if (lv.t < 0.5) tmpCol.copy(colRoot).lerp(colMid, lv.t * 2.0);
            else tmpCol.copy(colMid).lerp(colTip, (lv.t - 0.5) * 2.0);

            const tw = lv.t * lv.t;

            // Left vertex
            positions.push(cx - sideX * halfW, y, cz - sideZ * halfW);
            normals.push(0, 1, 0); // Unified Up normal for soft painterly blending!
            colors.push(tmpCol.r, tmpCol.g, tmpCol.b);
            tipWeights.push(tw);

            // Right vertex
            positions.push(cx + sideX * halfW, y, cz + sideZ * halfW);
            normals.push(0, 1, 0);
            colors.push(tmpCol.r, tmpCol.g, tmpCol.b);
            tipWeights.push(tw);
            vIndex += 2;
          }

          // Softly pointed curving tip vertex
          const tipOut = b.rOff + b.lean * 1.08;
          positions.push(dirX * tipOut, b.h * 0.96, dirZ * tipOut);
          normals.push(0, 1, 0);
          colors.push(colTip.r, colTip.g, colTip.b);
          tipWeights.push(1.0);
          const tipV = vIndex++;

          // Quads between levels + tip triangle
          indices.push(baseV + 0, baseV + 1, baseV + 2, baseV + 1, baseV + 3, baseV + 2);
          indices.push(baseV + 2, baseV + 3, baseV + 4, baseV + 3, baseV + 5, baseV + 4);
          indices.push(baseV + 4, baseV + 5, tipV);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.setAttribute('aTipWeight', new THREE.Float32BufferAttribute(tipWeights, 1));
        geo.setIndex(indices);
        return geo;
      }

      const grassTuftGeo = createGhibliGrassTuftGeometry();
      const grassTuftMat = enhanceStandardMaterial(
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.90,
          metalness: 0.0,
          side: THREE.DoubleSide
        }),
        { windStrength: 0.055, useGrassTip: true }
      );
      const MAX_GRASS_TUFTS = 420;
      const grassClutterInst = new THREE.InstancedMesh(grassTuftGeo, grassTuftMat, MAX_GRASS_TUFTS);
      grassClutterInst.castShadow = false; // Prevents harsh self-shadow noise
      grassClutterInst.receiveShadow = true;
      chunkTopSurface.add(grassClutterInst);

      const pebbleGeo = new THREE.DodecahedronGeometry(0.055, 0);
      const pebbleMat = enhanceStandardMaterial(
        new THREE.MeshStandardMaterial({ color: '#9ea5b0', roughness: 0.34, metalness: 0.08 })
      );
      const pebbleClutterInst = new THREE.InstancedMesh(pebbleGeo, pebbleMat, 110);
      pebbleClutterInst.castShadow = true;
      pebbleClutterInst.receiveShadow = true;
      chunkTopSurface.add(pebbleClutterInst);

      const crateGeo = createBeveledBoxGeometry(0.16, 0.15, 0.16, 0.015);
      const crateMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#b57c47', roughness: 0.78 }));
      const crateClutterInst = new THREE.InstancedMesh(crateGeo, crateMat, 24);
      crateClutterInst.castShadow = true;
      crateClutterInst.receiveShadow = true;
      chunkTopSurface.add(crateClutterInst);

      // Glow Halos
      const glowCanvas = document.createElement('canvas');
      glowCanvas.width = 32; glowCanvas.height = 32;
      const gCtx = glowCanvas.getContext('2d');
      const grad = gCtx.createRadialGradient(16, 16, 1, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255, 232, 168, 0.95)');
      grad.addColorStop(0.35, 'rgba(255, 175, 82, 0.42)');
      grad.addColorStop(1, 'rgba(255, 145, 55, 0.0)');
      gCtx.fillStyle = grad; gCtx.fillRect(0, 0, 32, 32);
      const glowTex = new THREE.CanvasTexture(glowCanvas);

      const glowGroup = new THREE.Group();
      scene.add(glowGroup);
      let activeGlowSprites = [];

      // --- Point light budget: MAX_POINT_LIGHTS pool lights go to the light sources nearest the
      // view center. Lights hand over with a short fade; the pool never changes size, so no
      // shader recompiles (see rules in CLAUDE.md). ---
      let lightSources = [];
      let lightPickTimer = 0;
      function pickPointLights(instant) {
        const n = lightSources.length;
        if (n <= MAX_POINT_LIGHTS) lightSources.forEach((s) => { s.want = true; });

          const d = (s) => (s.x - camPan.x) * (s.x - camPan.x) + (s.z - camPan.y) * (s.z - camPan.y);
          const sorted = lightSources.slice().sort((a, b) => d(a) - d(b));

            float smLump(vec3 d) {

      // --- CAMPFIRE FLAMES (noise-driven billboard shader) & RISING EMBERS ---
      let campfireSpots = []; // filled by rebuildInstances: { x, y, z, seed }

        vertexShader: `
          attribute float aSeed;
          uniform vec2 uSize;
          varying vec2 vUv; varying float vSeed;
          void main() {
            vUv = uv; vSeed = aSeed;
            vec4 mv = viewMatrix * modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);

        fragmentShader: `
          uniform float uTime; uniform float uNightFactor;

      const EMBER_COUNT = 64;

      function updateCampfireFx(dt, t, lift) {

        let n = 0;
