          emberLife[i] = 1.0;
        }
        let any = false;
        for (let i = 0; i < EMBER_COUNT; i++) {
          if (emberLife[i] <= 0) continue;
          any = true;
          emberLife[i] -= dt * 0.75;
          const s = emberSeed[i];
          emberPos[i * 3] += (emberVel[i * 3] + Math.sin(t * 3.1 + s) * 0.18) * dt;
          emberPos[i * 3 + 1] += emberVel[i * 3 + 1] * dt;
          emberPos[i * 3 + 2] += (emberVel[i * 3 + 2] + Math.cos(t * 2.7 + s) * 0.18) * dt;
          emberVel[i * 3 + 1] *= 1 - dt * 0.6;
        }
        if (any || emberWasActive) {
          emberGeo.attributes.position.needsUpdate = true;
          emberGeo.attributes.aLife.needsUpdate = true;
        }
        emberWasActive = any;
      }

      function updateDust(dt) {
        let any = false;
        for (let i = 0; i < DUST_COUNT; i++) {
          if (dustLife[i] <= 0) continue;
          any = true;
          dustLife[i] -= dt * 2.6;
          dustVel[i * 3] *= 0.9; dustVel[i * 3 + 2] *= 0.9;
          dustVel[i * 3 + 1] -= dt * 3.0;
          dustPos[i * 3] += dustVel[i * 3] * dt;
          dustPos[i * 3 + 1] += Math.max(dustVel[i * 3 + 1], -0.2) * dt;
          dustPos[i * 3 + 2] += dustVel[i * 3 + 2] * dt;
        }
        if (any || dustGeo.userData.wasActive) {
          dustGeo.attributes.position.needsUpdate = true;
          dustGeo.attributes.aLife.needsUpdate = true;
        }
        dustGeo.userData.wasActive = any;
      }

      let shakeStart = -10, shakeAmp = 0;
      const pendingFx = [];
      function scheduleFx(delay, fn) { pendingFx.push({ t: performance.now() * 0.001 + delay, fn }); }
      function runPendingFx(nowSec) {
        for (let i = pendingFx.length - 1; i >= 0; i--) {
          if (nowSec >= pendingFx[i].t) { const f = pendingFx[i].fn; pendingFx.splice(i, 1); f(); }
        }
      }

      const _panV = new THREE.Vector3();
      function screenPan(x, y, z) { _panV.set(x, y, z).project(camera); return THREE.MathUtils.clamp(_panV.x, -1, 1) * 0.7; }

      function triggerPlaceJuice(def, x, y, z) {
        let total, groups;
        if (isInstancedDef(def)) {
          total = dropTotalTime(def.layers);
          groups = Math.floor((def.layers - 1) / dropGroupFor(def.layers)) + 1;
        } else if (def.type === '3d_cabin') {
          total = cabinDropTotal(); groups = 16;
        } else {
          total = 0.05; groups = 1; // path / fence: single snap
        }
        const footprint = def.type === '3d_cabin' ? 0.7 : (def.freePlace ? 0.18 : 0.32);
        // first layer lands -> pixel dust
        scheduleFx(DROP_FALL, () => burstDust(x, y, z, def.type === '3d_cabin' ? 20 : 12, footprint));
        // top lands -> micro shake
        scheduleFx(total, () => { shakeStart = performance.now() * 0.001; shakeAmp = def.type === '3d_cabin' ? 0.07 : (def.freePlace ? 0.02 : 0.045); });
        // clicks: ~6 evenly spread landings
        const clicks = Math.max(1, Math.min(6, groups));
        const times = [];
        for (let i = 0; i < clicks; i++) {
          times.push(DROP_FALL + (clicks > 1 ? i / (clicks - 1) : 0) * Math.max(0, total - DROP_FALL));
        }
        audio.playStackClicks(times, screenPan(x, y, z));
      }

      /* ---- COLLISION VALIDATION (PREVENTS UNREALISTIC CLIPPING / OVERLAP) ---- */
      const PROP_SELF_RADIUS = {
        rocks: 0.28,
        flowers: 0.12,
        reeds: 0.11,
        mushrooms: 0.10
      };

      function isInsideCabinFootprint(wx, wz, pad = 0.0) {
        for (const entry of placedItems.values()) {
          if (entry.id !== 'cabin') continue;
          const cx = entry.gx - HALF_GRID + 0.5;
          const cz = entry.gz - HALF_GRID + 0.5;
          const rotated = entry.rotation % 2 === 1;
          const hx = (rotated ? 0.48 : 0.52) + pad;
          const hz = (rotated ? 0.52 : 0.48) + pad;
          if (Math.abs(wx - cx) < hx && Math.abs(wz - cz) < hz) return true;
        }
        return false;
      }

      /* ---- SNAP PLACEMENT: quarter-tile props that sit right up against walls and each other ----
         Each snap prop has a ground footprint rectangle (def.footprint, local [x0, x1, z0, z1]);
         rotations are quarter turns, so the world footprint stays an axis-aligned rectangle. */
      const SNAP_STEP = 0.25, SNAP_GAP = 0.012, SNAP_PULL = 0.16;
      const footprintRect = (def, wx, wz, rot) => localRect(def.footprint || [-0.3, 0.3, -0.3, 0.3], wx, wz, rot);
      function localRect(f, wx, wz, rot) {
        const th = rot * Math.PI / 2;
        const c = Math.round(Math.cos(th)), s = Math.round(Math.sin(th));
        let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
        for (const lx of [f[0], f[1]]) for (const lz of [f[2], f[3]]) { // same turn as the instance matrix (rotation.y)
          const x = lx * c + lz * s, z = -lx * s + lz * c;
          x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z);
        }
        return { x0: wx + x0, x1: wx + x1, z0: wz + z0, z1: wz + z1 };
      }
      const rectsOverlap = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.z0 < b.z1 && a.z1 > b.z0;
      const rectHitsCircle = (r, cx, cz, rad) => Math.hypot(Math.max(r.x0 - cx, 0, cx - r.x1), Math.max(r.z0 - cz, 0, cz - r.z1)) < rad;
      function cabinRects() {
        const out = [];
        for (const e of placedItems.values()) {
          if (e.id !== 'cabin') continue;
          const cx = e.gx - HALF_GRID + 0.5, cz = e.gz - HALF_GRID + 0.5, rot = e.rotation % 2 === 1;
          const hx = rot ? 0.48 : 0.52, hz = rot ? 0.52 : 0.48;
          out.push({ x0: cx - hx, x1: cx + hx, z0: cz - hz, z1: cz + hz });
        }
        return out;
      }
      function gridSolidR(id) {
        if (id === 'pine' || id === 'oak') return 0.24;
        if (id === 'fence') return 0.16;
        return assetsById[id]?.def.solidRadius || 0.24;
      }
      // fence rails as thin rectangles between neighbouring posts
      function fenceRailRects() {
        const out = [];
        for (const e of placedItems.values()) {
          if (e.id !== 'fence') continue;
          const cx = e.gx - HALF_GRID + 0.5, cz = e.gz - HALF_GRID + 0.5;
          if (placedItems.get(`${e.gx + 1},${e.gz}`)?.id === 'fence') out.push({ x0: cx, x1: cx + 1, z0: cz - 0.05, z1: cz + 0.05 });
          if (placedItems.get(`${e.gx},${e.gz + 1}`)?.id === 'fence') out.push({ x0: cx - 0.05, x1: cx + 0.05, z0: cz, z1: cz + 1 });
        }
        return out;
      }
      // can a snap prop with world footprint `r` stand here? (skipIdx: a snapProps entry to ignore)
      const rectSamples = (r) => { const out = []; for (const fx of [0, 0.5, 1]) for (const fz of [0, 0.5, 1]) out.push([r.x0 + (r.x1 - r.x0) * fx, r.z0 + (r.z1 - r.z0) * fz]); return out; };
      // shore props (def.shore = { land, water } local rects): the land end on flat dry ground, the water end over the pond
      function shoreOk(land, water) {
        const h0 = getContinuousTerrainHeight((land.x0 + land.x1) / 2, (land.z0 + land.z1) / 2);
        for (const [x, z] of rectSamples(land)) if (getPondSDF(x, z) < 0.3 || Math.abs(getContinuousTerrainHeight(x, z) - h0) > 0.03) return false;
        for (const [x, z] of rectSamples(water)) if (getPondSDF(x, z) > -0.02) return false;
        return true;
      }
      function snapRectBlocked(r, skipIdx = -1, shore = null) {
        const lim = HALF_GRID - 0.04;
        if (r.x0 < -lim || r.x1 > lim || r.z0 < -lim || r.z1 > lim) return true;
        if (shore) {
          if (!shoreOk(shore.land, shore.water)) return true;
        } else {
          // flat, dry ground under the whole footprint (no terrace edge, no pond basin)
          const cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2, h0 = getContinuousTerrainHeight(cx, cz);
          for (const [px, pz] of rectSamples(r)) {
            if (isPondWorld(px, pz, 0.04) || Math.abs(getContinuousTerrainHeight(px, pz) - h0) > 0.04) return true;
          }
        }
        for (const c of cabinRects()) if (rectsOverlap(r, c)) return true;
        for (const e of placedItems.values()) {
          if (e.id === 'cabin') continue;
          const ex = e.gx - HALF_GRID + 0.5, ez = e.gz - HALF_GRID + 0.5;
          if (e.id === 'path') { // may brush the path's edge, not stand on it
            if (rectsOverlap(r, { x0: ex - 0.3, x1: ex + 0.3, z0: ez - 0.3, z1: ez + 0.3 })) return true;
          } else if (rectHitsCircle(r, ex, ez, gridSolidR(e.id))) return true;
        }
        for (const rail of fenceRailRects()) if (rectsOverlap(r, rail)) return true;
        for (const fp of freeProps) {
          const solid = fp.id === 'rocks' ? 0.3 : assetsById[fp.id]?.def.solidRadius;
          if (rectHitsCircle(r, fp.wx, fp.wz, solid ? solid * (fp.scale || 1) : 0.05)) return true;
        }
        for (let i = 0; i < snapProps.length; i++) {
          if (i === skipIdx) continue;
          const o = snapProps[i];
          if (rectsOverlap(r, footprintRect(assetsById[o.id].def, o.wx, o.wz, o.rotation))) return true;
        }
        return false;
      }
      // where a snap prop would go for this cursor hit: quarter-tile grid, but pulled flush against
      // a nearby cabin wall or another snap prop when an edge is within SNAP_PULL
      // ground height a snap prop stands at (a shore prop: its land end)
      function snapGroundY(def, wx, wz, rot) {
        if (!def.shore) return getContinuousTerrainHeight(wx, wz);
        const l = localRect(def.shore.land, wx, wz, rot);
        return getContinuousTerrainHeight((l.x0 + l.x1) / 2, (l.z0 + l.z1) / 2);
      }
      // shore props look around the cursor (a quarter tile each way) and try every heading, the
      // current one first, so a dock dropped at the water's edge turns to face the water by itself
      function shorePlacement(def, hit) {
        const gx = Math.round(hit.wx / SNAP_STEP) * SNAP_STEP, gz = Math.round(hit.wz / SNAP_STEP) * SNAP_STEP;
        const cands = [];
        [0, 1, 3, 2].forEach((k, ri) => {
          const rot = (currentRotation + k) % 4;
          for (const dx of [0, -SNAP_STEP, SNAP_STEP]) for (const dz of [0, -SNAP_STEP, SNAP_STEP]) {
            const x = gx + dx, z = gz + dz;
            cands.push({ x, z, rot, cost: Math.hypot(x - hit.wx, z - hit.wz) + ri * 0.12 });
          }
        });
        cands.sort((a, b) => a.cost - b.cost);
        for (const c of cands) {
          const rect = footprintRect(def, c.x, c.z, c.rot);
          const shore = { land: localRect(def.shore.land, c.x, c.z, c.rot), water: localRect(def.shore.water, c.x, c.z, c.rot) };
          if (!snapRectBlocked(rect, -1, shore)) return { wx: c.x, wz: c.z, wy: snapGroundY(def, c.x, c.z, c.rot), rect, valid: true, rot: c.rot };
        }
        return { wx: gx, wz: gz, wy: getContinuousTerrainHeight(gx, gz), rect: footprintRect(def, gx, gz, currentRotation), valid: false, rot: currentRotation };
      }
      function snapPlacement(def, hit, rot = currentRotation) {
        if (def.shore) return shorePlacement(def, hit);
        const f0 = footprintRect(def, 0, 0, rot);
        const gridX = Math.round(hit.wx / SNAP_STEP) * SNAP_STEP, gridZ = Math.round(hit.wz / SNAP_STEP) * SNAP_STEP;
        const walls = cabinRects();
        snapProps.forEach((o) => walls.push(footprintRect(assetsById[o.id].def, o.wx, o.wz, o.rotation)));
        const pull = (raw, grid, lo, hi, otherLo, otherHi, axis) => { // axis 0: x, 1: z
          let best = grid, bd = SNAP_PULL;
          for (const w of walls) {
            const [wlo, whi, olo, ohi] = axis === 0 ? [w.x0, w.x1, w.z0, w.z1] : [w.z0, w.z1, w.x0, w.x1];
            if (otherHi <= olo || otherLo >= ohi) continue; // not side by side along this axis
            for (const cand of [whi + SNAP_GAP - lo, wlo - SNAP_GAP - hi]) {
              const d = Math.abs(cand - raw);
              if (d < bd) { bd = d; best = cand; }
            }
          }
          return best;
        };
        const tries = [];
        const px = pull(hit.wx, gridX, f0.x0, f0.x1, gridZ + f0.z0, gridZ + f0.z1, 0);
        const pz = pull(hit.wz, gridZ, f0.z0, f0.z1, px + f0.x0, px + f0.x1, 1);
        tries.push([px, pz], [px, gridZ], [gridX, pz], [gridX, gridZ]);
        for (const [x, z] of tries) {
          const rect = footprintRect(def, x, z, rot);
          if (!snapRectBlocked(rect)) return { wx: x, wz: z, wy: getContinuousTerrainHeight(x, z), rect, valid: true, rot };
        }
        const rect = footprintRect(def, gridX, gridZ, rot);
        return { wx: gridX, wz: gridZ, wy: getContinuousTerrainHeight(gridX, gridZ), rect, valid: false, rot };
      }
      function snapPropAt(wx, wz) { // the snap prop whose footprint holds this point (smallest wins)
        let best = -1, area = 1e9;
        snapProps.forEach((o, i) => {
          const r = footprintRect(assetsById[o.id].def, o.wx, o.wz, o.rotation), a = (r.x1 - r.x0) * (r.z1 - r.z0);
          if (wx > r.x0 - 0.04 && wx < r.x1 + 0.04 && wz > r.z0 - 0.04 && wz < r.z1 + 0.04 && a < area) { area = a; best = i; }
        });
        return best;
      }

      function isBlockedForPoint(wx, wz, selfRadius = 0.10, checkSmallFreeProps = true) {
        // 1. Water / Pond exclusion
        if (isPondWorld(wx, wz, 0.06 + selfRadius * 0.3)) return true;

        // 1b. Snap props stand on their whole footprint
        for (const o of snapProps) {
          if (rectHitsCircle(footprintRect(assetsById[o.id].def, o.wx, o.wz, o.rotation), wx, wz, selfRadius)) return true;
        }

        // 2. Cabin interior floor & walls bounding box
        if (isInsideCabinFootprint(wx, wz, selfRadius)) return true;

        // 3. Solid grid-placed objects (campfire flames, tree trunks, benches, lanterns, fence posts)
        for (const entry of placedItems.values()) {
          if (entry.id === 'cabin' || entry.id === 'path') continue;
          const ex = entry.gx - HALF_GRID + 0.5;
          const ez = entry.gz - HALF_GRID + 0.5;
          let solidR = 0.24;
          if (entry.id === 'campfire') solidR = 0.42;
          else if (entry.id === 'bench') solidR = 0.34;
          else if (entry.id === 'pine' || entry.id === 'oak') solidR = 0.24;
          else if (entry.id === 'lantern') solidR = 0.18;
          else if (entry.id === 'fence') solidR = 0.16;
          else if (assetsById[entry.id]?.def.solidRadius) solidR = assetsById[entry.id].def.solidRadius;
          if (Math.hypot(wx - ex, wz - ez) < solidR + selfRadius) return true;
        }

        // 4. Solid free-placed rocks & closely overlapping small props
        for (const fp of freeProps) {
          const dist = Math.hypot(wx - fp.wx, wz - fp.wz);
          const solidFree = fp.id === 'rocks' ? 0.34 : assetsById[fp.id]?.def.solidRadius;
          if (solidFree) {
            if (dist < solidFree * (fp.scale || 1.0) + selfRadius) return true;
          } else if (checkSmallFreeProps) {
            if (dist < 0.16 + selfRadius * 0.5) return true;
          }
        }
        return false;
      }

      function canPlaceAtHit(toolId, hit) {
        if (!hit || toolId === 'delete') return true;
        const def = assetsById[toolId]?.def;
        if (!def) return false;

        if (def.snapPlace) return snapPlacement(def, hit).valid;
        if (def.freePlace) {
          const r = PROP_SELF_RADIUS[toolId] || 0.12;
          return !isBlockedForPoint(hit.wx, hit.wz, r, true);
        } else {
          // Grid-snapped object: block pond tiles and already-occupied tiles
          if (isPondTile(hit.gx, hit.gz)) return false;
          const key = `${hit.gx},${hit.gz}`;
          if (placedItems.has(key)) return false;
          // a cabin is wider than a tile's flat middle: its four neighbours must sit at the same step
          if (def.type === '3d_cabin') {
            const lv = getHillLevel(hit.gx, hit.gz);
            for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              const nx = hit.gx + dx, nz = hit.gz + dz;
              if (nx >= 0 && nx < GRID_SIZE && nz >= 0 && nz < GRID_SIZE && getHillLevel(nx, nz) !== lv) return false;
            }
          }

          // Prevent placing a cabin or campfire directly over existing solid rocks
          const wx = hit.gx - HALF_GRID + 0.5;
          const wz = hit.gz - HALF_GRID + 0.5;
          // ...or over a snap prop's footprint
          for (const o of snapProps) {
            const r = footprintRect(assetsById[o.id].def, o.wx, o.wz, o.rotation);
            if (def.type === '3d_cabin') {
              const rot = currentRotation % 2 === 1, hx = rot ? 0.48 : 0.52, hz = rot ? 0.52 : 0.48;
              if (rectsOverlap(r, { x0: wx - hx, x1: wx + hx, z0: wz - hz, z1: wz + hz })) return false;
            } else if (def.type === 'auto_path') {
              if (rectsOverlap(r, { x0: wx - 0.3, x1: wx + 0.3, z0: wz - 0.3, z1: wz + 0.3 })) return false;
            } else if (def.type === 'auto_fence') {
              if (rectHitsCircle(r, wx, wz, 0.16)) return false;
              for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { // rails it would grow toward fence neighbours
                if (placedItems.get(`${hit.gx + dx},${hit.gz + dz}`)?.id !== 'fence') continue;
                const rail = dx ? { x0: Math.min(wx, wx + dx), x1: Math.max(wx, wx + dx), z0: wz - 0.05, z1: wz + 0.05 }
                  : { x0: wx - 0.05, x1: wx + 0.05, z0: Math.min(wz, wz + dz), z1: Math.max(wz, wz + dz) };
                if (rectsOverlap(r, rail)) return false;
              }
            } else if (rectHitsCircle(r, wx, wz, gridSolidR(def.id))) return false;
          }
          const checkR = def.id === 'cabin' ? 0.46 : (def.id === 'campfire' ? 0.38 : 0.22);
          for (const fp of freeProps) {
            if (fp.id === 'rocks' && Math.hypot(wx - fp.wx, wz - fp.wz) < checkR + 0.26 * (fp.scale || 1.0)) {
              return false;
            }
          }
          return true;
        }
      }

      function setGhostValidityColor(ghost, isValid) {
        if (!ghost) return;
        const colHex = isValid ? '#a8ffbe' : '#ff5252';
        if (ghost.isMesh && ghost.material) {
          ghost.material.color.set(colHex);
          ghost.material.opacity = isValid ? 0.55 : 0.72;
        } else {
          ghost.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.color.set(isValid ? '#98ffb8' : '#ff5252');
              child.material.opacity = isValid ? 0.42 : 0.62;
            }
          });
        }
      }

      function rebuildInstances() {
        const buckets = {};
        ITEM_DEFS.forEach((d) => { if (isInstancedDef(d)) buckets[d.id] = []; });

        while (cabinGroupContainer.children.length > 0) {
          const old = cabinGroupContainer.children[0];
          cabinGroupContainer.remove(old);
          disposeObjectTree(old);
        }
        while (glowGroup.children.length > 0) {
          glowGroup.remove(glowGroup.children[0]);
        }
        activeCabins = [];
        activeGlowSprites = [];
        campfireSpots = [];
        contactShadowBaseList = [];

        lightSources = [];
        pointLightPool.forEach((pl) => { pl.userData = { active: false }; pl.intensity = 0; });

        const pathTiles = [];
        let fencePostIdx = 0, fenceRailIdx = 0;
        let crateIdx = 0;

        markShadowsDirty(1.0); // covers the stacked drop + cabin drop & squash

        // contact shadow, campfire flames, glow sprite and light source of one placed item
        // (ka, kb: hash keys, the tile for grid items, the quarter-tile position for snap props)
        function addItemExtras(id, def, wx, wy, wz, rotY, ka, kb) {
          if (def.contactRadius > 0) {
            contactShadowBaseList.push({
              x: wx, y: wy + 0.026, z: wz, r: def.contactRadius * 2.0,
              tier: def.type === '3d_cabin' ? 2 : (def.explodeTier || 0)
            });
          }

          if (id === 'campfire') campfireSpots.push({ x: wx, y: wy, z: wz, seed: hash2D(ka, kb, 9) * 10 });
          if (def.glow) {
            // optional horizontal offset of the light source (e.g. a lamp hanging off a post arm)
            const gox = def.glow.offsetX || 0, goz = def.glow.offsetZ || 0;
            const gx = wx + gox * Math.cos(rotY) + goz * Math.sin(rotY);
            const gz = wz - gox * Math.sin(rotY) + goz * Math.cos(rotY);
            const spMat = new THREE.SpriteMaterial({
              map: glowTex, color: def.glow.color, transparent: true, opacity: 0,
              blending: THREE.AdditiveBlending, depthWrite: false
            });
            const sprite = new THREE.Sprite(spMat);
            sprite.position.set(gx, wy + def.glow.offsetY, gz);
            sprite.scale.set(def.glow.scale, def.glow.scale, 1);
            glowGroup.add(sprite);
            activeGlowSprites.push({
              sprite, baseY: wy + def.glow.offsetY, baseScale: def.glow.scale,
              seed: hash2D(ka, kb, 9) * 10, flicker: !!def.glow.flicker,
              isCabin: def.type === '3d_cabin', tier: def.explodeTier || 0
            });

            // every light source is listed; updatePointLights() lends the 8 pool lights to the nearest ones
            lightSources.push({
              x: gx, z: gz, baseY: wy + def.glow.offsetY + 0.15,
              color: def.glow.color,
              mult: def.glow.lightIntensity || 1.0,
              flicker: !!def.glow.flicker,
              seed: hash2D(ka, kb, 15) * 20,
              isCabin: def.type === '3d_cabin',
              tier: def.explodeTier || 0,
              want: false, slot: -1, w: 0
            });
          }
        }

        // 1. Process Grid-Snapped Items
        placedItems.forEach((entry) => {
          const def = assetsById[entry.id].def;
          const wx = entry.gx - HALF_GRID + 0.5;
          const wz = entry.gz - HALF_GRID + 0.5;
          const wy = getTileElevation(entry.gx, entry.gz);
          const rotY = entry.rotation * (Math.PI / 2);

          if (isInstancedDef(def)) {
            buckets[entry.id].push({ wx, wy, wz, rotation: entry.rotation, scale: 1.0, spawnT: entry.spawnT ?? -100 });
          } else if (def.type === '3d_cabin') {
            const cabin = buildStorybookCabinPrefab();
            cabin.position.set(wx, wy, wz);
            cabin.rotation.y = rotY;
            cabinGroupContainer.add(cabin);
            activeCabins.push({ mesh: cabin, baseX: wx, baseY: wy, baseZ: wz, rotY, spawnT: entry.spawnT ?? -100 });
            prepareCabinDrop(cabin);

            if (crateIdx < 24) {
              dummyObj.position.set(wx - 0.54, wy + 0.08, wz + 0.34);
              dummyObj.rotation.set(0, rotY + 0.25, 0);
              dummyObj.scale.set(1, 1, 1);
              dummyObj.updateMatrix();
              crateClutterInst.setMatrixAt(crateIdx++, dummyObj.matrix);
            }
          } else if (def.type === 'auto_path') {
            // cobbled pad, with arms to cardinal neighbors (path or cabin door) on the same elevation
            const conns = [];
            for (const [dx, dz] of [[0, -1], [0, 1], [1, 0], [-1, 0]]) {
              const nb = placedItems.get(`${entry.gx + dx},${entry.gz + dz}`);
              if (nb && (nb.id === 'path' || nb.id === 'cabin') && getTileElevation(entry.gx + dx, entry.gz + dz) === wy) conns.push([dx, dz]);
            }
            pathTiles.push({ gx: entry.gx, gz: entry.gz, wx, wy, wz, conns });
          } else if (def.type === 'auto_fence') {
            // Auto-tiling wooden fence post + horizontal rails to adjacent fence posts!
            dummyObj.position.set(wx, wy + 0.18, wz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(1, 1, 1);
            dummyObj.updateMatrix();
            fencePostInst.setMatrixAt(fencePostIdx++, dummyObj.matrix);

            const dirs = [[0, -1, 0], [0, 1, 0], [1, 0, Math.PI / 2], [-1, 0, Math.PI / 2]];
            dirs.forEach(([dx, dz, ang]) => {
              const nb = placedItems.get(`${entry.gx + dx},${entry.gz + dz}`);
              if (nb && nb.id === 'fence' && Math.abs(getTileElevation(entry.gx + dx, entry.gz + dz) - wy) < 0.05) {
                for (let railH of [0.13, 0.27]) {
                  if (fenceRailIdx < 360) {
                    dummyObj.position.set(wx + dx * 0.28, wy + railH, wz + dz * 0.28);
                    dummyObj.rotation.set(0, ang, 0);
                    dummyObj.scale.set(1, 1, 1);
                    dummyObj.updateMatrix();
                    fenceRailInst.setMatrixAt(fenceRailIdx++, dummyObj.matrix);
                  }
                }
              }
            });
          }

          addItemExtras(entry.id, def, wx, wy, wz, rotY, entry.gx, entry.gz);
        });
        // 1b. Quarter-tile snap props (benches, lanterns, campfires, woodpiles, ...)
        snapProps.forEach((o) => {
          const def = assetsById[o.id]?.def;
          if (!def) return;
          const wy = snapGroundY(def, o.wx, o.wz, o.rotation), rotY = o.rotation * (Math.PI / 2);
          if (isInstancedDef(def)) buckets[o.id].push({ wx: o.wx, wy, wz: o.wz, rotation: o.rotation, scale: 1.0, spawnT: o.spawnT ?? -100 });
          addItemExtras(o.id, def, o.wx, wy, o.wz, rotY, Math.round(o.wx * 4) + 101, Math.round(o.wz * 4) + 101);
        });
        pickPointLights(true);

        // 2. Process Free-Placed Overlapping Decor (Flowers, Reeds, Rocks, Mushrooms)
        freeProps.forEach((fp) => {
          const def = assetsById[fp.id]?.def;
          if (!def || !isInstancedDef(def)) return;
          const wy = getContinuousTerrainHeight(fp.wx, fp.wz);
          buckets[fp.id].push({ wx: fp.wx, wy, wz: fp.wz, rotation: fp.rotation, scale: fp.scale || 1.0, spawnT: fp.spawnT ?? -100 });
          if (def.contactRadius > 0) {
            contactShadowBaseList.push({
              x: fp.wx, y: wy + 0.026, z: fp.wz, r: def.contactRadius * 1.75 * (fp.scale || 1.0),
              tier: def.explodeTier || 0
            });
          }
        });

        // Apply InstancedMeshes
        ITEM_DEFS.forEach((def) => {
          if (!isInstancedDef(def) || def.seedScatter) return;
          const list = buckets[def.id];
          const mesh = instancedById[def.id];
          for (let i = 0; i < list.length && i < MAX_INSTANCES; i++) {
            const item = list[i];
            dummyObj.position.set(item.wx, item.wy, item.wz);
            dummyObj.rotation.set(0, item.rotation * (Math.PI / 2), 0);
            dummyObj.scale.setScalar(item.scale);
            dummyObj.updateMatrix();
            mesh.setMatrixAt(i, dummyObj.matrix);
            mesh.userData.spawnAttr.array[i] = item.spawnT;
          }
          mesh.count = Math.min(list.length, MAX_INSTANCES);
          mesh.visible = mesh.count > 0; // an empty InstancedMesh still costs a draw call (x2 with shadows)
          mesh.instanceMatrix.needsUpdate = true;
          mesh.userData.spawnAttr.needsUpdate = true;
        });

        pathMesh.geometry.dispose(); pathMesh.geometry = buildPathGeometry(pathTiles); pathMesh.count = pathTiles.length;
        fencePostInst.count = fencePostIdx; fencePostInst.instanceMatrix.needsUpdate = true;
        fenceRailInst.count = fenceRailIdx; fenceRailInst.instanceMatrix.needsUpdate = true;
        crateClutterInst.count = crateIdx; crateClutterInst.instanceMatrix.needsUpdate = true;
        for (const im of [pathMesh, fencePostInst, fenceRailInst, crateClutterInst]) im.visible = im.count > 0;

        // 3. Clustered Ghibli-Style Grass Tufts (Large + 2~3 Med/Small Clumps with Tile Edge Padding!)
        let grassIdx = 0;
        let pebbleIdx = 0;
        const TILE_PAD = 0.14; // Keeps tufts neatly inset from tile grid lines

        function clampToTilePadding(val) {
          const base = Math.floor(val);
          const local = THREE.MathUtils.clamp(val - base, TILE_PAD, 1.0 - TILE_PAD);
          return base + local;
        }

        function isGrassSpotValid(tx, tz) {
          if (Math.abs(tx) > HALF_GRID - 0.18 || Math.abs(tz) > HALF_GRID - 0.18) return false;
          if (getPondSDF(tx, tz) < 0.16) return false;
          if (terrainPaintAt(tx, tz) !== MAT_GRASS) return false;
          const gx = Math.floor(tx + HALF_GRID);
          const gz = Math.floor(tz + HALF_GRID);
          const tileItem = placedItems.get(`${gx},${gz}`);
          if (tileItem && (tileItem.id === 'path' || tileItem.id === 'cabin' || tileItem.id === 'campfire')) return false;
          if (isBlockedForPoint(tx, tz, 0.06, false)) return false;
          return true;
        }

        function spawnGrassCluster(ax, az, seed) {
          if (grassIdx >= MAX_GRASS_TUFTS) return;
          const cx = clampToTilePadding(ax);
          const cz = clampToTilePadding(az);
          if (!isGrassSpotValid(cx, cz)) return;

          // 1 Large anchor tuft
          const mainSc = 1.02 + hash2D(seed, 1, 31) * 0.24;
          const cy = getContinuousTerrainHeight(cx, cz);
          dummyObj.position.set(cx, cy - 0.01, cz);
          dummyObj.rotation.set(0, hash2D(seed, 2, 31) * Math.PI * 2, 0);
          dummyObj.scale.set(mainSc, mainSc, mainSc);
          dummyObj.updateMatrix();
          grassClutterInst.setMatrixAt(grassIdx++, dummyObj.matrix);

          // 2~3 Medium/Small companion tufts tucked tightly around the large tuft
          const subCount = 2 + (Math.floor(hash2D(seed, 3, 31) * 2) % 2);
          for (let s = 0; s < subCount && grassIdx < MAX_GRASS_TUFTS; s++) {
            const ang = (s / subCount) * Math.PI * 2 + hash2D(seed, s + 4, 31) * 1.1;
            const dist = 0.085 + hash2D(seed, s + 9, 31) * 0.075;
            const sx = clampToTilePadding(cx + Math.cos(ang) * dist);
            const sz = clampToTilePadding(cz + Math.sin(ang) * dist);
            if (!isGrassSpotValid(sx, sz)) continue;
            const sy = getContinuousTerrainHeight(sx, sz);
            const subSc = 0.56 + hash2D(seed, s + 15, 31) * 0.30;
            dummyObj.position.set(sx, sy - 0.01, sz);
            dummyObj.rotation.set(0, hash2D(seed, s + 21, 31) * Math.PI * 2, 0);
            dummyObj.scale.set(subSc, subSc * (0.9 + hash2D(seed, s + 25, 31) * 0.2), subSc);
            dummyObj.updateMatrix();
            grassClutterInst.setMatrixAt(grassIdx++, dummyObj.matrix);
          }
        }

        let clusterSeed = 1;
        // (A) Cluster around Tree Roots, Cabin Outer Corners & Fences
        placedItems.forEach((entry) => {
          const wx = entry.gx - HALF_GRID + 0.5;
          const wz = entry.gz - HALF_GRID + 0.5;
          if (entry.id === 'pine' || entry.id === 'oak') {
            for (let k = 0; k < 2; k++) {
              const a = hash2D(entry.gx, entry.gz, k * 3 + 1) * Math.PI * 2;
              spawnGrassCluster(wx + Math.cos(a) * 0.32, wz + Math.sin(a) * 0.32, clusterSeed++);
            }
          } else if (entry.id === 'cabin') {
            // Tuck fluffy grass clusters near cabin outer corners (outside footprint)
            [[-0.64, -0.58], [0.64, -0.58], [-0.66, 0.56], [0.64, 0.54]].forEach(([ox, oz]) => {
              spawnGrassCluster(wx + ox, wz + oz, clusterSeed++);
            });
          } else if (entry.id === 'fence' || entry.id === 'bench') {
            const a = hash2D(entry.gx, entry.gz, 7) * Math.PI * 2;
            spawnGrassCluster(wx + Math.cos(a) * 0.28, wz + Math.sin(a) * 0.28, clusterSeed++);
          }
        });

        // (A2) A tuft at one outer corner of each snap prop
        snapProps.forEach((o) => {
          const r = footprintRect(assetsById[o.id].def, o.wx, o.wz, o.rotation), k = hash2D(o.wx * 4, o.wz * 4, 7);
          spawnGrassCluster(k < 0.5 ? r.x0 - 0.1 : r.x1 + 0.1, (k * 4) % 1 < 0.5 ? r.z0 - 0.1 : r.z1 + 0.1, clusterSeed++);
        });

        // (B) Cluster right beside Rock Bases
        freeProps.forEach((fp) => {
          if (fp.id === 'rocks') {
            const r = 0.38 * (fp.scale || 1.0) + 0.08;
            for (let k = 0; k < 2; k++) {
              const a = hash2D(fp.wx * 10, fp.wz * 10, k + 5) * Math.PI * 2;
              spawnGrassCluster(fp.wx + Math.cos(a) * r, fp.wz + Math.sin(a) * r, clusterSeed++);
            }
          }
        });

        // (C) Grass clusters along every shoreline (a lattice of spots in the band just past the wet rim)
        if (terrain.water) for (let j = 0; j < GRID_SIZE * 4; j++) for (let i = 0; i < GRID_SIZE * 4; i++) {
          const tx = (i + 0.5) / 4 - HALF_GRID + (hash2D(i, j, 61) - 0.5) * 0.12, tz = (j + 0.5) / 4 - HALF_GRID + (hash2D(i, j, 62) - 0.5) * 0.12;
          const d = getPondSDF(tx, tz);
          if (d >= 0.22 && d < 0.38 && hash2D(i, j, 63) < 0.6) spawnGrassCluster(tx, tz, clusterSeed++);
        }

        // (D) Light natural accents on back-hill ledges (keeps central meadow clean & airy)
        for (let gz = 0; gz < GRID_SIZE; gz++) {
          for (let gx = 0; gx < GRID_SIZE; gx++) {
            if (getHillLevel(gx, gz) >= 1 && !placedItems.has(`${gx},${gz}`) && hash2D(gx, gz, 41) > 0.62) {
              const wx = gx - HALF_GRID + 0.5 + (hash2D(gx, gz, 42) - 0.5) * 0.35;
              const wz = gz - HALF_GRID + 0.5 + (hash2D(gx, gz, 43) - 0.5) * 0.35;
              spawnGrassCluster(wx, wz, clusterSeed++);
            }
          }
        }

        // Smooth wet pebbles strewn along every shoreline (evenly thinned when there's more shore than pebbles)
        const pebbleSpots = [];
        if (terrain.water) for (let j = 0; j < GRID_SIZE * 8; j++) for (let i = 0; i < GRID_SIZE * 8; i++) {
          const rx = (i + 0.5) / 8 - HALF_GRID + (hash2D(i, j, 5) - 0.5) * 0.1, rz = (j + 0.5) / 8 - HALF_GRID + (hash2D(i, j, 6) - 0.5) * 0.1;
          if (Math.abs(rx) > HALF_GRID - 0.2 || Math.abs(rz) > HALF_GRID - 0.2) continue;
          const d = getPondSDF(rx, rz);
          if (d >= 0.04 && d < 0.17 && hash2D(i, j, 7) < 0.8) pebbleSpots.push([rx, rz, i * 7 + j * 13]);
        }
        const pebbleStride = Math.max(1, pebbleSpots.length / 110);
        for (let f = 0; f < pebbleSpots.length && pebbleIdx < 110; f += pebbleStride) {
          const [rx, rz, a] = pebbleSpots[Math.floor(f)];
          const py = getContinuousTerrainHeight(rx, rz);
          const sc = 0.65 + hash2D(a, 3, 5) * 0.95;
          dummyObj.position.set(rx, py + 0.02, rz);
          dummyObj.rotation.set(a, a * 1.3, a * 0.7);
          dummyObj.scale.set(sc, sc * 0.55, sc);
          dummyObj.updateMatrix();
          pebbleClutterInst.setMatrixAt(pebbleIdx++, dummyObj.matrix);
        }
        grassClutterInst.count = grassIdx; grassClutterInst.instanceMatrix.needsUpdate = true;
        pebbleClutterInst.count = pebbleIdx; pebbleClutterInst.instanceMatrix.needsUpdate = true;
        pebbleClutterInst.visible = pebbleIdx > 0; // no water, no pebbles: no draw call
        rebuildSeedFlowers();
      }

      /* ---- WILDFLOWER SEEDS (들꽃 씨앗) ---- */
      // A click sows a handful (spaced apart, denser in the middle, colours in loose patches);
      // dragging keeps sowing. Only the seed mesh is refilled while sowing. Flowers stay in the
      // list under things placed later or ground painted over them, and show again when uncovered.
      const SEED_R = 0.5, SEED_GAP = 0.085, SEED_PER_SOW = 8;
      const SEED_TINTS = SEED_TINT_HEX.map((h) => new THREE.Color(h));
      // steepness of the ground (rise per run); terrace slopes are bare earth, no flowers there
      function seedSlope(x, z) {
        const e = 0.07;
        return Math.hypot(getContinuousTerrainHeight(x + e, z) - getContinuousTerrainHeight(x - e, z),
          getContinuousTerrainHeight(x, z + e) - getContinuousTerrainHeight(x, z - e)) / (2 * e);
      }
      const SEED_MAX_SLOPE = 0.45;
      function seedSpotFree(x, z, r) {
        if (Math.abs(x) > HALF_GRID - 0.08 || Math.abs(z) > HALF_GRID - 0.08) return false;
        if (getPondSDF(x, z) < 0.1 || terrainPaintAt(x, z) !== MAT_GRASS) return false;
        if (seedSlope(x, z) > SEED_MAX_SLOPE) return false;
        const tile = placedItems.get(`${Math.floor(x + HALF_GRID)},${Math.floor(z + HALF_GRID)}`);
        if (tile && tile.id === 'path') return false;
        return !isBlockedForPoint(x, z, r, false);
      }
      // A flower that gets covered (painted ground, an object, a raised slope) or erased sinks into
      // the ground over SEED_SHRINK (f.goneAt); uncovered again it grows back. Erased ones leave the
      // list once they're gone. Cheap enough to run every frame of a paint stroke.
      let seedCleanup = 0;
      function rebuildSeedFlowers() {
        const mesh = instancedById.seeds;
        if (!mesh) return;
        const max = assetsById.seeds.def.maxInstances, tint = mesh.userData.tintAttr.array, sp = mesh.userData.spawnAttr.array, gone = mesh.userData.goneAttr.array;
        const now = performance.now() * 0.001;
        let n = 0, sinking = false, drop = false;
        for (const f of seedFlowers) {
          if (n >= max) break;
          if (!f.erased && seedSpotFree(f.wx, f.wz, 0.02)) {
            if (f.goneAt != null) { f.goneAt = null; f.spawnT = now + Math.random() * 0.15; } // grows back
          } else {
            if (f.goneAt == null) f.goneAt = now;
            if (now - f.goneAt >= SEED_SHRINK) { if (f.erased) drop = true; continue; }
            sinking = true;
          }
          gone[n] = f.goneAt == null ? 1e9 : f.goneAt;
          dummyObj.position.set(f.wx, getContinuousTerrainHeight(f.wx, f.wz) - 0.005, f.wz);
          dummyObj.rotation.set(0, f.rot, 0);
          dummyObj.scale.setScalar(f.scale);
          dummyObj.updateMatrix();
          mesh.setMatrixAt(n, dummyObj.matrix);
          const c = SEED_TINTS[f.tint];
          tint[n * 3] = c.r; tint[n * 3 + 1] = c.g; tint[n * 3 + 2] = c.b;
          sp[n] = f.spawnT;
          n++;
        }
        if (drop) for (let i = seedFlowers.length - 1; i >= 0; i--) if (seedFlowers[i].erased && now - seedFlowers[i].goneAt >= SEED_SHRINK) seedFlowers.splice(i, 1);
        mesh.count = n;
        mesh.visible = n > 0; // nothing sown: no draw call
        mesh.instanceMatrix.needsUpdate = true;
        mesh.userData.spawnAttr.needsUpdate = true;
        mesh.userData.tintAttr.needsUpdate = true;
        mesh.userData.goneAttr.needsUpdate = true;
        // once the sinking ones are gone, take them out of the buffer
        if (sinking && !seedCleanup) seedCleanup = setTimeout(() => { seedCleanup = 0; rebuildSeedFlowers(); }, SEED_SHRINK * 1000 + 60);
        queueAutosave(); // every edit ends up here (rebuildInstances finishes with this)
      }
      function sowSeedsAt(cx, cz) { // how many flowers came up
        const max = assetsById.seeds.def.maxInstances, now = performance.now() * 0.001;
        const reach = (SEED_R + SEED_GAP) * (SEED_R + SEED_GAP);
        const near = seedFlowers.filter((f) => !f.erased && dist2(f.wx, f.wz, cx, cz) < reach);
        let made = 0;
        for (let k = 0; k < 48 && made < SEED_PER_SOW && seedFlowers.length < max; k++) {
          const a = Math.random() * TAU, r = SEED_R * Math.pow(Math.random(), 0.75);
          const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
          if (near.some((f) => dist2(f.wx, f.wz, x, z) < SEED_GAP * SEED_GAP)) continue;
          if (!seedSpotFree(x, z, 0.03)) continue;
          const tint = Math.random() < 0.65 ? Math.min(SEED_TINTS.length - 1, Math.floor(vnoise(x * 1.3, z * 1.3, 181) * SEED_TINTS.length)) : Math.floor(Math.random() * SEED_TINTS.length);
          const f = { wx: x, wz: z, rot: Math.random() * TAU, scale: 0.8 + Math.random() * 0.45, tint, spawnT: now + made * 0.05 + Math.random() * 0.12 };
          seedFlowers.push(f); near.push(f); made++;
        }
        return made;
      }
      let seedStroke = null;
      function sowStep(wx, wz) {
        const n = sowSeedsAt(wx, wz);
        if (!n) return 0;
        seedStroke.made += n;
        rebuildSeedFlowers();
        const y = getContinuousTerrainHeight(wx, wz);
        audio.playSeeds(screenPan(wx, y, wz));
        burstDust(wx, y, wz, 4, 0.3);
        return n;
      }
      function beginSeedStroke(hit) {
        seedStroke = { wx: hit.wx, wz: hit.wz, made: 0 };
        if (!sowStep(hit.wx, hit.wz)) audio.playTerrainBlocked(screenPan(hit.wx, hit.wy, hit.wz));
      }
      function seedStrokeTo(wx, wz) {
        if (Math.hypot(wx - seedStroke.wx, wz - seedStroke.wz) < 0.32) return;
        seedStroke.wx = wx; seedStroke.wz = wz;
        sowStep(wx, wz);
      }
      function endSeedStroke() { seedStroke = null; }

      /* ---- SAVE (step 5): the island lives on in this browser ---- */
      // The current island is written to a hidden auto slot one second after the last edit (a few
      // KB, only on edits, never per frame) and comes back, assembling, on the next visit. The time
      // of day is a separate setting. #save=0 turns reading and writing off. Coordinates are kept
      // exactly (no rounding) so a reloaded island is the same island, mesh for mesh.
      const SAVE_ON = HASH.save !== '0';
      const SAVE_V = 1, SAVE_KEY_AUTO = 'mori-isle.v1.auto', SAVE_KEY_SLOT = 'mori-isle.v1.slot', SAVE_KEY_PREFS = 'mori-isle.prefs';
      const storeGet = (k) => { if (!SAVE_ON) return null; try { return localStorage.getItem(k); } catch (e) { return null; } };
      const storeSet = (k, v) => { if (!SAVE_ON) return false; try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
      const bytesToB64 = (u8) => { let t = ''; for (let i = 0; i < u8.length; i++) t += String.fromCharCode(u8[i]); return btoa(t); };
      const b64ToBytes = (b) => { try { const t = atob(b); const u8 = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) u8[i] = t.charCodeAt(i); return u8; } catch (e) { return null; } };
      function serializeIsland() {
        return {
          level: bytesToB64(new Uint8Array(terrain.level.buffer)),
          mat: bytesToB64(terrain.mat),
          placed: [...placedItems.values()].map((e) => [e.id, e.gx, e.gz, e.rotation]),
          snap: snapProps.map((o) => [o.id, o.wx, o.wz, o.rotation]),
          free: freeProps.map((fp) => [fp.id, fp.wx, fp.wz, fp.rotation, fp.scale]),
          seeds: seedFlowers.filter((f) => !f.erased).map((f) => [f.wx, f.wz, f.rot, f.scale, f.tint])
        };
      }
      // A broken terrain throws the whole save away (the starter island instead); objects that don't
      // fit (unknown id, wrong placement kind, off the island, not a number) are dropped one by one.
      function parseIsland(isl) {
        if (!isl || typeof isl !== 'object') return null;
        const lv = b64ToBytes(isl.level), mt = b64ToBytes(isl.mat);
        if (!lv || lv.length !== GRID_SIZE * GRID_SIZE || !mt || mt.length !== MAT_N * MAT_N) return null;
        const level = new Int8Array(lv.buffer);
        for (const v of level) if (v < 0 || v > TERRAIN_MAX) return null;
        for (const v of mt) if (v > MAT_WATER) return null;
        const num = (v) => typeof v === 'number' && Number.isFinite(v);
        const onIsland = (x, z) => num(x) && num(z) && Math.abs(x) < HALF_GRID && Math.abs(z) < HALF_GRID;
        const defOf = (id) => (typeof id === 'string' && assetsById[id] ? assetsById[id].def : null);
        const list = (a) => (Array.isArray(a) ? a.filter(Array.isArray) : []);
        const placed = [], seen = new Set();
        for (const [id, gx, gz, rotation] of list(isl.placed)) {
          const def = defOf(id);
          if (!def || def.freePlace || def.snapPlace || def.seedScatter || !Number.isInteger(gx) || !Number.isInteger(gz) || !num(rotation)) continue;
          if (gx < 0 || gz < 0 || gx >= GRID_SIZE || gz >= GRID_SIZE || seen.has(`${gx},${gz}`)) continue;
          seen.add(`${gx},${gz}`); placed.push({ id, gx, gz, rotation });
        }
        const snap = [];
        for (const [id, wx, wz, rotation] of list(isl.snap)) {
          const def = defOf(id);
          if (def && def.snapPlace && onIsland(wx, wz) && num(rotation)) snap.push({ id, wx, wz, rotation });
        }
        const free = [];
        for (const [id, wx, wz, rotation, scale] of list(isl.free)) {
          const def = defOf(id);

        // seed flowers: a little patch at a time
        let erased = 0;
        for (const f of seedFlowers) {
          if (!f.erased && dist2(f.wx, f.wz, hit.wx, hit.wz) < 0.3 * 0.3) { f.erased = true; erased++; }
        }
        if (erased) {
          rebuildSeedFlowers();
          audio.playRemove();
          return;
        }
        const key = `${hit.gx},${hit.gz}`;
        if (placedItems.has(key)) {
          placedItems.delete(key);
          rebuildInstances();
          audio.playRemove();
        }
      }

      function updateHoverVisuals() {
        ITEM_DEFS.forEach((d) => { ghostMeshesById[d.id].visible = false; });
        cursorTile.visible = false;
        cursorTile.scale.set(1, 1, 1);
        freeCursorRing.visible = false;
        freeCursorRing.scale.set(1, 1, 1);

        if (!hoveredHit || isPhotoMode || isExploded) return;

        const { gx, gz, wx, wz, wy } = hoveredHit;
        if (selectedTool === 'delete') {
          cursorTile.visible = true;
          cursorTile.position.set(gx - HALF_GRID + 0.5, getTileElevation(gx, gz) + 0.025, gz - HALF_GRID + 0.5);
          cursorMat.color.set('#ff7c7c');
          return;
        }

        const tt = terrainToolById(selectedTool);
        if (tt && tt.paint !== undefined) { // ground paint: the quarter tile under the brush
          const [qx, qz] = paintCellAt(wx, wz), [cx, cz] = paintCellCentre(qx, qz), r = 0.5 / MAT_RES;
          let y = -1e9;
          for (const [ox, oz] of [[-r, -r], [r, -r], [-r, r], [r, r], [0, 0]]) y = Math.max(y, getTurfHeight(cx + ox, cz + oz));
          cursorTile.visible = true;
          cursorTile.scale.set(1.12 / MAT_RES / 0.98, 1.12 / MAT_RES / 0.98, 1);
          cursorTile.position.set(cx, y + 0.03, cz);
          cursorMat.color.set(paintAllowed(qx, qz, tt.paint) ? tt.cursor : '#ff5252');
          return;
        }
        if (tt) { // terrain tool: the tile lights up (green up, gold down) or red when blocked
          cursorTile.visible = true;
          cursorTile.position.set(gx - HALF_GRID + 0.5, getTileElevation(gx, gz) + 0.025, gz - HALF_GRID + 0.5);
          cursorMat.color.set(terrainEditAllowed(gx, gz, tt.dir) ? (tt.dir > 0 ? '#a8ffbe' : '#ffe29c') : '#ff5252');
          return;
        }

        const def = assetsById[selectedTool].def;
        const ghost = ghostMeshesById[selectedTool];
        const valid = canPlaceAtHit(selectedTool, hoveredHit);

        if (def.snapPlace) {
          const p = snapPlacement(def, hoveredHit);
          cursorTile.visible = true;
          cursorTile.scale.set((p.rect.x1 - p.rect.x0 + 0.06) / 0.98, (p.rect.z1 - p.rect.z0 + 0.06) / 0.98, 1);
          cursorTile.position.set((p.rect.x0 + p.rect.x1) / 2, p.wy + 0.025, (p.rect.z0 + p.rect.z1) / 2);
          cursorMat.color.set(p.valid ? '#a8ffbe' : '#ff5252');
          if (ghost) {
            ghost.visible = true;
            ghost.position.set(p.wx, p.wy + 0.02, p.wz);
            ghost.userData.baseY = p.wy;
            ghost.rotation.y = p.rot * (Math.PI / 2);
            setGhostValidityColor(ghost, p.valid);
          }

          freeCursorRing.visible = true;
          freeCursorRing.scale.set(SEED_R / 0.27, 1, SEED_R / 0.27);
          freeCursorRing.position.set(wx, wy + 0.03, wz);
          ringMat.color.set(seedSpotFree(wx, wz, 0.03) ? '#ffe29c' : '#ff5252');
        } else if (def.freePlace) {
          freeCursorRing.visible = true;
          freeCursorRing.position.set(wx, wy + 0.03, wz);
          ringMat.color.set(valid ? '#ffe29c' : '#ff5252');
          if (ghost) {
            ghost.visible = true;
            ghost.position.set(wx, wy + 0.02, wz);
            ghost.rotation.y = currentRotation * (Math.PI / 2);
            setGhostValidityColor(ghost, valid);
          }
        } else {
          const tileX = gx - HALF_GRID + 0.5;
          const tileZ = gz - HALF_GRID + 0.5;
          const tileY = getTileElevation(gx, gz);
          cursorTile.visible = true;
          cursorTile.position.set(tileX, tileY + 0.025, tileZ);
          cursorMat.color.set(valid ? '#a8ffbe' : '#ff5252');
          if (ghost) {

            ghost.position.set(tileX, tileY + 0.02, tileZ);
            ghost.rotation.y = currentRotation * (Math.PI / 2);
            setGhostValidityColor(ghost, valid);
          }

      }

      // trim an icon to its opaque pixels and scale it to fill the slot (integer steps keep pixels crisp)
      function fitIconCanvas(src, size = 40, pad = 2) {
        const w = src.width, h = src.height, d = src.getContext('2d').getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 < 0) return src;
        const bw = x1 - x0 + 1, bh = y1 - y0 + 1, fit = (size - pad * 2) / Math.max(bw, bh);
        const k = fit >= 2 ? Math.floor(fit) : (fit >= 1 ? 1 : fit);
        const c = document.createElement('canvas'); c.width = size; c.height = size;
        const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = k < 1;
        const dw = bw * k, dh = bh * k;
        ctx.drawImage(src, x0, y0, bw, bh, Math.round((size - dw) / 2), Math.round(size - pad - dh), dw, dh);
        return c;
      }
