      });
      // Card motion. One continuous curve per property, no keyframe seams and no squashing:
      // x and y travel on different curves (y settles first) so each card swings out on an arc from
      // the book, while scale and tilt ride a lightly damped spring (about 3% overshoot, one settle).
      // The three transform parts are separate animations stacked with composite 'add', in the order
      // translateX → translateY → scale·rotate, so the scale never shrinks the travel.
      const springEase = (() => {
        const z = 0.74, w = 6.2 / z, wd = w * Math.sqrt(1 - z * z), pts = [];
        for (let i = 0; i <= 40; i++) {
          const t = i / 40, x = i === 40 ? 1 : 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
          pts.push(x.toFixed(4));
        }
        try { return CSS.supports('transition-timing-function', `linear(${pts.join(',')})`) ? `linear(${pts.join(',')})` : 'cubic-bezier(0.2, 1.1, 0.4, 1)'; } catch (e) { return 'cubic-bezier(0.2, 1.1, 0.4, 1)'; }
      })();
      const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      function animateSaveCards(open) {
        const b = btnSave.getBoundingClientRect(), p = savePanel.getBoundingClientRect();
        const bx = b.left + b.width / 2, by = b.top + b.height / 2;
        const n = slotCards.length;
        slotCards.forEach((card, k) => {
          card.getAnimations().forEach((a) => a.cancel());
          if (reduceMotion) { card.animate([{ opacity: open ? 0 : 1 }, { opacity: open ? 1 : 0 }], { duration: 160, fill: open ? 'backwards' : 'forwards' }); return; }
          const tilt = parseFloat(card.style.getPropertyValue('--tilt')) || 0;
          const dx = bx - (p.left + card.offsetLeft + card.offsetWidth / 2);
          const dy = by - (p.top + card.offsetTop + card.offsetHeight * 0.35);
          const near = n - 1 - k; // the right-hand card sits under the book
          if (open) {
            const delay = near * 45;
            const o = { delay, fill: 'backwards' };
            card.animate([{ transform: `translateX(${dx}px)` }, { transform: 'translateX(0)' }], { ...o, duration: 520, easing: 'cubic-bezier(0.32, 0.72, 0.24, 1)' });
            card.animate([{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }], { ...o, duration: 420, easing: 'cubic-bezier(0.16, 0.9, 0.3, 1)', composite: 'add' });
            card.animate([{ transform: `scale(0.42) rotate(${tilt + 7}deg)` }, { transform: `scale(1) rotate(${tilt}deg)` }], { ...o, duration: 560, easing: springEase, composite: 'add' });
            card.animate([{ opacity: 0 }, { opacity: 1 }], { ...o, duration: 140, easing: 'ease-out' });
          } else {
            const o = { delay: k * 30, fill: 'forwards', duration: 230, easing: 'cubic-bezier(0.55, 0, 0.8, 0.35)' };
            card.animate([{ transform: `rotate(${tilt}deg)` }, { transform: `translate(${dx}px, ${dy}px) scale(0.45) rotate(${tilt + 6}deg)` }], o);
            card.animate([{ opacity: 1, offset: 0 }, { opacity: 1, offset: 0.45 }, { opacity: 0 }], o);
          }
        });
      }
      // opening and closing from anywhere (outside click, help, reset, photo mode, loading a slot)
      new MutationObserver(() => {
        const open = savePanel.classList.contains('open');
        if (open === !!savePanel._wasOpen) return;
        savePanel._wasOpen = open;
        animateSaveCards(open);
        audio.playPaper(open);
      }).observe(savePanel, { attributes: true, attributeFilter: ['class'] });
      // a risky press asks once more: the token wobbles and its label says so
      function armed(btn, hint) {
        if (btn.classList.contains('arm')) { disarmSlots(); return true; }
        disarmSlots();
        btn.dataset.hint0 = btn.dataset.hint; btn.dataset.hint = hint; btn.classList.add('arm');
        btn.dispatchEvent(new Event('mouseenter'));
        audio.playUiBlip(380);
        return false;
      }
      savePanel.addEventListener('mouseleave', disarmSlots);
      slotCards.forEach((card, k) => {
        const i = k + 1;
        card.querySelector('.slot-save').addEventListener('click', (e) => {
          const btn = e.currentTarget;
          if (intro.phase !== 'done') return;
          if (!card.classList.contains('empty') && !armed(btn, '한 번 더: 덮어쓰기')) return;
          disarmSlots();
          const island = serializeIsland();
          requestThumb((thumb) => {
            const ok = storeSet(SAVE_KEY_SLOT + i, JSON.stringify({ v: SAVE_V, savedAt: Date.now(), island, thumb }))
              || storeSet(SAVE_KEY_SLOT + i, JSON.stringify({ v: SAVE_V, savedAt: Date.now(), island, thumb: '' })); // full storage: keep the island, drop the picture
            refreshSlots();
            if (ok) audio.playPlace(); else audio.playTerrainBlocked(0);
          });
        });
        card.querySelector('.slot-load').addEventListener('click', () => {
          const isl = readSave(SAVE_KEY_SLOT + i);
          if (!isl || intro.phase !== 'done') { audio.playTerrainBlocked(0); return; }
          closeSavePanel();
          resetIsland((rebuild) => applyIsland(isl, rebuild));
        });
        card.querySelector('.slot-del').addEventListener('click', (e) => {
          if (!armed(e.currentTarget, '한 번 더: 지우기')) return;
          try { if (SAVE_ON) localStorage.removeItem(SAVE_KEY_SLOT + i); } catch (err) { /* private mode */ }
          refreshSlots();
          audio.playRemove();
        });
      });

      /* =======================================================================
         15. POINTER, KEYBOARD & TOUCH INTERACTION CONTROLS
         ======================================================================= */
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      function getHitUnderClient(clientX, clientY) {
        pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(rayTargets, false);
        if (hits.length === 0) return null;
        const p = hits[0].point;
        const gx = Math.floor(p.x + HALF_GRID);
        const gz = Math.floor(p.z + HALF_GRID);
        if (gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return null;
        return { gx, gz, wx: p.x, wz: p.z, wy: p.y };
      }

      let isOrbiting = false;
      let isPanning = false;
      let orbitButton = -1;
      let dragStartX = 0, dragStartY = 0, lastDragX = 0, lastDragY = 0, dragStartTime = 0;
      let hasMovedSignificantly = false;

      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

      renderer.domElement.addEventListener('pointerdown', (e) => {
        resetPopover.classList.remove('open');
        if (e.button === 1 || e.button === 2) {
          isOrbiting = true;
          orbitButton = e.button;
          isPanning = e.button === 1 || e.shiftKey; // middle drag or shift + right drag pans
          dragStartX = lastDragX = e.clientX;
          dragStartY = lastDragY = e.clientY;
          dragStartTime = performance.now();
          hasMovedSignificantly = false;
          container.classList.add('dragging');
        } else if (e.button === 0) {
          if (isPhotoMode || isExploded) {
            isOrbiting = true;
            orbitButton = 0;
            dragStartX = lastDragX = e.clientX;
            dragStartY = lastDragY = e.clientY;
            hasMovedSignificantly = false;
            container.classList.add('dragging');
          } else {
            const hit = getHitUnderClient(e.clientX, e.clientY);
            if (hit) {
              placeAtHit(hit);
              hoveredHit = hit;
              updateHoverVisuals();
            }
          }
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (intro.phase !== 'done') return; // no ghost or grid while the island assembles
        if (isOrbiting) {
          const dx = e.clientX - lastDragX;
          const dy = e.clientY - lastDragY;
          lastDragX = e.clientX;
          lastDragY = e.clientY;
          if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 5) hasMovedSignificantly = true;
          if (isPanning) {
            panByScreen(dx, dy);
          } else {
            setTargetElev(targetCamElev + dy * 0.0065); // drag down -> look from higher, drag up -> lower
            targetOrbitAngle -= dx * 0.0085;
          }
        } else if (!isPhotoMode && !isExploded) {
          const hit = getHitUnderClient(e.clientX, e.clientY);
          if (paintStroke && hit && (e.buttons & 1)) paintStrokeTo(hit.wx, hit.wz);
          if (seedStroke && hit && (e.buttons & 1)) seedStrokeTo(hit.wx, hit.wz);
          hoveredHit = hit;
          updateHoverVisuals();
        }
      });

      renderer.domElement.addEventListener('pointerleave', () => {
        hoveredHit = null;
        updateHoverVisuals();
      });

      window.addEventListener('pointercancel', () => { endPaintStroke(); endSeedStroke(); }); // a cancelled touch still finishes the stroke
      window.addEventListener('pointerup', (e) => {
        if (paintStroke && e.button === 0) endPaintStroke();
        if (e.button === 0) endSeedStroke();
        if (isOrbiting && e.button === orbitButton) {
          if (orbitButton === 2 && !isPanning && !hasMovedSignificantly && performance.now() - dragStartTime < 350 && !isPhotoMode && !isExploded) {
            const hit = getHitUnderClient(e.clientX, e.clientY);
            if (hit) removeAtHit(hit);
          }
          isOrbiting = false;
          isPanning = false;
          orbitButton = -1;
          container.classList.remove('dragging');
        }
      });

      renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        const unit = e.deltaMode === 1 ? 33 : (e.deltaMode === 2 ? 400 : 1); // lines / pages -> pixels
        const dy = e.deltaY * unit, dx = e.deltaX * unit;
        // pinch on a laptop trackpad arrives as ctrl+wheel with small deltas
        zoomAt(Math.exp(dy * (e.ctrlKey ? 0.01 : 0.0009)), e.clientX, e.clientY);
        if (!e.ctrlKey && Math.abs(dx) > 0.5) targetOrbitAngle -= dx * 0.0045; // two-finger sideways swipe orbits
      }, { passive: false });

      renderer.domElement.addEventListener('dblclick', (e) => {
        if (!isPhotoMode && !isExploded) return; // in build mode a click places objects
        if (targetCamDist > 26) zoomAt(20 / targetCamDist, e.clientX, e.clientY);
        else resetView();
      });

      let prevPinchDist = null, prevTwoFingerX = null, prevTwoFingerY = null;
      renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const t0 = e.touches[0], t1 = e.touches[1];
          prevPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          prevTwoFingerX = (t0.clientX + t1.clientX) * 0.5;
          prevTwoFingerY = (t0.clientY + t1.clientY) * 0.5;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && prevPinchDist !== null) {
          const t0 = e.touches[0], t1 = e.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const midX = (t0.clientX + t1.clientX) * 0.5;
          const midY = (t0.clientY + t1.clientY) * 0.5;
          targetCamDist = THREE.MathUtils.clamp(targetCamDist - (dist - prevPinchDist) * 0.08, 16.0, 62.0);
          targetOrbitAngle -= (midX - prevTwoFingerX) * 0.01;
          setTargetElev(targetCamElev + (midY - prevTwoFingerY) * 0.008);
          prevPinchDist = dist;
          prevTwoFingerX = midX;
          prevTwoFingerY = midY;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', () => { prevPinchDist = null; prevTwoFingerX = null; prevTwoFingerY = null; });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          targetOrbitAngle += (e.key === 'ArrowLeft' ? 1 : -1) * 0.12; e.preventDefault(); return;
        }
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          setTargetElev(targetCamElev + (e.key === 'ArrowUp' ? 1 : -1) * 0.09); e.preventDefault(); return;
        }
        if (e.key === 'f' || e.key === 'F') { resetView(); return; }
        const panKey = { w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key.toLowerCase()];
        if (panKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const step = 70; // screen px per press
          panByScreen(-panKey[0] * step, -panKey[1] * step);
          return;
        }
        if (e.key === 'Escape') {
          if (isPhotoMode) setPhotoMode(false);
          resetPopover.classList.remove('open');
          toggleHelp(false);
          closeTray();
        } else if (e.key === 'e' || e.key === 'E') {
          toggleExplodedView();
        } else if (e.key === 'r' || e.key === 'R') {
          currentRotation = (currentRotation + 1) % 4;
          audio.playRotate();
          updateSelectionUI();
        } else if (e.key === 'x' || e.key === 'X') {
          selectTool('delete', true);
        } else if (e.key === 'h' || e.key === 'H') {
          toggleHelp();
        } else if (e.key >= '1' && e.key <= '9') {
          selectCategoryByIndex(parseInt(e.key, 10) - 1);
        }
      });

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = Math.max(window.innerHeight, 1);
        renderer.setSize(w, h);
        applyResolution();
      });

      /* =======================================================================
         16. STARTUP & 60 FPS ANIMATION LOOP
             (STAGGERED EXPLODED VIEW + EASE-OUT-BACK + SYNCED SHADOWS & SMOKE)
         ======================================================================= */
      setTimeOfDay(0);
      const bootSave = readSave(SAVE_KEY_AUTO);
      if (bootSave) applyIsland(bootSave); else populateStarterIsland();
      updateSelectionUI();

      // everything that stands on the island hangs off one root, so the reset can drop the whole
      // island at once (dust, petals, cursors and lights stay in the world)
      const islandRoot = new THREE.Group();
      scene.add(islandRoot);
      for (const o of [chunkTopSurface, chunkSubsoil, chunkBedrock, fenceGroup, cabinGroupContainer, glowGroup,
        smokeInst, flameInst, emberPoints, ...Object.values(instancedById)]) islandRoot.add(o);

      // Helper: Compute staggered springy progress [0..1] (with easeOutBack overshoot!) for each chunk
      function evalLayerProgress(sinceToggle, openDelay, closeDelay) {
        if (sinceToggle < 0) return 0;
        const delay = isExploded ? openDelay : closeDelay;
        const raw = THREE.MathUtils.clamp((sinceToggle - delay) / EXPLODE_DURATION, 0, 1);
        const eased = easeOutBack(raw);
        return isExploded ? eased : (1.0 - eased);
      }

      // Smooth transient bell curve [0..1..0] for 1~3° micro-rotation during transit
      function evalTransitTwist(sinceToggle, openDelay, closeDelay) {
        if (sinceToggle < 0) return 0;
        const delay = isExploded ? openDelay : closeDelay;
        const raw = THREE.MathUtils.clamp((sinceToggle - delay) / EXPLODE_DURATION, 0, 1);
        return Math.sin(raw * Math.PI);
      }

      let lastTime = performance.now();
      const animDummy = new THREE.Object3D();
      const tmpWorldPos = new THREE.Vector3();

      function animate(now) {
        requestAnimationFrame(animate);
        const rawFrameDt = (now - lastTime) / 1000;
        const dt = Math.min(rawFrameDt, 0.05);
        lastTime = now;
        frameNo++;
        // #debug=1 tests can hold the clock at one moment of the assembly (see __mori.introClock)
        const elapsed = debugClock !== null ? debugClock : now * 0.001;
        sharedUniforms.uTime.value = elapsed;

        // Smooth camera orbit, zoom & look height
        orbitAngle += (targetOrbitAngle - orbitAngle) * Math.min(1, dt * 10);
        camElev += (targetCamElev - camElev) * Math.min(1, dt * 10);
        camDist += (targetCamDist - camDist) * Math.min(1, dt * 8);
        camLookY += (targetCamLookY - camLookY) * Math.min(1, dt * 8);
        camPan.lerp(targetPan, Math.min(1, dt * 8)); // same rate as zoom so zoom-to-cursor stays anchored
        updateCameraTransform();
        runPendingFx(elapsed);
        updateDust(dt);
        {
          const st = elapsed - shakeStart;
          if (st >= 0 && st < 0.16) {
            const k = shakeAmp * (1 - st / 0.16);
            camShake.set(Math.sin(st * 160) * k, Math.cos(st * 190) * k * 0.6);
            updateCameraTransform();
          } else if (camShake.x !== 0 || camShake.y !== 0) {
            camShake.set(0, 0);
            updateCameraTransform();
          }
        }

        // Context-Sensitive Grid Auto-Hide (only appears gently when hovering in grid-placement mode)
        const showGrid = !isPhotoMode && !isExploded && hoveredHit !== null &&
          (selectedTool === 'delete' || !assetsById[selectedTool]?.def.freePlace);
        const targetGridAlpha = showGrid ? 1.0 : 0.0;
        gridMat.uniforms.uGridAlpha.value += (targetGridAlpha - gridMat.uniforms.uGridAlpha.value) * Math.min(1, dt * 10);
        if (hoveredHit) {
          gridMat.uniforms.uCursorXZ.value.set(hoveredHit.wx, hoveredHit.wz);
        }

        // --- EXPLODED VIEW: Clean 4-Tier Non-Overlapping Hierarchy ---
        // Tier 0 (Strata): Bedrock (-1.70), Subsoil (-0.80)
        // Tier 1 (Terrain & Ground Props): TopSurface/Hills/Paths/Grass (0.0), Cabin Floor (+0.34), Ground Props (+0.42)
        // Tier 2 (Walls & Tree Trunks): Cabin Walls (+1.68), Tree Trunks & Lanterns (+1.28 relative to hill!)
        // Tier 3 (Roof & Foliage): Cabin Roof (+3.15), Tree Canopies (+2.62 relative to hill!)
        const sinceToggle = elapsed - explodeToggleTime;
        const pTop      = evalLayerProgress(sinceToggle, 0.00, 0.14);
        const pMid      = evalLayerProgress(sinceToggle, 0.035, 0.105);
        const pProps    = evalLayerProgress(sinceToggle, 0.07, 0.07);
        const pSubsoil  = evalLayerProgress(sinceToggle, 0.105, 0.035);
        const pBedrock  = evalLayerProgress(sinceToggle, 0.14, 0.00);

        const twTop     = evalTransitTwist(sinceToggle, 0.00, 0.14) * 0.044;
        const twMid     = evalTransitTwist(sinceToggle, 0.035, 0.105) * -0.034;
        const twSubsoil = evalTransitTwist(sinceToggle, 0.105, 0.035) * -0.024;
        const twBedrock = evalTransitTwist(sinceToggle, 0.14, 0.00) * 0.030;

        // 1. Earth Cross-Section Strata Drop (wide clean gaps below topsoil)
        chunkSubsoil.position.y = pSubsoil * -0.80;
        chunkSubsoil.rotation.y = twSubsoil;
        chunkBedrock.position.y = pBedrock * -1.70;
        chunkBedrock.rotation.y = twBedrock;

        // 2. Ground Props (Fences, Rocks, Flowers, Reeds, Campfire) & Split Trees (Trunk -> Mid, Canopy -> Top)
        fenceGroup.position.y = pProps * 0.42;
        sharedUniforms.uExplodePropLift.value = pProps * 0.42;
        sharedUniforms.uExplodeMidLift.value  = pMid * 1.28;
        sharedUniforms.uExplodeTopLift.value  = pTop * 2.62;
        sharedUniforms.uExplodeSpread.value   = pMid * 0.34;
        sharedUniforms.uExplodeTwist.value    = twMid;

        // 3. 3-Chunk Storybook Cabin Separation (cleanly aligned with the 4 macro tiers)
        for (let i = 0; i < activeCabins.length; i++) {
          const cb = activeCabins[i];
          const { chunkInterior, chunkWalls, chunkRoof } = cb.mesh.userData;
          chunkInterior.position.y = pProps * 0.34;
          chunkWalls.position.y = pMid * 1.68;
          chunkWalls.rotation.y = twMid;
          chunkRoof.position.y = pTop * 3.15;
          chunkRoof.rotation.y = twTop;

          // LEGO-style part-by-part drop for newly placed cabins
          const ud = cb.mesh.userData;
          if (!ud.dropDone && ud.dropParts) {
            const since = elapsed - cb.spawnT;
            const done = since > cabinDropTotal() + 0.2;
            for (const pt of ud.dropParts) {
              const tl = since - pt.g * CABIN_STRIDE;
              if (done || tl >= DROP_FALL) {
                pt.obj.visible = pt.visible; pt.obj.position.y = pt.baseY; pt.obj.rotation.z = pt.baseRZ;
              } else if (tl < 0) {
                pt.obj.visible = false;
              } else {
                const e = (tl / DROP_FALL) ** 2;
                pt.obj.visible = pt.visible;
                pt.obj.position.y = pt.baseY + (1 - e) * 1.1;
                pt.obj.rotation.z = pt.baseRZ + pt.ang * (1 - e);
              }
            }
            const u = since - (cabinDropTotal() - 0.03);
            let sy = 1;
            if (u > 0 && u < 0.14) {
              sy = u < 0.045 ? THREE.MathUtils.lerp(1, 0.85, u / 0.045)
                 : (u < 0.10 ? THREE.MathUtils.lerp(0.85, 1.05, (u - 0.045) / 0.055)
                             : THREE.MathUtils.lerp(1.05, 1, (u - 0.10) / 0.04));
            }
            const sxz = 1 + (1 - sy) * 0.45;
            cb.mesh.scale.set(sxz, sy, sxz);
            if (done) { ud.dropDone = true; cb.mesh.scale.set(1, 1, 1); mergeCabinPrefab(cb.mesh); markShadowsDirty(); }
          }
        }

        // Startup assembly / reset crumble: island layers, water, paths, fence (section 17)
        if (intro.phase === 'assemble' || intro.phase === 'crumble') updateIntro(elapsed);
        updateIntroFx(elapsed); // impact rings + ignition sparkles (hidden when idle)

        // 4. Height-Proportional Contact Shadows (shift along key light & soften alpha as layers float!)
        const shadowFade = THREE.MathUtils.clamp(1.0 - pMid * 0.58, 0.32, 1.0);
        csMat.opacity = shadowFade * introShadowK(elapsed);
        const csChanged = pMid !== csLast.pMid || pProps !== csLast.pProps || contactShadowBaseList !== csLast.list;
        csLast.pMid = pMid; csLast.pProps = pProps; csLast.list = contactShadowBaseList;
        for (let i = 0; csChanged && i < contactShadowBaseList.length; i++) {
          const cs = contactShadowBaseList[i];
          const lift = cs.tier === 2 ? pMid * 1.4 : (cs.tier === 1 ? pMid * 1.1 : pProps * 0.42);
          animDummy.position.set(cs.x - lift * 0.34, cs.y, cs.z - lift * 0.26);
          animDummy.rotation.set(0, 0, 0);
          const sc = cs.r * (1.0 + lift * 0.18);
          animDummy.scale.set(sc, 1, sc);
          animDummy.updateMatrix();
          contactShadowInst.setMatrixAt(i, animDummy.matrix);
        }
        contactShadowInst.count = contactShadowBaseList.length;
        if (csChanged) contactShadowInst.instanceMatrix.needsUpdate = true;

        // 5. Smooth 3-Point Lighting & Atmosphere interpolation
        const lr = Math.min(1, dt * 2.5);
        curAtmo.skyTop.lerp(targetAtmo.skyTop, lr);
        curAtmo.skyBottom.lerp(targetAtmo.skyBottom, lr);
        curAtmo.keyColor.lerp(targetAtmo.keyColor, lr);
        curAtmo.keyIntensity += (targetAtmo.keyIntensity - curAtmo.keyIntensity) * lr;
        curAtmo.fillColor.lerp(targetAtmo.fillColor, lr);
        curAtmo.fillIntensity += (targetAtmo.fillIntensity - curAtmo.fillIntensity) * lr;
        curAtmo.rimColor.lerp(targetAtmo.rimColor, lr);
        curAtmo.rimIntensity += (targetAtmo.rimIntensity - curAtmo.rimIntensity) * lr;
        curAtmo.hemiSky.lerp(targetAtmo.hemiSky, lr);
        curAtmo.hemiGround.lerp(targetAtmo.hemiGround, lr);
        curAtmo.hemiIntensity += (targetAtmo.hemiIntensity - curAtmo.hemiIntensity) * lr;
        curAtmo.fogColor.lerp(targetAtmo.fogColor, lr);
        curAtmo.fogDensity += (targetAtmo.fogDensity - curAtmo.fogDensity) * lr;
        curAtmo.waterDeep.lerp(targetAtmo.waterDeep, lr);
        curAtmo.waterShallow.lerp(targetAtmo.waterShallow, lr);
        curAtmo.waterFoam.lerp(targetAtmo.waterFoam, lr);
        curAtmo.gradeTint.lerp(targetAtmo.gradeTint, lr);
        curAtmo.gradeWarmth += (targetAtmo.gradeWarmth - curAtmo.gradeWarmth) * lr;
        curAtmo.nightFactor += (targetAtmo.nightFactor - curAtmo.nightFactor) * lr;
        curAtmo.pointIntensity += (targetAtmo.pointIntensity - curAtmo.pointIntensity) * lr;

        keyLight.color.copy(curAtmo.keyColor); keyLight.intensity = curAtmo.keyIntensity;
        fillLight.color.copy(curAtmo.fillColor); fillLight.intensity = curAtmo.fillIntensity;
        rimLight.color.copy(curAtmo.rimColor); rimLight.intensity = curAtmo.rimIntensity;
        hemiLight.color.copy(curAtmo.hemiSky); hemiLight.groundColor.copy(curAtmo.hemiGround);
        hemiLight.intensity = curAtmo.hemiIntensity;

        sharedUniforms.uSkyTop.value.copy(curAtmo.skyTop);
        sharedUniforms.uSkyBottom.value.copy(curAtmo.skyBottom);
        sharedUniforms.uFogColor.value.copy(curAtmo.fogColor);
        sharedUniforms.uFogDensity.value = curAtmo.fogDensity;
        sharedUniforms.uWaterDeep.value.copy(curAtmo.waterDeep);
        sharedUniforms.uWaterShallow.value.copy(curAtmo.waterShallow);
        sharedUniforms.uWaterFoam.value.copy(curAtmo.waterFoam);
        sharedUniforms.uGradeTint.value.copy(curAtmo.gradeTint);
        sharedUniforms.uGradeWarmth.value = curAtmo.gradeWarmth;
        sharedUniforms.uNightFactor.value = curAtmo.nightFactor;

        mistMat.uniforms.uColor.value.copy(curAtmo.fogColor); // drifts in its shader (uTime)
        mistMat.uniforms.uOpacity.value = curAtmo.fogDensity * 0.42;

        // 6. Warm PointLights & Glowing Halos synced with exploded elevation
        const glowPower = THREE.MathUtils.smoothstep(curAtmo.nightFactor, 0.15, 0.9);
        for (let i = 0; i < activeGlowSprites.length; i++) {
          const g = activeGlowSprites[i];
          const flick = g.flicker
            ? fireFlicker(elapsed, g.seed)
            : (0.95 + 0.05 * noise1(elapsed * 1.7, g.seed));
          g.sprite.material.opacity = glowPower * 0.72 * flick * introLightK(g.sprite.position.x, g.sprite.position.z, elapsed);
          const liftY = g.isCabin ? pMid * 1.68 : (g.tier === 1 ? pMid * 1.28 : pProps * 0.42);
          g.sprite.position.y = g.baseY + liftY;
          const sc = g.baseScale * (0.94 + 0.08 * flick);
          g.sprite.scale.set(sc, sc, 1);
        }
        updatePointLights(dt, elapsed, pMid, pProps);

        updateCampfireFx(dt, elapsed, pProps * 0.42);
        // campfire crackle: louder when zoomed in and when a fire is near the view center
        fireAudioTimer -= dt;
        if (fireAudioTimer <= 0 && audio.ctx) {
          fireAudioTimer = 0.25;
          let best = null, bestD = Infinity;
          for (const f of campfireSpots) { const d = Math.hypot(f.x - camPan.x, f.z - camPan.y); if (d < bestD) { bestD = d; best = f; } }
          const zoomK = THREE.MathUtils.clamp((62 - camDist) / 46, 0, 1) * 0.75 + 0.25;
          const level = best ? THREE.MathUtils.clamp(1.1 - bestD / 9, 0, 1) * zoomK * Math.min(1, 0.7 + 0.15 * campfireSpots.length) : 0;
          audio.setFire(level, best ? screenPan(best.x, best.y, best.z) : 0);
        }
        audio.updateFire(dt);
        // waterfalls: babble from the one nearest the view centre, ripple rings at the 8 nearest
        fallAudioTimer -= dt;
        if (fallAudioTimer <= 0 && audio.ctx) {
          fallAudioTimer = 0.25;
          let best = null, bestD = Infinity;
          for (const f of fallFeet) { const d = Math.hypot(f.x - camPan.x, f.z - camPan.y); if (d < bestD) { bestD = d; best = f; } }
          const zoomK = THREE.MathUtils.clamp((62 - camDist) / 46, 0, 1) * 0.75 + 0.25;
          const level = best ? THREE.MathUtils.clamp(1.1 - bestD / 9, 0, 1) * zoomK * Math.min(1, 0.75 + 0.05 * fallFeet.length) * fallMat.uniforms.uK.value : 0;
          audio.setFalls(level, best ? screenPan(best.x, best.y, best.z) : 0);
        }
        audio.updateFalls(dt);
        if (fallFeet.length || waterMat.uniforms.uRipN.value) {
          ripSort.length = 0;
          for (const f of fallLines) { // nearest point of each foot line to the screen centre
            const t = THREE.MathUtils.clamp((camPan.x - f.x) * f.ax + (camPan.y - f.z) * f.az, -f.half, f.half);
            f.d = Math.hypot(f.x + f.ax * t - camPan.x, f.z + f.az * t - camPan.y); ripSort.push(f);
          }
          ripSort.sort((a, b) => a.d - b.d);
          const n = Math.min(8, ripSort.length), rip = waterMat.uniforms.uRip.value, ripL = waterMat.uniforms.uRipL.value;
          for (let i = 0; i < n; i++) { const f = ripSort[i]; rip[i].set(f.x, f.z, fallMat.uniforms.uK.value); ripL[i].set(f.ax, f.az, f.half); }
          waterMat.uniforms.uRipN.value = n;
        }

        // 7. Chimney smoke: puffs are emitted at the chimney mouth (tracked through roof lift / tilt) and then
        //    move analytically from their birth time; the S-curve sway is a wave travelling up the whole column.
        //    Translucent, so the live puffs are sorted far -> near before they are written to the instance buffer.
        let smN = 0;
        const liveSmoke = new Set();
        camera.getWorldDirection(smokeViewDir);
        for (let c = 0; c < activeCabins.length; c++) {
          const cb = activeCabins[c];
          const { chunkRoof } = cb.mesh.userData;
          const key = `${cb.baseX.toFixed(2)},${cb.baseZ.toFixed(2)}`;
          liveSmoke.add(key);
          tmpWorldPos.copy(SMOKE.mouth);
          chunkRoof.localToWorld(tmpWorldPos);
          islandRoot.worldToLocal(tmpWorldPos); // smoke lives under islandRoot
          const smokeK = Math.min(1, introLightK(cb.baseX, cb.baseZ, elapsed)); // chimney starts once the cabin is lit
          let st = smokeStates.get(key);
          const newPuff = (born) => {
            const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random());
            st.puffs.push({ born, ox: tmpWorldPos.x, oy: tmpWorldPos.y, oz: tmpWorldPos.z, s: 0.8 + Math.random() * 0.45,
              jx: Math.cos(a) * r, jz: Math.sin(a) * r, seed: Math.random(), spin: (Math.random() - 0.5) * 0.8, heat: smokeK });
          };
          if (!st) {
            // a chimney placed outside the startup assembly is already burning: start with a full column
            st = { acc: 0, last: intro.phase === 'done' ? elapsed - SMOKE.life : elapsed, seed: Math.random() * 6.28, puffs: [] };
            smokeStates.set(key, st);
          }
          // emit by elapsed time (not the clamped dt) so slow frames still stream evenly; births are spread over the gap
          const gap = Math.min(SMOKE.life, Math.max(0, elapsed - st.last));
          st.acc += gap * SMOKE.rate * (intro.phase === 'done' ? 1 : smokeK);
          while (st.acc >= 1) { st.acc -= 1; newPuff(elapsed - st.acc / SMOKE.rate); }
          st.last = elapsed;
          while (st.puffs.length && elapsed - st.puffs[0].born > SMOKE.life) st.puffs.shift();

          const wx = SMOKE.wind.x, wz = SMOKE.wind.y; // downwind; (-wz, wx) is across the wind
          for (const p of st.puffs) {
            if (smN >= MAX_SMOKE_PUFFS) break;
            const t = Math.max(0, elapsed - p.born), a = t / SMOKE.life;
            const h = 0.21 * t + 0.1 * (1 - Math.exp(-1.5 * t));              // a lazy, nearly even climb (no flue pressure)
            const drift = 0.03 * t + 0.016 * t * t;                             // the breeze bends the column more as it rises
            const reach = THREE.MathUtils.smoothstep(h, 0.0, 0.6);
            const across = Math.sin(h * 2.0 - elapsed * 0.55 + st.seed) * 0.16 * reach;
            const along = Math.cos(h * 1.5 - elapsed * 0.4 + st.seed) * 0.05 * reach;
            const jit = 0.015 + 0.16 * a;                                       // the column loosens into separate billows
            const d = smokeDraw[smN++];
            d.x = p.ox + wx * (drift + along) - wz * across + p.jx * jit;
            d.y = p.oy + h;
            d.z = p.oz + wz * (drift + along) + wx * across + p.jz * jit;
            // seep out small and swell gently; a slight shrink at the very end while it thins away
            d.size = (0.055 + 0.1 * (1 - Math.exp(-0.9 * t)) + 0.016 * t) * (1 - 0.2 * THREE.MathUtils.smoothstep(a, 0.8, 1.0)) * p.s;
            d.rx = p.spin * t; d.ry = p.seed * 6.28 + p.spin * t * 0.7;
            d.a = a; d.seed = p.seed; d.heat = p.heat;
            d.erode = THREE.MathUtils.lerp(-0.25, 0.85, THREE.MathUtils.smoothstep(a, 0.3, 1.0));
            d.depth = d.x * smokeViewDir.x + d.y * smokeViewDir.y + d.z * smokeViewDir.z;
          }
        }
        for (const key of smokeStates.keys()) if (!liveSmoke.has(key)) smokeStates.delete(key);
        const smSorted = smokeDraw.slice(0, smN).sort((p, q) => q.depth - p.depth);
        const smokeArr = aSmoke.array;
        for (let i = 0; i < smN; i++) {
          const d = smSorted[i];
          animDummy.position.set(d.x, d.y, d.z);
          animDummy.rotation.set(d.rx, d.ry, 0);
          animDummy.scale.set(d.size, d.size * 0.92, d.size);
          animDummy.updateMatrix();
          smokeInst.setMatrixAt(i, animDummy.matrix);
          smokeArr[i * 4] = d.a; smokeArr[i * 4 + 1] = d.seed; smokeArr[i * 4 + 2] = d.erode; smokeArr[i * 4 + 3] = d.heat;
        }
        smokeInst.count = smN;
        smokeInst.instanceMatrix.needsUpdate = true;
        aSmoke.needsUpdate = true;

        // 8. Swirling Pastel Flower Petals
        for (let i = 0; i < PETAL_COUNT; i++) {
          const pd = petalData[i];
          const fallY = ((pd.by - elapsed * pd.speed) % 4.6 + 4.6) % 4.6 + 0.15;
          animDummy.position.set(
            pd.bx + Math.sin(elapsed * 0.9 + pd.seed) * 0.75,
            fallY,
            pd.bz + Math.cos(elapsed * 0.75 + pd.seed * 1.3) * 0.75
          );
          animDummy.rotation.set(elapsed * 1.4 + pd.seed, elapsed * 1.1, elapsed * 0.8);
          animDummy.scale.setScalar(1.0 - curAtmo.nightFactor * 0.35);
          animDummy.updateMatrix();
          petalInst.setMatrixAt(i, animDummy.matrix);
        }
        petalInst.instanceMatrix.needsUpdate = true;

        // Hover bob on ghost
        if (hoveredHit && selectedTool !== 'delete' && !isPhotoMode && !isExploded) {
          const ghost = ghostMeshesById[selectedTool];
          if (ghost && ghost.visible) {
            const def = assetsById[selectedTool].def;
            const baseY = def.snapPlace ? (ghost.userData.baseY ?? hoveredHit.wy) : (def.freePlace ? hoveredHit.wy : getTileElevation(hoveredHit.gx, hoveredHit.gz));
            ghost.position.y = baseY + 0.03 + Math.sin(elapsed * 5.0) * 0.025;
          }
        }

        renderer.info.reset();
        if (performance.now() * 0.001 <= shadowHoldUntil || HASH.noopt === '1') renderer.shadowMap.needsUpdate = true;
        // Pass 1: Render 3D scene to WebGLRenderTarget
        renderer.setRenderTarget(renderTarget);
        renderer.setClearColor(0x000000, 0);
        renderer.clear();
        renderer.render(scene, camera);

        // Pass 2: Low-res post pipeline (AO + lit mist -> depth tilt-shift -> bloom -> grade + dither)
        runPostPipeline();

        // Pass 3: Sharp upscale to the screen + film grain
        upMat.uniforms.uSeed.value = (elapsed * 60 % 1000) * 7.13;
        renderer.setRenderTarget(null);
        renderer.render(upScene, postCamera);
        if (thumbWaiting.length) captureThumb(); // same task as the draw: the canvas still holds this frame
        // behind the loader the finished island is drawn a few times first, so every shader and the
        // shadow map are compiled before the player presses start (no hitch when the assembly begins)
        if (intro.phase === 'boot' && ++bootFrames === 3) onBootReady();
        trackPerformance(rawFrameDt);
        // #fps=1 also writes a draw-call snapshot (frame 12 and an idle frame 150) to <body data-bench> and the console
        if (fpsEl && (++benchFrame === 3 || benchFrame === 150)) {
          let cabinMeshes = 0, sceneMeshes = 0, casters = 0;
          cabinGroupContainer.traverse((o) => { if (o.isMesh) cabinMeshes++; });
          scene.traverse((o) => { if (o.isMesh && o.visible) { sceneMeshes++; if (o.castShadow) casters++; } });
          const line = '[f' + benchFrame + '] calls ' + renderer.info.render.calls + ' tris ' + renderer.info.render.triangles
            + ' programs ' + renderer.info.programs.length + ' geos ' + renderer.info.memory.geometries
            + ' | meshes ' + sceneMeshes + ' casters ' + casters + ' cabinMeshes ' + cabinMeshes;
          document.body.dataset.bench = (document.body.dataset.bench || '') + line + ' ';
          console.log('[mori-bench] ' + line);
        }
      }
      let benchFrame = 0, frameNo = 0, debugClock = null;
      let fireAudioTimer = 0, fallAudioTimer = 0;
      const ripSort = [];
      const csLast = { pMid: -1, pProps: -1, list: null };

      /* =======================================================================
         17. STARTUP ASSEMBLY (black -> fade in while the island stacks itself -> HUD)
             Like Cinderwatch's board rise, but Lego-style: the three island layers drop in one
             by one (bedrock, subsoil, grass + hills) with impact rings, the pond fills, then
             everything on top drops with the usual stacked-drop shader (spawn times set in the
             future, back to front), lamps light up one by one with pixel star sparkles and the HUD
             hops in. "처음 섬으로" first lets the island fall away, then assembles it again.
             No skipping; input is held back until it is done (wheel zoom still works).
             #intro=0 turns it off; it is off by default with #debug=1 (tests want a finished
             island at once), #debug=1&intro=1 turns it back on.
         ======================================================================= */
      const INTRO_ON = HASH.intro !== undefined ? HASH.intro !== '0' : HASH.debug !== '1';
      const IT = {                        // seconds after the start (3.4 s + settle)
        layers: [0.0, 0.25, 0.5],         // bedrock, subsoil, grass + hills start falling
        layerFall: 0.42, layerFrom: 12,   // fall time and height (starts above the screen)
        water: 1.0,                       // pond fills, lily pads pop
        big: [1.2, 0.8],                  // cabins and trees: start, back-to-front spread
        small: [2.0, 0.5],                // props, flowers, rocks
        path: 2.0, fence: 2.1,
        light: [2.6, 0.4],                // lamps and fires catch, one after another
        ui: 3.0, end: 3.6
      };
      const FIRST_LEAD = 0.45;            // the black starts fading this long before the first layer falls
      const CRUMBLE_HOLD = 0.2, CRUMBLE_LEN = 0.95; // tremble, then the whole island drops away
      const WATER_Y = waterMesh.position.y, WATER_FROM = WATER_Y - 0.4;
      const LAYER_EDGE = [[-1.40, 5.45], [-0.60, 5.85], [0.0, 5.95]]; // top y and half width of each layer
      const introLayers = [chunkBedrock, chunkSubsoil, chunkTopSurface];
      const loaderEl = document.getElementById('loader');
      const intro = { phase: INTRO_ON ? 'boot' : 'done', t0: 0, withUI: false, ignite: [] };
      let bootFrames = 0;
      if (!INTRO_ON) document.body.classList.remove('booting');

      // 0 = the far (hill) corner, 1 = the near corner of the default view
      const introDiag = (x, z) => THREE.MathUtils.clamp((x + z + GRID_SIZE) / (2 * GRID_SIZE), 0, 1);
      const introIsBig = (def) => !def.freePlace && (def.type === '3d_cabin' || def.category === 'flora');
      function introFx(at, fn) { pendingFx.push({ t: at, fn, intro: true }); }

      // lamp / fire brightness: 0 until its turn, a short warm flare, then 1; fades out in a crumble.
      // Turns come from intro.ignite (one light after another, back to front); sprites, pool lights,
      // flames and chimney smoke look up the nearest entry
      function introIgniteAt(x, z) {
        let at = null, bd = 1.2;
        for (const g of intro.ignite) { const d = Math.abs(g.x - x) + Math.abs(g.z - z); if (d < bd) { bd = d; at = g.t; } }
        return at !== null ? at : intro.t0 + IT.light[0] + introDiag(x, z) * IT.light[1];
      }
      function introLightK(x, z, now) {
        if (intro.phase === 'crumble') return Math.max(0, 1 - (now - intro.t0) * 4);
        if (intro.phase !== 'assemble') return 1;
        const u = now - introIgniteAt(x, z);
        if (u <= 0) return 0;
        return Math.min(1, u / 0.08) * (1 + 1.3 * Math.exp(-u * 5));
      }
      // contact shadows fade in with the objects that cast them
      function introShadowK(now) {
        if (intro.phase !== 'assemble') return 1;
        return THREE.MathUtils.smoothstep(now - intro.t0, IT.big[0], IT.small[0] + IT.small[1] + 0.3);
      }
      const popScale = (u) => (u <= 0 ? 0.0001 : (u >= 1 ? 1 : easeOutBack(u)));

      // --- impact rings: a cream ring skims out over the ground when something heavy lands
      // (island layers: rounded square hugging the island edge; cabins: a circle). Constant
      // world-space width, drawn in the low-res scene so it reads as a pixel ring.
      const RING_POOL = 4;
      const ringGeo2 = new THREE.PlaneGeometry(2, 2); ringGeo2.rotateX(-Math.PI / 2);
      const impactRings = [];
      for (let i = 0; i < RING_POOL; i++) {
        const mat = new THREE.ShaderMaterial({
          uniforms: { uR: { value: 0 }, uW: { value: 0.1 }, uA: { value: 0 }, uHalf: { value: 1 }, uExp: { value: 2 } },
          vertexShader: `
            varying vec2 vP;
            void main() { vP = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `
            uniform float uR; uniform float uW; uniform float uA; uniform float uHalf; uniform float uExp;
            varying vec2 vP;
            void main() {
              vec2 p = abs(vP) * uHalf;
              float d = pow(pow(p.x, uExp) + pow(p.y, uExp), 1.0 / uExp);
              float band = 1.0 - smoothstep(uW * 0.45, uW, abs(d - uR));
              float trail = smoothstep(uR - uW * 5.0, uR, d) * step(d, uR) * 0.22; // faint wash behind the front
              float a = max(band, trail) * uA;
              if (a < 0.01) discard;
              gl_FragColor = vec4(vec3(1.0, 0.95, 0.84) * 1.15, a);
            }`,
          transparent: true,
          depthWrite: false
        });
        const mesh = new THREE.Mesh(ringGeo2, mat);
        mesh.visible = false;
        mesh.frustumCulled = false;
        mesh.renderOrder = 2;
        scene.add(mesh);
        impactRings.push({ mesh, t0: -100, dur: 1 });
      }
      function spawnRing(at, x, y, z, { r0, r1, w, a, exp, dur }) {
        let ring = impactRings[0];
        for (const r of impactRings) if (r.t0 + r.dur < ring.t0 + ring.dur) ring = r; // free or oldest
        Object.assign(ring, { t0: at, dur, r0, r1, w, a });
        ring.mesh.position.set(x, y, z);
        const half = r1 + w;
        ring.mesh.scale.set(half, 1, half);
        const u = ring.mesh.material.uniforms;
        u.uHalf.value = half; u.uExp.value = exp;
      }
      const layerRing = (half) => ({ r0: half, r1: half + 2.6, w: 0.2, a: 0.6, exp: 8, dur: 0.55 });
      const CABIN_RING = { r0: 0.35, r1: 1.55, w: 0.11, a: 0.7, exp: 2, dur: 0.45 };

      // --- pixel star sparkles: little 4-point stars twinkle out of a lamp or fire as it catches
      const SPARK_COUNT = 64;
      const sparkPos = new Float32Array(SPARK_COUNT * 3), sparkLife = new Float32Array(SPARK_COUNT), sparkSize = new Float32Array(SPARK_COUNT);
      const sparks = Array.from({ length: SPARK_COUNT }, () => ({ t0: -100, dur: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 }));
      const sparkGeo = new THREE.BufferGeometry();
      sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
      sparkGeo.setAttribute('aLife', new THREE.BufferAttribute(sparkLife, 1));
      sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(sparkSize, 1));
      const sparkPoints = new THREE.Points(sparkGeo, new THREE.ShaderMaterial({
        uniforms: { uPx: sharedUniforms.uPointScale, uNightFactor: sharedUniforms.uNightFactor },
        vertexShader: `
          attribute float aLife; attribute float aSize; uniform float uPx; varying float vLife;
          void main() {
            vLife = aLife;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            float grow = sin(clamp(aLife, 0.0, 1.0) * 3.14159); // pops open, then closes
            gl_PointSize = aLife > 0.0 ? max(1.0, floor(aSize * uPx * (0.35 + 0.65 * grow) + 0.5)) : 0.0;
          }`,
        fragmentShader: `
          uniform float uNightFactor; varying float vLife;
          void main() {
            if (vLife <= 0.0) discard;
            vec2 c = abs(gl_PointCoord - 0.5) * 2.0;           // 0 centre .. 1 edge
            float arms = max(step(c.x, 0.15) * (1.0 - c.y), step(c.y, 0.15) * (1.0 - c.x));
            float core = step(max(c.x, c.y), 0.3);
            float a = max(arms * 1.15, core);
            if (a < 0.12) discard;
            vec3 col = mix(vec3(1.0, 0.72, 0.3), vec3(1.0, 0.95, 0.78), core);
            gl_FragColor = vec4(col * mix(1.5, 2.8, uNightFactor) * a * (1.0 - vLife * 0.5), 1.0);
          }`,
        // no depth test: the light source often sits inside its object (a cabin window light is
        // behind the walls), and a glint that brief reads fine even when it shows through
        transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending
      }));
      sparkPoints.frustumCulled = false;
      sparkPoints.renderOrder = 3;
      sparkPoints.visible = false;
      scene.add(sparkPoints);
      let sparkCursor = 0;
      function spawnSparks(at, x, y, z, n = 7) {
        for (let k = 0; k < n; k++) {
          const idx = sparkCursor, s = sparks[idx]; sparkCursor = (sparkCursor + 1) % SPARK_COUNT;
          const a = (k / n) * Math.PI * 2 + Math.random() * 0.6, r = 0.16 + Math.random() * 0.26;
          Object.assign(s, {
            t0: at + k * 0.035 + Math.random() * 0.03, dur: 0.42 + Math.random() * 0.2,
            x: x + Math.cos(a) * r, y: y + Math.random() * 0.35, z: z + Math.sin(a) * r,
            vx: Math.cos(a) * 0.25, vy: 0.3 + Math.random() * 0.25, vz: Math.sin(a) * 0.25
          });
          sparkSize[idx] = 10 + Math.random() * 4; // x uPointScale: 5~7 scene pixels at full size, a clear 4-point star
        }
        sparkGeo.attributes.aSize.needsUpdate = true;
      }

      // rings and sparkles are pure functions of the clock (so a held debug clock shows them too);
      // both stay hidden (no draw call) when idle
      let introFxWasActive = false;
      function updateIntroFx(now) {
        let any = false;
        for (const r of impactRings) {
          const u = (now - r.t0) / r.dur;
          const on = u >= 0 && u < 1;
          r.mesh.visible = on;
          if (!on) continue;
          any = true;
          const e = 1 - (1 - u) ** 3, uni = r.mesh.material.uniforms;
          uni.uR.value = r.r0 + (r.r1 - r.r0) * e;
          uni.uW.value = r.w * (1 - 0.5 * u);
          uni.uA.value = r.a * (1 - u) ** 1.5;
        }
        let lit = false;
        for (let i = 0; i < SPARK_COUNT; i++) {
          const s = sparks[i], age = now - s.t0, p = age / s.dur;
          if (p < 0 || p >= 1) { sparkLife[i] = 0; continue; }
          lit = true;
          sparkLife[i] = Math.max(p, 0.001);
          sparkPos[i * 3] = s.x + s.vx * age;
          sparkPos[i * 3 + 1] = s.y + s.vy * age;
          sparkPos[i * 3 + 2] = s.z + s.vz * age;
        }
        if (lit || introFxWasActive) {
          sparkGeo.attributes.position.needsUpdate = true;
          sparkGeo.attributes.aLife.needsUpdate = true;
        }
        sparkPoints.visible = lit;
        introFxWasActive = lit;
        return any || lit;
      }

      // per frame while assembling or crumbling (called from animate after the exploded-view code,
      // which sets the subsoil / bedrock / fence heights every frame; offsets are added on top)
      function updateIntro(now) {
        const u = now - intro.t0;
        if (intro.phase === 'crumble') {
          if (u < CRUMBLE_HOLD) { // tremble
            const k = u / CRUMBLE_HOLD;
            islandRoot.position.set(Math.sin(u * 95) * 0.035 * k, 0, Math.cos(u * 83) * 0.03 * k);
          } else {
            const v = u - CRUMBLE_HOLD; // gravity, with a slight tip forward
            islandRoot.position.set(0, -(16 * v * v + 1.2 * v), 0);
            islandRoot.rotation.set(v * 0.16, 0, -v * 0.1);
          }
          return;
        }
        // island layers: fall, land, small rebound with a sideways bulge
        for (let i = 0; i < 3; i++) {
          const ch = introLayers[i], t = u - IT.layers[i];
          ch.visible = t >= 0;
          let off = 0, bulge = 1;
          if (t >= 0 && t < IT.layerFall) { const p = t / IT.layerFall; off = IT.layerFrom * (1 - p * p); }
          else if (t >= IT.layerFall) {
            const v = (t - IT.layerFall) / 0.3;
            if (v < 1) { const s = Math.sin(v * Math.PI) * (1 - v); off = s * 0.1; bulge = 1 + s * 0.03; }
          }
          if (i === 2) ch.position.y = off; else ch.position.y += off;
          ch.scale.set(bulge, 1, bulge);
        }
        // pond fills, then the lily pads pop up one by one
        const w = (u - IT.water) / 0.45;
        waterMesh.visible = w > 0;
        waterMesh.position.y = THREE.MathUtils.lerp(WATER_FROM, WATER_Y, popScale(w));
        fallMat.uniforms.uK.value = THREE.MathUtils.clamp((u - IT.water - 0.3) / 0.6, 0, 1); // falls start running once it is full
        lilyParts.forEach((lp, i) => {
          const s = popScale((u - IT.water - 0.22 - i * 0.09) / 0.28);
          for (const m of lp.meshes) m.scale.setScalar(s);
        });
        // paths appear, the fence drops in as one piece
        const pathOn = u >= IT.path;
        for (const im of [pathMesh]) im.visible = pathOn && im.count > 0;
        crateClutterInst.visible = u >= IT.small[0] && crateClutterInst.count > 0;
        const f = u - IT.fence;
        fenceGroup.visible = f >= 0;
        if (f >= 0 && f < 0.16) fenceGroup.position.y += 1.2 * (1 - (f / 0.16) ** 2);
        petalInst.visible = u >= IT.layers[2] + IT.layerFall;
        if (u >= IT.end) finishIntro();
      }

      // dust thrown out along the four edges of a layer that just landed
      function dustRing(y, half) {
        for (let s = 0; s < 4; s++) for (let k = 0; k < 5; k++) {
          const f = ((k + 0.5) / 5) * 2 - 1;
          const [x, z] = [[f * half, half], [f * half, -half], [half, f * half], [-half, f * half]][s];
          burstDust(x, y, z, 3, 0.5);
        }
      }
      function introShake(amp) { shakeStart = performance.now() * 0.001; shakeAmp = amp; }

      // spawn times for everything on the island + the juice for each landing
      function startAssembly(withUI, lead = 0.12) {
        const t0 = performance.now() * 0.001 + lead;
        intro.phase = 'assemble'; intro.t0 = t0; intro.withUI = withUI;
        smokeStates.clear(); // drop smoke left from the hidden warm-up frames / the island that just fell
        isExploded = false; explodeToggleTime = -10;
        hoveredHit = null; updateHoverVisuals();
        islandRoot.position.set(0, 0, 0); islandRoot.rotation.set(0, 0, 0);

        const events = [];
        const spawnAt = (def, x, z) => {
          const [a, span] = introIsBig(def) ? IT.big : IT.small;
          return t0 + a + introDiag(x, z) * span + Math.random() * 0.04;
        };
        const landing = (def, x, y, z, spawn) => {
          const top = def.type === '3d_cabin' ? cabinDropTotal() : (isInstancedDef(def) ? dropTotalTime(def.layers) : 0);
          events.push({ def, x, y, z, first: spawn + (top ? DROP_FALL : 0), top: spawn + top });
        };
        placedItems.forEach((e) => {
          const def = assetsById[e.id].def;
          const x = e.gx - HALF_GRID + 0.5, z = e.gz - HALF_GRID + 0.5, y = getTileElevation(e.gx, e.gz);
          if (def.type === 'auto_path' || def.type === 'auto_fence') { // no drop shader: they snap in
            e.spawnT = -100;
            landing(def, x, y, z, t0 + (def.type === 'auto_path' ? IT.path : IT.fence + 0.16) + introDiag(x, z) * 0.12);
            return;
          }
          e.spawnT = spawnAt(def, x, z);
          landing(def, x, y, z, e.spawnT);
        });
        freeProps.forEach((fp) => {
          const def = assetsById[fp.id].def;
          fp.spawnT = spawnAt(def, fp.wx, fp.wz);
          landing(def, fp.wx, getContinuousTerrainHeight(fp.wx, fp.wz), fp.wz, fp.spawnT);
        });
        snapProps.forEach((o) => {
          const def = assetsById[o.id].def;
          o.spawnT = spawnAt(def, o.wx, o.wz);
          landing(def, o.wx, snapGroundY(def, o.wx, o.wz, o.rotation), o.wz, o.spawnT);
        });
        seedFlowers.forEach((f) => { if (f.erased) return; f.spawnT = t0 + IT.small[0] + 0.25 + introDiag(f.wx, f.wz) * IT.small[1] + Math.random() * 0.15; f.goneAt = null; });
        rebuildInstances(); // (refills the seed flowers too)
        markShadowsDirty(IT.end + lead + 0.4); // casters keep moving the whole time

        // island layers: dust off the edges, an impact ring, a thud and a shake
        LAYER_EDGE.forEach(([y, half], i) => {
          const at = t0 + IT.layers[i] + IT.layerFall;
          introFx(at, () => {
            dustRing(y, half);
            spawnRing(at, 0, y + 0.03, 0, layerRing(half));
            introShake([0.07, 0.06, 0.08][i]);
            audio.introThump([1, 0.85, 0.95][i], 0);
          });
        });
        // pond
        introFx(t0 + IT.water + 0.05, () => audio.introPlop(screenPan(2.4, 0, 2.4), 0.85));
        lilyParts.filter((lp) => lp.meshes[0].visible).forEach((lp, i) => introFx(t0 + IT.water + 0.3 + i * 0.09, () => audio.introPlop(screenPan(lp.x, 0, lp.z), 1.15 + i * 0.12)));
        // objects: dust when the first slice lands, one "tok" when the top lands; the pitch climbs
        // through the whole sequence instead of restarting per object. Cabins also get a ring.
        events.sort((a, b) => a.top - b.top);
        events.forEach((ev, i) => {
          const pan = screenPan(ev.x, ev.y, ev.z), cabin = ev.def.type === '3d_cabin', big = introIsBig(ev.def);
          const n = cabin ? 18 : (big ? 8 : 4), r = cabin ? 0.7 : (big ? 0.32 : 0.18);
          introFx(ev.first, () => burstDust(ev.x, ev.y, ev.z, n, r));
          introFx(ev.top, () => {
            audio.introClick(1 + 0.65 * i / Math.max(1, events.length - 1), pan, cabin);
            if (cabin) { introShake(0.06); spawnRing(ev.top, ev.x, ev.y + 0.03, ev.z, CABIN_RING); }
          });
        });
        // lamps and fires catch one by one, evenly spaced, back to front, each with a few sparkles
        const lights = lightSources.slice().sort((a, b) => introDiag(a.x, a.z) - introDiag(b.x, b.z));
        const step = Math.min(0.14, IT.light[1] / Math.max(1, lights.length - 1));
        intro.ignite = lights.map((s, i) => ({ x: s.x, z: s.z, t: t0 + IT.light[0] + i * step }));
        lights.forEach((s, i) => introFx(intro.ignite[i].t, () => {
          spawnSparks(intro.ignite[i].t, s.x, s.baseY - 0.1, s.z);
          audio.introIgnite(screenPan(s.x, s.baseY, s.z), 0.9 + i * 0.06);
        }));
        campfireSpots.forEach((f) => introFx(introIgniteAt(f.x, f.z), () => { emberAcc += 10; }));
        // the HUD hops in
        if (withUI) introFx(t0 + IT.ui, popUI);
      }

      function popUI() {
        document.body.classList.remove('booting');
        document.body.classList.add('ui-pop');
        setTimeout(() => document.body.classList.remove('ui-pop'), 1300);
        [0, 0.2, 0.42].forEach((d, i) => setTimeout(() => audio.playUiBlip(560 + i * 150), d * 1000));
        wakeUI();
      }

      // end of the assembly: put every intro offset back
      function finishIntro() {
        if (intro.phase !== 'assemble') return;
        intro.phase = 'done';
        for (let i = pendingFx.length - 1; i >= 0; i--) if (pendingFx[i].intro) pendingFx.splice(i, 1);
        islandRoot.position.set(0, 0, 0); islandRoot.rotation.set(0, 0, 0);
        for (const ch of introLayers) { ch.visible = true; ch.scale.set(1, 1, 1); }
        chunkTopSurface.position.y = 0;
        waterMesh.visible = true; waterMesh.position.y = WATER_Y; fallMat.uniforms.uK.value = 1;
        lilyParts.forEach((lp) => lp.meshes.forEach((m) => m.scale.setScalar(1)));
        fenceGroup.visible = true; petalInst.visible = true;
        for (const im of [pathMesh, crateClutterInst]) im.visible = im.count > 0;
        markShadowsDirty(1.0);
        if (document.body.classList.contains('booting')) popUI();
      }

      // "처음 섬으로": tremble, fall away, assemble again
      // save slot pictures: the next finished frame, centre cropped to 3:2, as a small JPEG
      const thumbWaiting = [];
      function requestThumb(cb) {
        hoveredHit = null; updateHoverVisuals(); // no cursor or ghost in the picture
        thumbWaiting.push(cb);
      }
      let thumbCanvas = null;
      function captureThumb() {
        const src = renderer.domElement, W = 240, H = 160;
        if (!thumbCanvas) { thumbCanvas = document.createElement('canvas'); thumbCanvas.width = W; thumbCanvas.height = H; }
        let sw = src.width, sh = src.height;
        if (sw / sh > W / H) sw = sh * W / H; else sh = sw * H / W;
        let url = '';
        try {
          const g = thumbCanvas.getContext('2d');
          g.drawImage(src, (src.width - sw) / 2, (src.height - sh) / 2, sw, sh, 0, 0, W, H);
          url = thumbCanvas.toDataURL('image/jpeg', 0.8);
        } catch (e) { url = ''; }
        thumbWaiting.splice(0).forEach((cb) => cb(url));
      }

      // apply(rebuild) puts the next island in place: the starter one, or a saved slot
      function resetIsland(apply = populateStarterIsland) {
        if (intro.phase !== 'done') return;
        if (!INTRO_ON) { apply(true); audio.playPlace(); return; }
        if (isExploded) { isExploded = false; explodeToggleTime = -10; }
        hoveredHit = null; updateHoverVisuals();
        const now = performance.now() * 0.001;
        intro.phase = 'crumble'; intro.t0 = now;
        markShadowsDirty(CRUMBLE_LEN + 0.3);
        audio.introRumble();
        introShake(0.05);
        introFx(now + CRUMBLE_HOLD, () => dustRing(0.0, 5.95));
        introFx(now + CRUMBLE_LEN, () => { apply(false); startAssembly(false); });
      }

      // the finished island has been drawn a few times behind the black (shaders and shadow map
      // compiled): fade the black away while the assembly begins
      function onBootReady() {
        // sound is on by default, but browsers only allow it after a click or key: start it now
        // if this browser already allows it, otherwise the first input does (see below)
        audio.init();
        if (audio.ctx.state === 'running') { audio.setEnabled(true); syncAudioIcon(); }
        loaderEl.classList.add('go');
        setTimeout(() => loaderEl.remove(), 1000);
        startAssembly(true, FIRST_LEAD);
      }
      if (!INTRO_ON) { loaderEl.classList.add('go'); setTimeout(() => loaderEl.remove(), 1000); }

      // first click, tap or key turns the sound on (unless the player switched it off). It keeps
      // trying until the browser really plays: Esc and browser shortcuts don't count as a user
      // gesture, and a touch only counts when the finger lifts. Registered before the input hold
      // below, so it also works during the assembly. The sound button handles itself.
      function unlockAudio(e) {
        if (!audio.wantOn || audioPlaying()) return;
        if (e.type === 'keydown' && (e.key === 'Escape' || e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(e.key))) return;
        if (e.target.closest?.('#btn-audio')) return;
        audio.setEnabled(true);
        syncAudioIcon();
      }
      for (const ev of ['pointerdown', 'pointerup', 'keydown']) window.addEventListener(ev, unlockAudio, true);

      // while the island assembles (or crumbles) nothing reaches the game: no placing, no key
      // shortcuts, no HUD clicks. Wheel zoom is left alone; reload / devtools keys pass through.
      function holdIntroInput(e) {
        if (intro.phase === 'done') return;
        if (e.type === 'keydown' && (e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(e.key))) return;
        e.stopPropagation();
        e.preventDefault();
      }
      for (const ev of ['pointerdown', 'keydown', 'click', 'contextmenu']) window.addEventListener(ev, holdIntroInput, true);

      // #debug=1: read-only state hook for automated tests (headless Chrome)
      if (HASH.debug === '1') {
        const _pv = new THREE.Vector3();
        window.__mori = {
          state: () => ({
            pan: [camPan.x, camPan.y], targetPan: [targetPan.x, targetPan.y],
            dist: camDist, targetDist: targetCamDist, elev: camElev * 180 / Math.PI, orbit: orbitAngle,
            placed: placedItems.size, free: freeProps.length, snap: snapProps.length, seeds: seedFlowers.filter((f) => !f.erased).length, photo: isPhotoMode, exploded: isExploded,
            intro: intro.phase
          }),
          // startup assembly hooks for tools/tests/intro.mjs
          resetIsland: () => resetIsland(),
          frame: () => frameNo,
          introFx: () => {
            const live = [...sparkLife].map((l, i) => [l, i]).filter(([l]) => l > 0);
            return { rings: impactRings.filter((r) => r.mesh.visible).length, sparks: sparkPoints.visible, live: live.length,
              first: live.length ? [...sparkPos.slice(live[0][1] * 3, live[0][1] * 3 + 3)].map((v) => +v.toFixed(2)).concat(+sparkSize[live[0][1]].toFixed(1)) : null,
              px: sharedUniforms.uPointScale.value, lights: intro.ignite.map((g) => [+g.x.toFixed(2), +g.z.toFixed(2), +(g.t - intro.t0).toFixed(2)]) };
          },
          // hold the animation clock at `sec` seconds into the current assembly / crumble (null = run)
          introClock: (sec) => { debugClock = sec === null ? null : intro.t0 + sec; markShadowsDirty(3); },
          items: () => ITEM_DEFS.map((d) => ({ id: d.id, name: d.name, category: d.category, type: d.type, freePlace: d.freePlace, snapPlace: d.snapPlace, autoConnect: d.autoConnect })),
          snaps: () => snapProps.map((o) => ({ id: o.id, wx: o.wx, wz: o.wz, rotation: o.rotation, rect: footprintRect(assetsById[o.id].def, o.wx, o.wz, o.rotation) })),
          cabins: () => cabinRects(),
          pond: (x, z) => getPondSDF(x, z),
          terrainLevel: (gx, gz) => getHillLevel(gx, gz),
          terrainVersion: () => terrain.version,
          terrainAllowed: (gx, gz, dir) => terrainEditAllowed(gx, gz, dir),
          terrainMat: (qx, qz) => terrain.mat[qz * MAT_N + qx],
          terrainPaintAt: (x, z) => terrainPaintAt(x, z),
          terrainPainted: () => terrain.painted,
          paintAllowed: (qx, qz, mat = 0) => paintAllowed(qx, qz, mat),
          terrainWater: () => terrain.water,
          ground: (x, z) => getContinuousTerrainHeight(x, z),
          falls: () => falls.map((f) => ({ qx: f.qx, qz: f.qz, gx: f.gx, gz: f.gz, sx: f.sx, sz: f.sz, edge: f.edge, top: f.top, bot: f.bot })),
          fallPool: () => fallPool.reduce((n, v) => n + v, 0),
          // save (step 5): the raw auto slot, write it now (true if written), a write waiting, time of day
          saveRaw: () => storeGet(SAVE_KEY_AUTO),
          autosaveNow: () => writeAutosave(),
          saveSlot: (i) => storeGet(SAVE_KEY_SLOT + i),
          autosavePending: () => !!autosaveTimer,
          timeOfDay: () => TIME_ORDER[timeIndex],
          fallSheet: () => ({ visible: fallMesh.visible, verts: fallMesh.geometry.attributes.position.count, spray: sprayPoints.visible ? sprayPoints.geometry.attributes.position.count : 0, feet: fallFeet.length, lines: fallLines.length, ripples: waterMat.uniforms.uRipN.value, k: fallMat.uniforms.uK.value, sound: audio.fallLevel || 0 }),
          lipInfo: (qx, qz) => lipInfo(qx, qz),
          fallVerts: () => Array.from(fallMesh.geometry.attributes.position.array, (v) => Math.round(v * 1000) / 1000),
          waterSheet: () => ({ water: waterMesh.geometry.index.count / 6, mist: pondMist.geometry.index.count / 6, lilies: lilyParts.map((lp) => lp.meshes[0].visible) }),
          instanceCount: (id) => instancedById[id].count,
          instanceVisible: (id) => instancedById[id].visible,
          seedFlowers: () => ({ now: performance.now() * 0.001, list: seedFlowers.filter((f) => !f.erased).map((f) => [f.wx, f.wz, f.tint, f.spawnT, f.goneAt == null ? 0 : 1]) }),
          seedSlope: (x, z) => seedSlope(x, z),
          islandDigest: () => { // like meshDigest, island layers only (no cursor / ghosts / particles)
            const fnv = (arr, h) => { const u8 = new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength); for (let k = 0; k < u8.length; k++) { h ^= u8[k]; h = Math.imul(h, 16777619) >>> 0; } return h; };
            const out = [];
            for (const root of [chunkTopSurface, chunkSubsoil, chunkBedrock]) root.traverse((o) => {
              if (!o.isMesh) return;
              let h = 0x811c9dc5 >>> 0;
              for (const name of Object.keys(o.geometry.attributes).sort()) h = fnv(o.geometry.attributes[name].array, h);
              if (o.isInstancedMesh) h = fnv(o.instanceMatrix.array.subarray(0, o.count * 16), h);
              out.push(h.toString(16));
            });
            return out;
          },
          // terrain function samples for tools/tests/terrain.mjs (hash of exact float bits + a coarse table)
          terrainDump: (step = 0.02, coarse = 0.25) => {
            let h = 0x811c9dc5 >>> 0;
            const f64 = new Float64Array(1), u8 = new Uint8Array(f64.buffer);
            const mix = (v) => { f64[0] = v; for (let k = 0; k < 8; k++) { h ^= u8[k]; h = Math.imul(h, 16777619) >>> 0; } };
            const fns = {
              cont: (x, z) => getContinuousTerrainHeight(x, z),
              turf: (x, z) => getTurfHeight(x, z),
              sdf: (x, z) => getPondSDF(x, z),
              pondW: (x, z) => (isPondWorld(x, z) ? 1 : 0) + (isPondWorld(x, z, 0.06) ? 2 : 0)
            };
            const out = { hash: {}, coarse: {}, tiles: {} };
            const N = Math.round(13 / step);
            for (const [k, fn] of Object.entries(fns)) {
              h = 0x811c9dc5 >>> 0;
              for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) mix(fn(-6.5 + i * step, -6.5 + j * step));
              out.hash[k] = h;
              const M = Math.round(13 / coarse), c = [];
              for (let j = 0; j <= M; j++) for (let i = 0; i <= M; i++) c.push(+fn(-6.5 + i * coarse, -6.5 + j * coarse).toFixed(7));
              out.coarse[k] = c;
            }
            for (const [k, fn] of Object.entries({ hill: getHillLevel, elev: getTileElevation, pondT: (x, z) => (isPondTile(x, z) ? 1 : 0) })) {
              const c = [];
              for (let gz = -2; gz < GRID_SIZE + 2; gz++) for (let gx = -2; gx < GRID_SIZE + 2; gx++) c.push(fn(gx, gz));
              out.tiles[k] = c;
            }
            return out;
          },
          // hash of every mesh's geometry + instance matrices + texture canvases in the scene (built once / rebuilt)
          meshDigest: () => {
            const fnv = (arr, h) => { const u8 = new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength); for (let k = 0; k < u8.length; k++) { h ^= u8[k]; h = Math.imul(h, 16777619) >>> 0; } return h; };
            const out = [], seenTex = new Set();
            scene.updateMatrixWorld(true);
            scene.traverse((o) => {
              if (!(o.isMesh || o.isPoints)) return;
              if (o.userData.digestSkip) return; // added after the terrain baseline, empty on the default island
              let h = 0x811c9dc5 >>> 0;
              const g = o.geometry;
              for (const name of Object.keys(g.attributes).sort()) h = fnv(g.attributes[name].array, h);
              if (g.index) h = fnv(g.index.array, h);
              if (o.isInstancedMesh) h = fnv(o.instanceMatrix.array.subarray(0, o.count * 16), h);
              h = fnv(new Float32Array(o.matrixWorld.elements), h);
              const u = o.material && o.material.uniforms;
              if (u) for (const v of Object.values(u)) {
                const img = v && v.value && v.value.isTexture && v.value.image;
                if (img && img.getContext && !seenTex.has(img)) { seenTex.add(img); h = fnv(img.getContext('2d').getImageData(0, 0, img.width, img.height).data, h); }
              }
              out.push((o.name || o.type) + ':' + (o.isInstancedMesh ? o.count : 1) + ':' + h.toString(16));
            });
            return out;
          },
          lights: () => ({
            sources: lightSources.length,
            active: pointLightPool.filter((pl) => pl.userData.active).length,
            lit: lightSources.filter((s) => s.slot >= 0 && s.want).map((s) => `${s.x.toFixed(1)},${s.z.toFixed(1)}`).sort().join(' ')
          }),
          // visible renderables in the main scene (for draw call breakdowns)
          renderables: () => {
            const out = [];
            scene.traverseVisible((o) => {
              if (!(o.isMesh || o.isPoints || o.isSprite || o.isLine)) return;
              if (o.isInstancedMesh && o.count === 0) return;
              out.push({ type: o.type, name: o.name || o.material?.type, count: o.isInstancedMesh ? o.count : 1, tris: o.geometry?.index ? o.geometry.index.count / 3 : (o.geometry?.attributes.position?.count || 0) / 3, cast: o.castShadow });
            });
            return out;
          },
          // world point -> CSS pixel position on screen
          project: (x, y, z) => { _pv.set(x, y, z).project(camera); return [(_pv.x + 1) / 2 * window.innerWidth, (1 - _pv.y) / 2 * window.innerHeight]; },
          // CSS pixel -> ground hit (or null)
          hit: (cx, cy) => { const h = getHitUnderClient(cx, cy); return h ? { wx: h.wx, wz: h.wz, wy: h.wy } : null; },
          audio
        };
      }

      // #time=golden / #time=night starts at that time of day (else the one remembered from last time)
      const startTime = HASH.time && TIME_ORDER.includes(HASH.time) ? HASH.time : readPrefs().time;
      if (TIME_ORDER.includes(startTime) && startTime !== TIME_ORDER[0]) {
        setTimeOfDay(TIME_ORDER.indexOf(startTime));
        // start already there instead of blending from day
        for (const k in curAtmo) {
          if (curAtmo[k] && curAtmo[k].isColor) curAtmo[k].copy(targetAtmo[k]);
          else if (typeof targetAtmo[k] === 'number') curAtmo[k] = targetAtmo[k];
        }
      }
      if (HASH.explode === '1') setTimeout(toggleExplodedView, 600); // #explode=1 opens the exploded view

      requestAnimationFrame(animate);
    }

    function showToast() {}
  </script>
</body>
</html>
