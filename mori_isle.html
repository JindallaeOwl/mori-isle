      /* =======================================================================
         15. POINTER, KEYBOARD & TOUCH INTERACTION CONTROLS
         ======================================================================= */
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      function getHitUnderClient(clientX, clientY) {
        pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(rayTargets, false);
        if (hits.length === 0) return null;
        const p = hits[0].point;
        const gx = Math.floor(p.x + HALF_GRID);
        const gz = Math.floor(p.z + HALF_GRID);
        if (gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return null;
        return { gx, gz, wx: p.x, wz: p.z, wy: p.y };
      }

      let isOrbiting = false;
      let isPanning = false;
      let orbitButton = -1;
      let dragStartX = 0, dragStartY = 0, lastDragX = 0, lastDragY = 0, dragStartTime = 0;
      let hasMovedSignificantly = false;

      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

      renderer.domElement.addEventListener('pointerdown', (e) => {
        resetPopover.classList.remove('open');
        if (e.button === 1 || e.button === 2) {
          isOrbiting = true;
          orbitButton = e.button;
          isPanning = e.button === 1 || e.shiftKey; // middle drag or shift + right drag pans
          dragStartX = lastDragX = e.clientX;
          dragStartY = lastDragY = e.clientY;
          dragStartTime = performance.now();
          hasMovedSignificantly = false;
          container.classList.add('dragging');
        } else if (e.button === 0) {
          if (isPhotoMode || isExploded) {
            isOrbiting = true;
            orbitButton = 0;
            dragStartX = lastDragX = e.clientX;
            dragStartY = lastDragY = e.clientY;
            hasMovedSignificantly = false;
            container.classList.add('dragging');
          } else {
            const hit = getHitUnderClient(e.clientX, e.clientY);
            if (hit) {
              placeAtHit(hit);
              hoveredHit = hit;
              updateHoverVisuals();
            }
          }
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (intro.phase !== 'done') return; // no ghost or grid while the island assembles
        if (isOrbiting) {
          const dx = e.clientX - lastDragX;
          const dy = e.clientY - lastDragY;
          lastDragX = e.clientX;
          lastDragY = e.clientY;
          if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 5) hasMovedSignificantly = true;
          if (isPanning) {
            panByScreen(dx, dy);
          } else {
            setTargetElev(targetCamElev + dy * 0.0065); // drag down -> look from higher, drag up -> lower
            targetOrbitAngle -= dx * 0.0085;
          }
        } else if (!isPhotoMode && !isExploded) {
          const hit = getHitUnderClient(e.clientX, e.clientY);
          hoveredHit = hit;
          updateHoverVisuals();
        }
      });

      renderer.domElement.addEventListener('pointerleave', () => {
        hoveredHit = null;
        updateHoverVisuals();
      });

      window.addEventListener('pointerup', (e) => {
        if (isOrbiting && e.button === orbitButton) {
          if (orbitButton === 2 && !isPanning && !hasMovedSignificantly && performance.now() - dragStartTime < 350 && !isPhotoMode && !isExploded) {
            const hit = getHitUnderClient(e.clientX, e.clientY);
            if (hit) removeAtHit(hit);
          }
          isOrbiting = false;
          isPanning = false;
          orbitButton = -1;
          container.classList.remove('dragging');
        }
      });

      renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        const unit = e.deltaMode === 1 ? 33 : (e.deltaMode === 2 ? 400 : 1); // lines / pages -> pixels
        const dy = e.deltaY * unit, dx = e.deltaX * unit;
        // pinch on a laptop trackpad arrives as ctrl+wheel with small deltas
        zoomAt(Math.exp(dy * (e.ctrlKey ? 0.01 : 0.0009)), e.clientX, e.clientY);
        if (!e.ctrlKey && Math.abs(dx) > 0.5) targetOrbitAngle -= dx * 0.0045; // two-finger sideways swipe orbits
      }, { passive: false });

      renderer.domElement.addEventListener('dblclick', (e) => {
        if (!isPhotoMode && !isExploded) return; // in build mode a click places objects
        if (targetCamDist > 26) zoomAt(20 / targetCamDist, e.clientX, e.clientY);
        else resetView();
      });

      let prevPinchDist = null, prevTwoFingerX = null, prevTwoFingerY = null;
      renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const t0 = e.touches[0], t1 = e.touches[1];
          prevPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          prevTwoFingerX = (t0.clientX + t1.clientX) * 0.5;
          prevTwoFingerY = (t0.clientY + t1.clientY) * 0.5;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && prevPinchDist !== null) {
          const t0 = e.touches[0], t1 = e.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const midX = (t0.clientX + t1.clientX) * 0.5;
          const midY = (t0.clientY + t1.clientY) * 0.5;
          targetCamDist = THREE.MathUtils.clamp(targetCamDist - (dist - prevPinchDist) * 0.08, 16.0, 62.0);
          targetOrbitAngle -= (midX - prevTwoFingerX) * 0.01;
          setTargetElev(targetCamElev + (midY - prevTwoFingerY) * 0.008);
          prevPinchDist = dist;
          prevTwoFingerX = midX;
          prevTwoFingerY = midY;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', () => { prevPinchDist = null; prevTwoFingerX = null; prevTwoFingerY = null; });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          targetOrbitAngle += (e.key === 'ArrowLeft' ? 1 : -1) * 0.12; e.preventDefault(); return;
        }
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          setTargetElev(targetCamElev + (e.key === 'ArrowUp' ? 1 : -1) * 0.09); e.preventDefault(); return;
        }
        if (e.key === 'f' || e.key === 'F') { resetView(); return; }
        const panKey = { w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key.toLowerCase()];
        if (panKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const step = 70; // screen px per press
          panByScreen(-panKey[0] * step, -panKey[1] * step);
          return;
        }
        if (e.key === 'Escape') {
          if (isPhotoMode) setPhotoMode(false);
          resetPopover.classList.remove('open');
          toggleHelp(false);
          closeTray();
        } else if (e.key === 'e' || e.key === 'E') {
          toggleExplodedView();
        } else if (e.key === 'r' || e.key === 'R') {
          currentRotation = (currentRotation + 1) % 4;
          audio.playRotate();
          updateSelectionUI();
        } else if (e.key === 'x' || e.key === 'X') {
          selectTool('delete', true);
        } else if (e.key === 'h' || e.key === 'H') {
          toggleHelp();
        } else if (e.key >= '1' && e.key <= '9') {
          selectCategoryByIndex(parseInt(e.key, 10) - 1);
        }
      });

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = Math.max(window.innerHeight, 1);
        renderer.setSize(w, h);
        applyResolution();
      });

      /* =======================================================================
         16. STARTUP & 60 FPS ANIMATION LOOP
             (STAGGERED EXPLODED VIEW + EASE-OUT-BACK + SYNCED SHADOWS & SMOKE)
         ======================================================================= */
      setTimeOfDay(0);
      populateStarterIsland();
      updateSelectionUI();

      // everything that stands on the island hangs off one root, so the reset can drop the whole
      // island at once (dust, petals, cursors and lights stay in the world)
      const islandRoot = new THREE.Group();
      scene.add(islandRoot);
      for (const o of [chunkTopSurface, chunkSubsoil, chunkBedrock, fenceGroup, cabinGroupContainer, glowGroup,
        smokeInst, flameInst, emberPoints, ...Object.values(instancedById)]) islandRoot.add(o);

      // Helper: Compute staggered springy progress [0..1] (with easeOutBack overshoot!) for each chunk
      function evalLayerProgress(sinceToggle, openDelay, closeDelay) {
        if (sinceToggle < 0) return 0;
        const delay = isExploded ? openDelay : closeDelay;
        const raw = THREE.MathUtils.clamp((sinceToggle - delay) / EXPLODE_DURATION, 0, 1);
        const eased = easeOutBack(raw);
        return isExploded ? eased : (1.0 - eased);
      }

      // Smooth transient bell curve [0..1..0] for 1~3° micro-rotation during transit
      function evalTransitTwist(sinceToggle, openDelay, closeDelay) {
        if (sinceToggle < 0) return 0;
        const delay = isExploded ? openDelay : closeDelay;
        const raw = THREE.MathUtils.clamp((sinceToggle - delay) / EXPLODE_DURATION, 0, 1);
        return Math.sin(raw * Math.PI);
      }

      let lastTime = performance.now();
      const animDummy = new THREE.Object3D();
      const tmpWorldPos = new THREE.Vector3();

      function animate(now) {
        requestAnimationFrame(animate);
        const rawFrameDt = (now - lastTime) / 1000;
        const dt = Math.min(rawFrameDt, 0.05);
        lastTime = now;
        frameNo++;
        // #debug=1 tests can hold the clock at one moment of the assembly (see __mori.introClock)
        const elapsed = debugClock !== null ? debugClock : now * 0.001;
        sharedUniforms.uTime.value = elapsed;

        // Smooth camera orbit, zoom & look height
        orbitAngle += (targetOrbitAngle - orbitAngle) * Math.min(1, dt * 10);
        camElev += (targetCamElev - camElev) * Math.min(1, dt * 10);
        camDist += (targetCamDist - camDist) * Math.min(1, dt * 8);
        camLookY += (targetCamLookY - camLookY) * Math.min(1, dt * 8);
        camPan.lerp(targetPan, Math.min(1, dt * 8)); // same rate as zoom so zoom-to-cursor stays anchored
        updateCameraTransform();
        runPendingFx(elapsed);
        updateDust(dt);
        {
          const st = elapsed - shakeStart;
          if (st >= 0 && st < 0.16) {
            const k = shakeAmp * (1 - st / 0.16);
            camShake.set(Math.sin(st * 160) * k, Math.cos(st * 190) * k * 0.6);
            updateCameraTransform();
          } else if (camShake.x !== 0 || camShake.y !== 0) {
            camShake.set(0, 0);
            updateCameraTransform();
          }
        }

        // Context-Sensitive Grid Auto-Hide (only appears gently when hovering in grid-placement mode)
        const showGrid = !isPhotoMode && !isExploded && hoveredHit !== null &&
          (selectedTool === 'delete' || !assetsById[selectedTool]?.def.freePlace);
        const targetGridAlpha = showGrid ? 1.0 : 0.0;
        gridMat.uniforms.uGridAlpha.value += (targetGridAlpha - gridMat.uniforms.uGridAlpha.value) * Math.min(1, dt * 10);
        if (hoveredHit) {
          gridMat.uniforms.uCursorXZ.value.set(hoveredHit.wx, hoveredHit.wz);
        }

        // --- EXPLODED VIEW: Clean 4-Tier Non-Overlapping Hierarchy ---
        // Tier 0 (Strata): Bedrock (-1.70), Subsoil (-0.80)
        // Tier 1 (Terrain & Ground Props): TopSurface/Hills/Paths/Grass (0.0), Cabin Floor (+0.34), Ground Props (+0.42)
        // Tier 2 (Walls & Tree Trunks): Cabin Walls (+1.68), Tree Trunks & Lanterns (+1.28 relative to hill!)
        // Tier 3 (Roof & Foliage): Cabin Roof (+3.15), Tree Canopies (+2.62 relative to hill!)
        const sinceToggle = elapsed - explodeToggleTime;
        const pTop      = evalLayerProgress(sinceToggle, 0.00, 0.14);
        const pMid      = evalLayerProgress(sinceToggle, 0.035, 0.105);
        const pProps    = evalLayerProgress(sinceToggle, 0.07, 0.07);
        const pSubsoil  = evalLayerProgress(sinceToggle, 0.105, 0.035);
        const pBedrock  = evalLayerProgress(sinceToggle, 0.14, 0.00);

        const twTop     = evalTransitTwist(sinceToggle, 0.00, 0.14) * 0.044;
        const twMid     = evalTransitTwist(sinceToggle, 0.035, 0.105) * -0.034;
        const twSubsoil = evalTransitTwist(sinceToggle, 0.105, 0.035) * -0.024;
        const twBedrock = evalTransitTwist(sinceToggle, 0.14, 0.00) * 0.030;

        // 1. Earth Cross-Section Strata Drop (wide clean gaps below topsoil)
        chunkSubsoil.position.y = pSubsoil * -0.80;
        chunkSubsoil.rotation.y = twSubsoil;
        chunkBedrock.position.y = pBedrock * -1.70;
        chunkBedrock.rotation.y = twBedrock;

        // 2. Ground Props (Fences, Rocks, Flowers, Reeds, Campfire) & Split Trees (Trunk -> Mid, Canopy -> Top)
        fenceGroup.position.y = pProps * 0.42;
        sharedUniforms.uExplodePropLift.value = pProps * 0.42;
        sharedUniforms.uExplodeMidLift.value  = pMid * 1.28;
        sharedUniforms.uExplodeTopLift.value  = pTop * 2.62;
        sharedUniforms.uExplodeSpread.value   = pMid * 0.34;
        sharedUniforms.uExplodeTwist.value    = twMid;

        // 3. 3-Chunk Storybook Cabin Separation (cleanly aligned with the 4 macro tiers)
        for (let i = 0; i < activeCabins.length; i++) {
          const cb = activeCabins[i];
          const { chunkInterior, chunkWalls, chunkRoof } = cb.mesh.userData;
          chunkInterior.position.y = pProps * 0.34;
          chunkWalls.position.y = pMid * 1.68;
          chunkWalls.rotation.y = twMid;
          chunkRoof.position.y = pTop * 3.15;
          chunkRoof.rotation.y = twTop;

          // LEGO-style part-by-part drop for newly placed cabins
          const ud = cb.mesh.userData;
          if (!ud.dropDone && ud.dropParts) {
            const since = elapsed - cb.spawnT;
            const done = since > cabinDropTotal() + 0.2;
            for (const pt of ud.dropParts) {
              const tl = since - pt.g * CABIN_STRIDE;
              if (done || tl >= DROP_FALL) {
                pt.obj.visible = pt.visible; pt.obj.position.y = pt.baseY; pt.obj.rotation.z = pt.baseRZ;
              } else if (tl < 0) {
                pt.obj.visible = false;
              } else {
                const e = (tl / DROP_FALL) ** 2;
                pt.obj.visible = pt.visible;
                pt.obj.position.y = pt.baseY + (1 - e) * 1.1;
                pt.obj.rotation.z = pt.baseRZ + pt.ang * (1 - e);
              }
            }
            const u = since - (cabinDropTotal() - 0.03);
            let sy = 1;
            if (u > 0 && u < 0.14) {
              sy = u < 0.045 ? THREE.MathUtils.lerp(1, 0.85, u / 0.045)
                 : (u < 0.10 ? THREE.MathUtils.lerp(0.85, 1.05, (u - 0.045) / 0.055)
                             : THREE.MathUtils.lerp(1.05, 1, (u - 0.10) / 0.04));
            }
            const sxz = 1 + (1 - sy) * 0.45;
            cb.mesh.scale.set(sxz, sy, sxz);
            if (done) { ud.dropDone = true; cb.mesh.scale.set(1, 1, 1); mergeCabinPrefab(cb.mesh); markShadowsDirty(); }
          }
        }

        // Startup assembly / reset crumble: island layers, water, paths, fence (section 17)
        if (intro.phase === 'assemble' || intro.phase === 'crumble') updateIntro(elapsed);

        // 4. Height-Proportional Contact Shadows (shift along key light & soften alpha as layers float!)
        const shadowFade = THREE.MathUtils.clamp(1.0 - pMid * 0.58, 0.32, 1.0);
        csMat.opacity = shadowFade * introShadowK(elapsed);
        const csChanged = pMid !== csLast.pMid || pProps !== csLast.pProps || contactShadowBaseList !== csLast.list;
        csLast.pMid = pMid; csLast.pProps = pProps; csLast.list = contactShadowBaseList;
        for (let i = 0; csChanged && i < contactShadowBaseList.length; i++) {
          const cs = contactShadowBaseList[i];
          const lift = cs.tier === 2 ? pMid * 1.4 : (cs.tier === 1 ? pMid * 1.1 : pProps * 0.42);
          animDummy.position.set(cs.x - lift * 0.34, cs.y, cs.z - lift * 0.26);
          animDummy.rotation.set(0, 0, 0);
          const sc = cs.r * (1.0 + lift * 0.18);
          animDummy.scale.set(sc, 1, sc);
          animDummy.updateMatrix();
          contactShadowInst.setMatrixAt(i, animDummy.matrix);
        }
        contactShadowInst.count = contactShadowBaseList.length;
        if (csChanged) contactShadowInst.instanceMatrix.needsUpdate = true;

        // 5. Smooth 3-Point Lighting & Atmosphere interpolation
        const lr = Math.min(1, dt * 2.5);
        curAtmo.skyTop.lerp(targetAtmo.skyTop, lr);
        curAtmo.skyBottom.lerp(targetAtmo.skyBottom, lr);
        curAtmo.keyColor.lerp(targetAtmo.keyColor, lr);
        curAtmo.keyIntensity += (targetAtmo.keyIntensity - curAtmo.keyIntensity) * lr;
        curAtmo.fillColor.lerp(targetAtmo.fillColor, lr);
        curAtmo.fillIntensity += (targetAtmo.fillIntensity - curAtmo.fillIntensity) * lr;
        curAtmo.rimColor.lerp(targetAtmo.rimColor, lr);
        curAtmo.rimIntensity += (targetAtmo.rimIntensity - curAtmo.rimIntensity) * lr;
        curAtmo.hemiSky.lerp(targetAtmo.hemiSky, lr);
        curAtmo.hemiGround.lerp(targetAtmo.hemiGround, lr);
        curAtmo.hemiIntensity += (targetAtmo.hemiIntensity - curAtmo.hemiIntensity) * lr;
        curAtmo.fogColor.lerp(targetAtmo.fogColor, lr);
        curAtmo.fogDensity += (targetAtmo.fogDensity - curAtmo.fogDensity) * lr;
        curAtmo.waterDeep.lerp(targetAtmo.waterDeep, lr);
        curAtmo.waterShallow.lerp(targetAtmo.waterShallow, lr);
        curAtmo.waterFoam.lerp(targetAtmo.waterFoam, lr);
        curAtmo.gradeTint.lerp(targetAtmo.gradeTint, lr);
        curAtmo.gradeWarmth += (targetAtmo.gradeWarmth - curAtmo.gradeWarmth) * lr;
        curAtmo.nightFactor += (targetAtmo.nightFactor - curAtmo.nightFactor) * lr;
        curAtmo.pointIntensity += (targetAtmo.pointIntensity - curAtmo.pointIntensity) * lr;

        keyLight.color.copy(curAtmo.keyColor); keyLight.intensity = curAtmo.keyIntensity;
        fillLight.color.copy(curAtmo.fillColor); fillLight.intensity = curAtmo.fillIntensity;
        rimLight.color.copy(curAtmo.rimColor); rimLight.intensity = curAtmo.rimIntensity;
        hemiLight.color.copy(curAtmo.hemiSky); hemiLight.groundColor.copy(curAtmo.hemiGround);
        hemiLight.intensity = curAtmo.hemiIntensity;

        sharedUniforms.uSkyTop.value.copy(curAtmo.skyTop);
        sharedUniforms.uSkyBottom.value.copy(curAtmo.skyBottom);
        sharedUniforms.uFogColor.value.copy(curAtmo.fogColor);
        sharedUniforms.uFogDensity.value = curAtmo.fogDensity;
        sharedUniforms.uWaterDeep.value.copy(curAtmo.waterDeep);
        sharedUniforms.uWaterShallow.value.copy(curAtmo.waterShallow);
        sharedUniforms.uWaterFoam.value.copy(curAtmo.waterFoam);
        sharedUniforms.uGradeTint.value.copy(curAtmo.gradeTint);
        sharedUniforms.uGradeWarmth.value = curAtmo.gradeWarmth;
        sharedUniforms.uNightFactor.value = curAtmo.nightFactor;

        mistMat.color.copy(curAtmo.fogColor);
        mistMat.opacity = curAtmo.fogDensity * 0.42;
        pondMist.position.x = 2.3 + Math.sin(elapsed * 0.25) * 0.35;
        pondMist.position.z = 2.3 + Math.cos(elapsed * 0.2) * 0.35;

        // 6. Warm PointLights & Glowing Halos synced with exploded elevation
        const glowPower = THREE.MathUtils.smoothstep(curAtmo.nightFactor, 0.15, 0.9);
        for (let i = 0; i < activeGlowSprites.length; i++) {
          const g = activeGlowSprites[i];
          const flick = g.flicker
            ? fireFlicker(elapsed, g.seed)
            : (0.95 + 0.05 * noise1(elapsed * 1.7, g.seed));
          g.sprite.material.opacity = glowPower * 0.72 * flick * introLightK(g.sprite.position.x, g.sprite.position.z, elapsed);
          const liftY = g.isCabin ? pMid * 1.68 : (g.tier === 1 ? pMid * 1.28 : pProps * 0.42);
          g.sprite.position.y = g.baseY + liftY;
          const sc = g.baseScale * (0.94 + 0.08 * flick);
          g.sprite.scale.set(sc, sc, 1);
        }
        updatePointLights(dt, elapsed, pMid, pProps);

        updateCampfireFx(dt, elapsed, pProps * 0.42);
        // campfire crackle: louder when zoomed in and when a fire is near the view center
        fireAudioTimer -= dt;
        if (fireAudioTimer <= 0 && audio.ctx) {
          fireAudioTimer = 0.25;
          let best = null, bestD = Infinity;
          for (const f of campfireSpots) { const d = Math.hypot(f.x - camPan.x, f.z - camPan.y); if (d < bestD) { bestD = d; best = f; } }
          const zoomK = THREE.MathUtils.clamp((62 - camDist) / 46, 0, 1) * 0.75 + 0.25;
          const level = best ? THREE.MathUtils.clamp(1.1 - bestD / 9, 0, 1) * zoomK * Math.min(1, 0.7 + 0.15 * campfireSpots.length) : 0;
          audio.setFire(level, best ? screenPan(best.x, best.y, best.z) : 0);
        }
        audio.updateFire(dt);

        // 7. Fluffy Spherical Chimney Smoke (Real-time tracked to Exploding Roof/Chimney!)
        const puffsPerChimney = 8;
        let smIdx = 0;
        for (let c = 0; c < activeCabins.length; c++) {
          const cb = activeCabins[c];
          const { chunkRoof } = cb.mesh.userData;
          // Compute exact world position of chimney rim including roof lift & micro-rotation!
          tmpWorldPos.set(0.25, 1.50, -0.16);
          chunkRoof.localToWorld(tmpWorldPos);
          const smokeK = Math.min(1, introLightK(cb.baseX, cb.baseZ, elapsed)); // chimney starts once the cabin is lit

          for (let p = 0; p < puffsPerChimney && smIdx < MAX_SMOKE_PUFFS; p++) {
            const t = (elapsed * 0.28 + p / puffsPerChimney + c * 0.37) % 1.0;
            const sCurveX = Math.sin(t * Math.PI * 2.1 + elapsed * 0.9) * 0.24 * t + t * 0.42;
            const sCurveZ = Math.cos(t * Math.PI * 1.6 + elapsed * 0.7) * 0.16 * t + t * 0.20;
            const scaleProfile = Math.sin(Math.pow(t, 0.65) * Math.PI) * 1.45;
            animDummy.position.set(tmpWorldPos.x + sCurveX, tmpWorldPos.y + t * 1.55, tmpWorldPos.z + sCurveZ);
            animDummy.rotation.set(t * 2.0, t * 1.5, 0);
            animDummy.scale.setScalar(Math.max(0.01, scaleProfile * smokeK));
            animDummy.updateMatrix();
            smokeInst.setMatrixAt(smIdx++, animDummy.matrix);
          }
        }
        smokeInst.count = smIdx;
        smokeInst.instanceMatrix.needsUpdate = true;

        // 8. Swirling Pastel Flower Petals
        for (let i = 0; i < PETAL_COUNT; i++) {
          const pd = petalData[i];
          const fallY = ((pd.by - elapsed * pd.speed) % 4.6 + 4.6) % 4.6 + 0.15;
          animDummy.position.set(
            pd.bx + Math.sin(elapsed * 0.9 + pd.seed) * 0.75,
            fallY,
            pd.bz + Math.cos(elapsed * 0.75 + pd.seed * 1.3) * 0.75
          );
          animDummy.rotation.set(elapsed * 1.4 + pd.seed, elapsed * 1.1, elapsed * 0.8);
          animDummy.scale.setScalar(1.0 - curAtmo.nightFactor * 0.35);
          animDummy.updateMatrix();
          petalInst.setMatrixAt(i, animDummy.matrix);
        }
        petalInst.instanceMatrix.needsUpdate = true;

        // Hover bob on ghost
        if (hoveredHit && selectedTool !== 'delete' && !isPhotoMode && !isExploded) {
          const ghost = ghostMeshesById[selectedTool];
          if (ghost && ghost.visible) {
            const def = assetsById[selectedTool].def;
            const baseY = def.freePlace ? hoveredHit.wy : getTileElevation(hoveredHit.gx, hoveredHit.gz);
            ghost.position.y = baseY + 0.03 + Math.sin(elapsed * 5.0) * 0.025;
          }
        }

        renderer.info.reset();
        if (performance.now() * 0.001 <= shadowHoldUntil || HASH.noopt === '1') renderer.shadowMap.needsUpdate = true;
        // Pass 1: Render 3D scene to WebGLRenderTarget
        renderer.setRenderTarget(renderTarget);
        renderer.setClearColor(0x000000, 0);
        renderer.clear();
        renderer.render(scene, camera);

        // Pass 2: Low-res post pipeline (AO + lit mist -> depth tilt-shift -> bloom -> grade + dither)
        runPostPipeline();

        // Pass 3: Sharp upscale to the screen + film grain
        upMat.uniforms.uSeed.value = (elapsed * 60 % 1000) * 7.13;
        renderer.setRenderTarget(null);
        renderer.render(upScene, postCamera);
        // behind the loader the finished island is drawn a few times first, so every shader and the
        // shadow map are compiled before the player presses start (no hitch when the assembly begins)
        if (intro.phase === 'boot' && ++bootFrames === 3) onBootReady();
        trackPerformance(rawFrameDt);
        // #fps=1 also writes a draw-call snapshot (frame 12 and an idle frame 150) to <body data-bench> and the console
        if (fpsEl && (++benchFrame === 3 || benchFrame === 150)) {
          let cabinMeshes = 0, sceneMeshes = 0, casters = 0;
          cabinGroupContainer.traverse((o) => { if (o.isMesh) cabinMeshes++; });
          scene.traverse((o) => { if (o.isMesh && o.visible) { sceneMeshes++; if (o.castShadow) casters++; } });
          const line = '[f' + benchFrame + '] calls ' + renderer.info.render.calls + ' tris ' + renderer.info.render.triangles
            + ' programs ' + renderer.info.programs.length + ' geos ' + renderer.info.memory.geometries
            + ' | meshes ' + sceneMeshes + ' casters ' + casters + ' cabinMeshes ' + cabinMeshes;
          document.body.dataset.bench = (document.body.dataset.bench || '') + line + ' ';
          console.log('[mori-bench] ' + line);
        }
      }
      let benchFrame = 0, frameNo = 0, debugClock = null;
      let fireAudioTimer = 0;
      const csLast = { pMid: -1, pProps: -1, list: null };

      /* =======================================================================
         17. STARTUP ASSEMBLY (loader -> island stacks itself bottom to top -> HUD)
             Like Cinderwatch's board rise, but Lego-style: the three island layers drop in one
             by one (bedrock, subsoil, grass + hills), the pond fills, then everything on top drops
             with the usual stacked-drop shader (spawn times set in the future, back to front),
             lamps light up one by one and the HUD hops in. "처음 섬으로" first lets the island
             fall away, then assembles it again. Any click or key skips to the end.
             #intro=0 turns it off; it is off by default with #debug=1 (tests want a finished
             island at once), #debug=1&intro=1 turns it back on.
         ======================================================================= */
      const INTRO_ON = HASH.intro !== undefined ? HASH.intro !== '0' : HASH.debug !== '1';
      const IT = {                        // seconds after the start press (3.4 s + settle)
        layers: [0.0, 0.25, 0.5],         // bedrock, subsoil, grass + hills start falling
        layerFall: 0.42, layerFrom: 12,   // fall time and height (starts above the screen)
        water: 1.0,                       // pond fills, lily pads pop
        big: [1.2, 0.8],                  // cabins and trees: start, back-to-front spread
        small: [2.0, 0.5],                // props, flowers, rocks
        path: 2.0, fence: 2.1,
        light: [2.6, 0.4],                // lamps and fires catch, back to front
        ui: 3.0, end: 3.6
      };
      const CRUMBLE_HOLD = 0.2, CRUMBLE_LEN = 0.95; // tremble, then the whole island drops away
      const WATER_Y = waterMesh.position.y, WATER_FROM = WATER_Y - 0.4;
      const LAYER_DUST = [[-1.40, 5.45], [-0.60, 5.85], [0.0, 5.95]]; // top y and half width of each layer
      const introLayers = [chunkBedrock, chunkSubsoil, chunkTopSurface];
      const loaderEl = document.getElementById('loader');
      const intro = { phase: INTRO_ON ? 'boot' : 'done', t0: 0, withUI: false, ignite: [], swallowUntil: 0 };
      let bootFrames = 0, loaderReady = false;
      if (!INTRO_ON) document.body.classList.remove('booting');

      // 0 = the far (hill) corner, 1 = the near corner of the default view
      const introDiag = (x, z) => THREE.MathUtils.clamp((x + z + GRID_SIZE) / (2 * GRID_SIZE), 0, 1);
      const introIsBig = (def) => !def.freePlace && (def.type === '3d_cabin' || def.category === 'flora');
      function introFx(at, fn) { pendingFx.push({ t: at, fn, intro: true }); }

      // lamp / fire brightness: 0 until its turn, a short warm flare, then 1; fades out in a crumble.
      // Turns come from intro.ignite (one light after another, back to front); sprites, pool lights,
      // flames and chimney smoke look up the nearest entry
      function introIgniteAt(x, z) {
        let at = null, bd = 1.2;
        for (const g of intro.ignite) { const d = Math.abs(g.x - x) + Math.abs(g.z - z); if (d < bd) { bd = d; at = g.t; } }
        return at !== null ? at : intro.t0 + IT.light[0] + introDiag(x, z) * IT.light[1];
      }
      function introLightK(x, z, now) {
        if (intro.phase === 'crumble') return Math.max(0, 1 - (now - intro.t0) * 4);
        if (intro.phase !== 'assemble') return 1;
        const u = now - introIgniteAt(x, z);
        if (u <= 0) return 0;
        return Math.min(1, u / 0.08) * (1 + 1.3 * Math.exp(-u * 5));
      }
      // contact shadows fade in with the objects that cast them
      function introShadowK(now) {
        if (intro.phase !== 'assemble') return 1;
        return THREE.MathUtils.smoothstep(now - intro.t0, IT.big[0], IT.small[0] + IT.small[1] + 0.3);
      }
      const popScale = (u) => (u <= 0 ? 0.0001 : (u >= 1 ? 1 : easeOutBack(u)));

      // per frame while assembling or crumbling (called from animate after the exploded-view code,
      // which sets the subsoil / bedrock / fence heights every frame; offsets are added on top)
      function updateIntro(now) {
        const u = now - intro.t0;
        if (intro.phase === 'crumble') {
          if (u < CRUMBLE_HOLD) { // tremble
            const k = u / CRUMBLE_HOLD;
            islandRoot.position.set(Math.sin(u * 95) * 0.035 * k, 0, Math.cos(u * 83) * 0.03 * k);
          } else {
            const v = u - CRUMBLE_HOLD; // gravity, with a slight tip forward
            islandRoot.position.set(0, -(16 * v * v + 1.2 * v), 0);
            islandRoot.rotation.set(v * 0.16, 0, -v * 0.1);
          }
          return;
        }
        // island layers: fall, land, small rebound with a sideways bulge
        for (let i = 0; i < 3; i++) {
          const ch = introLayers[i], t = u - IT.layers[i];
          ch.visible = t >= 0;
          let off = 0, bulge = 1;
          if (t >= 0 && t < IT.layerFall) { const p = t / IT.layerFall; off = IT.layerFrom * (1 - p * p); }
          else if (t >= IT.layerFall) {
            const v = (t - IT.layerFall) / 0.3;
            if (v < 1) { const s = Math.sin(v * Math.PI) * (1 - v); off = s * 0.1; bulge = 1 + s * 0.03; }
          }
          if (i === 2) ch.position.y = off; else ch.position.y += off;
          ch.scale.set(bulge, 1, bulge);
        }
        // pond fills, then the lily pads pop up one by one
        const w = (u - IT.water) / 0.45;
        waterMesh.visible = w > 0;
        waterMesh.position.y = THREE.MathUtils.lerp(WATER_FROM, WATER_Y, popScale(w));
        lilyParts.forEach((lp, i) => {
          const s = popScale((u - IT.water - 0.22 - i * 0.09) / 0.28);
          for (const m of lp.meshes) m.scale.setScalar(s);
        });
        // paths appear, the fence drops in as one piece
        const pathOn = u >= IT.path;
        for (const im of [pathCenterInst, pathConnInst, pathCobbleInst]) im.visible = pathOn && im.count > 0;
        crateClutterInst.visible = u >= IT.small[0] && crateClutterInst.count > 0;
        const f = u - IT.fence;
        fenceGroup.visible = f >= 0;
        if (f >= 0 && f < 0.16) fenceGroup.position.y += 1.2 * (1 - (f / 0.16) ** 2);
        petalInst.visible = u >= IT.layers[2] + IT.layerFall;
        if (u >= IT.end) finishIntro(false);
      }

      // dust thrown out along the four edges of a layer that just landed
      function dustRing(y, half) {
        for (let s = 0; s < 4; s++) for (let k = 0; k < 5; k++) {
          const f = ((k + 0.5) / 5) * 2 - 1;
          const [x, z] = [[f * half, half], [f * half, -half], [half, f * half], [-half, f * half]][s];
          burstDust(x, y, z, 3, 0.5);
        }
      }
      function introShake(amp) { shakeStart = performance.now() * 0.001; shakeAmp = amp; }

      // spawn times for everything on the island + the juice for each landing
      function startAssembly(withUI) {
        const t0 = performance.now() * 0.001 + 0.12;
        intro.phase = 'assemble'; intro.t0 = t0; intro.withUI = withUI;
        isExploded = false; explodeToggleTime = -10;
        hoveredHit = null; updateHoverVisuals();
        islandRoot.position.set(0, 0, 0); islandRoot.rotation.set(0, 0, 0);

        const events = [];
        const spawnAt = (def, x, z) => {
          const [a, span] = introIsBig(def) ? IT.big : IT.small;
          return t0 + a + introDiag(x, z) * span + Math.random() * 0.04;
        };
        const landing = (def, x, y, z, spawn) => {
          const top = def.type === '3d_cabin' ? cabinDropTotal() : (isInstancedDef(def) ? dropTotalTime(def.layers) : 0);
          events.push({ def, x, y, z, first: spawn + (top ? DROP_FALL : 0), top: spawn + top });
        };
        placedItems.forEach((e) => {
          const def = assetsById[e.id].def;
          const x = e.gx - HALF_GRID + 0.5, z = e.gz - HALF_GRID + 0.5, y = getTileElevation(e.gx, e.gz);
          if (def.type === 'auto_path' || def.type === 'auto_fence') { // no drop shader: they snap in
            e.spawnT = -100;
            landing(def, x, y, z, t0 + (def.type === 'auto_path' ? IT.path : IT.fence + 0.16) + introDiag(x, z) * 0.12);
            return;
          }
          e.spawnT = spawnAt(def, x, z);
          landing(def, x, y, z, e.spawnT);
        });
        freeProps.forEach((fp) => {
          const def = assetsById[fp.id].def;
          fp.spawnT = spawnAt(def, fp.wx, fp.wz);
          landing(def, fp.wx, getContinuousTerrainHeight(fp.wx, fp.wz), fp.wz, fp.spawnT);
        });
        rebuildInstances();
        markShadowsDirty(IT.end + 0.4); // casters keep moving the whole time

        // island layers
        LAYER_DUST.forEach(([y, half], i) => {
          introFx(t0 + IT.layers[i] + IT.layerFall, () => {
            dustRing(y, half);
            introShake([0.07, 0.06, 0.08][i]);
            audio.introThump([1, 0.85, 0.95][i], 0);
          });
        });
        // pond
        introFx(t0 + IT.water + 0.05, () => audio.introPlop(screenPan(2.4, 0, 2.4), 0.85));
        lilyParts.forEach((lp, i) => introFx(t0 + IT.water + 0.3 + i * 0.09, () => audio.introPlop(screenPan(lp.x, 0, lp.z), 1.15 + i * 0.12)));
        // objects: dust when the first slice lands, one "tok" when the top lands; the pitch climbs
        // through the whole sequence instead of restarting per object
        events.sort((a, b) => a.top - b.top);
        events.forEach((ev, i) => {
          const pan = screenPan(ev.x, ev.y, ev.z), cabin = ev.def.type === '3d_cabin', big = introIsBig(ev.def);
          const n = cabin ? 18 : (big ? 8 : 4), r = cabin ? 0.7 : (big ? 0.32 : 0.18);
          introFx(ev.first, () => burstDust(ev.x, ev.y, ev.z, n, r));
          introFx(ev.top, () => {
            audio.introClick(1 + 0.65 * i / Math.max(1, events.length - 1), pan, cabin);
            if (cabin) introShake(0.06);
          });
        });
        // lamps and fires catch one by one, evenly spaced, back to front
        const lights = lightSources.slice().sort((a, b) => introDiag(a.x, a.z) - introDiag(b.x, b.z));
        const step = Math.min(0.14, IT.light[1] / Math.max(1, lights.length - 1));
        intro.ignite = lights.map((s, i) => ({ x: s.x, z: s.z, t: t0 + IT.light[0] + i * step }));
        lights.forEach((s, i) => introFx(intro.ignite[i].t, () => audio.introIgnite(screenPan(s.x, s.baseY, s.z), 0.9 + i * 0.06)));
        campfireSpots.forEach((f) => introFx(introIgniteAt(f.x, f.z), () => { emberAcc += 10; }));
        // the HUD hops in
        if (withUI) introFx(t0 + IT.ui, popUI);
      }

      function popUI() {
        document.body.classList.remove('booting');
        document.body.classList.add('ui-pop');
        setTimeout(() => document.body.classList.remove('ui-pop'), 1300);
        [0, 0.2, 0.42].forEach((d, i) => setTimeout(() => audio.playUiBlip(560 + i * 150), d * 1000));
        wakeUI();
      }

      // end of the assembly; skipped = jump straight to the finished island
      function finishIntro(skipped) {
        if (intro.phase !== 'assemble' && intro.phase !== 'crumble') return;
        const wasCrumble = intro.phase === 'crumble';
        intro.phase = 'done';
        for (let i = pendingFx.length - 1; i >= 0; i--) if (pendingFx[i].intro) pendingFx.splice(i, 1);
        islandRoot.position.set(0, 0, 0); islandRoot.rotation.set(0, 0, 0);
        for (const ch of introLayers) { ch.visible = true; ch.scale.set(1, 1, 1); }
        chunkTopSurface.position.y = 0;
        waterMesh.visible = true; waterMesh.position.y = WATER_Y;
        lilyParts.forEach((lp) => lp.meshes.forEach((m) => m.scale.setScalar(1)));
        fenceGroup.visible = true; petalInst.visible = true;
        if (skipped) {
          if (wasCrumble) populateStarterIsland(false);
          placedItems.forEach((e) => { e.spawnT = -100; });
          freeProps.forEach((fp) => { fp.spawnT = -100; });
          rebuildInstances(); // also restores path / crate visibility; cabins merge next frame
          audio.introThump(0.7, 0);
          introShake(0.05);
        } else {
          for (const im of [pathCenterInst, pathConnInst, pathCobbleInst, crateClutterInst]) im.visible = im.count > 0;
        }
        markShadowsDirty(1.0);
        if (document.body.classList.contains('booting')) {
          if (skipped) { document.body.classList.remove('booting'); wakeUI(); } else popUI();
        }
      }

      // "처음 섬으로": tremble, fall away, assemble again
      function resetIsland() {
        if (intro.phase !== 'done') return;
        if (!INTRO_ON) { populateStarterIsland(); audio.playPlace(); return; }
        if (isExploded) { isExploded = false; explodeToggleTime = -10; }
        hoveredHit = null; updateHoverVisuals();
        const now = performance.now() * 0.001;
        intro.phase = 'crumble'; intro.t0 = now;
        markShadowsDirty(CRUMBLE_LEN + 0.3);
        audio.introRumble();
        introShake(0.05);
        introFx(now + CRUMBLE_HOLD, () => dustRing(0.0, 5.95));
        introFx(now + CRUMBLE_LEN, () => { populateStarterIsland(false); startAssembly(false); });
      }

      // loader: the finished island has been drawn a few times behind it
      function onBootReady() {
        loaderReady = true;
        loaderEl.classList.add('ready');
      }
      // the start press is a user gesture, so sound can start here (on by default)
      function beginFromLoader() {
        loaderReady = false;
        audio.setEnabled(true);
        syncAudioIcon();
        loaderEl.classList.add('go');
        setTimeout(() => loaderEl.remove(), 900);
        startAssembly(true);
      }
      if (!INTRO_ON) { loaderEl.classList.add('go'); setTimeout(() => loaderEl.remove(), 900); }

      // input while not "done": the loader press starts, anything else skips; nothing reaches the
      // game (no placing or key shortcuts mid-assembly). Wheel zoom is left alone.
      function onIntroInput(e) {
        if (intro.phase === 'done') return;
        if (e.type === 'keydown' && (e.repeat || e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(e.key)
          || ['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key))) return; // keep reload, devtools...
        e.stopPropagation();
        e.preventDefault();
        intro.swallowUntil = performance.now() + 450; // and the click that follows this press
        if (intro.phase === 'boot') { if (loaderReady) beginFromLoader(); return; }
        finishIntro(true);
      }
      window.addEventListener('pointerdown', onIntroInput, true);
      window.addEventListener('keydown', onIntroInput, true);
      window.addEventListener('click', (e) => {
        if (performance.now() < intro.swallowUntil) { e.stopPropagation(); e.preventDefault(); }
      }, true);

      // #debug=1: read-only state hook for automated tests (headless Chrome)
      if (HASH.debug === '1') {
        const _pv = new THREE.Vector3();
        window.__mori = {
          state: () => ({
            pan: [camPan.x, camPan.y], targetPan: [targetPan.x, targetPan.y],
            dist: camDist, targetDist: targetCamDist, elev: camElev * 180 / Math.PI, orbit: orbitAngle,
            placed: placedItems.size, free: freeProps.length, photo: isPhotoMode, exploded: isExploded,
            intro: intro.phase, loaderReady
          }),
          // startup assembly hooks for tools/tests/intro.mjs
          resetIsland: () => resetIsland(),
          frame: () => frameNo,
          // hold the animation clock at `sec` seconds into the current assembly / crumble (null = run)
          introClock: (sec) => { debugClock = sec === null ? null : intro.t0 + sec; markShadowsDirty(3); },
          items: () => ITEM_DEFS.map((d) => ({ id: d.id, name: d.name, category: d.category, type: d.type, freePlace: d.freePlace, autoConnect: d.autoConnect })),
          lights: () => ({
            sources: lightSources.length,
            active: pointLightPool.filter((pl) => pl.userData.active).length,
            lit: lightSources.filter((s) => s.slot >= 0 && s.want).map((s) => `${s.x.toFixed(1)},${s.z.toFixed(1)}`).sort().join(' ')
          }),
          // visible renderables in the main scene (for draw call breakdowns)
          renderables: () => {
            const out = [];
            scene.traverseVisible((o) => {
              if (!(o.isMesh || o.isPoints || o.isSprite || o.isLine)) return;
              if (o.isInstancedMesh && o.count === 0) return;
              out.push({ type: o.type, name: o.name || o.material?.type, count: o.isInstancedMesh ? o.count : 1, tris: o.geometry?.index ? o.geometry.index.count / 3 : (o.geometry?.attributes.position?.count || 0) / 3, cast: o.castShadow });
            });
            return out;
          },
          // world point -> CSS pixel position on screen
          project: (x, y, z) => { _pv.set(x, y, z).project(camera); return [(_pv.x + 1) / 2 * window.innerWidth, (1 - _pv.y) / 2 * window.innerHeight]; },
          // CSS pixel -> ground hit (or null)
          hit: (cx, cy) => { const h = getHitUnderClient(cx, cy); return h ? { wx: h.wx, wz: h.wz } : null; },
          audio
        };
      }

      // #time=golden / #time=night starts at that time of day
      if (HASH.time && TIME_ORDER.includes(HASH.time)) {
        setTimeOfDay(TIME_ORDER.indexOf(HASH.time));
        // start already there instead of blending from day
        for (const k in curAtmo) {
          if (curAtmo[k] && curAtmo[k].isColor) curAtmo[k].copy(targetAtmo[k]);
          else if (typeof targetAtmo[k] === 'number') curAtmo[k] = targetAtmo[k];
        }
      }
      if (HASH.explode === '1') setTimeout(toggleExplodedView, 600); // #explode=1 opens the exploded view

      requestAnimationFrame(animate);
    }

    function showToast() {}
  </script>
</body>
</html>
