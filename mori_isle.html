      // --- PLACE JUICE: pixel dust burst, micro screen shake, timed events ---
      const DUST_COUNT = 48;
      const dustPos = new Float32Array(DUST_COUNT * 3);
      const dustLife = new Float32Array(DUST_COUNT);
      const dustVel = new Float32Array(DUST_COUNT * 3);
      const dustGeo = new THREE.BufferGeometry();
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
      dustGeo.setAttribute('aLife', new THREE.BufferAttribute(dustLife, 1));
      const dustMat = new THREE.ShaderMaterial({
        uniforms: { uPx: sharedUniforms.uPointScale },
        vertexShader: `
          attribute float aLife;
          uniform float uPx;
          varying float vLife;
          void main() {
            vLife = aLife;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = aLife > 0.0 ? max(1.0, floor((3.0 + 2.0 * aLife) * uPx + 0.5)) : 0.0;
          }`,
        fragmentShader: `
          varying float vLife;
          void main() {
            if (vLife <= 0.0) discard;
            gl_FragColor = vec4(0.86, 0.76, 0.58, vLife * 0.85); // square pixel dust
          }`,
        transparent: true,
        depthWrite: false
      });
      const dustPoints = new THREE.Points(dustGeo, dustMat);
      dustPoints.frustumCulled = false;
      scene.add(dustPoints);
      let dustCursor = 0;
      function burstDust(x, y, z, n = 12, radius = 0.3) {
        for (let k = 0; k < n; k++) {
          const i = dustCursor; dustCursor = (dustCursor + 1) % DUST_COUNT;
          const a = Math.random() * Math.PI * 2;
          dustPos[i * 3] = x + Math.cos(a) * radius * 0.5;
          dustPos[i * 3 + 1] = y + 0.03;
          dustPos[i * 3 + 2] = z + Math.sin(a) * radius * 0.5;
          const sp = 0.9 + Math.random() * 0.9;
          dustVel[i * 3] = Math.cos(a) * sp;
          dustVel[i * 3 + 1] = 0.5 + Math.random() * 0.7;
          dustVel[i * 3 + 2] = Math.sin(a) * sp;
          dustLife[i] = 1.0;
        }
      }
      function updateDust(dt) {
        let any = false;
        for (let i = 0; i < DUST_COUNT; i++) {
          if (dustLife[i] <= 0) continue;
          any = true;
          dustLife[i] -= dt * 2.6;
          dustVel[i * 3] *= 0.9; dustVel[i * 3 + 2] *= 0.9;
          dustVel[i * 3 + 1] -= dt * 3.0;
          dustPos[i * 3] += dustVel[i * 3] * dt;
          dustPos[i * 3 + 1] += Math.max(dustVel[i * 3 + 1], -0.2) * dt;
          dustPos[i * 3 + 2] += dustVel[i * 3 + 2] * dt;
        }
        if (any || dustGeo.userData.wasActive) {
          dustGeo.attributes.position.needsUpdate = true;
          dustGeo.attributes.aLife.needsUpdate = true;
        }
        dustGeo.userData.wasActive = any;
      }

      let shakeStart = -10, shakeAmp = 0;
      const pendingFx = [];
      function scheduleFx(delay, fn) { pendingFx.push({ t: performance.now() * 0.001 + delay, fn }); }
      function runPendingFx(nowSec) {
        for (let i = pendingFx.length - 1; i >= 0; i--) {
          if (nowSec >= pendingFx[i].t) { const f = pendingFx[i].fn; pendingFx.splice(i, 1); f(); }
        }
      }

      function triggerPlaceJuice(def, x, y, z) {
        let total, groups;
        if (def.type === 'stack') {
          total = dropTotalTime(def.layers);
          groups = Math.floor((def.layers - 1) / dropGroupFor(def.layers)) + 1;
        } else if (def.type === '3d_cabin') {
          total = cabinDropTotal(); groups = 16;
        } else {
          total = 0.05; groups = 1; // path / fence: single snap
        }
        const footprint = def.type === '3d_cabin' ? 0.7 : (def.freePlace ? 0.18 : 0.32);
        // first layer lands -> pixel dust
        scheduleFx(DROP_FALL, () => burstDust(x, y, z, def.type === '3d_cabin' ? 20 : 12, footprint));
        // top lands -> micro shake
        scheduleFx(total, () => { shakeStart = performance.now() * 0.001; shakeAmp = def.type === '3d_cabin' ? 0.07 : (def.freePlace ? 0.02 : 0.045); });
        // clicks: ~6 evenly spread landings
        const clicks = Math.max(1, Math.min(6, groups));
        const times = [];
        for (let i = 0; i < clicks; i++) {
          times.push(DROP_FALL + (clicks > 1 ? i / (clicks - 1) : 0) * Math.max(0, total - DROP_FALL));
        }
        audio.playStackClicks(times);
      }

      /* ---- COLLISION VALIDATION (PREVENTS UNREALISTIC CLIPPING / OVERLAP) ---- */
      const PROP_SELF_RADIUS = {
        rocks: 0.28,
        flowers: 0.12,
        reeds: 0.11,
        mushrooms: 0.10
      };

      function isInsideCabinFootprint(wx, wz, pad = 0.0) {
        for (const entry of placedItems.values()) {
          if (entry.id !== 'cabin') continue;
          const cx = entry.gx - HALF_GRID + 0.5;
          const cz = entry.gz - HALF_GRID + 0.5;
          const rotated = entry.rotation % 2 === 1;
          const hx = (rotated ? 0.48 : 0.52) + pad;
          const hz = (rotated ? 0.52 : 0.48) + pad;
          if (Math.abs(wx - cx) < hx && Math.abs(wz - cz) < hz) return true;
        }
        return false;
      }

      function isBlockedForPoint(wx, wz, selfRadius = 0.10, checkSmallFreeProps = true) {
        // 1. Water / Pond exclusion
        if (isPondWorld(wx, wz, 0.06 + selfRadius * 0.3)) return true;

        // 2. Cabin interior floor & walls bounding box
        if (isInsideCabinFootprint(wx, wz, selfRadius)) return true;

        // 3. Solid grid-placed objects (campfire flames, tree trunks, benches, lanterns, fence posts)
        for (const entry of placedItems.values()) {
          if (entry.id === 'cabin' || entry.id === 'path') continue;
          const ex = entry.gx - HALF_GRID + 0.5;
          const ez = entry.gz - HALF_GRID + 0.5;
          let solidR = 0.24;
          if (entry.id === 'campfire') solidR = 0.42;
          else if (entry.id === 'bench') solidR = 0.34;
          else if (entry.id === 'pine' || entry.id === 'oak') solidR = 0.24;
          else if (entry.id === 'lantern') solidR = 0.18;
          else if (entry.id === 'fence') solidR = 0.16;
          if (Math.hypot(wx - ex, wz - ez) < solidR + selfRadius) return true;
        }

        // 4. Solid free-placed rocks & closely overlapping small props
        for (const fp of freeProps) {
          const dist = Math.hypot(wx - fp.wx, wz - fp.wz);
          if (fp.id === 'rocks') {
            const rockR = 0.34 * (fp.scale || 1.0);
            if (dist < rockR + selfRadius) return true;
          } else if (checkSmallFreeProps) {
            if (dist < 0.16 + selfRadius * 0.5) return true;
          }
        }
        return false;
      }

      function canPlaceAtHit(toolId, hit) {
        if (!hit || toolId === 'delete') return true;
        const def = assetsById[toolId]?.def;
        if (!def) return false;

        if (def.freePlace) {
          const r = PROP_SELF_RADIUS[toolId] || 0.12;
          return !isBlockedForPoint(hit.wx, hit.wz, r, true);
        } else {
          // Grid-snapped object: block pond tiles and already-occupied tiles
          if (isPondTile(hit.gx, hit.gz)) return false;
          const key = `${hit.gx},${hit.gz}`;
          if (placedItems.has(key)) return false;

          // Prevent placing a cabin or campfire directly over existing solid rocks
          const wx = hit.gx - HALF_GRID + 0.5;
          const wz = hit.gz - HALF_GRID + 0.5;
          const checkR = def.id === 'cabin' ? 0.46 : (def.id === 'campfire' ? 0.38 : 0.22);
          for (const fp of freeProps) {
            if (fp.id === 'rocks' && Math.hypot(wx - fp.wx, wz - fp.wz) < checkR + 0.26 * (fp.scale || 1.0)) {
              return false;
            }
          }
          return true;
        }
      }

      function setGhostValidityColor(ghost, isValid) {
        if (!ghost) return;
        const colHex = isValid ? '#a8ffbe' : '#ff5252';
        if (ghost.isMesh && ghost.material) {
          ghost.material.color.set(colHex);
          ghost.material.opacity = isValid ? 0.55 : 0.72;
        } else {
          ghost.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.color.set(isValid ? '#98ffb8' : '#ff5252');
              child.material.opacity = isValid ? 0.42 : 0.62;
            }
          });
        }
      }

      function rebuildInstances() {
        const buckets = {};
        ITEM_DEFS.forEach((d) => { if (d.type === 'stack') buckets[d.id] = []; });

        while (cabinGroupContainer.children.length > 0) {
          const old = cabinGroupContainer.children[0];
          cabinGroupContainer.remove(old);
          disposeObjectTree(old);
        }
        while (glowGroup.children.length > 0) {
          glowGroup.remove(glowGroup.children[0]);
        }
        activeCabins = [];
        activeGlowSprites = [];
        contactShadowBaseList = [];

        let plIndex = 0;
        pointLightPool.forEach((pl) => { pl.userData = { active: false }; pl.intensity = 0; });

        let pathCenterIdx = 0, pathConnIdx = 0, pathCobbleIdx = 0;
        let fencePostIdx = 0, fenceRailIdx = 0;
        let crateIdx = 0;

        markShadowsDirty(1.0); // covers the stacked drop + cabin drop & squash

        // 1. Process Grid-Snapped Items
        placedItems.forEach((entry) => {
          const def = assetsById[entry.id].def;
          const wx = entry.gx - HALF_GRID + 0.5;
          const wz = entry.gz - HALF_GRID + 0.5;
          const wy = getTileElevation(entry.gx, entry.gz);
          const rotY = entry.rotation * (Math.PI / 2);

          if (def.type === 'stack') {
            buckets[entry.id].push({ wx, wy, wz, rotation: entry.rotation, scale: 1.0, spawnT: entry.spawnT ?? -100 });
          } else if (def.type === '3d_cabin') {
            const cabin = buildStorybookCabinPrefab();
            cabin.position.set(wx, wy, wz);
            cabin.rotation.y = rotY;
            cabinGroupContainer.add(cabin);
            activeCabins.push({ mesh: cabin, baseX: wx, baseY: wy, baseZ: wz, rotY, spawnT: entry.spawnT ?? -100 });
            prepareCabinDrop(cabin);

            if (crateIdx < 24) {
              dummyObj.position.set(wx - 0.54, wy + 0.08, wz + 0.34);
              dummyObj.rotation.set(0, rotY + 0.25, 0);
              dummyObj.scale.set(1, 1, 1);
              dummyObj.updateMatrix();
              crateClutterInst.setMatrixAt(crateIdx++, dummyObj.matrix);
            }
          } else if (def.type === 'auto_path') {
            // Auto-tiling dirt pad + stepping stones connecting to neighbor paths & cabin door!
            dummyObj.position.set(wx, wy + 0.014, wz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(1, 1, 1);
            dummyObj.updateMatrix();
            pathCenterInst.setMatrixAt(pathCenterIdx++, dummyObj.matrix);

            // Stepping stones on tile
            for (let s = 0; s < 2 && pathCobbleIdx < 260; s++) {
              const ox = (hash2D(entry.gx, entry.gz, s * 5 + 1) - 0.5) * 0.36;
              const oz = (hash2D(entry.gx, entry.gz, s * 5 + 2) - 0.5) * 0.36;
              const sc = 0.78 + hash2D(entry.gx, entry.gz, s * 5 + 3) * 0.45;
              dummyObj.position.set(wx + ox, wy + 0.022, wz + oz);
              dummyObj.rotation.set(0, hash2D(entry.gx, entry.gz, s + 9) * 3.14, 0);
              dummyObj.scale.set(sc, 1, sc * 0.85);
              dummyObj.updateMatrix();
              pathCobbleInst.setMatrixAt(pathCobbleIdx++, dummyObj.matrix);
            }

            // Connect smoothly to cardinal neighbors (path or cabin) on same elevation
            const dirs = [[0, -1, 0], [0, 1, 0], [1, 0, Math.PI / 2], [-1, 0, Math.PI / 2]];
            dirs.forEach(([dx, dz, ang]) => {
              const nb = placedItems.get(`${entry.gx + dx},${entry.gz + dz}`);
              if (nb && (nb.id === 'path' || nb.id === 'cabin') && getTileElevation(entry.gx + dx, entry.gz + dz) === wy) {
                if (pathConnIdx < 260) {
                  dummyObj.position.set(wx + dx * 0.36, wy + 0.013, wz + dz * 0.36);
                  dummyObj.rotation.set(0, ang, 0);
                  dummyObj.scale.set(1, 1, 1);
                  dummyObj.updateMatrix();
                  pathConnInst.setMatrixAt(pathConnIdx++, dummyObj.matrix);
                }
              }
            });
          } else if (def.type === 'auto_fence') {
            // Auto-tiling wooden fence post + horizontal rails to adjacent fence posts!
            dummyObj.position.set(wx, wy + 0.18, wz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(1, 1, 1);
            dummyObj.updateMatrix();
            fencePostInst.setMatrixAt(fencePostIdx++, dummyObj.matrix);

            const dirs = [[0, -1, 0], [0, 1, 0], [1, 0, Math.PI / 2], [-1, 0, Math.PI / 2]];
            dirs.forEach(([dx, dz, ang]) => {
              const nb = placedItems.get(`${entry.gx + dx},${entry.gz + dz}`);
              if (nb && nb.id === 'fence' && Math.abs(getTileElevation(entry.gx + dx, entry.gz + dz) - wy) < 0.05) {
                for (let railH of [0.13, 0.27]) {
                  if (fenceRailIdx < 360) {
                    dummyObj.position.set(wx + dx * 0.28, wy + railH, wz + dz * 0.28);
                    dummyObj.rotation.set(0, ang, 0);
                    dummyObj.scale.set(1, 1, 1);
                    dummyObj.updateMatrix();
                    fenceRailInst.setMatrixAt(fenceRailIdx++, dummyObj.matrix);
                  }
                }
              }
            });
          }

          if (def.contactRadius > 0) {
            contactShadowBaseList.push({
              x: wx, y: wy + 0.014, z: wz, r: def.contactRadius * 2.0,
              tier: def.type === '3d_cabin' ? 2 : (def.explodeTier || 0)
            });
          }

          if (def.glow) {
            const spMat = new THREE.SpriteMaterial({
              map: glowTex, color: def.glow.color, transparent: true, opacity: 0,
              blending: THREE.AdditiveBlending, depthWrite: false
            });
            const sprite = new THREE.Sprite(spMat);
            sprite.position.set(wx, wy + def.glow.offsetY, wz);
            sprite.scale.set(def.glow.scale, def.glow.scale, 1);
            glowGroup.add(sprite);
            activeGlowSprites.push({
              sprite, baseY: wy + def.glow.offsetY, baseScale: def.glow.scale,
              seed: hash2D(entry.gx, entry.gz, 9) * 10, flicker: !!def.glow.flicker,
              isCabin: def.type === '3d_cabin', tier: def.explodeTier || 0
            });

            if (plIndex < MAX_POINT_LIGHTS) {
              const pl = pointLightPool[plIndex++];
              pl.color.set(def.glow.color);
              pl.position.set(wx, wy + def.glow.offsetY + 0.15, wz);
              pl.userData = {
                baseY: wy + def.glow.offsetY + 0.15,
                mult: def.glow.lightIntensity || 1.0,
                flicker: !!def.glow.flicker,
                seed: hash2D(entry.gx, entry.gz, 15) * 20,
                isCabin: def.type === '3d_cabin',
                tier: def.explodeTier || 0,
                active: true
              };
            }
          }
        });

        // 2. Process Free-Placed Overlapping Decor (Flowers, Reeds, Rocks, Mushrooms)
        freeProps.forEach((fp) => {
          const def = assetsById[fp.id]?.def;
          if (!def || def.type !== 'stack') return;
          const wy = getContinuousTerrainHeight(fp.wx, fp.wz);
          buckets[fp.id].push({ wx: fp.wx, wy, wz: fp.wz, rotation: fp.rotation, scale: fp.scale || 1.0, spawnT: fp.spawnT ?? -100 });
          if (def.contactRadius > 0) {
            contactShadowBaseList.push({
              x: fp.wx, y: wy + 0.014, z: fp.wz, r: def.contactRadius * 1.75 * (fp.scale || 1.0),
              tier: def.explodeTier || 0
            });
          }
        });

        // Apply InstancedMeshes
        ITEM_DEFS.forEach((def) => {
          if (def.type !== 'stack') return;
          const list = buckets[def.id];
          const mesh = instancedById[def.id];
          for (let i = 0; i < list.length && i < MAX_INSTANCES; i++) {
            const item = list[i];
            dummyObj.position.set(item.wx, item.wy, item.wz);
            dummyObj.rotation.set(0, item.rotation * (Math.PI / 2), 0);
            dummyObj.scale.setScalar(item.scale);
            dummyObj.updateMatrix();
            mesh.setMatrixAt(i, dummyObj.matrix);
            mesh.userData.spawnAttr.array[i] = item.spawnT;
          }
          mesh.count = Math.min(list.length, MAX_INSTANCES);
          mesh.visible = mesh.count > 0; // an empty InstancedMesh still costs a draw call (x2 with shadows)
          mesh.instanceMatrix.needsUpdate = true;
          mesh.userData.spawnAttr.needsUpdate = true;
        });

        pathCenterInst.count = pathCenterIdx; pathCenterInst.instanceMatrix.needsUpdate = true;
        pathConnInst.count = pathConnIdx; pathConnInst.instanceMatrix.needsUpdate = true;
        pathCobbleInst.count = pathCobbleIdx; pathCobbleInst.instanceMatrix.needsUpdate = true;
        fencePostInst.count = fencePostIdx; fencePostInst.instanceMatrix.needsUpdate = true;
        fenceRailInst.count = fenceRailIdx; fenceRailInst.instanceMatrix.needsUpdate = true;
        crateClutterInst.count = crateIdx; crateClutterInst.instanceMatrix.needsUpdate = true;
        for (const im of [pathCenterInst, pathConnInst, pathCobbleInst, fencePostInst, fenceRailInst, crateClutterInst]) im.visible = im.count > 0;

        // 3. Clustered Ghibli-Style Grass Tufts (Large + 2~3 Med/Small Clumps with Tile Edge Padding!)
        let grassIdx = 0;
        let pebbleIdx = 0;
        const TILE_PAD = 0.14; // Keeps tufts neatly inset from tile grid lines

        function clampToTilePadding(val) {
          const base = Math.floor(val);
          const local = THREE.MathUtils.clamp(val - base, TILE_PAD, 1.0 - TILE_PAD);
          return base + local;
        }

        function isGrassSpotValid(tx, tz) {
          if (Math.abs(tx) > HALF_GRID - 0.18 || Math.abs(tz) > HALF_GRID - 0.18) return false;
          if (getPondSDF(tx, tz) < 0.16) return false;
          const gx = Math.floor(tx + HALF_GRID);
          const gz = Math.floor(tz + HALF_GRID);
          const tileItem = placedItems.get(`${gx},${gz}`);
          if (tileItem && (tileItem.id === 'path' || tileItem.id === 'cabin' || tileItem.id === 'campfire')) return false;
          if (isBlockedForPoint(tx, tz, 0.06, false)) return false;
          return true;
        }

        function spawnGrassCluster(ax, az, seed) {
          if (grassIdx >= MAX_GRASS_TUFTS) return;
          const cx = clampToTilePadding(ax);
          const cz = clampToTilePadding(az);
          if (!isGrassSpotValid(cx, cz)) return;

          // 1 Large anchor tuft
          const mainSc = 1.02 + hash2D(seed, 1, 31) * 0.24;
          const cy = getContinuousTerrainHeight(cx, cz);
          dummyObj.position.set(cx, cy - 0.01, cz);
          dummyObj.rotation.set(0, hash2D(seed, 2, 31) * Math.PI * 2, 0);
          dummyObj.scale.set(mainSc, mainSc, mainSc);
          dummyObj.updateMatrix();
          grassClutterInst.setMatrixAt(grassIdx++, dummyObj.matrix);

          // 2~3 Medium/Small companion tufts tucked tightly around the large tuft
          const subCount = 2 + (Math.floor(hash2D(seed, 3, 31) * 2) % 2);
          for (let s = 0; s < subCount && grassIdx < MAX_GRASS_TUFTS; s++) {
            const ang = (s / subCount) * Math.PI * 2 + hash2D(seed, s + 4, 31) * 1.1;
            const dist = 0.085 + hash2D(seed, s + 9, 31) * 0.075;
            const sx = clampToTilePadding(cx + Math.cos(ang) * dist);
            const sz = clampToTilePadding(cz + Math.sin(ang) * dist);
            if (!isGrassSpotValid(sx, sz)) continue;
            const sy = getContinuousTerrainHeight(sx, sz);
            const subSc = 0.56 + hash2D(seed, s + 15, 31) * 0.30;
            dummyObj.position.set(sx, sy - 0.01, sz);
            dummyObj.rotation.set(0, hash2D(seed, s + 21, 31) * Math.PI * 2, 0);
            dummyObj.scale.set(subSc, subSc * (0.9 + hash2D(seed, s + 25, 31) * 0.2), subSc);
            dummyObj.updateMatrix();
            grassClutterInst.setMatrixAt(grassIdx++, dummyObj.matrix);
          }
        }

        let clusterSeed = 1;
        // (A) Cluster around Tree Roots, Cabin Outer Corners & Fences
        placedItems.forEach((entry) => {
          const wx = entry.gx - HALF_GRID + 0.5;
          const wz = entry.gz - HALF_GRID + 0.5;
          if (entry.id === 'pine' || entry.id === 'oak') {
            for (let k = 0; k < 2; k++) {
              const a = hash2D(entry.gx, entry.gz, k * 3 + 1) * Math.PI * 2;
              spawnGrassCluster(wx + Math.cos(a) * 0.32, wz + Math.sin(a) * 0.32, clusterSeed++);
            }
          } else if (entry.id === 'cabin') {
            // Tuck fluffy grass clusters near cabin outer corners (outside footprint)
            [[-0.64, -0.58], [0.64, -0.58], [-0.66, 0.56], [0.64, 0.54]].forEach(([ox, oz]) => {
              spawnGrassCluster(wx + ox, wz + oz, clusterSeed++);
            });
          } else if (entry.id === 'fence' || entry.id === 'bench') {
            const a = hash2D(entry.gx, entry.gz, 7) * Math.PI * 2;
            spawnGrassCluster(wx + Math.cos(a) * 0.28, wz + Math.sin(a) * 0.28, clusterSeed++);
          }
        });

        // (B) Cluster right beside Rock Bases
        freeProps.forEach((fp) => {
          if (fp.id === 'rocks') {
            const r = 0.38 * (fp.scale || 1.0) + 0.08;
            for (let k = 0; k < 2; k++) {
              const a = hash2D(fp.wx * 10, fp.wz * 10, k + 5) * Math.PI * 2;
              spawnGrassCluster(fp.wx + Math.cos(a) * r, fp.wz + Math.sin(a) * r, clusterSeed++);
            }
          }
        });

        // (C) Cluster organically around the Rounded Pond Rim
        for (let a = 0; a < 18; a++) {
          const ang = (a / 18) * Math.PI * 2 + 0.12;
          for (let step = 0.6; step < 3.6; step += 0.08) {
            const tx = 2.35 + Math.cos(ang) * step;
            const tz = 2.35 + Math.sin(ang) * step;
            if (getPondSDF(tx, tz) > 0.24) {
              spawnGrassCluster(tx, tz, clusterSeed++);
              break;
            }
          }
        }

        // (D) Light natural accents on back-hill ledges (keeps central meadow clean & airy)
        for (let gz = 0; gz < GRID_SIZE; gz++) {
          for (let gx = 0; gx < GRID_SIZE; gx++) {
            if (getHillLevel(gx, gz) >= 1 && !placedItems.has(`${gx},${gz}`) && hash2D(gx, gz, 41) > 0.62) {
              const wx = gx - HALF_GRID + 0.5 + (hash2D(gx, gz, 42) - 0.5) * 0.35;
              const wz = gz - HALF_GRID + 0.5 + (hash2D(gx, gz, 43) - 0.5) * 0.35;
              spawnGrassCluster(wx, wz, clusterSeed++);
            }
          }
        }

        // Cluster smooth wet pebbles tightly along the organic rounded pond rim!
        for (let a = 0; a < 90 && pebbleIdx < 110; a++) {
          const ang = (a / 90) * Math.PI * 2;
          // March radially outward from pond center until right on the curved shoreline!
          let rx = 2.35, rz = 2.35;
          for (let step = 0.5; step < 3.4; step += 0.08) {
            const tx = 2.35 + Math.cos(ang) * step;
            const tz = 2.35 + Math.sin(ang) * step;
            if (getPondSDF(tx, tz) > 0.08) {
              rx = tx + (hash2D(a, 1, 5) - 0.5) * 0.28;
              rz = tz + (hash2D(a, 2, 5) - 0.5) * 0.28;
              break;
            }
          }
          if (Math.abs(rx) > HALF_GRID - 0.2 || Math.abs(rz) > HALF_GRID - 0.2) continue;
          const py = getContinuousTerrainHeight(rx, rz);
          const sc = 0.65 + hash2D(a, 3, 5) * 0.95;
          dummyObj.position.set(rx, py + 0.02, rz);
          dummyObj.rotation.set(a, a * 1.3, a * 0.7);
          dummyObj.scale.set(sc, sc * 0.55, sc);
          dummyObj.updateMatrix();
          pebbleClutterInst.setMatrixAt(pebbleIdx++, dummyObj.matrix);
        }
        grassClutterInst.count = grassIdx; grassClutterInst.instanceMatrix.needsUpdate = true;
        pebbleClutterInst.count = pebbleIdx; pebbleClutterInst.instanceMatrix.needsUpdate = true;

        const totalCount = placedItems.size + freeProps.length;
        document.getElementById('item-counter').textContent =
          totalCount === 0 ? 'Empty Island' : `${totalCount} Objects Placed`;
      }

      /* ---- STORYTELLING CLUSTERED STARTER DIORAMA ---- */
      function populateStarterIsland() {
        placedItems.clear();
        freeProps.length = 0;

        const starterGrid = [
          // 1. Dense Forest & Rocks clustered tightly on the elevated back hills!
          { gx: 0, gz: 1, id: 'pine', rotation: 0 },
          { gx: 0, gz: 3, id: 'pine', rotation: 2 },
          { gx: 1, gz: 0, id: 'pine', rotation: 1 },
          { gx: 1, gz: 2, id: 'oak', rotation: 0 },
          { gx: 2, gz: 0, id: 'pine', rotation: 3 },
          { gx: 2, gz: 1, id: 'pine', rotation: 1 },
          { gx: 3, gz: 0, id: 'oak', rotation: 2 },
          { gx: 4, gz: 0, id: 'pine', rotation: 0 },
          { gx: 5, gz: 1, id: 'pine', rotation: 2 },
          { gx: 0, gz: 5, id: 'oak', rotation: 1 },
          { gx: 1, gz: 6, id: 'pine', rotation: 3 },

          // 2. Cozy Storybook Cabin nestled right in front of the back hill shelter
          { gx: 4, gz: 4, id: 'cabin', rotation: 0 },

          // 3. Auto-tiling Wooden Fence hugging the left side of the cabin yard
          { gx: 3, gz: 4, id: 'fence', rotation: 0 },
          { gx: 3, gz: 5, id: 'fence', rotation: 0 },
          { gx: 3, gz: 6, id: 'fence', rotation: 0 },

          // 4. Storytelling Path connecting Cabin Door -> Campfire/Bench -> Pond Shoreline!
          { gx: 4, gz: 5, id: 'path', rotation: 0 },
          { gx: 4, gz: 6, id: 'path', rotation: 0 },
          { gx: 5, gz: 6, id: 'path', rotation: 0 },
          { gx: 6, gz: 6, id: 'path', rotation: 0 },
          { gx: 7, gz: 6, id: 'path', rotation: 0 },

          // 5. Gathering Area (Campfire, Bench, Lanterns)
          { gx: 5, gz: 7, id: 'campfire', rotation: 0 },
          { gx: 4, gz: 7, id: 'bench', rotation: 1 },
          { gx: 5, gz: 5, id: 'lantern', rotation: 2 },
          { gx: 6, gz: 9, id: 'lantern', rotation: 0 }
        ];

        starterGrid.forEach((s) => {
          if (!isPondTile(s.gx, s.gz)) placedItems.set(`${s.gx},${s.gz}`, s);
        });

        // Free-placed overlapping clusters:
        // (a) Mossy Rocks & Mushrooms tucked right against back hill trees
        const starterFree = [
          { id: 'rocks', wx: -3.2, wz: -3.3, rotation: 0, scale: 1.05 },
          { id: 'rocks', wx: -2.4, wz: -3.9, rotation: 1, scale: 0.85 },
          { id: 'rocks', wx: -4.1, wz: -1.4, rotation: 2, scale: 0.95 },
          { id: 'mushrooms', wx: -3.0, wz: -2.5, rotation: 0, scale: 1.0 },
          { id: 'mushrooms', wx: -4.3, wz: -0.2, rotation: 2, scale: 0.9 },
          // (b) Reeds, Flowers & Rocks hugging the curved rounded Pond Edge!
          { id: 'reeds', wx: 0.55, wz: 2.35, rotation: 0, scale: 1.05 },
          { id: 'reeds', wx: 0.85, wz: 3.75, rotation: 1, scale: 0.95 },
          { id: 'reeds', wx: 3.95, wz: 0.75, rotation: 2, scale: 1.0 },
          { id: 'reeds', wx: 4.35, wz: 2.15, rotation: 0, scale: 0.92 },
          { id: 'rocks', wx: 3.75, wz: 0.35, rotation: 1, scale: 0.92 },
          { id: 'flowers', wx: 0.35, wz: 1.85, rotation: 0, scale: 0.95 },
          { id: 'flowers', wx: 1.65, wz: 4.15, rotation: 1, scale: 1.0 },
          // (c) Wildflowers & Mushrooms right beside cabin fence & bench
          { id: 'flowers', wx: -2.15, wz: -0.85, rotation: 0, scale: 0.92 },
          { id: 'flowers', wx: -1.85, wz: 0.95, rotation: 2, scale: 0.88 },
          { id: 'mushrooms', wx: -2.85, wz: 0.55, rotation: 1, scale: 0.85 }
        ];
        starterFree.forEach((fp) => freeProps.push(fp));

        rebuildInstances();
      }

      function placeAtHit(hit) {
        if (selectedTool === 'delete') {
          removeAtHit(hit);
          return;
        }
        if (!canPlaceAtHit(selectedTool, hit)) {
          return; // Blocked by collision/water; red ghost provides clear visual feedback
        }
        const def = assetsById[selectedTool].def;
        if (def.freePlace) {
          freeProps.push({
            id: selectedTool,
            wx: hit.wx,
            wz: hit.wz,
            rotation: currentRotation,
            scale: 0.88 + Math.random() * 0.24,
            spawnT: performance.now() * 0.001
          });
          rebuildInstances();
          triggerPlaceJuice(def, hit.wx, getContinuousTerrainHeight(hit.wx, hit.wz), hit.wz);
        } else {
          const key = `${hit.gx},${hit.gz}`;
          placedItems.set(key, { id: selectedTool, gx: hit.gx, gz: hit.gz, rotation: currentRotation, spawnT: performance.now() * 0.001 });
          rebuildInstances();
          triggerPlaceJuice(def, hit.gx - HALF_GRID + 0.5, getTileElevation(hit.gx, hit.gz), hit.gz - HALF_GRID + 0.5);
        }
      }

      function removeAtHit(hit) {
        // Check closest free-placed prop within 0.55 radius first
        let bestIdx = -1, bestDist = 0.55;
        for (let i = 0; i < freeProps.length; i++) {
          const d = Math.hypot(freeProps[i].wx - hit.wx, freeProps[i].wz - hit.wz);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        if (bestIdx !== -1) {
          freeProps.splice(bestIdx, 1);
          rebuildInstances();
          audio.playRemove();
          return;
        }
        const key = `${hit.gx},${hit.gz}`;
        if (placedItems.has(key)) {
          placedItems.delete(key);
          rebuildInstances();
          audio.playRemove();
        }
      }

      function updateHoverVisuals() {
        ITEM_DEFS.forEach((d) => { ghostMeshesById[d.id].visible = false; });
        cursorTile.visible = false;
        freeCursorRing.visible = false;

        if (!hoveredHit || isPhotoMode || isExploded) return;

        const { gx, gz, wx, wz, wy } = hoveredHit;
        if (selectedTool === 'delete') {
          cursorTile.visible = true;
          cursorTile.position.set(gx - HALF_GRID + 0.5, getTileElevation(gx, gz) + 0.025, gz - HALF_GRID + 0.5);
          cursorMat.color.set('#ff7c7c');
          return;
        }

        const def = assetsById[selectedTool].def;
        const ghost = ghostMeshesById[selectedTool];
        const valid = canPlaceAtHit(selectedTool, hoveredHit);

        if (def.freePlace) {
          freeCursorRing.visible = true;
          freeCursorRing.position.set(wx, wy + 0.03, wz);
          ringMat.color.set(valid ? '#ffe29c' : '#ff5252');
          if (ghost) {
            ghost.visible = true;
            ghost.position.set(wx, wy + 0.02, wz);
            ghost.rotation.y = currentRotation * (Math.PI / 2);
            setGhostValidityColor(ghost, valid);
          }
        } else {
          const tileX = gx - HALF_GRID + 0.5;
          const tileZ = gz - HALF_GRID + 0.5;
          const tileY = getTileElevation(gx, gz);
          cursorTile.visible = true;
          cursorTile.position.set(tileX, tileY + 0.025, tileZ);
          cursorMat.color.set(valid ? '#a8ffbe' : '#ff5252');
          if (ghost) {
            ghost.visible = true;
            ghost.position.set(tileX, tileY + 0.02, tileZ);
            ghost.rotation.y = currentRotation * (Math.PI / 2);
            setGhostValidityColor(ghost, valid);
          }
        }
      }

      /* =======================================================================
         13. EXPLODED VIEW TOGGLE & ATMOSPHERE INTERPOLATION
         ======================================================================= */
      const btnExplodeTop = document.getElementById('btn-explode-top');
      const explodeBtnText = document.getElementById('explode-btn-text');

      function toggleExplodedView() {
        isExploded = !isExploded;
        explodeToggleTime = performance.now() * 0.001;
        markShadowsDirty(1.4); // stagger + ease-out-back settle
        btnExplodeTop.classList.toggle('active', isExploded);
        explodeBtnText.textContent = isExploded ? '디오라마 합치기' : '디오라마 분해 보기';
        targetCamDist = isExploded ? 51.5 : 42.5;
        targetCamLookY = isExploded ? 1.05 : 0.05;
        audio.playExplodeCascade(isExploded);
        updateHoverVisuals();
      }
      btnExplodeTop.addEventListener('click', toggleExplodedView);

      let timeIndex = 0;
      let targetAtmo = ATMOSPHERES.day;
      const curAtmo = {
        skyTop: ATMOSPHERES.day.skyTop.clone(),
        skyBottom: ATMOSPHERES.day.skyBottom.clone(),
        keyColor: ATMOSPHERES.day.keyColor.clone(),
        keyIntensity: ATMOSPHERES.day.keyIntensity,
        fillColor: ATMOSPHERES.day.fillColor.clone(),
        fillIntensity: ATMOSPHERES.day.fillIntensity,
        rimColor: ATMOSPHERES.day.rimColor.clone(),
        rimIntensity: ATMOSPHERES.day.rimIntensity,
        hemiSky: ATMOSPHERES.day.hemiSky.clone(),
        hemiGround: ATMOSPHERES.day.hemiGround.clone(),
        hemiIntensity: ATMOSPHERES.day.hemiIntensity,
        fogColor: ATMOSPHERES.day.fogColor.clone(),
        fogDensity: ATMOSPHERES.day.fogDensity,
        waterDeep: ATMOSPHERES.day.waterDeep.clone(),
        waterShallow: ATMOSPHERES.day.waterShallow.clone(),
        waterFoam: ATMOSPHERES.day.waterFoam.clone(),
        gradeTint: ATMOSPHERES.day.gradeTint.clone(),
        gradeWarmth: ATMOSPHERES.day.gradeWarmth,
        nightFactor: ATMOSPHERES.day.nightFactor,

      };

      const TIME_ICONS = {
        day: `<svg viewBox="0 0 24 24" fill="none" stroke="#ffe17d" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>`,

      /* =======================================================================

      const paletteContainer = document.getElementById('palette-container');

      function updateSelectionUI() {

      delBtn.addEventListener('click', () => {

      document.getElementById('btn-rotate').addEventListener('click', () => {

      document.getElementById('btn-time').addEventListener('click', () => {

      const AUDIO_ICONS = {
        off: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`,
        on: `<svg viewBox="0 0 24 24" fill="none" stroke="#8fd18a" stroke-width="2.2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>`
      };
      const btnAudio = document.getElementById('btn-audio');
      const audioIcon = document.getElementById('audio-icon');
      audioIcon.innerHTML = AUDIO_ICONS.off;
      btnAudio.addEventListener('click', () => {

      const resetPopover = document.getElementById('reset-popover');
      function setPhotoMode(enabled) {
        isPhotoMode = enabled;
        document.body.classList.toggle('photo-mode', enabled);
        resetPopover.classList.remove('open');

      }
      document.getElementById('btn-photo').addEventListener('click', () => {

      document.getElementById('photo-exit-btn').addEventListener('click', () => setPhotoMode(false));

      document.getElementById('btn-reset').addEventListener('click', (e) => {

      });
      document.getElementById('pop-starter').addEventListener('click', () => {
        populateStarterIsland();
        resetPopover.classList.remove('open');

      });
      document.getElementById('pop-clear').addEventListener('click', () => {
        placedItems.clear();
        freeProps.length = 0;
        rebuildInstances();
        resetPopover.classList.remove('open');

      });
      document.getElementById('pop-cancel').addEventListener('click', () => resetPopover.classList.remove('open'));

      /* =======================================================================
         15. POINTER, KEYBOARD & TOUCH INTERACTION CONTROLS
         ======================================================================= */
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      function getHitUnderClient(clientX, clientY) {
        pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
        pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(rayTargets, false);
        if (hits.length === 0) return null;
        const p = hits[0].point;
        const gx = Math.floor(p.x + HALF_GRID);
        const gz = Math.floor(p.z + HALF_GRID);
        if (gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return null;
        return { gx, gz, wx: p.x, wz: p.z, wy: p.y };
      }

      let isOrbiting = false;
      let orbitButton = -1;
      let dragStartX = 0, dragStartY = 0, lastDragX = 0, lastDragY = 0, dragStartTime = 0;
      let hasMovedSignificantly = false;

      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

      renderer.domElement.addEventListener('pointerdown', (e) => {
        resetPopover.classList.remove('open');
        if (e.button === 1 || e.button === 2) {
          isOrbiting = true;
          orbitButton = e.button;
          dragStartX = lastDragX = e.clientX;
          dragStartY = lastDragY = e.clientY;
          dragStartTime = performance.now();
          hasMovedSignificantly = false;
          container.classList.add('dragging');
        } else if (e.button === 0) {
          if (isPhotoMode || isExploded) {
            isOrbiting = true;
            orbitButton = 0;
            dragStartX = lastDragX = e.clientX;
            dragStartY = lastDragY = e.clientY;
            hasMovedSignificantly = false;
            container.classList.add('dragging');
          } else {
            const hit = getHitUnderClient(e.clientX, e.clientY);
            if (hit) {
              placeAtHit(hit);
              hoveredHit = hit;
              updateHoverVisuals();
            }
          }
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (isOrbiting) {
          const dx = e.clientX - lastDragX;
          const dy = e.clientY - lastDragY;
          lastDragX = e.clientX;
          lastDragY = e.clientY;
          setTargetElev(targetCamElev + dy * 0.0065); // drag down -> look from higher, drag up -> lower
          if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) > 5) hasMovedSignificantly = true;
          targetOrbitAngle -= dx * 0.0085;
        } else if (!isPhotoMode && !isExploded) {
          const hit = getHitUnderClient(e.clientX, e.clientY);
          hoveredHit = hit;
          updateHoverVisuals();
        }
      });

      renderer.domElement.addEventListener('pointerleave', () => {
        hoveredHit = null;
        updateHoverVisuals();
      });

      window.addEventListener('pointerup', (e) => {
        if (isOrbiting && e.button === orbitButton) {
          if (orbitButton === 2 && !hasMovedSignificantly && performance.now() - dragStartTime < 350 && !isPhotoMode && !isExploded) {
            const hit = getHitUnderClient(e.clientX, e.clientY);
            if (hit) removeAtHit(hit);
          }
          isOrbiting = false;
          orbitButton = -1;
          container.classList.remove('dragging');
        }
      });

      renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        const unit = e.deltaMode === 1 ? 33 : (e.deltaMode === 2 ? 400 : 1); // lines / pages -> pixels
        const dy = e.deltaY * unit, dx = e.deltaX * unit;
        // pinch on a laptop trackpad arrives as ctrl+wheel with small deltas
        targetCamDist = THREE.MathUtils.clamp(targetCamDist * Math.exp(dy * (e.ctrlKey ? 0.01 : 0.0009)), 16.0, 62.0);
        if (!e.ctrlKey && Math.abs(dx) > 0.5) targetOrbitAngle -= dx * 0.0045; // two-finger sideways swipe orbits
      }, { passive: false });

      let prevPinchDist = null, prevTwoFingerX = null, prevTwoFingerY = null;
      renderer.domElement.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const t0 = e.touches[0], t1 = e.touches[1];
          prevPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          prevTwoFingerX = (t0.clientX + t1.clientX) * 0.5;
          prevTwoFingerY = (t0.clientY + t1.clientY) * 0.5;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && prevPinchDist !== null) {
          const t0 = e.touches[0], t1 = e.touches[1];
          const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
          const midX = (t0.clientX + t1.clientX) * 0.5;
          const midY = (t0.clientY + t1.clientY) * 0.5;
          targetCamDist = THREE.MathUtils.clamp(targetCamDist - (dist - prevPinchDist) * 0.08, 16.0, 62.0);
          targetOrbitAngle -= (midX - prevTwoFingerX) * 0.01;
          setTargetElev(targetCamElev + (midY - prevTwoFingerY) * 0.008);
          prevPinchDist = dist;
          prevTwoFingerX = midX;
          prevTwoFingerY = midY;
        }
      }, { passive: true });
      renderer.domElement.addEventListener('touchend', () => { prevPinchDist = null; prevTwoFingerX = null; prevTwoFingerY = null; });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          targetOrbitAngle += (e.key === 'ArrowLeft' ? 1 : -1) * 0.12; e.preventDefault(); return;
        }
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          setTargetElev(targetCamElev + (e.key === 'ArrowUp' ? 1 : -1) * 0.09); e.preventDefault(); return;
        }
        if (e.key === 'f' || e.key === 'F') { resetView(); return; }
        if (e.key === 'Escape') {
          if (isPhotoMode) setPhotoMode(false);
          resetPopover.classList.remove('open');
        } else if (e.key === 'e' || e.key === 'E') {
          toggleExplodedView();
        } else if (e.key === 'r' || e.key === 'R') {
          currentRotation = (currentRotation + 1) % 4;
          audio.playRotate();
          updateSelectionUI();
        } else if (e.key >= '1' && e.key <= '9') {
          const idx = parseInt(e.key, 10) - 1;
          if (ITEM_DEFS[idx]) {
            selectedTool = ITEM_DEFS[idx].id;
            audio.playUiBlip(520);
            updateSelectionUI();
          }
        }
      });

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = Math.max(window.innerHeight, 1);
        renderer.setSize(w, h);
        applyResolution();
      });

      /* =======================================================================
         16. STARTUP & 60 FPS ANIMATION LOOP
             (STAGGERED EXPLODED VIEW + EASE-OUT-BACK + SYNCED SHADOWS & SMOKE)
         ======================================================================= */
      setTimeOfDay(0);
      populateStarterIsland();
      updateSelectionUI();

      // Helper: Compute staggered springy progress [0..1] (with easeOutBack overshoot!) for each chunk
      function evalLayerProgress(sinceToggle, openDelay, closeDelay) {
        if (sinceToggle < 0) return 0;
        const delay = isExploded ? openDelay : closeDelay;
        const raw = THREE.MathUtils.clamp((sinceToggle - delay) / EXPLODE_DURATION, 0, 1);
        const eased = easeOutBack(raw);
        return isExploded ? eased : (1.0 - eased);
      }

      // Smooth transient bell curve [0..1..0] for 1~3° micro-rotation during transit
      function evalTransitTwist(sinceToggle, openDelay, closeDelay) {
        if (sinceToggle < 0) return 0;
        const delay = isExploded ? openDelay : closeDelay;
        const raw = THREE.MathUtils.clamp((sinceToggle - delay) / EXPLODE_DURATION, 0, 1);
        return Math.sin(raw * Math.PI);
      }

      let lastTime = performance.now();
      const animDummy = new THREE.Object3D();
      const tmpWorldPos = new THREE.Vector3();

      function animate(now) {
        requestAnimationFrame(animate);
        const rawFrameDt = (now - lastTime) / 1000;
        const dt = Math.min(rawFrameDt, 0.05);
        lastTime = now;
        const elapsed = now * 0.001;
        sharedUniforms.uTime.value = elapsed;

        // Smooth camera orbit, zoom & look height
        orbitAngle += (targetOrbitAngle - orbitAngle) * Math.min(1, dt * 10);
        camElev += (targetCamElev - camElev) * Math.min(1, dt * 10);
        camDist += (targetCamDist - camDist) * Math.min(1, dt * 8);
        camLookY += (targetCamLookY - camLookY) * Math.min(1, dt * 8);
        updateCameraTransform();
        runPendingFx(elapsed);
        updateDust(dt);
        {
          const st = elapsed - shakeStart;
          if (st >= 0 && st < 0.16) {
            const k = shakeAmp * (1 - st / 0.16);
            camShake.set(Math.sin(st * 160) * k, Math.cos(st * 190) * k * 0.6);
            updateCameraTransform();
          } else if (camShake.x !== 0 || camShake.y !== 0) {
            camShake.set(0, 0);
            updateCameraTransform();
          }
        }

        // Context-Sensitive Grid Auto-Hide (only appears gently when hovering in grid-placement mode)
        const showGrid = !isPhotoMode && !isExploded && hoveredHit !== null &&
          (selectedTool === 'delete' || !assetsById[selectedTool]?.def.freePlace);
        const targetGridAlpha = showGrid ? 1.0 : 0.0;
        gridMat.uniforms.uGridAlpha.value += (targetGridAlpha - gridMat.uniforms.uGridAlpha.value) * Math.min(1, dt * 10);
        if (hoveredHit) {
          gridMat.uniforms.uCursorXZ.value.set(hoveredHit.wx, hoveredHit.wz);
        }

        // --- EXPLODED VIEW: Clean 4-Tier Non-Overlapping Hierarchy ---
        // Tier 0 (Strata): Bedrock (-1.70), Subsoil (-0.80)
        // Tier 1 (Terrain & Ground Props): TopSurface/Hills/Paths/Grass (0.0), Cabin Floor (+0.34), Ground Props (+0.42)
        // Tier 2 (Walls & Tree Trunks): Cabin Walls (+1.68), Tree Trunks & Lanterns (+1.28 relative to hill!)
        // Tier 3 (Roof & Foliage): Cabin Roof (+3.15), Tree Canopies (+2.62 relative to hill!)
        const sinceToggle = elapsed - explodeToggleTime;
        const pTop      = evalLayerProgress(sinceToggle, 0.00, 0.14);
        const pMid      = evalLayerProgress(sinceToggle, 0.035, 0.105);
        const pProps    = evalLayerProgress(sinceToggle, 0.07, 0.07);
        const pSubsoil  = evalLayerProgress(sinceToggle, 0.105, 0.035);
        const pBedrock  = evalLayerProgress(sinceToggle, 0.14, 0.00);

        const twTop     = evalTransitTwist(sinceToggle, 0.00, 0.14) * 0.044;
        const twMid     = evalTransitTwist(sinceToggle, 0.035, 0.105) * -0.034;
        const twSubsoil = evalTransitTwist(sinceToggle, 0.105, 0.035) * -0.024;
        const twBedrock = evalTransitTwist(sinceToggle, 0.14, 0.00) * 0.030;

        // 1. Earth Cross-Section Strata Drop (wide clean gaps below topsoil)
        chunkSubsoil.position.y = pSubsoil * -0.80;
        chunkSubsoil.rotation.y = twSubsoil;
        chunkBedrock.position.y = pBedrock * -1.70;
        chunkBedrock.rotation.y = twBedrock;

        // 2. Ground Props (Fences, Rocks, Flowers, Reeds, Campfire) & Split Trees (Trunk -> Mid, Canopy -> Top)
        fenceGroup.position.y = pProps * 0.42;
        sharedUniforms.uExplodePropLift.value = pProps * 0.42;
        sharedUniforms.uExplodeMidLift.value  = pMid * 1.28;
        sharedUniforms.uExplodeTopLift.value  = pTop * 2.62;
        sharedUniforms.uExplodeSpread.value   = pMid * 0.34;
        sharedUniforms.uExplodeTwist.value    = twMid;

        // 3. 3-Chunk Storybook Cabin Separation (cleanly aligned with the 4 macro tiers)
        for (let i = 0; i < activeCabins.length; i++) {
          const cb = activeCabins[i];
          const { chunkInterior, chunkWalls, chunkRoof } = cb.mesh.userData;
          chunkInterior.position.y = pProps * 0.34;
          chunkWalls.position.y = pMid * 1.68;
          chunkWalls.rotation.y = twMid;
          chunkRoof.position.y = pTop * 3.15;
          chunkRoof.rotation.y = twTop;

          // LEGO-style part-by-part drop for newly placed cabins
          const ud = cb.mesh.userData;
          if (!ud.dropDone && ud.dropParts) {
            const since = elapsed - cb.spawnT;
            const done = since > cabinDropTotal() + 0.2;
            for (const pt of ud.dropParts) {
              const tl = since - pt.g * CABIN_STRIDE;
              if (done || tl >= DROP_FALL) {
                pt.obj.visible = pt.visible; pt.obj.position.y = pt.baseY; pt.obj.rotation.z = pt.baseRZ;
              } else if (tl < 0) {
                pt.obj.visible = false;
              } else {
                const e = (tl / DROP_FALL) ** 2;
                pt.obj.visible = pt.visible;
                pt.obj.position.y = pt.baseY + (1 - e) * 1.1;
                pt.obj.rotation.z = pt.baseRZ + pt.ang * (1 - e);
              }
            }
            const u = since - (cabinDropTotal() - 0.03);
            let sy = 1;
            if (u > 0 && u < 0.14) {
              sy = u < 0.045 ? THREE.MathUtils.lerp(1, 0.85, u / 0.045)
                 : (u < 0.10 ? THREE.MathUtils.lerp(0.85, 1.05, (u - 0.045) / 0.055)
                             : THREE.MathUtils.lerp(1.05, 1, (u - 0.10) / 0.04));
            }
            const sxz = 1 + (1 - sy) * 0.45;
            cb.mesh.scale.set(sxz, sy, sxz);
            if (done) { ud.dropDone = true; cb.mesh.scale.set(1, 1, 1); mergeCabinPrefab(cb.mesh); markShadowsDirty(); }
          }
        }

        // 4. Height-Proportional Contact Shadows (shift along key light & soften alpha as layers float!)
        const shadowFade = THREE.MathUtils.clamp(1.0 - pMid * 0.58, 0.32, 1.0);
        csMat.opacity = shadowFade;
        const csChanged = pMid !== csLast.pMid || pProps !== csLast.pProps || contactShadowBaseList !== csLast.list;
        csLast.pMid = pMid; csLast.pProps = pProps; csLast.list = contactShadowBaseList;
        for (let i = 0; csChanged && i < contactShadowBaseList.length; i++) {
          const cs = contactShadowBaseList[i];
          const lift = cs.tier === 2 ? pMid * 1.4 : (cs.tier === 1 ? pMid * 1.1 : pProps * 0.42);
          animDummy.position.set(cs.x - lift * 0.34, cs.y, cs.z - lift * 0.26);
          animDummy.rotation.set(0, 0, 0);
          const sc = cs.r * (1.0 + lift * 0.18);
          animDummy.scale.set(sc, 1, sc);
          animDummy.updateMatrix();
          contactShadowInst.setMatrixAt(i, animDummy.matrix);
        }
        contactShadowInst.count = contactShadowBaseList.length;
        if (csChanged) contactShadowInst.instanceMatrix.needsUpdate = true;

        // 5. Smooth 3-Point Lighting & Atmosphere interpolation
        const lr = Math.min(1, dt * 2.5);
        curAtmo.skyTop.lerp(targetAtmo.skyTop, lr);
        curAtmo.skyBottom.lerp(targetAtmo.skyBottom, lr);
        curAtmo.keyColor.lerp(targetAtmo.keyColor, lr);
        curAtmo.keyIntensity += (targetAtmo.keyIntensity - curAtmo.keyIntensity) * lr;
        curAtmo.fillColor.lerp(targetAtmo.fillColor, lr);
        curAtmo.fillIntensity += (targetAtmo.fillIntensity - curAtmo.fillIntensity) * lr;
        curAtmo.rimColor.lerp(targetAtmo.rimColor, lr);
        curAtmo.rimIntensity += (targetAtmo.rimIntensity - curAtmo.rimIntensity) * lr;
        curAtmo.hemiSky.lerp(targetAtmo.hemiSky, lr);
        curAtmo.hemiGround.lerp(targetAtmo.hemiGround, lr);
        curAtmo.hemiIntensity += (targetAtmo.hemiIntensity - curAtmo.hemiIntensity) * lr;
        curAtmo.fogColor.lerp(targetAtmo.fogColor, lr);
        curAtmo.fogDensity += (targetAtmo.fogDensity - curAtmo.fogDensity) * lr;
        curAtmo.waterDeep.lerp(targetAtmo.waterDeep, lr);
        curAtmo.waterShallow.lerp(targetAtmo.waterShallow, lr);
        curAtmo.waterFoam.lerp(targetAtmo.waterFoam, lr);
        curAtmo.gradeTint.lerp(targetAtmo.gradeTint, lr);
        curAtmo.gradeWarmth += (targetAtmo.gradeWarmth - curAtmo.gradeWarmth) * lr;
        curAtmo.nightFactor += (targetAtmo.nightFactor - curAtmo.nightFactor) * lr;
        curAtmo.pointIntensity += (targetAtmo.pointIntensity - curAtmo.pointIntensity) * lr;

        keyLight.color.copy(curAtmo.keyColor); keyLight.intensity = curAtmo.keyIntensity;
        fillLight.color.copy(curAtmo.fillColor); fillLight.intensity = curAtmo.fillIntensity;
        rimLight.color.copy(curAtmo.rimColor); rimLight.intensity = curAtmo.rimIntensity;
        hemiLight.color.copy(curAtmo.hemiSky); hemiLight.groundColor.copy(curAtmo.hemiGround);
        hemiLight.intensity = curAtmo.hemiIntensity;

        sharedUniforms.uSkyTop.value.copy(curAtmo.skyTop);
        sharedUniforms.uSkyBottom.value.copy(curAtmo.skyBottom);
        sharedUniforms.uFogColor.value.copy(curAtmo.fogColor);
        sharedUniforms.uFogDensity.value = curAtmo.fogDensity;
        sharedUniforms.uWaterDeep.value.copy(curAtmo.waterDeep);
        sharedUniforms.uWaterShallow.value.copy(curAtmo.waterShallow);
        sharedUniforms.uWaterFoam.value.copy(curAtmo.waterFoam);
        sharedUniforms.uGradeTint.value.copy(curAtmo.gradeTint);
        sharedUniforms.uGradeWarmth.value = curAtmo.gradeWarmth;
        sharedUniforms.uNightFactor.value = curAtmo.nightFactor;

        mistMat.color.copy(curAtmo.fogColor);
        mistMat.opacity = curAtmo.fogDensity * 0.42;
        pondMist.position.x = 2.3 + Math.sin(elapsed * 0.25) * 0.35;
        pondMist.position.z = 2.3 + Math.cos(elapsed * 0.2) * 0.35;

        // 6. Warm PointLights & Glowing Halos synced with exploded elevation
        const glowPower = THREE.MathUtils.smoothstep(curAtmo.nightFactor, 0.15, 0.9);
        for (let i = 0; i < activeGlowSprites.length; i++) {
          const g = activeGlowSprites[i];
          const flick = g.flicker
            ? (0.82 + 0.18 * Math.sin(elapsed * 9.5 + g.seed) * Math.cos(elapsed * 5.3 + g.seed))
            : (0.92 + 0.08 * Math.sin(elapsed * 3.8 + g.seed));
          g.sprite.material.opacity = glowPower * 0.72 * flick;
          const liftY = g.isCabin ? pMid * 1.68 : (g.tier === 1 ? pMid * 1.28 : pProps * 0.42);
          g.sprite.position.y = g.baseY + liftY;
          const sc = g.baseScale * (0.94 + 0.08 * flick);
          g.sprite.scale.set(sc, sc, 1);
        }
        for (let i = 0; i < pointLightPool.length; i++) {
          const pl = pointLightPool[i];
          if (!pl.userData.active) continue;
          const ud = pl.userData;
          const flick = ud.flicker
            ? (0.80 + 0.20 * Math.sin(elapsed * 10.5 + ud.seed))
            : (0.95 + 0.05 * Math.sin(elapsed * 3.2 + ud.seed));
          pl.intensity = curAtmo.pointIntensity * ud.mult * flick;
          const plLift = ud.isCabin ? pMid * 1.68 : (ud.tier === 1 ? pMid * 1.28 : pProps * 0.42);
          pl.position.y = ud.baseY + plLift;
        }

        // 7. Fluffy Spherical Chimney Smoke (Real-time tracked to Exploding Roof/Chimney!)
        const puffsPerChimney = 8;
        let smIdx = 0;
        for (let c = 0; c < activeCabins.length; c++) {
          const cb = activeCabins[c];
          const { chunkRoof } = cb.mesh.userData;
          // Compute exact world position of chimney rim including roof lift & micro-rotation!
          tmpWorldPos.set(0.25, 1.50, -0.16);
          chunkRoof.localToWorld(tmpWorldPos);

          for (let p = 0; p < puffsPerChimney && smIdx < MAX_SMOKE_PUFFS; p++) {
            const t = (elapsed * 0.28 + p / puffsPerChimney + c * 0.37) % 1.0;
            const sCurveX = Math.sin(t * Math.PI * 2.1 + elapsed * 0.9) * 0.24 * t + t * 0.42;
            const sCurveZ = Math.cos(t * Math.PI * 1.6 + elapsed * 0.7) * 0.16 * t + t * 0.20;
            const scaleProfile = Math.sin(Math.pow(t, 0.65) * Math.PI) * 1.45;
            animDummy.position.set(tmpWorldPos.x + sCurveX, tmpWorldPos.y + t * 1.55, tmpWorldPos.z + sCurveZ);
            animDummy.rotation.set(t * 2.0, t * 1.5, 0);
            animDummy.scale.setScalar(Math.max(0.01, scaleProfile));
            animDummy.updateMatrix();
            smokeInst.setMatrixAt(smIdx++, animDummy.matrix);
          }
        }
        smokeInst.count = smIdx;
        smokeInst.instanceMatrix.needsUpdate = true;

        // 8. Swirling Pastel Flower Petals
        for (let i = 0; i < PETAL_COUNT; i++) {
          const pd = petalData[i];
          const fallY = ((pd.by - elapsed * pd.speed) % 4.6 + 4.6) % 4.6 + 0.15;
          animDummy.position.set(
            pd.bx + Math.sin(elapsed * 0.9 + pd.seed) * 0.75,
            fallY,
            pd.bz + Math.cos(elapsed * 0.75 + pd.seed * 1.3) * 0.75
          );
          animDummy.rotation.set(elapsed * 1.4 + pd.seed, elapsed * 1.1, elapsed * 0.8);
          animDummy.scale.setScalar(1.0 - curAtmo.nightFactor * 0.35);
          animDummy.updateMatrix();
          petalInst.setMatrixAt(i, animDummy.matrix);
        }
        petalInst.instanceMatrix.needsUpdate = true;

        // Hover bob on ghost
        if (hoveredHit && selectedTool !== 'delete' && !isPhotoMode && !isExploded) {
          const ghost = ghostMeshesById[selectedTool];
          if (ghost && ghost.visible) {
            const def = assetsById[selectedTool].def;
            const baseY = def.freePlace ? hoveredHit.wy : getTileElevation(hoveredHit.gx, hoveredHit.gz);
            ghost.position.y = baseY + 0.03 + Math.sin(elapsed * 5.0) * 0.025;
          }
        }

        renderer.info.reset();
        if (performance.now() * 0.001 <= shadowHoldUntil || HASH.noopt === '1') renderer.shadowMap.needsUpdate = true;
        // Pass 1: Render 3D scene to WebGLRenderTarget
        renderer.setRenderTarget(renderTarget);
        renderer.setClearColor(0x000000, 0);
        renderer.clear();
        renderer.render(scene, camera);

        // Pass 2: Low-res post pipeline (AO + lit mist -> depth tilt-shift -> bloom -> grade + dither)
        runPostPipeline();

        // Pass 3: Sharp upscale to the screen + film grain
        upMat.uniforms.uSeed.value = (elapsed * 60 % 1000) * 7.13;
        renderer.setRenderTarget(null);
        renderer.render(upScene, postCamera);
        trackPerformance(rawFrameDt);
        // #fps=1 also writes a draw-call snapshot (frame 12 and an idle frame 150) to <body data-bench> and the console
        if (fpsEl && (++benchFrame === 3 || benchFrame === 150)) {
          let cabinMeshes = 0, sceneMeshes = 0, casters = 0;
          cabinGroupContainer.traverse((o) => { if (o.isMesh) cabinMeshes++; });
          scene.traverse((o) => { if (o.isMesh && o.visible) { sceneMeshes++; if (o.castShadow) casters++; } });
          const line = '[f' + benchFrame + '] calls ' + renderer.info.render.calls + ' tris ' + renderer.info.render.triangles
            + ' programs ' + renderer.info.programs.length + ' geos ' + renderer.info.memory.geometries
            + ' | meshes ' + sceneMeshes + ' casters ' + casters + ' cabinMeshes ' + cabinMeshes;
          document.body.dataset.bench = (document.body.dataset.bench || '') + line + ' ';
          console.log('[mori-bench] ' + line);
        }
      }
      let benchFrame = 0;
      const csLast = { pMid: -1, pProps: -1, list: null };

      // #time=golden / #time=night starts at that time of day
      if (HASH.time && TIME_ORDER.includes(HASH.time)) setTimeOfDay(TIME_ORDER.indexOf(HASH.time));
      if (HASH.explode === '1') setTimeout(toggleExplodedView, 600); // #explode=1 opens the exploded view

      requestAnimationFrame(animate);
    }

    function showToast() {}
  </script>
</body>
