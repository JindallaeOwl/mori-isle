<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mori Isle — Cozy 3D Miniature Diorama</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" />

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <style>
    :root {
      --ink: #f4e8cc;          /* warm cream for icons and the few words left */
      --ink-dim: rgba(244, 232, 204, 0.5);
      --glow: #ffc45e;         /* lamp light = "this is selected" */
      --glow-soft: rgba(255, 184, 84, 0.5);
      --danger: #ff8f7a;
      --scrim: rgba(3, 6, 16, 0.72); /* bottom shade, retinted per time of day from JS */
      --halo: rgba(4, 6, 14, 0.55);  /* shade behind an open tray, also per time of day */
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --font: 'Galmuri11', 'Galmuri9', monospace;
      --font-small: 'Galmuri9', 'Galmuri11', monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161d30;
      font-family: var(--font);
      font-size: 12px;
      color: var(--ink);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    #canvas-container.dragging { cursor: grabbing; }

    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 1px dashed var(--glow);
      outline-offset: 3px;
    }

    /* everything drawn over the scene shares one drop shadow so it reads on day and night */
    .lit {
      filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.75)) drop-shadow(0 0 5px rgba(0, 0, 0, 0.45));
    }

    .ui-layer {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.photo-mode .ui-layer {
      opacity: 0;
      pointer-events: none !important;
    }

    body.photo-mode #hud-dock { transform: translate(-50%, 16px); }
    body.photo-mode #sys { transform: translateY(-16px); }

    /* untouched for a while: the UI steps back so the diorama is the only thing on screen */
    /* panels are excluded: this rule would override their closed state (opacity 0) and show them */
    body.ui-idle:not(.photo-mode) .ui-layer:not(.panel) { opacity: 0.32; }

    #hud-scrim {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 150px;
      background: linear-gradient(to bottom, transparent, var(--scrim));
      pointer-events: none;
      z-index: 5;
      transition: background 1.2s ease, opacity 0.4s ease;
    }

    /* ---------- top right: icon-only system buttons ---------- */
    #sys {
      position: fixed;
      top: 16px;
      right: 18px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }

    /* wooden tokens (see 4C. COZY UI TOKENS): the token draws its own thickness, so only a
       soft contact shadow is added here */
    .token {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 3px 2.5px rgba(10, 6, 2, 0.38));
      transition: filter 0.25s ease;
    }
    .token .glyph { transform-box: view-box; transform-origin: 28px 27px; transition: transform 0.35s var(--spring); }

    .sys-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      transition: transform 0.25s var(--spring);
    }

    .sys-btn > span, .sys-btn > svg { width: 40px; height: 40px; display: block; }
    .sys-btn:hover { transform: scale(1.14) translateY(-2px) rotate(-4deg); }
    .sys-btn:active { transform: scale(0.9); }
    .sys-btn .token { filter: drop-shadow(0 3px 2.5px rgba(10, 6, 2, 0.38)) saturate(0.9) brightness(0.93); }
    .sys-btn.on .token { filter: drop-shadow(0 0 7px var(--glow-soft)) drop-shadow(0 3px 2.5px rgba(10, 6, 2, 0.35)) brightness(1.06); }

    #sys-sep {
      width: 1px;
      margin: 8px 4px;
      background: linear-gradient(transparent, rgba(244, 232, 204, 0.35), transparent);
    }

    /* small floating panels under the system buttons */
    .panel {
      position: fixed;
      top: 58px;
      right: 18px;
      z-index: 30;
      padding: 12px 14px;
      background: rgba(10, 12, 22, 0.78);
      border-radius: 3px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.25s var(--spring);
    }

    .panel.open {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    #help-panel {
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px 16px;
      line-height: 1.25;
    }

    #help-panel b {
      font-family: var(--font-small);
      font-weight: 400;
      color: var(--glow);
      text-align: right;
      white-space: nowrap;
    }

    #reset-popover { display: flex; gap: 10px; padding: 10px; }

    .pop-btn {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      transition: transform 0.25s var(--spring);
    }

    .pop-btn:hover { transform: scale(1.14) translateY(-2px) rotate(-4deg); }
    .pop-btn:active { transform: scale(0.9); }

    /* ---------- bottom: category dock ---------- */
    #hud-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 14px;
      z-index: 25;
    }

    .dock-sep {
      width: 1px;
      height: 40px;
      margin: 0 2px 4px;
      background: linear-gradient(transparent, rgba(244, 232, 204, 0.3), transparent);
    }

    .cat-wrap { position: relative; }

    .cat, .tool {
      position: relative;
      width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cat .icon, .tool .icon {
      width: 58px;
      height: 58px;
      display: block;
      transition: transform 0.3s var(--spring);
    }

    /* resting tokens sit a little dim; the one in hand is lifted and lit */
    .cat .token, .tool .token { filter: drop-shadow(0 3px 2.5px rgba(10, 6, 2, 0.38)) saturate(0.88) brightness(0.92); }
    .cat.active .icon, .tool.active .icon { transform: translateY(-4px); }
    .cat.active .token, .tool.active .token { filter: drop-shadow(0 7px 5px rgba(10, 6, 2, 0.32)) brightness(1.05); }

    /* warm pool of light behind the active slot */
    .cat::before, .tool::before {
      content: '';
      position: absolute;
      left: -8px;
      right: -8px;
      top: -4px;
      height: 70px;
      background: radial-gradient(closest-side, rgba(255, 178, 80, 0.42), transparent);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.25s ease, transform 0.35s var(--spring);
      pointer-events: none;
    }

    .cat::after, .tool::after {
      content: '';
      position: absolute;
      bottom: -5px;
      width: 18px;
      height: 2px;
      background: var(--glow);
      box-shadow: 0 0 8px var(--glow);
      opacity: 0;
      transform: scaleX(0.2);
      transition: opacity 0.2s ease, transform 0.3s var(--spring);
    }

    .cat-wrap:hover .cat .icon, .cat-wrap.open .cat .icon, .tool:hover .icon { transform: translateY(-7px) scale(1.12) rotate(-3deg); }
    .cat-wrap:hover .cat .token, .cat-wrap.open .cat .token, .tool:hover .token { filter: drop-shadow(0 9px 6px rgba(10, 6, 2, 0.3)) brightness(1.04); }
    .cat:active .icon, .tool:active .icon { transform: scale(0.9); }

    .cat.active::before, .tool.active::before { opacity: 1; transform: none; }
    .cat.active::after, .tool.active::after { opacity: 1; transform: none; }
    .tool.active.eraser::before { background: radial-gradient(closest-side, rgba(255, 120, 100, 0.45), transparent); }
    .tool.active.eraser::after { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    /* the item tray that rises out of a category */
    .tray {
      position: absolute;
      bottom: 100%;
      left: 50%;
      display: flex;
      gap: 4px;
      padding: 0 10px 14px;  /* bottom padding bridges the gap so the hover never drops */
      transform: translateX(-50%);
      pointer-events: none;
    }

    .cat-wrap.open .tray { pointer-events: auto; }

    /* items sit on little cream paper cards, each pinned slightly askew */
    .item {
      position: relative;
      width: 52px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 9px 11px 10px 8px;
      background: linear-gradient(170deg, #fbf1dc, #ead6ae);
      box-shadow: 0 3px 0 #b48a5c, 0 5px 6px rgba(10, 6, 2, 0.35), inset 0 1px 0 #fffaf0;
      opacity: 0;
      transform: translateY(14px) scale(0.6) rotate(var(--tilt, 0deg));
      transition: opacity 0.16s ease, transform 0.34s var(--spring), box-shadow 0.2s ease;
      transition-delay: 0s;
    }

    .cat-wrap.open .item {
      opacity: 1;
      transform: rotate(var(--tilt, 0deg));
      transition-delay: calc(var(--i) * 30ms);
    }

    .item canvas {
      width: 44px;
      height: 44px;
      image-rendering: pixelated;
      transition: transform 0.25s var(--spring);
    }

    .cat-wrap.open .item:hover { transform: translateY(-5px) rotate(0deg) scale(1.08); box-shadow: 0 3px 0 #b48a5c, 0 9px 9px rgba(10, 6, 2, 0.3), inset 0 1px 0 #fffaf0; }
    .item:hover canvas { transform: scale(1.12); }
    .cat-wrap.open .item:active { transform: scale(0.94); }

    /* the card in hand gets a warm stitched border */
    .item::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 7px 9px 8px 6px;
      border: 1.5px dashed #d98f3a;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .item.active::after { opacity: 1; }
    .item.active { background: linear-gradient(170deg, #fff4d8, #f4d79c); }

    /* one quiet line of text: the name of what you point at or just picked */
    #item-name {
      position: fixed;
      left: 50%;
      bottom: 150px;
      transform: translate(-50%, 4px);
      color: #ffe6b0;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      z-index: 26;
      transition: opacity 0.18s ease, transform 0.25s var(--spring);
    }

    #item-name.show { opacity: 1; transform: translate(-50%, 0); }

    #hint {
      position: fixed;
      transform: translate(-50%, 3px);
      color: var(--ink);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: opacity 0.15s ease, transform 0.22s var(--spring);
    }

    #hint.show { opacity: 1; transform: translate(-50%, 0); }
    #hint .hint-key { font-family: var(--font-small); color: var(--glow); margin-left: 3px; }

    /* photo mode: a single faint close mark */
    #photo-exit-btn {
      position: fixed;
      top: 16px;
      right: 18px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.22s var(--spring);
    }
    body.photo-mode #photo-exit-btn { opacity: 0.4; pointer-events: auto; }
    body.photo-mode #photo-exit-btn:hover { opacity: 1; transform: scale(1.15); }

    /* ---------- startup: one wooden sprout token while loading, then the island assembles ---------- */
    /* the token is static SVG so it shows before three.js arrives; its motion is transform-only so it
       keeps moving while the main thread is busy building textures and meshes */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #161d30;
      transition: opacity 0.65s ease;
    }
    #loader.go { opacity: 0; pointer-events: none; }
    #loader-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 340px;
      height: 340px;
      margin: -170px 0 0 -170px;
      background: radial-gradient(closest-side, rgba(255, 178, 80, 0.2), rgba(255, 150, 60, 0.06) 55%, transparent);
      animation: loader-breathe 2.8s ease-in-out infinite;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    #loader-token {
      position: relative;
      width: 92px;
      height: 92px;
      animation: loader-bob 1.6s ease-in-out infinite;
      pointer-events: none;
    }
    #loader-token .token { filter: drop-shadow(0 6px 5px rgba(10, 6, 2, 0.45)) saturate(0.85) brightness(0.9); transition: filter 0.4s ease; }
    /* ready: the token lights up and nudges, asking to be pressed */
    #loader.ready { cursor: pointer; }
    #loader.ready #loader-token { pointer-events: auto; animation: loader-nudge 1.5s ease-in-out infinite; }
    #loader.ready #loader-token .token { filter: drop-shadow(0 0 14px var(--glow-soft)) drop-shadow(0 6px 5px rgba(10, 6, 2, 0.4)) brightness(1.06); }
    #loader.ready #loader-glow { animation-duration: 1.5s; background: radial-gradient(closest-side, rgba(255, 184, 84, 0.32), rgba(255, 150, 60, 0.09) 55%, transparent); }
    #loader.ready #loader-token:hover { animation: none; transform: translateY(-5px) scale(1.1) rotate(-4deg); transition: transform 0.25s var(--spring); }
    #loader.go #loader-token { animation: none; transform: scale(0.86); transition: transform 0.16s ease; }
    /* three.js never arrived: the sprout tips over, one quiet word, click reloads */
    #loader.failed { cursor: pointer; }
    #loader.failed #loader-token { animation: none; transform: rotate(-24deg) translateY(6px); }
    #loader.failed #loader-glow { opacity: 0.3; }
    #loader-retry {
      position: absolute;
      top: calc(50% + 62px);
      left: 50%;
      transform: translateX(-50%);
      color: var(--ink-dim);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #loader.failed #loader-retry { opacity: 1; }
    @keyframes loader-bob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    @keyframes loader-nudge {
      0%, 60%, 100% { transform: translateY(0) scale(1); }
      22% { transform: translateY(-10px) scale(1.08) rotate(-5deg); }
      40% { transform: translateY(1px) scale(0.97) rotate(2deg); }
    }
    @keyframes loader-breathe {
      0%, 100% { opacity: 0.65; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    /* the HUD stays out of sight until the island has assembled (beats the idle rule too) */
    body.booting .ui-layer, body.booting #item-name, body.booting #hint { opacity: 0 !important; pointer-events: none !important; }
    /* then each token hops in, one after another (--pop is set from JS) */
    body.ui-pop .sys-btn, body.ui-pop #sys-sep, body.ui-pop .cat-wrap, body.ui-pop .tool, body.ui-pop .dock-sep {
      animation: ui-pop-in 0.42s var(--spring) backwards;
      animation-delay: calc(var(--pop, 0) * 55ms);
    }
    @keyframes ui-pop-in { from { opacity: 0; transform: translateY(16px) scale(0.55); } }

    @media (max-width: 760px) {
      #hud-dock { gap: 6px; bottom: 10px; }
      .cat, .tool { width: 46px; }
      .cat .icon, .tool .icon { width: 46px; height: 46px; }
      .item { width: 44px; height: 48px; }
      .item canvas { width: 38px; height: 38px; }
      .sys-btn { width: 34px; height: 34px; }
      .sys-btn > span, .sys-btn > svg { width: 34px; height: 34px; }
      #sys { gap: 2px; right: 10px; }
    }
  </style>
</head>

 fill="none" stroke="#fff1d2"/><path d="M28 34c0-4.5-3.2-7.5-8.5-7.5c0 4.5 3.2 7.5 8.5 7.5z" fill="none" stroke="#fff1d2"/><path d="M20.5 42.5h15" fill="none" stroke="#fff1d2"/></g><path d="M28 42.5V30" fill="none" stroke="#5b3a1f"/><path d="M28 31.5c0-6.5 5-10 11-10c0 6.5-5 10-11 10z" fill="#7fb04f" stroke="#5b3a1f"/><path d="M28 34c0-4.5-3.2-7.5-8.5-7.5c0 4.5 3.2 7.5 8.5 7.5z" fill="#a2c96c" stroke="#5b3a1f"/><path d="M20.5 42.5h15" fill="none" stroke="#5b3a1f"/></g></g></svg></div>
    <div id="loader-retry">다시 불러오기</div>

  <script>
    // three.js comes from a CDN: if the game module never ran by the time the page has loaded,
    // say so (a click reloads) instead of bobbing forever
    window.addEventListener('load', function () {
      if (!window.__moriBoot) document.getElementById('loader').classList.add('failed');
    });
    document.getElementById('loader').addEventListener('click', function () {
      if (this.classList.contains('failed')) location.reload();
    });
  </script>

  <!-- WebGL Viewport -->
  <div id="canvas-container"></div>

  <div id="hud-scrim" class="ui-layer"></div>

  <!-- Top right: icon-only system buttons -->
  <div id="sys" class="ui-layer">
    <button class="sys-btn" id="btn-time" aria-label="시간대" data-hint="시간대"><span id="time-icon"></span></button>
    <button class="sys-btn" id="btn-audio" aria-label="배경음" data-hint="배경음"><span id="audio-icon"></span></button>
    <!-- every HUD icon is a wooden token filled in by makeToken() (4C); the HTML holds empty slots -->
    <button class="sys-btn" id="btn-explode" aria-label="분해 보기 (E)" data-hint="분해 보기 (E)"></button>
    <button class="sys-btn" id="btn-photo" aria-label="감상 모드" data-hint="감상 모드"></button>
    <div id="sys-sep"></div>
    <button class="sys-btn" id="btn-reset" aria-label="섬 초기화" data-hint="섬 초기화"></button>
    <button class="sys-btn" id="btn-help" aria-label="조작법 (H)" data-hint="조작법 (H)"></button>
  </div>

  <div id="reset-popover" class="panel ui-layer">
    <button class="pop-btn" id="pop-starter" aria-label="처음 섬으로" data-hint="처음 섬으로"></button>
    <button class="pop-btn danger" id="pop-clear" aria-label="모두 비우기" data-hint="모두 비우기"></button>
  </div>

  <div id="help-panel" class="panel ui-layer">
    <b>왼쪽 클릭</b><span>놓기</span>
    <b>오른쪽 클릭</b><span>지우기</span>
    <b>오른쪽 드래그</b><span>돌리기 · 기울이기</span>
    <b>휠 드래그</b><span>화면 이동</span>
    <b>휠</b><span>확대 · 축소</span>
    <b>1 ~ 5</b><span>도구 (다시 누르면 다음 것)</span>
    <b>R</b><span>방향 돌리기</span>
    <b>X</b><span>지우개</span>
    <b>E</b><span>분해 보기</span>
    <b>F</b><span>시점 되돌리기</span>
  </div>

  <!-- Bottom: categories (hover or tap to open), eraser, rotate -->

  <script type="module">
    import * as THREE from 'three';
    window.__moriBoot = true; // three.js arrived (the loader checks this on page load)

    /* =========================================================================
       1. CONFIGURATION, ORGANIC POND SDF & TERRACED HILL FRAMING
       ========================================================================= */
    const GRID_SIZE = 12;
    const HALF_GRID = GRID_SIZE / 2;
    const MAX_PIXEL_RATIO = 2.0; // only the final upscale pass runs at this density
    // --- Low-res pixel rendering (scene is drawn small, then sharply upscaled) ---
    const HASH = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map((kv) => {
      const [k, v] = kv.split('='); return [k, v === undefined ? '1' : v];
    }));
    const LOWRES = {
      enabled: HASH.hires !== '1', // #hires=1 renders at full resolution for comparison
      maxIH: 600,                  // internal height cap (px)
      maxPix: 620000,              // internal pixel budget
      minTexel: 2,                 // at least 2x2 screen pixels per scene pixel
      quality: 1.0,                // adaptive scale 0.55 ~ 1.0
      adaptive: HASH.noscale !== '1'
    };
    const CAM_FOV_EQUIV = 22 * Math.PI / 180; // ortho framing matches the old 22-degree lens
    const SHADOW_MAP_SIZE = 1024;
    const MAX_POINT_LIGHTS = 8;

    // Smooth-min for organic rounded pond lobes (zero blocky square edges!)
    function smin(a, b, k) {
      const h = Math.max(k - Math.abs(a - b), 0.0) / k;
      return Math.min(a, b) - h * h * k * 0.25;
    }

    // Signed Distance Field of the organic rounded pond in world XZ space
    // Returns < 0 inside water, 0 at shoreline, > 0 on land
    function getPondSDF(wx, wz) {
      const d1 = Math.hypot(wx - 2.35, wz - 2.35) - 1.72;
      const d2 = Math.hypot(wx - 3.35, wz - 1.75) - 1.18;
      const d3 = Math.hypot(wx - 1.45, wz - 2.95) - 1.12;
      const d4 = Math.hypot(wx - 2.95, wz - 3.25) - 1.02;
      return smin(smin(d1, d2, 0.72), smin(d3, d4, 0.72), 0.68);
    }

    function isPondWorld(wx, wz, margin = 0.12) {
      return getPondSDF(wx, wz) < margin;
    }

    function isPondTile(gx, gz) {
      const wx = gx - HALF_GRID + 0.5;
      const wz = gz - HALF_GRID + 0.5;
      return getPondSDF(wx, wz) < 0.18;
    }

    // Cozy Back-Hill Framing (Terraced 1~2 steps on the back two edges: gx <= 2, gz <= 2)
    function getHillLevel(gx, gz) {
      if (gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return 0;
      // Top-most back corner ridge (Level 2)
      if ((gx === 0 && gz <= 5) || (gz === 0 && gx <= 5) || (gx === 1 && gz <= 2) || (gz === 1 && gx <= 2)) {
        return 2;
      }
      // Mid terrace framing behind the cabin & sides (Level 1)
      if ((gx <= 2 && gz <= 7) || (gz <= 2 && gx <= 7) || (gx === 3 && gz <= 3) || (gz === 3 && gx <= 3)) {
        return 1;
      }
      return 0;
    }

    const STEP_HEIGHT = 0.48;
    function getTileElevation(gx, gz) {
      return getHillLevel(gx, gz) * STEP_HEIGHT;
    }

    // Smooth continuous surface height at any world (wx, wz) for hills + rounded pond basin
    function getContinuousTerrainHeight(wx, wz) {
      const gx = THREE.MathUtils.clamp(wx + HALF_GRID - 0.5, 0, GRID_SIZE - 1);
      const gz = THREE.MathUtils.clamp(wz + HALF_GRID - 0.5, 0, GRID_SIZE - 1);
      const x0 = Math.floor(gx), z0 = Math.floor(gz);
      const x1 = Math.min(GRID_SIZE - 1, x0 + 1);
      const z1 = Math.min(GRID_SIZE - 1, z0 + 1);
      // Sharpened smoothstep for crisp beveled terrace cliffs
      const fx = THREE.MathUtils.smoothstep(gx - x0, 0.22, 0.78);
      const fz = THREE.MathUtils.smoothstep(gz - z0, 0.22, 0.78);

      const h00 = getTileElevation(x0, z0);
      const h10 = getTileElevation(x1, z0);
      const h01 = getTileElevation(x0, z1);
      const h11 = getTileElevation(x1, z1);
      const hillH = THREE.MathUtils.lerp(
        THREE.MathUtils.lerp(h00, h10, fx),
        THREE.MathUtils.lerp(h01, h11, fx),
        fz
      );

      // Organic smooth depression for the rounded pond basin
      const sdf = getPondSDF(wx, wz);
      const basin = THREE.MathUtils.smoothstep(sdf, -0.35, 0.36); // 0 deep inside pond .. 1 on land
      const pondDip = (1.0 - basin) * -0.40;
      return hillH + pondDip;
    }

    // 3-Point Lighting & Atmosphere Presets
    const ATMOSPHERES = {
      day: {
        name: 'Day',
        dotColor: '#8fd18a',
        skyTop: new THREE.Color('#4f92d6'),
        skyBottom: new THREE.Color('#cfe9ff'),
        keyColor: new THREE.Color('#fff2d6'),
        keyIntensity: 2.35,
        fillColor: new THREE.Color('#8bb8eb'),
        fillIntensity: 0.78,
        rimColor: new THREE.Color('#ffecc4'),
        rimIntensity: 0.92,
        hemiSky: new THREE.Color('#b8dcff'),
        hemiGround: new THREE.Color('#5a4636'),
        hemiIntensity: 0.72,
        fogColor: new THREE.Color('#d6ecff'),
        fogDensity: 0.30,
        waterDeep: new THREE.Color('#1d688c'),
        waterShallow: new THREE.Color('#49b5c9'),
        waterFoam: new THREE.Color('#dcf8ff'),
        gradeTint: new THREE.Color('#ffffff'),
        gradeWarmth: 0.02,
        nightFactor: 0.0,
        pointIntensity: 0.35
      },
      golden: {
        name: 'Golden',
        dotColor: '#f7b267',
        skyTop: new THREE.Color('#5b4678'),
        skyBottom: new THREE.Color('#ffae6e'),
        keyColor: new THREE.Color('#ff9d4f'),
        keyIntensity: 2.5,
        fillColor: new THREE.Color('#6a7fb8'),
        fillIntensity: 0.65,
        rimColor: new THREE.Color('#ffd08a'),
        rimIntensity: 1.25,
        hemiSky: new THREE.Color('#ffb58a'),
        hemiGround: new THREE.Color('#402e3a'),
        hemiIntensity: 0.58,
        fogColor: new THREE.Color('#f5b384'),
        fogDensity: 0.46,
        waterDeep: new THREE.Color('#34456b'),
        waterShallow: new THREE.Color('#c47964'),
        waterFoam: new THREE.Color('#ffe0ba'),
        gradeTint: new THREE.Color('#ffe8cf'),
        gradeWarmth: 0.11,
        nightFactor: 0.48,
        pointIntensity: 2.2
      },
      night: {
        name: 'Night',
        dotColor: '#8ea8ff',
        skyTop: new THREE.Color('#090e21'),
        skyBottom: new THREE.Color('#1d2a4f'),
        keyColor: new THREE.Color('#7a96dc'),  // cold moonlight
        keyIntensity: 0.8,
        fillColor: new THREE.Color('#24365f'),
        fillIntensity: 0.3,
        rimColor: new THREE.Color('#8aa8f0'),
        rimIntensity: 0.62,
        hemiSky: new THREE.Color('#26375f'),
        hemiGround: new THREE.Color('#0c0e17'),
        hemiIntensity: 0.38,
        fogColor: new THREE.Color('#1c2a4c'),
        fogDensity: 0.54,
        waterDeep: new THREE.Color('#0d1a38'),
        waterShallow: new THREE.Color('#1f3b6b'),
        waterFoam: new THREE.Color('#6488bd'),
        gradeTint: new THREE.Color('#c6d6ff'),
        gradeWarmth: -0.04,
        nightFactor: 1.0,
        pointIntensity: 6.0  // warm lamps/fires become the main light at night
      }
    };
    const TIME_ORDER = ['day', 'golden', 'night'];

    /* =========================================================================
       2. DETERMINISTIC HASH, EASING & SHARED UNIFORMS
       ========================================================================= */
    // Smooth 1D value noise in [-1, 1] (two octaves of this give a natural flame flicker)
    function noise1(x, seed = 0) {
      const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
      const a = Math.sin((i + seed * 13.1) * 127.1) * 43758.5453, b = Math.sin((i + 1 + seed * 13.1) * 127.1) * 43758.5453;
      return ((a - Math.floor(a)) * (1 - u) + (b - Math.floor(b)) * u) * 2 - 1;
    }
    function fireFlicker(t, seed) {
      return 0.86 + 0.1 * noise1(t * 6.3, seed) + 0.06 * noise1(t * 17.0, seed + 1);
    }

    function hash2D(x, y, seed = 0) {
      const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    // Juicy Ease-Out-Back overshoot curve for Exploded View layers
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    const sharedUniforms = {
      uTime: { value: 0 },
      uNightFactor: { value: 0.0 },
      uFogColor: { value: ATMOSPHERES.day.fogColor.clone() },
      uFogDensity: { value: ATMOSPHERES.day.fogDensity },
      uFogBottom: { value: -1.1 },
      uFogTop: { value: 1.45 },
      uWaterDeep: { value: ATMOSPHERES.day.waterDeep.clone() },
      uWaterShallow: { value: ATMOSPHERES.day.waterShallow.clone() },
      uWaterFoam: { value: ATMOSPHERES.day.waterFoam.clone() },
      uSkyTop: { value: ATMOSPHERES.day.skyTop.clone() },
      uSkyBottom: { value: ATMOSPHERES.day.skyBottom.clone() },
      uGradeTint: { value: ATMOSPHERES.day.gradeTint.clone() },
      uGradeWarmth: { value: ATMOSPHERES.day.gradeWarmth },
      uPointScale: { value: 0.5 }, // scene pixels per CSS pixel (for gl_PointSize)
      // Exploded View GPU uniforms for clear 4-tier non-overlapping separation
      uExplodeSpread: { value: 0.0 },
      uExplodePropLift: { value: 0.0 },
      uExplodeMidLift: { value: 0.0 },
      uExplodeTopLift: { value: 0.0 },
      uExplodeTwist: { value: 0.0 }
    };

    /* =========================================================================
       3. SYNTHESIZED COZY WEB AUDIO ENGINE (WITH CASCADING EXPLODE BLOCK SFX)
       ========================================================================= */
    class CozyAudio {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.enabled = false;
        this.chimeTimer = null;
        this.isNight = false;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        const ctx = this.ctx;

        // Output: everything ends in a gentle compressor so stacked clicks / chimes never clip
        this.comp = ctx.createDynamicsCompressor();
        this.comp.threshold.value = -18; this.comp.knee.value = 12; this.comp.ratio.value = 3.5;
        this.comp.attack.value = 0.004; this.comp.release.value = 0.18;
        this.comp.connect(ctx.destination);

        // Small-room reverb from a generated impulse (decaying stereo noise), shared by sfx and chimes
        this.reverb = ctx.createConvolver();
        this.reverb.buffer = this.makeImpulse(1.6, 3.2);
        this.revReturn = ctx.createGain(); this.revReturn.gain.value = 0.22;
        this.reverb.connect(this.revReturn); this.revReturn.connect(this.comp);

        // Ambience (wind, chimes): master on/off fader
        this.masterGain = ctx.createGain();
        this.masterGain.gain.value = 0.0001;
        this.masterGain.connect(this.comp);
        const ambSend = ctx.createGain(); ambSend.gain.value = 0.5;
        this.masterGain.connect(ambSend); ambSend.connect(this.reverb);

        // Sound effects bus (same level the old masterGain gave them), with a reverb send
        this.sfxBus = ctx.createGain(); this.sfxBus.gain.value = 0.42;
        this.sfxBus.connect(this.comp);
        const sfxSend = ctx.createGain(); sfxSend.gain.value = 0.35;
        this.sfxBus.connect(sfxSend); sfxSend.connect(this.reverb);

        // Shared white noise for clicks and crackles
        const wl = ctx.sampleRate;
        this.white = ctx.createBuffer(1, wl, ctx.sampleRate);
        const wd = this.white.getChannelData(0);
        for (let i = 0; i < wl; i++) wd[i] = Math.random() * 2 - 1;

        // Campfire bed: brown-ish rumble whose level follows nearby fires (see setFire / updateFire)
        const bl = ctx.sampleRate * 2, brown = ctx.createBuffer(1, bl, ctx.sampleRate), bd = brown.getChannelData(0);
        let last = 0;
        for (let i = 0; i < bl; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
        const rumble = ctx.createBufferSource(); rumble.buffer = brown; rumble.loop = true;
        const rumbleLP = ctx.createBiquadFilter(); rumbleLP.type = 'lowpass'; rumbleLP.frequency.value = 520;
        this.fireGain = ctx.createGain(); this.fireGain.gain.value = 0;
        this.firePan = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
        rumble.connect(rumbleLP); rumbleLP.connect(this.fireGain); this.fireGain.connect(this.firePan); this.firePan.connect(this.masterGain);
        rumble.start();
        this.fireLevel = 0; this.firePanValue = 0;

        // Pause audio while the tab is hidden
        document.addEventListener('visibilitychange', () => {
          if (!this.ctx) return;
          if (document.hidden) this.ctx.suspend(); else if (this.enabled) this.ctx.resume();
        });

        // Soft pink-ish filtered breeze
        const bufferSize = this.ctx.sampleRate * 3;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          output[i] = (b0 + b1 + b2 + white * 0.015) * 0.5;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 340;
        filter.Q.value = 1.1;

        const lfo = this.ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.11;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 150;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();

        const windGain = this.ctx.createGain();
        windGain.gain.value = 0.2;
        noise.connect(filter);
        filter.connect(windGain);
        windGain.connect(this.masterGain);
        noise.start();
      }

      makeImpulse(seconds, decay) {
        const ctx = this.ctx, len = Math.floor(ctx.sampleRate * seconds), buf = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = buf.getChannelData(c);
          for (let i = 0; i < len; i++) {
            const t = i / len;
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < 90 ? i / 90 : 1); // soft onset, exponential-ish tail
          }
        }
        return buf;
      }

      // route a node into the sfx bus with stereo position (-1 left .. 1 right)
      out(node, pan = 0) {
        if (this.ctx.createStereoPanner && pan) {
          const pn = this.ctx.createStereoPanner();
          pn.pan.value = Math.max(-1, Math.min(1, pan));
          node.connect(pn); pn.connect(this.sfxBus);
        } else node.connect(this.sfxBus);
      }

      // short filtered noise burst: the "wood" in a wooden click / crackle pop
      noiseHit(t, { freq = 1800, q = 3.5, vol = 0.1, decay = 0.035, type = 'bandpass', pan = 0, dest = null } = {}) {
        const ctx = this.ctx;
        const src = ctx.createBufferSource(); src.buffer = this.white;
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.0015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        src.connect(f); f.connect(g);
        if (dest) {
          if (this.ctx.createStereoPanner && pan) { const pn = ctx.createStereoPanner(); pn.pan.value = pan; g.connect(pn); pn.connect(dest); }
          else g.connect(dest);
        } else this.out(g, pan);
        src.start(t, Math.random() * 0.8); src.stop(t + decay + 0.02);
      }

      // Campfire ambience: level 0..1 from nearby fires + zoom, pan from screen position
      setFire(level, pan) {
        if (!this.ctx) return;
        this.fireLevel = level; this.firePanValue = pan;
        const now = this.ctx.currentTime;
        this.fireGain.gain.setTargetAtTime(this.enabled ? level * 0.09 : 0, now, 0.4);
        if (this.firePan.pan) this.firePan.pan.setTargetAtTime(pan, now, 0.3);
      }
      updateFire(dt) {
        if (!this.ctx || !this.enabled || this.fireLevel < 0.02 || document.hidden) return;
        // crackle pops: random rate, random brightness, a few big snaps
        let expected = dt * 9 * this.fireLevel;
        const now = this.ctx.currentTime;
        while (expected > 0) {
          if (Math.random() < Math.min(1, expected)) {
            const big = Math.random() < 0.12;
            this.noiseHit(now + Math.random() * dt, {
              type: 'highpass', freq: big ? 900 : 1600 + Math.random() * 2600, q: 0.7,
              vol: (big ? 0.11 : 0.035 + Math.random() * 0.04) * this.fireLevel,
              decay: big ? 0.05 : 0.012 + Math.random() * 0.02,
              pan: this.firePanValue + (Math.random() - 0.5) * 0.2, dest: this.masterGain
            });
          }
          expected -= 1;
        }
      }

      ensureSfxContext() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      // must run inside a user gesture (browsers block audio before the first click / key)
      setEnabled(on) {
        this.ensureSfxContext();
        if (this.enabled !== on) this.toggle(true);
        return this.enabled;
      }

      toggle(silent = false) {
        this.ensureSfxContext();
        this.enabled = !this.enabled;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setTargetAtTime(this.enabled ? 0.42 : 0.0001, now, silent ? 0.9 : 0.25);
        this.setFire(this.fireLevel, this.firePanValue);

        if (this.enabled) {
          this.scheduleChime();
          if (!silent) this.playUiBlip(523.25);
        } else if (this.chimeTimer) {
          clearTimeout(this.chimeTimer);
          this.chimeTimer = null;
        }
        return this.enabled;
      }

      scheduleChime() {
        if (!this.enabled) return;
        this.chimeTimer = setTimeout(() => {
          if (this.enabled) {
            this.playWindChime();
            this.scheduleChime();
          }
        }, 2800 + Math.random() * 4200);
      }

      playWindChime() {
        if (!this.ctx || !this.enabled) return;
        const notes = this.isNight
          ? [392.0, 440.0, 523.25, 587.33, 659.25]
          : [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
        const freq = notes[Math.floor(Math.random() * notes.length)];
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.085, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.7);
        osc.connect(gain);
        gain.connect(this.masterGain); // chime lives on the ambience fader (+ reverb send)
        osc.start(now);
        osc.stop(now + 2.8);
      }

      // Cascading wooden-block / card-fanning SFX synced to Exploded View stagger!
      playExplodeCascade(opening) {
        this.ensureSfxContext();
        const quiet = !this.enabled; // UI feedback stays audible (softly) even with ambience off
        const baseVol = quiet ? 0.09 : 0.22;
        const steps = 8;
        const now = this.ctx.currentTime;

        for (let i = 0; i < steps; i++) {
          const t = now + i * 0.026; // Matches 0.026s layer wave stagger
          const frac = opening ? i / (steps - 1) : 1 - i / (steps - 1);
          const freq = 270 + frac * 420;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * (opening ? 1.18 : 0.86), t + 0.055);

          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(baseVol * (0.75 + 0.25 * frac), t + 0.007);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);

          osc.connect(gain);
          if (quiet) gain.connect(this.comp); else this.out(gain);
          osc.start(t);
          osc.stop(t + 0.095);
          this.noiseHit(t, { freq: 1400 + frac * 1400, q: 4, vol: baseVol * 0.5, decay: 0.03, dest: quiet ? this.comp : null });
        }
      }

      // LEGO-style stacking clicks: one per landing group, pitch 1.0 -> 1.3
      playStackClicks(times, pan = 0) {
        this.ensureSfxContext();
        const quiet = !this.enabled;
        const send = (node) => { if (quiet) node.connect(this.comp); else this.out(node, pan); };
        const vol = quiet ? 0.07 : 0.16;
        const now = this.ctx.currentTime;
        const n = times.length;
        times.forEach((dt, i) => {
          const t = now + dt;
          const pitch = 1.0 + 0.3 * (n > 1 ? i / (n - 1) : 0);
          const f = 620 * pitch;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f * 1.6, t);
          osc.frequency.exponentialRampToValueAtTime(f, t + 0.018);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol * (i === 0 || i === n - 1 ? 1.0 : 0.7), t + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          osc.connect(gain); send(gain);
          osc.start(t); osc.stop(t + 0.06);
          // the wooden "tok": band-passed noise rising with the tone

        g.gain.linearRampToValueAtTime(vol, t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
        o.connect(g); this.out(g, pan);
        o.start(t); o.stop(t + 0.065);

          th.frequency.exponentialRampToValueAtTime(95, t + 0.09);
          tg.gain.setValueAtTime(0.0001, t);
          tg.gain.linearRampToValueAtTime(0.16, t + 0.005);
          tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);

        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(240 * pitch, t);
        o.frequency.exponentialRampToValueAtTime(780 * pitch, t + 0.07);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.13, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        o.connect(g); this.out(g, pan);
        o.start(t); o.stop(t + 0.13);
      }

        const src = ctx.createBufferSource(); src.buffer = this.white;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;

        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.1, t + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);

          const o = ctx.createOscillator(), og = ctx.createGain(), ts = t + 0.05 + i * 0.07;

          og.gain.setValueAtTime(0.0001, ts);
          og.gain.linearRampToValueAtTime(0.045, ts + 0.02);
          og.gain.exponentialRampToValueAtTime(0.0001, ts + 0.5);

        }

        if (!this.ctx || !this.enabled) return;

        const osc = this.ctx.createOscillator();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.012);

        if (!this.ctx || !this.enabled) return;

        const gain = this.ctx.createGain();

        const gain = this.ctx.createGain();
        osc.type = 'sine';

        osc.frequency.exponentialRampToValueAtTime(720, now + 0.045);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.08, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
        osc.connect(gain);
        this.out(gain);
        osc.start(now);
        osc.stop(now + 0.07);

      playUiBlip(freq = 480) {

        gain.gain.linearRampToValueAtTime(0.07, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

        osc.stop(now + 0.15);

        if (dSince < 0.9) {

          float g = floor(li / uDropGroup);
          float G = floor((uDropLayers - 1.0) / uDropGroup);
          float tl = dSince - g * ${DROP_STRIDE.toFixed(4)};
          float FALL = ${DROP_FALL.toFixed(4)};
          // Whole-stack squash: 0.85 -> 1.05 -> 1.0 right as the top lands
          float u = dSince - (G * ${DROP_STRIDE.toFixed(4)} + FALL - 0.03);
          if (u > 0.0 && u < 0.14) {

              float phase = 0.0;

            }

            if (uExplodeSliceFactor > 0.001 && (uExplodeSpread > 0.0001 || uExplodePropLift > 0.0001 || uExplodeMidLift > 0.0001 || uExplodeTopLift > 0.0001)) {
              // Clean 4-tier hierarchy: Ground Props -> Mid (Trunks/Walls/Lanterns) -> Top (Canopies/Roof)

            '#include <project_vertex>',

            vWorldXZ = hFogWorld.xz;`

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uNightFactor;
            uniform vec3 uFogColor;
            uniform float uFogDensity;
            uniform float uFogBottom;
            uniform float uFogTop;

    /* =========================================================================
       6. SPRITE STACK BUILDER & MINIATURE ICONS
       ========================================================================= */
    function buildSpriteStackAsset(def) {
      const { size, layers, layerStep, scale } = def;
      const sheetW = size * layers;
      const sheetH = size;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = sheetW;
      colorCanvas.height = sheetH;
      const colorCtx = colorCanvas.getContext('2d');
      colorCtx.imageSmoothingEnabled = false;

      const emCanvas = document.createElement('canvas');
      emCanvas.width = sheetW;
      emCanvas.height = sheetH;
      const emCtx = emCanvas.getContext('2d');
      emCtx.imageSmoothingEnabled = false;

      const sliceCanvases = [];
      const tmpEm = document.createElement('canvas');
      tmpEm.width = size;
      tmpEm.height = size;
      const tmpEmCtx = tmpEm.getContext('2d');

      for (let i = 0; i < layers; i++) {
        const sc = document.createElement('canvas');
        sc.width = size;
        sc.height = size;
        const sctx = sc.getContext('2d');
        sctx.imageSmoothingEnabled = false;

        tmpEmCtx.clearRect(0, 0, size, size);
        def.drawSlice(sctx, tmpEmCtx, i, layers, size);

        colorCtx.drawImage(sc, i * size, 0);
        emCtx.drawImage(tmpEm, i * size, 0);
        sliceCanvases.push(sc);
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.minFilter = THREE.NearestFilter;
      colorTex.magFilter = THREE.NearestFilter;
      colorTex.generateMipmaps = false;
      colorTex.colorSpace = THREE.SRGBColorSpace;

      const emTex = new THREE.CanvasTexture(emCanvas);
      emTex.minFilter = THREE.NearestFilter;
      emTex.magFilter = THREE.NearestFilter;
      emTex.generateMipmaps = false;
      emTex.colorSpace = THREE.SRGBColorSpace;

      const positions = [], normals = [], uvs = [], colors = [], layerHeights = [], indices = [];
      const half = 0.5 * scale;

      for (let i = 0; i < layers; i++) {
        const y = i * layerStep + 0.012;
        const u0 = i / layers;
        const u1 = (i + 1) / layers;
        const hNorm = layers > 1 ? i / (layers - 1) : 0;
        const ao = 0.62 + 0.42 * Math.pow(hNorm, 0.7);

        const vOffset = i * 4;
        positions.push(-half, y, -half, half, y, -half, half, y, half, -half, y, half);
        normals.push(-0.28, 0.92, -0.28, 0.28, 0.92, -0.28, 0.28, 0.92, 0.28, -0.28, 0.92, 0.28);
        uvs.push(u0, 1, u1, 1, u1, 0, u0, 0);
        colors.push(ao, ao, ao, ao, ao, ao, ao, ao, ao, ao, ao, ao);
        layerHeights.push(hNorm, hNorm, hNorm, hNorm);
        indices.push(vOffset, vOffset + 2, vOffset + 1, vOffset, vOffset + 3, vOffset + 2);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    function renderMiniIsoIcon(sliceCanvases, size) {
      const iconSize = 40;
      const c = document.createElement('canvas');
      c.width = iconSize;
      c.height = iconSize;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const layers = sliceCanvases.length;
      const drawScale = size > 20 ? 0.92 : (size > 18 ? 1.0 : 1.15);
      const yStep = Math.min(1.0, 20 / Math.max(layers, 1));
      const baseY = iconSize - 8;

      for (let i = 0; i < layers; i++) {
        const hNorm = layers > 1 ? i / (layers - 1) : 1;
        ctx.save();
        ctx.translate(iconSize / 2, baseY - i * yStep);
        ctx.scale(drawScale, drawScale * 0.56);
        ctx.rotate(Math.PI / 4);

    /* =========================================================================

    function createBeveledBoxGeometry(w, h, d, bevel = 0.025) {
      const shape = new THREE.Shape();
      const hw = Math.max(0.004, w / 2 - bevel);
      const hd = Math.max(0.004, d / 2 - bevel);
      shape.moveTo(-hw, -hd);
      shape.lineTo(hw, -hd);
      shape.lineTo(hw, hd);
      shape.lineTo(-hw, hd);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: Math.max(0.01, h - bevel * 2),
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: bevel,
        bevelThickness: bevel

      geo.rotateX(-Math.PI / 2);
      geo.center();
      return geo;
    }

    function prepareCabinDrop(root) {

        chunk.children.forEach((obj) => {
          parts.push({ obj, ci, baseY: obj.position.y, baseRZ: obj.rotation.z, visible: obj.visible });
        });
      });
      parts.sort((a, b) => (a.ci - b.ci) || (a.baseY - b.baseY));

      parts.forEach((pt, i) => {
        pt.g = Math.floor(i * groups / parts.length);
        const r = hash2D(i, pt.g, 7);
        pt.ang = (r < 0.5 ? -1 : 1) * (0.087 + 0.088 * hash2D(i, 3, 11));

      root.userData.dropGroups = groups;
      root.userData.dropDone = false;
    }
    const CABIN_STRIDE = 0.019;
    function cabinDropTotal() { return 15 * CABIN_STRIDE + DROP_FALL; }

    // Merge all meshes under each cabin chunk that share a material into one mesh.
    // Visual result is identical; draw calls drop from ~96 to ~25 per cabin (x2 with shadows).
    const _mergeInv = new THREE.Matrix4(), _mergeM = new THREE.Matrix4(), _mergeN = new THREE.Matrix3(), _mergeV = new THREE.Vector3();
    function mergeChunkByMaterial(chunk) {
      chunk.updateMatrixWorld(true);

      const groups = new Map();
      chunk.traverse((o) => {
        if (!o.isMesh || o === chunk) return;
        const key = o.material.uuid + (o.castShadow ? 'c' : '') + (o.receiveShadow ? 'r' : '');
        if (!groups.has(key)) groups.set(key, { mat: o.material, cast: o.castShadow, recv: o.receiveShadow, list: [] });
        groups.get(key).list.push(o);
      });
      const merged = [];
      for (const g of groups.values()) {
        let total = 0;
        const parts = g.list.map((m) => {
          const geo = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry;
          total += geo.attributes.position.count;
          return { m, geo };
        });
        const pos = new Float32Array(total * 3), nrm = new Float32Array(total * 3), uv = new Float32Array(total * 2);

            if (N) { _mergeV.fromBufferAttribute(N, i).applyMatrix3(_mergeN).normalize(); nrm[(off + i) * 3] = _mergeV.x; nrm[(off + i) * 3 + 1] = _mergeV.y; nrm[(off + i) * 3 + 2] = _mergeV.z; }

      const base = mat.onBeforeCompile;
      mat.onBeforeCompile = (sh, r) => {

          .replace('#include <common>', '#include <common>\nattribute vec2 aRM; attribute vec4 aEmis; varying vec2 vRM; varying vec4 vEmis;')

          .replace('#include <common>', '#include <common>\nvarying vec2 vRM; varying vec4 vEmis;')

          .replace('#include <metalnessmap_fragment>', '#include <metalnessmap_fragment>\nmetalnessFactor = vRM.y;')

          totalEmissiveRadiance = vEmis.rgb * (vEmis.a > 0.01 ? mix(0.25, vEmis.a, smoothstep(0.1, 0.85, uNightFactor)) : 1.0);`);

    const _mergeCol = new THREE.Color();

      chunk.updateMatrixWorld(true);

      for (const m of meshes) {

        if (!groups.has(key)) groups.set(key, { cast: m.castShadow, recv: m.receiveShadow, list: [] });
        groups.get(key).list.push(m);
      }
      const merged = [];
      for (const g of groups.values()) {
        let total = 0;
        const parts = g.list.map((m) => { const geo = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry; total += geo.attributes.position.count; return { m, geo }; });
        const pos = new Float32Array(total * 3), nrm = new Float32Array(total * 3), col = new Float32Array(total * 3);
        const rm = new Float32Array(total * 2), em = new Float32Array(total * 4);

            _mergeV.fromBufferAttribute(P, i).applyMatrix4(_mergeM);
            pos[o * 3] = _mergeV.x; pos[o * 3 + 1] = _mergeV.y; pos[o * 3 + 2] = _mergeV.z;
            if (N) { _mergeV.fromBufferAttribute(N, i).applyMatrix3(_mergeN).normalize(); nrm[o * 3] = _mergeV.x; nrm[o * 3 + 1] = _mergeV.y; nrm[o * 3 + 2] = _mergeV.z; }
            _mergeCol.copy(mt.color);
            if (VC) { _mergeCol.r *= VC.getX(i); _mergeCol.g *= VC.getY(i); _mergeCol.b *= VC.getZ(i); }

      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 3 - row; col++) {
          addPart(chunkWalls, logGeo, col % 2 === 0 ? matWood : matWoodDark, -0.25, 0.03 + row * 0.042, 0.41 + col * 0.045 + row * 0.022);
        }
      }
      addPart(chunkWalls, new THREE.CylinderGeometry(0.05, 0.06, 0.10, 7), matWoodDark, -0.42, 0.05, 0.36);
      addPart(chunkWalls, new THREE.CylinderGeometry(0.009, 0.009, 0.16, 5), matWood, -0.44, 0.15, 0.36, 0, 0, 0.45);
      addPart(chunkWalls, createBeveledBoxGeometry(0.055, 0.04, 0.014, 0.004), matMetal, -0.41, 0.12, 0.36, 0, 0, 0.35);

      addPart(chunkWalls, new THREE.CylinderGeometry(0.012, 0.014, 0.24, 6), matWoodDark, 0.38, 0.12, 0.44, 0.05, 0, -0.08);
      addPart(chunkWalls, createBeveledBoxGeometry(0.07, 0.065, 0.11, 0.014), matMailbox, 0.39, 0.25, 0.44, 0.05, 0.15, -0.08);

      const vineGeo = new THREE.DodecahedronGeometry(0.042, 0);
      [[-0.39, 0.16, 0.22], [-0.40, 0.26, 0.18], [-0.39, 0.36, 0.24], [-0.40, 0.48, 0.20], [-0.38, 0.58, 0.14]]
        .forEach(([vx, vy, vz]) => addPart(chunkWalls, vineGeo, matFoliage, vx, vy, vz));

      /* ---- CHUNK 2: STEEP FAIRYTALE ROOF + PROTRUDING SHINGLES + CROOKED CHIMNEY ---- */
      const roofSlope = 0.94;
      const roofPanelGeo = createBeveledBoxGeometry(0.66, 0.07, 0.86, 0.015);
      addPart(chunkRoof, roofPanelGeo, matRoof, -0.23, 0.93, 0, 0, 0, roofSlope);
      addPart(chunkRoof, roofPanelGeo, matRoof, 0.23, 0.93, 0, 0, 0, -roofSlope);

      const gableShape = new THREE.Shape();
      gableShape.moveTo(-0.38, 0); gableShape.lineTo(0.38, 0); gableShape.lineTo(0, 0.56); gableShape.closePath();
      const gableGeo = new THREE.ExtrudeGeometry(gableShape, { depth: 0.62, bevelEnabled: false });
      gableGeo.translate(0, 0, -0.31);
      addPart(chunkRoof, gableGeo, matWood, 0, 0.65, 0);
      addPart(chunkRoof, createBeveledBoxGeometry(0.10, 0.09, 0.90, 0.02), matWoodDark, 0, 1.24, 0);

      const shingleGeo = createBeveledBoxGeometry(0.14, 0.032, 0.16, 0.006);
      [
        [-0.36, 0.78, -0.24], [-0.26, 0.92, 0.12], [-0.15, 1.07, -0.10], [-0.30, 0.86, 0.28],
        [0.36, 0.78, 0.20], [0.25, 0.93, -0.16], [0.16, 1.06, 0.08], [0.31, 0.85, -0.30]
      ].forEach(([sx, sy, sz], idx) => {
        const tilt = sx < 0 ? roofSlope + 0.05 : -roofSlope - 0.05;
        addPart(chunkRoof, shingleGeo, idx % 2 === 0 ? matRoofAlt : matRoof, sx, sy, sz, 0, 0, tilt);
      });

      // Oversized crooked chimney with dark soot gradient
      const chimGeo = createBeveledBoxGeometry(0.20, 0.68, 0.20, 0.025);
      const cPos = chimGeo.attributes.position;
      const cCols = new Float32Array(cPos.count * 3);
      for (let i = 0; i < cPos.count; i++) {
        const yNorm = THREE.MathUtils.clamp((cPos.getY(i) + 0.34) / 0.68, 0, 1);
        const soot = 1.0 - Math.pow(yNorm, 2.2) * 0.74;
        cCols[i * 3] = 0.54 * soot; cCols[i * 3 + 1] = 0.56 * soot; cCols[i * 3 + 2] = 0.60 * soot;
      }
      chimGeo.setAttribute('color', new THREE.BufferAttribute(cCols, 3));
      const matChimney = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0.02 }));
      addPart(chunkRoof, chimGeo, matChimney, 0.22, 1.10, -0.18, 0.06, 0.08, -0.09);
      const matSootCap = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#2b2c33', roughness: 0.94 }));
      addPart(chunkRoof, createBeveledBoxGeometry(0.24, 0.06, 0.24, 0.015), matSootCap, 0.25, 1.44, -0.16, 0.06, 0.08, -0.09);

      return root;
    }

    /* =========================================================================
       8. THICK STRATIFIED DIORAMA ISLAND WITH ROUNDED POND & BACK HILLS
          Split into 3 geological chunks so Exploded View reveals earth strata!
       ========================================================================= */
    function buildSculptedStratum(yBottomFn, yTopFn, width, colorA, colorB, roughness, metalness, taperBottom = 1.0, seed = 0) {
      const segXZ = 24;
      const segY = 3;
      const geo = new THREE.BoxGeometry(width, 1.0, width, segXZ, segY, segXZ);
      const pos = geo.attributes.position;
      const cols = new Float32Array(pos.count * 3);
      const cA = new THREE.Color(colorA);
      const cB = new THREE.Color(colorB);
      const tmpC = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let yNorm = pos.getY(i) + 0.5; // 0 bottom .. 1 top
        let z = pos.getZ(i);

        const yBot = yBottomFn(x, z);
        const yTop = yTopFn(x, z);
        const y = THREE.MathUtils.lerp(yBot, yTop, yNorm);

        const scaleXZ = THREE.MathUtils.lerp(taperBottom, 1.0, yNorm);
        x *= scaleXZ;
        z *= scaleXZ;

        const edge = Math.max(Math.abs(x), Math.abs(z)) / (width * 0.5 * scaleXZ);
        if (edge > 0.88) {
          const n = hash2D(Math.round(x * 1.8), Math.round(z * 1.8) + Math.round(y * 3.0), seed) - 0.5;
          x += n * 0.16;
          z += n * 0.16;
          if (yNorm > 0.92 || yNorm < 0.08) {
            x *= 0.986;
            z *= 0.986;
          }
        }
        pos.setXYZ(i, x, y, z);

        const hVal = hash2D(Math.floor(x * 1.5), Math.floor(z * 1.5 + y * 2.2), seed + 3);
        tmpC.copy(cA).lerp(cB, hVal);
        const seamAO = 0.72 + 0.28 * Math.sin(yNorm * Math.PI * 0.85 + 0.15);
        tmpC.multiplyScalar(seamAO);
        cols[i * 3] = tmpC.r; cols[i * 3 + 1] = tmpC.g; cols[i * 3 + 2] = tmpC.b;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
      geo.computeVertexNormals();

      const mat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness,
        metalness
      }));
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function buildMiniatureIsland(scene) {
      const chunkTopSurface = new THREE.Group(); // Grass, hills, topsoil cutaway, roots, pond
      const chunkSubsoil = new THREE.Group();    // Clay/subsoil + embedded stones
      const chunkBedrock = new THREE.Group();    // Deep bedrock tapered base
      scene.add(chunkTopSurface, chunkSubsoil, chunkBedrock);

      // --- 8A. Continuous Beveled Top Grass & Terraced Hills + Rounded Pond Basin ---
      const segs = 72;
      const topGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE, segs, segs);
      topGeo.rotateX(-Math.PI / 2);
      const tPos = topGeo.attributes.position;
      const tCols = new Float32Array(tPos.count * 3);
      const colGrassA = new THREE.Color('#6db450');
      const colGrassB = new THREE.Color('#5fa346');
      const colHill = new THREE.Color('#579942');
      const colShore = new THREE.Color('#b8a472'); // Soft sandy/mossy wet rim
      const colBed = new THREE.Color('#4a615c');
      const tmpC = new THREE.Color();

      for (let i = 0; i < tPos.count; i++) {
        const wx = tPos.getX(i);
        const wz = tPos.getZ(i);
        let y = getContinuousTerrainHeight(wx, wz);

        // Subtle beveled edge rounding along the outer diorama border
        const borderDist = Math.min(HALF_GRID - Math.abs(wx), HALF_GRID - Math.abs(wz));
        if (borderDist < 0.18) {
          y -= (0.18 - borderDist) * 0.45;
        }
        tPos.setY(i, y);

        const sdf = getPondSDF(wx, wz);
        const n = hash2D(Math.floor(wx * 2.2), Math.floor(wz * 2.2), 11);
        tmpC.copy(colGrassA).lerp(colGrassB, n);

        // Slightly richer deep green on elevated back hills
        if (y > 0.25) tmpC.lerp(colHill, THREE.MathUtils.clamp((y - 0.25) * 0.7, 0, 0.55));
        // Smooth organic sandy/mossy transition around the rounded pond edge
        if (sdf < 0.42) {
          const shoreMix = 1.0 - THREE.MathUtils.smoothstep(sdf, -0.05, 0.42);
          tmpC.lerp(colShore, shoreMix * 0.78);
        }
        if (sdf < 0.02) {
          const bedMix = 1.0 - THREE.MathUtils.smoothstep(sdf, -0.35, 0.02);
          tmpC.lerp(colBed, bedMix * 0.85);
        }
        tCols[i * 3] = tmpC.r; tCols[i * 3 + 1] = tmpC.g; tCols[i * 3 + 2] = tmpC.b;
      }
      topGeo.setAttribute('color', new THREE.BufferAttribute(tCols, 3));
      topGeo.computeVertexNormals();

      const topMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.88,
        metalness: 0.0
      }));
      const topMesh = new THREE.Mesh(topGeo, topMat);
      topMesh.castShadow = true;
      topMesh.receiveShadow = true;
      chunkTopSurface.add(topMesh);

      // --- 8B. Thick Stratified Cutaway Cross-Section Chunks ---
      // Stratum 1: Topsoil skirt that rises seamlessly to meet the back hills!
      const topsoilMesh = buildSculptedStratum(
        () => -0.62,
        (x, z) => getContinuousTerrainHeight(x, z) - 0.03,
        GRID_SIZE - 0.04,
        '#6b472c', '#52341e', 0.94, 0.0, 0.985, 1
      );
      chunkTopSurface.add(topsoilMesh);

      // Stratum 2: Thick Subsoil / Warm Clay Layer
      const subsoilMesh = buildSculptedStratum(
        () => -1.42,
        () => -0.60,
        GRID_SIZE - 0.24,
        '#8c5f3d', '#6e472b', 0.92, 0.0, 0.93, 2
      );
      chunkSubsoil.add(subsoilMesh);

      // Stratum 3: Deep Craggy Bedrock Base
      const bedrockMesh = buildSculptedStratum(
        () => -2.55,
        () => -1.40,
        GRID_SIZE - 1.05,
        '#636875', '#3e424f', 0.84, 0.08, 0.72, 3
      );
      chunkBedrock.add(bedrockMesh);

      // --- 8C. Protruding Tree Roots (Topsoil Chunk) & Embedded Stones (Subsoil/Bedrock) ---
      const dummy = new THREE.Object3D();
      const rootGeo = new THREE.CylinderGeometry(0.024, 0.056, 0.62, 5);
      const rootMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#5c3c24', roughness: 0.90 }));
      const embedRoots = new THREE.InstancedMesh(rootGeo, rootMat, 44);
      for (let i = 0; i < 44; i++) {
        const side = i % 4;
        const along = (hash2D(i, 4, 19) - 0.5) * (GRID_SIZE - 1.0);
        let rx = 0, rz = 0;
        const edgeR = HALF_GRID - 0.04;
        if (side === 0) { rx = along; rz = edgeR; }
        else if (side === 1) { rx = along; rz = -edgeR; }
        else if (side === 2) { rx = edgeR; rz = along; }
        else { rx = -edgeR; rz = along; }
        const surfY = getContinuousTerrainHeight(rx, rz);
        const depthY = surfY - 0.26 - hash2D(i, 5, 19) * 0.36;
        dummy.position.set(rx, depthY, rz);
        dummy.rotation.set((hash2D(i, 6, 19) - 0.5) * 0.55, hash2D(i, 7, 19) * 3.14, (hash2D(i, 8, 19) - 0.5) * 0.55);
        dummy.scale.set(1, 0.8 + hash2D(i, 9, 19) * 0.9, 1);
        dummy.updateMatrix();
        embedRoots.setMatrixAt(i, dummy.matrix);
      }
      embedRoots.instanceMatrix.needsUpdate = true;
      chunkTopSurface.add(embedRoots);

      // Embedded Stones in Subsoil Cutaway
      const stoneGeo = new THREE.DodecahedronGeometry(0.17, 0);
      const embedStoneMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({
        color: '#8f96a3', roughness: 0.34, metalness: 0.08
      }));
      const embedStones = new THREE.InstancedMesh(stoneGeo, embedStoneMat, 56);
      embedStones.castShadow = true;
      embedStones.receiveShadow = true;
      for (let i = 0; i < 56; i++) {
        const side = i % 4;
        const along = (hash2D(i, 1, 7) - 0.5) * (GRID_SIZE - 1.2);
        const depthY = -0.72 - hash2D(i, 2, 7) * 0.62;
        const edgeR = HALF_GRID - 0.16 + (depthY + 0.6) * 0.3;
        let sx = 0, sz = 0;
        if (side === 0) { sx = along; sz = edgeR; }
        else if (side === 1) { sx = along; sz = -edgeR; }
        else if (side === 2) { sx = edgeR; sz = along; }
        else { sx = -edgeR; sz = along; }
        const sc = 0.65 + hash2D(i, 3, 7) * 1.15;
        dummy.position.set(sx, depthY, sz);
        dummy.rotation.set(i * 0.7, i * 1.1, i * 0.5);
        dummy.scale.set(sc, sc * 0.72, sc);
        dummy.updateMatrix();
        embedStones.setMatrixAt(i, dummy.matrix);
      }
      embedStones.instanceMatrix.needsUpdate = true;
      chunkSubsoil.add(embedStones);

      // --- 8D. Smooth Organic Curved Water Surface (SDF-Masked Shader) + Lily Pads ---
      const sdfSize = 128;
      const sdfCanvas = document.createElement('canvas');
      sdfCanvas.width = sdfSize;
      sdfCanvas.height = sdfSize;
      const sCtx = sdfCanvas.getContext('2d');
      const imgData = sCtx.createImageData(sdfSize, sdfSize);
      for (let py = 0; py < sdfSize; py++) {
        for (let pxIdx = 0; pxIdx < sdfSize; pxIdx++) {
          const wx = (pxIdx / (sdfSize - 1) - 0.5) * GRID_SIZE;
          const wz = (py / (sdfSize - 1) - 0.5) * GRID_SIZE;
          const sdf = getPondSDF(wx, wz);
          // Encode sdf in [-1.5, 1.5] -> [0, 255], 0.5 = exact shoreline
          const val = Math.round(THREE.MathUtils.clamp((sdf / 3.0 + 0.5) * 255, 0, 255));
          const idx = (py * sdfSize + pxIdx) * 4;
          imgData.data[idx] = val;
          imgData.data[idx + 1] = val;
          imgData.data[idx + 2] = val;
          imgData.data[idx + 3] = 255;
        }
      }
      sCtx.putImageData(imgData, 0, 0);
      const sdfTex = new THREE.CanvasTexture(sdfCanvas);
      sdfTex.minFilter = THREE.LinearFilter;
      sdfTex.magFilter = THREE.LinearFilter;

      const waterGeo = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE, 32, 32);
      waterGeo.rotateX(-Math.PI / 2);
      const waterMat = new THREE.ShaderMaterial({
        uniforms: {
          uSdf: { value: sdfTex },
          uTime: sharedUniforms.uTime,
          uDeep: sharedUniforms.uWaterDeep,
          uShallow: sharedUniforms.uWaterShallow,
          uFoam: sharedUniforms.uWaterFoam,
          uFogColor: sharedUniforms.uFogColor,
          uFogDensity: sharedUniforms.uFogDensity
        },
        vertexShader: `
          uniform float uTime;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec3 pos = position;
            pos.y += sin(pos.x * 2.8 + uTime * 2.0) * cos(pos.z * 2.4 - uTime * 1.6) * 0.012;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uSdf;
          uniform float uTime;
          uniform vec3 uDeep;
          uniform vec3 uShallow;
          uniform vec3 uFoam;
          uniform vec3 uFogColor;
          uniform float uFogDensity;
          varying vec2 vUv;

          void main() {
            // Decode smooth rounded SDF (0.5 = shoreline, <0.5 = inside pond)
            float sdf = (texture2D(uSdf, vUv).r - 0.5) * 3.0;
            if (sdf > 0.08) discard;

            float wave1 = sin(vUv.x * 46.0 + uTime * 2.2 + cos(vUv.y * 30.0 - uTime * 1.3));
            float wave2 = sin(vUv.y * 40.0 - uTime * 1.7 + vUv.x * 18.0);
            float ripple = (wave1 + wave2) * 0.5;

            // Depth gradient from shallow rounded rim to deeper center
            float depthT = smoothstep(0.06, -0.95, sdf);
            vec3 col = mix(uShallow, uDeep, depthT * 0.85);
            col = mix(col, uShallow * 1.12, smoothstep(-0.2, 0.7, ripple) * 0.35);

            // Crisp specular sparkle
            float sparkle = smoothstep(0.84, 0.96, ripple);
            col = mix(col, uFoam, sparkle * 0.58);

            // Animated organic curved foam line hugging the rounded edge!
            float foamWave = sin(sdf * 26.0 - uTime * 2.6 + ripple * 2.0);
            float rimFoam = smoothstep(-0.18, 0.04, sdf) * (0.55 + 0.45 * foamWave);
            col = mix(col, uFoam, clamp(rimFoam * 0.72, 0.0, 0.85));

            // Soft feathered shoreline alpha for silky blending into sandy bank
            float alpha = smoothstep(0.08, -0.06, sdf) * 0.90;
            col = mix(col, uFogColor, uFogDensity * 0.20);
            gl_FragColor = vec4(col, alpha);
          }
        `,
        transparent: true,
        depthWrite: false
      });
      const waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.y = -0.09;
      chunkTopSurface.add(waterMesh);

      // Floating Lily Pads inside the rounded pond (lilyParts: pad + blossom, popped in by the startup assembly)
      const lilyParts = [];
      const lilyMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#4c9c48', roughness: 0.55 }));
      const blossomMat = enhanceStandardMaterial(new THREE.MeshStandardMaterial({ color: '#ffa3c7', roughness: 0.65 }));
      [
        { x: 1.9, z: 2.0, flower: true },
        { x: 3.1, z: 2.3, flower: false },
        { x: 2.3, z: 3.0, flower: true }
      ].forEach((lp) => {
        const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.025, 10, 1, false, 0.2, Math.PI * 1.85), lilyMat);
        pad.position.set(lp.x, -0.075, lp.z);
        pad.rotation.y = lp.x * 1.7;
        chunkTopSurface.add(pad);
        const part = [pad];
        if (lp.flower) {
          const fl = new THREE.Mesh(new THREE.DodecahedronGeometry(0.068, 0), blossomMat);
          fl.position.set(lp.x, -0.03, lp.z);
          chunkTopSurface.add(fl);
          part.push(fl);
        }
        lilyParts.push({ meshes: part, x: lp.x, z: lp.z });
      });

      // Low-lying valley mist sheet drifting over the pond
      const mistCanvas = document.createElement('canvas');
      mistCanvas.width = 64; mistCanvas.height = 64;
      const mCtx = mistCanvas.getContext('2d');
      const mGrad = mCtx.createRadialGradient(32, 32, 2, 32, 32, 32);
      mGrad.addColorStop(0, 'rgba(255,255,255,0.42)');
      mGrad.addColorStop(0.6, 'rgba(255,255,255,0.14)');
      mGrad.addColorStop(1, 'rgba(255,255,255,0.0)');
      mCtx.fillStyle = mGrad; mCtx.fillRect(0, 0, 64, 64);
      const mistMat = new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(mistCanvas),
        color: ATMOSPHERES.day.fogColor,
        transparent: true,
        opacity: 0.24,
        depthWrite: false
      });
      const pondMist = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 5.6), mistMat);
      pondMist.rotation.x = -Math.PI / 2;
      pondMist.position.set(2.3, 0.12, 2.3);
      chunkTopSurface.add(pondMist);

      // --- 8E. Subtle Context-Sensitive Terrain Grid Overlay (>50% lower contrast, auto-hides!) ---
      const gridGeo = topGeo.clone();
      const gridMat = new THREE.ShaderMaterial({
        uniforms: {
          uSdf: { value: sdfTex },
          uGridAlpha: { value: 0.0 },
          uCursorXZ: { value: new THREE.Vector2(99, 99) }
        },
        vertexShader: `
          varying vec2 vWorldXZ;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec3 pos = position;
            pos.y += 0.016;
            vec4 wp = modelMatrix * vec4(pos, 1.0);
            vWorldXZ = wp.xz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform sampler2D uSdf;
          uniform float uGridAlpha;
          uniform vec2 uCursorXZ;
          varying vec2 vWorldXZ;
          varying vec2 vUv;

          void main() {
            if (uGridAlpha < 0.005) discard;
            float sdf = (texture2D(uSdf, vUv).r - 0.5) * 3.0;
            if (sdf < 0.06) discard;

            // Crisp ultra-subtle 1x1 tile lines
            vec2 g = abs(fract(vWorldXZ + 0.5) - 0.5);
            float line = 1.0 - smoothstep(0.465, 0.492, max(g.x, g.y));
            float invLine = 1.0 - line;

            // Soft radial spotlight around cursor so grid never feels heavy or noisy
            float dist = length(vWorldXZ - uCursorXZ);
            float radial = smoothstep(4.2, 0.6, dist) * 0.72 + 0.28;
            float alpha = invLine * uGridAlpha * radial * 0.19; // Soft low-contrast lines!
            if (alpha < 0.004) discard;
            gl_FragColor = vec4(1.0, 0.97, 0.88, alpha);
          }
        `,
        transparent: true,
        depthWrite: false
      });
      const gridOverlay = new THREE.Mesh(gridGeo, gridMat);
      chunkTopSurface.add(gridOverlay);

      return { chunkTopSurface, chunkSubsoil, chunkBedrock, pondMist, mistMat, gridMat, waterMesh, lilyParts };
    }

    /* =========================================================================
       9. MAIN APPLICATION, 3-POINT LIGHTING & SINGLE-PASS POST-PROCESSING
       ========================================================================= */
    window.addEventListener('load', () => {
      try {
        initGame();
      } catch (err) {
        console.error('Failed to initialize Mori Isle:', err);
        document.getElementById('loader')?.classList.add('failed'); // the sprout tips over, click reloads
      }
    });

    function initGame() {
      const container = document.getElementById('canvas-container');
      const pixelRatio = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);

      const renderer = new THREE.WebGLRenderer({
        antialias: false, // MSAA is wasted: the screen only receives the upscale pass
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      // The key light never moves and wind sway isn't in the depth pass, so the shadow map only
      // changes when casters move: placement/removal, drop animations, exploded-view transitions.
      renderer.shadowMap.autoUpdate = false;
      renderer.shadowMap.needsUpdate = true;
      let shadowHoldUntil = 0;
      function markShadowsDirty(seconds = 0.05) {
        shadowHoldUntil = Math.max(shadowHoldUntil, performance.now() * 0.001 + seconds);
      }
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.info.autoReset = false; // count draw calls for the whole frame (all passes)
      container.appendChild(renderer.domElement);

      function getRTSize() {
        const dw = Math.max(8, Math.floor(window.innerWidth * pixelRatio));
